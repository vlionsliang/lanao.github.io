<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考试库 · 通用刷题引擎</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#15803d;--bad:#dc2626}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:9;background:#111827;color:#fff;padding:12px 16px}
  header h1{margin:0;font-size:17px}
  header p{margin:4px 0 0;font-size:12px;color:#9ca3af}
  header select{width:100%;margin-top:10px;padding:9px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
  nav{display:flex;gap:8px;padding:10px 12px;position:sticky;top:118px;z-index:9;background:var(--bg)}
  nav button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px}
  nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  main{padding:4px 12px 40px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .setbtn{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin:10px 0;font-size:15px}
  .setbtn small{color:var(--sub)}
  .qtag{font-size:12px;color:var(--acc);font-weight:600}
  .stem{font-size:15px;line-height:1.65;margin:8px 0 10px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;line-height:1.5}
  .opt.sel{border-color:var(--acc);background:#eff6ff}
  .opt.right{border-color:var(--ok);background:#f0fdf4}
  .opt.wrong{border-color:var(--bad);background:#fef2f2}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .exp{display:none;margin-top:10px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
  .exp.show{display:block}
  .verdict{font-weight:700}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  input.num,textarea.ans{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  textarea.ans{min-height:140px;line-height:1.6}
  .meta{color:var(--sub);font-size:12.5px}
  .score{font-size:26px;font-weight:800}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}
  .timer{font-variant-numeric:tabular-nums;font-weight:700}
  .empty{color:var(--sub);text-align:center;padding:28px 0}
  .casebox{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.65;margin:10px 0;white-space:pre-wrap}
  .sechead{font-size:16px;font-weight:800;margin:18px 2px 4px}
  .ptline{color:#92400e;font-weight:600}
  .maprow{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0;font-size:13.5px}
  .maprow .btn{flex:0 0 auto;padding:6px 12px}
</style>
</head>
<body>
<header>
  <h1>考试库 · 通用刷题引擎</h1>
  <p id="examSub">一个引擎，多个考试：切换考试后进度、错题本按考试隔离保存</p>
  <select id="catSel" onchange="switchCategory(this.value)"></select>
  <select id="examSel" onchange="switchExam(this.value)"></select>
</header>
<nav>
  <button id="tab-practice" class="on" onclick="showTab('practice')">按套练习</button>
  <button id="tab-exam" onclick="showTab('exam')">模拟考试</button>
  <button id="tab-map" onclick="showTab('map')">考点地图</button>
  <button id="tab-wrong" onclick="showTab('wrong')">错题本</button>
</nav>
<main id="app"></main>

", "B": "for", "C": "to", "D": "with"}, "point": "词汇与语法·固定搭配：be aware of", "stem": "Are you aware ___ the changes to the exam schedule?", "type": "single"}, {"answer": "A", "explain": "focus on 意为“集中于”。in / to / for 都不构成这一搭配。", "id": "cet4v8", "options": {"A": "on", "B": "in", "C": "to", "D": "for"}, "point": "词汇与语法·固定搭配：focus on", "stem": "The course focuses ___ practical communication skills rather than grammar rules alone.", "type": "single"}, {"answer": "C", "explain": "空格后是名词 essay，需要表示所属的关系词 whose。who / whom 指人作主语或宾语，which 指物且不表示所属。", "id": "cet4v9", "options": {"A": "who", "B": "whom", "C": "whose", "D": "which"}, "point": "语法·定语从句：whose 表示所属", "stem": "The student ___ essay won first prize is in my class.", "type": "single"}, {"answer": "A", "explain": "insist 表示“要求”时，后接 (should +) 动词原形。submits 是陈述语气，不合“要求”的语境；submitted / submitting 也不合虚拟语气结构。", "id": "cet4v10", "options": {"A": "submit", "B": "submits", "C": "submitted", "D": "submitting"}, "point": "语法·虚拟语气：insist 后接动词原形", "stem": "The teacher insisted that every student ___ the essay before Friday.", "type": "single"}]}, {"name": "第2套 · 阅读理解（10题）", "questions": [{"answer": "A", "case": "For many students, online learning was once a backup plan, used only when the classroom was closed. Today it has become a normal part of education. A student in a small town can now listen to a lecture from a famous university, submit homework at midnight, and join a discussion group with classmates in other cities. The main advantage is flexibility: learners can study at their own speed and review difficult parts as many times as they need.\nFlexibility, however, is also a risk. Without a fixed timetable, some students put off their work until the last day. Others are easily distracted by phones and social media at home. Good online courses therefore use short videos, clear weekly deadlines, and quick feedback. These small structures help students stay on track without taking away freedom.\nOnline learning will not replace teachers, the author argues. It works best when technology and human guidance are combined: the screen delivers information, while the teacher answers questions, encourages discussion, and checks understanding.", "explain": "首段说在线学习已成为教育的正常部分，末段说它与教师指导结合时效果最好。B 与末段相反，C、D 都只是文中举例，不是主旨。", "id": "cet4r1", "options": {"A": "Online learning has become normal, and it works best together with teacher guidance.", "B": "Online learning will soon replace all teachers.", "C": "Online learning is only useful for students in small towns.", "D": "Students mainly like online learning because they can submit homework at midnight."}, "point": "阅读理解·主旨大意", "stem": "What is the main idea of the passage?", "type": "single"}, {"answer": "A", "explain": "文中明确说 flexibility 指 learners can study at their own speed and review difficult parts as many times as they need。", "id": "cet4r2", "options": {"A": "Learners can study at their own speed and review difficult parts repeatedly.", "B": "Learners can avoid all deadlines.", "C": "Learners can study without any teacher.", "D": "Learners only need to submit homework at midnight."}, "point": "阅读理解·细节理解", "stem": "According to the passage, what does flexibility in online learning mean?", "type": "single"}, {"answer": "A", "explain": "第二段明确提到：没有固定时间表时，有的学生拖到最后一天才做作业，有的在家容易被手机和社交媒体分心。", "id": "cet4r3", "options": {"A": "Some students delay their work and are easily distracted at home.", "B": "Online lectures are always too short.", "C": "Universities refuse to offer online courses.", "D": "Students in small towns have no internet access."}, "point": "阅读理解·细节理解", "stem": "What problem of online learning is mentioned in the passage?", "type": "single"}, {"answer": "A", "explain": "第二段末尾明确列出：short videos, clear weekly deadlines, and quick feedback。", "id": "cet4r4", "options": {"A": "Short videos, clear weekly deadlines, and quick feedback.", "B": "Longer lectures with no deadlines.", "C": "Social media alone, without any structure.", "D": "Homework that can only be submitted at midnight."}, "point": "阅读理解·细节理解", "stem": "What do good online courses use to help students stay on track?", "type": "single"}, {"answer": "A", "explain": "作者既肯定在线学习的便利，又指出灵活性的风险，结论是技术与教师指导结合最好，属于肯定但谨慎的态度。", "id": "cet4r5", "options": {"A": "Positive but cautious: online learning works best when combined with teacher guidance.", "B": "Completely negative about online learning.", "C": "Teachers are no longer needed in education.", "D": "Flexibility in online learning has no risk at all."}, "point": "阅读理解·作者态度", "stem": "What is the author's attitude toward online learning?", "type": "single"}, {"answer": "A", "case": "Every year, a large amount of food is thrown away before it is eaten. At home, people often buy too much, misunderstand date labels, or cook more than they need. In shops and restaurants, unsold food is sometimes thrown away even when it is still safe to eat. The waste is not only a waste of money; it also wastes the water, land, and work used to grow, transport, and cook the food.\nPart of the problem is confusion about labels. “Best before” usually means the food may lose some quality after that date, but it is not necessarily unsafe. “Use by”, by contrast, is about safety and should be followed more strictly. Many people treat the two labels as the same and throw away food too early.\nThe passage suggests simple steps. At home, plan meals before shopping, store food correctly, and use leftovers for the next meal. Shops and restaurants can sell food near its date at a lower price or donate unsold food. Reducing waste, the author argues, needs both careful consumers and responsible businesses.", "explain": "全文先讲浪费的规模与原因，再讲标签混淆，最后讲家庭与商家两方面的办法，主旨是浪费问题大但可以从两方面减少。", "id": "cet4r6", "options": {"A": "Food waste is a large problem, but it can be reduced by careful consumers and responsible businesses.", "B": "Food waste happens only in restaurants.", "C": "Date labels are always about safety.", "D": "Leftovers should always be thrown away."}, "point": "阅读理解·主旨大意", "stem": "What is the main idea of the passage?", "type": "single"}, {"answer": "A", "explain": "首段明确列出家庭浪费的三个原因：buy too much, misunderstand date labels, or cook more than they need。", "id": "cet4r7", "options": {"A": "Buying too much, misunderstanding date labels, and cooking more than needed.", "B": "Cooking too little food at home.", "C": "Refusing to shop in supermarkets.", "D": "Eating only in restaurants."}, "point": "阅读理解·细节理解", "stem": "According to the passage, why do households waste food?", "type": "single"}, {"answer": "A", "explain": "文中区分：best before 通常指品质可能下降，但不一定不安全；use by 则关于安全，应更严格遵守。", "id": "cet4r8", "options": {"A": "It usually means quality may drop, but the food is not necessarily unsafe.", "B": "It always means the food is unsafe after that date.", "C": "It means the same as “use by”.", "D": "It means the food must be sold at a lower price."}, "point": "阅读理解·细节理解", "stem": "What does “best before” usually mean in the passage?", "type": "single"}, {"answer": "A", "explain": "末段明确建议：at home, use leftovers for the next meal；商店和餐馆则可降价出售或捐赠未售出的食物。", "id": "cet4r9", "options": {"A": "Use leftovers for the next meal, and shops can sell or donate unsold food.", "B": "Throw away all leftovers immediately.", "C": "Buy more food than needed.", "D": "Ignore date labels completely."}, "point": "阅读理解·细节理解", "stem": "What solutions does the passage suggest?", "type": "single"}, {"answer": "A", "explain": "末段结论句明确说 reducing waste needs both careful consumers and responsible businesses，即需要两方共同努力。", "id": "cet4r10", "options": {"A": "Both consumers and businesses need to act.", "B": "Only consumers need to act.", "C": "Only restaurants need to act.", "D": "Food waste cannot be reduced at all."}, "point": "阅读理解·推理判断", "stem": "What can be inferred from the last paragraph?", "type": "single"}]}, {"name": "第3套 · 写作与翻译（自评，2题）", "questions": [{"answer": "范文对照（自评）", "explain": "范文要点：首段点题——短视频时代，读书仍不可替代；中段两点：①读书培养深度思考，短视频多为碎片信息；②读书积累词汇与表达，有助于写作；尾段总结——把读书作为日常习惯，每天固定时间读。自评清单：①结构是否首段点题＋中段展开＋尾段总结；②是否达到120-180词；③有无主谓一致、时态错误；④是否用到2个以上连接词（如 however, in addition, therefore）。全部做到算对，否则进错题本重练。", "id": "cet4w1", "options": {}, "point": "写作·短文写作：观点论证", "stem": "For this part, you are allowed 30 minutes to write a short essay on whether reading books still matters in the age of short videos. You should write at least 120 words but no more than 180 words.", "type": "self"}, {"answer": "范文对照（自评）", "explain": "参考译文：High-speed rail has become an important way for Chinese people to travel. It is not only fast, but also punctual and safe. In the past, it took more than ten hours to travel from Beijing to Shanghai; today it takes only a little more than four hours. The development of high-speed rail has not only made people's lives more convenient, but also promoted the economic development of cities along the line. 自评清单：① high-speed rail 拼写正确；② not only...but also 结构完整；③ “促进沿线城市经济发展”译出 promoted the economic development of cities along the line；④时态以一般现在时为主。缺两项以上算错，进错题本。", "id": "cet4t1", "options": {}, "point": "翻译·汉译英：说明文段落", "stem": "将下面这段话翻译成英文：高铁已经成为中国人出行的重要方式。它不仅速度快，而且准时、安全。过去，从北京到上海需要十多个小时，如今只需要四个多小时。高铁的发展不仅方便了人们的生活，也促进了沿线城市的经济发展。", "type": "self"}]}], "cet6": [{"name": "第1套 · 词汇与语法（10题）", "questions": [{"id": "cet6_1", "stem": "The committee decided to postpone the meeting ______ further notice.", "options": {"A": "until", "B": "unless", "C": "though", "D": "despite"}, "answer": "A", "point": "六级·词汇语法：until further notice", "explain": "until further notice 是固定搭配，意为“另行通知之前”，句意是会议推迟到另行通知为止。", "type": "single"}, {"id": "cet6_2", "stem": "She took the criticism ______ her stride and kept working on the project.", "options": {"A": "in", "B": "on", "C": "by", "D": "with"}, "answer": "A", "point": "六级·词汇语法：take in one's stride", "explain": "take something in one's stride 是固定搭配，意为“从容应对、泰然处之”。", "type": "single"}, {"id": "cet6_3", "stem": "The new policy is intended to ______ the gap between urban and rural education.", "options": {"A": "widen", "B": "bridge", "C": "ignore", "D": "measure"}, "answer": "B", "point": "六级·词汇语法：bridge the gap", "explain": "bridge the gap 是固定搭配，意为“弥合差距”；widen the gap 是扩大差距，与政策意图相反。", "type": "single"}, {"id": "cet6_4", "stem": "Had he followed the doctor's advice, he ______ in hospital now.", "options": {"A": "would not be", "B": "would not have been", "C": "will not be", "D": "is not"}, "answer": "A", "point": "六级·词汇语法：混合虚拟语气", "explain": "条件是过去的虚拟（Had he followed），结果是现在的情况，用 would + 动词原形，即 would not be。", "type": "single"}, {"id": "cet6_5", "stem": "Only by working together ______ overcome the difficulties ahead.", "options": {"A": "we can", "B": "can we", "C": "we will", "D": "will we"}, "answer": "B", "point": "六级·词汇语法：倒装", "explain": "Only + 状语放句首时，主句要部分倒装：Only by working together can we overcome...", "type": "single"}, {"id": "cet6_6", "stem": "The professor ______ the students to read at least three papers before the seminar.", "options": {"A": "required", "B": "demanded that", "C": "asked that", "D": "suggested to"}, "answer": "A", "point": "六级·词汇语法：require sb to do", "explain": "require sb. to do sth. 是正确结构；demanded / asked / suggested 后接 that 从句时从句用虚拟语气，不直接接 to do。", "type": "single"}, {"id": "cet6_7", "stem": "This phenomenon is often ______ to the rapid growth of short-video platforms.", "options": {"A": "attributed", "B": "contributed", "C": "distributed", "D": "devoted"}, "answer": "A", "point": "六级·词汇语法：be attributed to", "explain": "be attributed to 意为“归因于”；contribute to 是“促成”，主被动与搭配不同。", "type": "single"}, {"id": "cet6_8", "stem": "______ the rain, the outdoor concert went on as planned.", "options": {"A": "In spite", "B": "Despite of", "C": "In spite of", "D": "Although"}, "answer": "C", "point": "六级·词汇语法：in spite of", "explain": "in spite of 后接名词或动名词，意为“尽管”；despite 后不加 of，although 后接从句。", "type": "single"}, {"id": "cet6_9", "stem": "The company has committed itself ______ reducing carbon emissions by 2030.", "options": {"A": "to", "B": "for", "C": "with", "D": "on"}, "answer": "A", "point": "六级·词汇语法：be committed to", "explain": "be committed to doing sth. 是固定搭配，to 是介词，后接动名词 reducing。", "type": "single"}, {"id": "cet6_10", "stem": "It is high time that the government ______ effective measures to protect personal data.", "options": {"A": "takes", "B": "took", "C": "will take", "D": "has taken"}, "answer": "B", "point": "六级·词汇语法：It is high time that", "explain": "It is high time that 后接从句用过去式表示虚拟，意为“早就该……了”。", "type": "single"}]}], "ncre4_net": [{"name": "第1套 · NCRE四级网络工程师客观题（10题）", "questions": [{"answer": "C", "explain": "OSI 七层中，传输层负责端到端通信与可靠传输；网络层负责路由与寻址，数据链路层负责相邻节点间传输，会话层负责会话管理。", "id": "ncre4_1", "options": {"A": "网络层", "B": "数据链路层", "C": "传输层", "D": "会话层"}, "point": "NCRE四级·网络体系结构：OSI传输层", "stem": "在 OSI 参考模型中，负责端到端可靠传输的是哪一层？", "type": "single"}, {"answer": "B", "explain": "/24 的主机位为 8 位，共 256 个地址，减去网络地址与广播地址，可用主机地址为 254 个。", "id": "ncre4_2", "options": {"A": "256 个", "B": "254 个", "C": "248 个", "D": "128 个"}, "point": "NCRE四级·IP编址：子网可用主机数", "stem": "192.168.1.0/24 这个网络中，可用的主机地址有多少个？", "type": "single"}, {"answer": "A", "explain": "TCP 建立连接采用三次握手：SYN、SYN＋ACK、ACK。两次握手不能确认双方收发能力，四次握手不是 TCP 建连过程。", "id": "ncre4_3", "options": {"A": "三次握手", "B": "两次握手", "C": "四次握手", "D": "一次握手"}, "point": "NCRE四级·TCP：三次握手", "stem": "TCP 建立连接时采用的是哪种握手过程？", "type": "single"}, {"answer": "C", "explain": "OSPF 是链路状态路由协议，路由器交换链路状态信息并计算最短路径；RIP 是距离矢量协议，BGP 是路径矢量协议，静态路由不是动态协议。", "id": "ncre4_4", "options": {"A": "RIP", "B": "BGP", "C": "OSPF", "D": "静态路由"}, "point": "NCRE四级·路由协议：OSPF", "stem": "下列哪种路由协议属于链路状态路由协议？", "type": "single"}, {"answer": "B", "explain": "交换机工作在数据链路层，依据 MAC 地址转发；路由器工作在网络层，依据 IP 地址路由；集线器工作在物理层，网关是概念性设备，不对应这一层。", "id": "ncre4_5", "options": {"A": "路由器工作在数据链路层", "B": "交换机工作在数据链路层，路由器工作在网络层", "C": "交换机工作在网络层", "D": "集线器工作在网络层"}, "point": "NCRE四级·网络设备与层次", "stem": "关于交换机与路由器工作层次的说法，正确的是哪一项？", "type": "single"}, {"answer": "C", "explain": "DNS 默认端口是 53，主要用 UDP，区域传送等少数情况用 TCP；80 是 HTTP，443 是 HTTPS，21 是 FTP。", "id": "ncre4_6", "options": {"A": "80", "B": "443", "C": "53", "D": "21"}, "point": "NCRE四级·应用层协议：DNS端口", "stem": "DNS 服务默认使用的端口号是多少？", "type": "single"}, {"answer": "B", "explain": "HTTPS 默认端口是 443，HTTP 是 80，FTP 是 21，SMTP 是 25。", "id": "ncre4_7", "options": {"A": "80", "B": "443", "C": "21", "D": "25"}, "point": "NCRE四级·应用层协议：HTTPS端口", "stem": "HTTPS 服务默认使用的端口号是多少？", "type": "single"}, {"answer": "B", "explain": "/26 的主机位为 6 位，共 64 个地址，减去网络地址与广播地址，可用主机地址为 62 个；30 是 /27 的可用数，126 是 /25 的可用数。", "id": "ncre4_8", "options": {"A": "30 个", "B": "62 个", "C": "126 个", "D": "254 个"}, "point": "NCRE四级·IP编址：/26可用主机数", "stem": "192.168.1.0/26 这个子网中，可用的主机地址有多少个？", "type": "single"}, {"answer": "C", "explain": "RSA 是非对称加密算法，用公钥加密、私钥解密；DES、AES、3DES 都是对称加密算法，收发双方用同一密钥。", "id": "ncre4_9", "options": {"A": "DES", "B": "AES", "C": "RSA", "D": "3DES"}, "point": "NCRE四级·网络安全：非对称加密", "stem": "下列哪种算法属于非对称加密算法？", "type": "single"}, {"answer": "A", "explain": "VLAN 的主要作用是划分广播域、隔离广播流量并提高安全性；它不直接提高链路带宽，也不改变物理拓扑的布线方式。", "id": "ncre4_10", "options": {"A": "划分广播域，隔离广播流量", "B": "提高物理链路带宽", "C": "替代路由器实现跨网段路由", "D": "增加交换机端口数量"}, "point": "NCRE四级·局域网：VLAN作用", "stem": "VLAN 的主要作用是什么？", "type": "single"}]}], "rk_mid_designer": [{"name": "第1套 · 软考中级软件设计师上午客观题（10题）", "questions": [{"answer": "B", "explain": "栈是后进先出（LIFO）的线性表，只允许在栈顶插入与删除；先进先出是队列的特点。", "id": "rk_1", "options": {"A": "栈是先进先出的线性表", "B": "栈是后进先出的线性表", "C": "栈只能在栈底插入元素", "D": "队列是后进先出的线性表"}, "point": "软考中级·数据结构：栈", "stem": "关于栈的说法，正确的是哪一项？", "type": "single"}, {"answer": "C", "explain": "进程是资源分配的基本单位，线程是调度的基本单位；同一进程内的各线程共享该进程的地址空间与资源，但各线程有自己的栈。", "id": "rk_2", "options": {"A": "进程是调度的基本单位", "B": "线程是资源分配的基本单位", "C": "同一进程的各线程共享该进程的地址空间", "D": "不同进程的线程可以直接共享内存"}, "point": "软考中级·操作系统：进程与线程", "stem": "关于进程与线程的说法，正确的是哪一项？", "type": "single"}, {"answer": "B", "explain": "瀑布模型按阶段顺序推进，适用于需求明确、变更很少的项目；需求频繁变更时更适合迭代、敏捷等模型。", "id": "rk_3", "options": {"A": "瀑布模型适用于需求频繁变更的项目", "B": "瀑布模型适用于需求明确且很少变更的项目", "C": "瀑布模型不分阶段，可以并行推进", "D": "瀑布 "C": "VLAN 只能按端口划分，不能按 MAC 地址划分", "D": "VLAN 的主要作用是提高物理链路速率"}, "answer": "B", "point": "软考中级·局域网：VLAN", "explain": "VLAN 是逻辑分组，不受物理位置限制；不同 VLAN 属于不同广播域，互访需要路由器或三层交换机；划分方式包括端口、MAC、协议等多种。", "type": "single"}, {"id": "rknet_5", "stem": "下列哪项属于对称加密算法？", "options": {"A": "RSA", "B": "DSA", "C": "AES", "D": "ECC"}, "answer": "C", "point": "软考中级·网络安全：对称加密", "explain": "AES 是对称加密算法，收发双方用同一密钥；RSA、DSA、ECC 属于非对称加密算法。", "type": "single"}, {"id": "rknet_6", "stem": "SNMP 协议主要用于什么？", "options": {"A": "域名解析", "B": "网络设备管理与监控", "C": "文件传输", "D": "邮件收发"}, "answer": "B", "point": "软考中级·网络管理：SNMP", "explain": "SNMP 是简单网络管理协议，用于管理与监控网络设备；域名解析是 DNS，文件传输是 FTP，邮件收发是 SMTP／POP3。", "type": "single"}, {"id": "rknet_7", "stem": "IEEE 802.11 标准主要对应哪种网络？", "options": {"A": "有线局域网", "B": "无线局域网", "C": "广域网", "D": "城域网"}, "answer": "B", "point": "软考中级·无线网络：802.11", "explain": "802.11 系列是无线局域网标准；有线局域网主要是 802.3 以太网标准。", "type": "single"}, {"id": "rknet_8", "stem": "关于防火墙的说法，正确的是哪一项？", "options": {"A": "防火墙可以防范所有内部攻击", "B": "防火墙主要用于控制网络边界的访问，隔离内外网络", "C": "防火墙可以替代杀毒软件", "D": "防火墙只能过滤 IP 地址，不能过滤端口"}, "answer": "B", "point": "软考中级·网络安全：防火墙", "explain": "防火墙部署在网络边界，按规则控制进出访问；它不能防范所有内部攻击，也不能替代杀毒软件，包过滤防火墙可以按 IP 与端口过滤。", "type": "single"}, {"id": "rknet_9", "stem": "VPN 技术的主要作用是什么？", "options": {"A": "提高局域网带宽", "B": "在公共网络上建立安全的专用通信通道", "C": "替代路由器实现路由", "D": "为每台主机分配固定公网地址"}, "answer": "B", "point": "软考中级·网络安全：VPN", "explain": "VPN 通过加密隧道在公共网络上建立安全的专用通道，实现远程安全接入；它不提高带宽，也不替代路由。", "type": "single"}, {"id": "rknet_10", "stem": "在 TCP／IP 模型中，负责将 IP 地址解析为 MAC 地址的协议是哪个？", "options": {"A": "DNS", "B": "DHCP", "C": "ARP", "D": "ICMP"}, "answer": "C", "point": "软考中级·TCP／IP：ARP", "explain": "ARP 用于 IP 地址到 MAC 地址的解析；DNS 是域名到 IP，DHCP 是动态分配地址，ICMP 是控制报文协议。", "type": "single"}]}], "ncre4_db": [{"name": "第1套 · NCRE四级数据库工程师客观题（10题）", "questions": [{"id": "ncredb_1", "stem": "数据库事务的 ACID 特性中，字母 A 代表的是什么？", "options": {"A": "一致性", "B": "原子性", "C": "隔离性", "D": "持久性"}, "answer": "B", "point": "NCRE四级·数据库事务：ACID", "explain": "ACID 分别为原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）、持久性（Durability）。", "type": "single"}, {"id": "ncredb_2", "stem": "在 SQL 中，删除整张表结构（包括数据与定义）应使用哪个语句？", "options": {"A": "DELETE FROM 表名", "B": "DROP TABLE 表名", "C": "TRUNCATE TABLE 表名", "D": "UPDATE 表名"}, "answer": "B", "point": "NCRE四级·SQL：DROP与DELETE", "explain": "DROP TABLE 删除表定义与数据；DELETE 只删除数据行，保留表结构；TRUNCATE 清空数据但保留结构；UPDATE 是修改数据。", "type": "single"}, {"id": "ncredb_3", "stem": "关于范式的说法，正确的是哪一项？", "options": {"A": "满足 BCNF 的关系模式一定满足第三范式", "B": "满足第三范式的关系模式一定满足 BCNF", "C": "满足第一范式的关系模式一定满足第二范式", "D": "BCNF 与第三范式没有包含关系"}, "answer": "A", "point": "NCRE四级·数据库设计：BCNF", "explain": "BCNF 比第三范式更严格，满足 BCNF 一定满足第三范式；满足第三范式不一定满足 BCNF，因为 BCNF 要求每个决定因素都是候选键。", "type": "single"}, {"id": "ncredb_4", "stem": "关系代数中，选择运算与投影运算的符号分别是哪一组？", "options": {"A": "选择 σ，投影 π", "B": "选择 π，投影 σ", "C": "选择 ⋈，投影 σ", "D": "选择 σ，投影 ⋈"}, "answer": "A", "point": "NCRE四级·关系代数：选择与投影", "explain": "σ 表示选择（按条件选行），π 表示投影（选列），⋈ 表示连接。", "type": "single"}, {"id": "ncredb_5", "stem": "在并发控制中，“丢失更新”是指什么现象？", "options": {"A": "两个事务读到同一数据后各自更新，后提交的覆盖了先提交的更新", "B": "一个事务读到了另一个事务未提交的数据", "C": "一个事务读到了另一个事务已提交的旧数据", "D": "两个事务互相等待对方释放锁"}, "answer": "A", "point": "NCRE四级·并发控制：丢失更新", "explain": "丢失更新是两个事务对同一数据更新时，后者覆盖前者；读未提交数据是脏读，互相等待是死锁。", "type": "single"}, {"id": "ncredb_6", "stem": "关于聚集索引的说法，正确的是哪一项？", "options": {"A": "聚集索引的叶节点存放的是数据行本身，数据按索引键顺序存放", "B": "聚集索引的叶节点只存放键值与指针", "C": "一张表可以有多个聚集索引", "D": "聚集索引与数据存放顺序无关"}, "answer": "A", "point": "NCRE四级·索引：聚集索引", "explain": "聚集索引决定数据行的物理存放顺序，叶节点就是数据行本身，一张表最多只能有一个聚集索引；只存键值与指针的是非聚集索引。", "type": "single"}, {"id": "ncredb_7", "stem": "E-R 图中，实体与实体之间的“一对多”联系通常记为什么？", "options": {"A": "1:1", "B": "1:N", "C": "M:N", "D": "N:1 且只能反向表示"}, "answer": "B", "point": "NCRE四级·E-R图：联系类型", "explain": "一对多记为 1:N；一对一为 1:1，多对多为 M:N。", "type": "single"}, {"id": "ncredb_8", "stem": "数据库恢复中，检查点（Checkpoint）的主要作用是什么？", "options": {"A": "删除所有日志", "B": "缩短恢复时需要扫描的日志量，加快恢复", "C": "阻止所有事务提交", "D": "将数据库改为只读"}, "answer": "B", "point": "NCRE四级·数据库恢复：检查点", "explain": "检查点定期将内存数据写入磁盘并记录位置，恢复时只需从最近检查点开始扫描日志，从而加快恢复；它不删除日志，也不阻止提交。", "type": "single"}, {"id": "ncredb_9", "stem": "关于数据仓库的说法，正确的是哪一项？", "options": {"A": "数据仓库是面向事务处理的，数据频繁更新", "B": "数据仓库是面向主题、集成、相对稳定、随时间变化的数据集合", "C": "数据仓库与操作型数据库完全相同", "D": "数据仓库中的数据不随时间变化"}, "answer": "B", "point": "NCRE四级·数据仓库：基本特征", "explain": "数据仓库面向主题、集成、相对稳定、随时间变化，用于分析决策；操作型数据库面向事务处理，数据频繁更新。", "type": "single"}, {"id": "ncredb_10", "stem": "在数据库系统中，触发器是一种什么机制？", "options": {"A": "由用户手动调用的存储过程", "B": "在特定数据操作发生时自动执行的特殊存储过程", "C": "用于备份数据库的工具", "D": "用于创建索引的语句"}, "answer": "B", "point": "NCRE四级·触发器", "explain": "触发器在 INSERT、UPDATE、DELETE 等事件发生时自动执行，不需要用户手动调用；它不是备份工具，也不是索引语句。", "type": "single"}]}], "ncre4_sec": [{"name": "第1套 · NCRE四级信息安全工程师客观题（10题）", "questions": [{"id": "ncre4sec_1", "stem": "下列哪项属于对称加密算法？", "options": {"A": "RSA", "B": "AES", "C": "DSA", "D": "ECC"}, "answer": "B", "point": "NCRE四级·信息安全：对称加密", "explain": "AES 是对称加密算法，收发双方用同一密钥；RSA、DSA、ECC 属于非对称加密。", "type": "single"}, {"id": "ncre4sec_2", "stem": "数字签名的主要作用是什么？", "options": {"A": "对数据加密防止窃听", "B": "验证发送者身份并保证数据未被篡改", "C": "提高网络传输速度", "D": "压缩数据体积"}, "answer": "B", "point": "NCRE四级·信息安全：数字签名", "explain": "数字签名用发送者私钥签名、接收者公钥验证，解决身份认证与完整性问题；它本身不负责保密传输。", "type": "single"}, {"id": "ncre4sec_3", "stem": "关于哈希函数（散列）的说法，正确的是哪一项？", "options": {"A": "哈希值长度随输入长度成比例增长", "B": "同一输入的哈希值每次计算都不同", "C": "哈希是单向的，难以从哈希值还原原始数据", "D": "哈希可以替代加密实现保密"}, "answer": "C", "point": "NCRE四级·信息安全：哈希函数", "explain": "哈希函数输出定长摘要，具有单向性与抗碰撞性；它用于完整性校验，不能替代加密实现保密。", "type": "single"}, {"id": "ncre4sec_4", "stem": "入侵检测系统（IDS）与入侵防御系统（IPS）的主要区别是什么？", "options": {"A": "IDS 只检测不阻断，IPS 可以主动阻断可疑流量", "B": "IDS 只能检测病毒，IPS 只能检测木马", "C": "IDS 部署在边界，IPS 只能部署在内网", "D": "两者功能完全相同，只是名称不同"}, "answer": "A", "point": "NCRE四级·信息安全：IDS与IPS", "explain": "IDS 以检测报警为主，一般不阻断流量；IPS 串联在流量路径上，可以丢弃或阻断可疑流量。", "type": "single"}, {"id": "ncre4sec_5", "stem": "下列哪种攻击属于社会工程学攻击？", "options": {"A": "SQL 注入", "B": "钓鱼邮件诱骗用户交出账号密码", "C": "DDoS 攻击", "D": "缓冲区溢出"}, "answer": "B", "point": "NCRE四级·信息安全：社会工程学", "explain": "社会工程学利用人的心理弱点骗取信息，钓鱼邮件是典型；SQL 注入、DDoS、缓冲区溢出属于技术型攻击。", "type": "single"}, {"id": "ncre4sec_6", "stem": "访问控制模型中，基于角色的访问控制简称为？", "options": {"A": "DAC", "B": "MAC", "C": "RBAC", "D": "ABAC"}, "answer": "C", "point": "NCRE四级·信息安全：访问控制", "explain": "RBAC 是基于角色的访问控制；DAC 是自主访问控制，MAC 是强制访问控制，ABAC 是基于属性的访问控制。", "type": "single"}, {"id": "ncre4sec_7", "stem": "下列哪项不是计算机病毒的常见特征？", "options": {"A": "传染性", "B": "潜伏性", "C": "可触发性", "D": "可公开审计性"}, "answer": "D", "point": "NCRE四级·信息安全：病毒特征", "explain": "病毒常见特征包括传染性、潜伏性、破坏性、可触发性等；可公开审计性不是病毒特征。", "type": "single"}, {"id": "ncre4sec_8", "stem": "SSL／TLS 协议主要工作在哪一层？", "options": {"A": "网络层", "B": "传输层与应用层之间（会话层附近）", "C": "数据链路层", "D": "物理层"}, "answer": "B", "point": "NCRE四级·信息安全：SSL／TLS", "explain": "SSL／TLS 位于传输层之上、应用层之下，为应用数据提供加密与认证，常见说法是工作在传输层与应用层之间。", "type": "single"}, {"id": "ncre4sec_9", "stem": "关于数字证书的说法，正确的是哪一项？", "options": {"A": "数字证书由用户自己签发即具有公信力", "B": "数字证书将公钥与持有者身份绑定，由 CA 签发", "C": "数字证书只能用于加密，不能用于身份认证", "D": "数字证书的有效期是永久的"}, "answer": "B", "point": "NCRE四级·信息安全：数字证书与CA", "explain": "数字证书由可信的证书颁发机构 CA 签发，把公钥与身份绑定，用于身份认证与密钥分发；证书有有效期。", "type": "single"}, {"id": "ncre4sec_10", "stem": "下列哪项是防范 DDoS 攻击的合理措施？", "options": {"A": "关闭所有网络服务", "B": "流量清洗与带宽扩容结合，配合访问限速", "C": "把服务器密码设得更长", "D": "只允许内网用户访问，不再对外提供服务"}, "answer": "B", "point": "NCRE四级·信息安全：DDoS防范", "explain": "DDoS 靠海量流量压垮服务，合理做法是流量清洗、扩容与限速结合；单纯改密码或关服务不能解决流量攻击。", "type": "single"}]}], "ncre4_embed": [{"name": "第1套 · NCRE四级嵌入式系统开发工程师客观题（10题）", "questions": [{"id": "ncre4emb_1", "stem": "嵌入式系统最典型的特征是什么？", "options": {"A": "通用性强，可运行任意大型软件", "B": "专用性强，软硬件结合，资源受限", "C": "必须有大容量硬盘", "D": "必须联网运行"}, "answer": "B", "point": "NCRE四级·嵌入式基础：系统特征", "explain": "嵌入式系统面向特定应用，软硬件紧密结合，处理器、内存、功耗都受限；它不是通用计算机。", "type": "single"}, {"id": "ncre4emb_2", "stem": "关于实时操作系统（RTOS）的说法，正确的是哪一项？", "options": {"A": "RTOS 的首要目标是任务在规定时间内完成", "B": "RTOS 的首要目标是运行速度最快", "C": "RTOS 不能用于中断处理", "D": "RTOS 与通用操作系统没有区别"}, "answer": "A", "point": "NCRE四级·嵌入式：RTOS", "explain": "RTOS 强调确定性与时限性，任务要在截止时间前完成；速度快不等于实时，通用系统不保证时限。", "type": "single"}, {"id": "ncre4emb_3", "stem": "ARM 处理器中，RISC 架构的主要特点是什么？", "options": {"A": "指令复杂，单条指令完成多步操作", "B": "指令简单规整，执行效率高，功耗较低", "C": "只能用于服务器", "D": "不适合嵌入式应用"}, "answer": "B", "point": "NCRE四级·嵌入式：ARM与RISC", "explain": "RISC 指令简单规整，利于流水线与低功耗，这正是 ARM 在嵌入式领域广泛应用的原因。", "type": "single"}, {"id": "ncre4emb_4", "stem": "在嵌入式系统中，Flash 存储器常用于什么？", "options": {"A": "存放运行时的临时变量", "B": "存放程序代码与掉电不丢失的数据", "C": "替代 CPU 进行计算", "D": "存放显示缓存"}, "answer": "B", "point": "NCRE四级·嵌入式：存储器", "explain": "Flash 是非易失存储器，掉电后数据不丢失，常存程序与配置；运行时临时变量放在 RAM 里。", "type": "single"}, {"id": "ncre4emb_5", "stem": "中断处理中，保存现场的主要目的是什么？", "options": {"A": "提高 CPU 主频", "B": "中断返回后能恢复被打断程序的执行状态", "C": "减少内存占用", "D": "关闭所有外设"}, "answer": "B", "point": "NCRE四级·嵌入式：中断", "explain": "中断会打断当前程序，保存寄存器等现场是为了中断处理完后能准确恢复原程序继续执行。", "type": "single"}, {"id": "ncre4emb_6", "stem": "GPIO 的全称含义最接近哪一项？", "options": {"A": "图形处理输出接口", "B": "通用输入输出接口", "C": "高速串行总线", "D": "电源管理模块"}, "answer": "B", "point": "NCRE四级·嵌入式：GPIO", "explain": "GPIO 是 General Purpose Input/Output，即通用输入输出接口，可由软件配置为输入或输出。", "type": "single"}, {"id": "ncre4emb_7", "stem": "关于看门狗（Watchdog）的作用，正确的是哪一项？", "options": {"A": "防止程序跑飞，超时未喂狗则复位系统", "B": "监控网络流量", "C": "加密通信数据", "D": "管理文件系统"}, "answer": "A", "point": "NCRE四级·嵌入式：看门狗", "explain": "看门狗定时器需要程序定期“喂狗”，超时未喂说明程序可能跑飞或死机，看门狗会复位系统恢复运行。", "type": "single"}, {"id": "ncre4emb_8", "stem": "I2C 总线最显著的特点是什么？", "options": {"A": "需要很多根信号线", "B": "只需两根线（时钟与数据），可挂多个设备", "C": "只能一对一通信", "D": "传输距离可达数公里"}, "answer": "B", "point": "NCRE四级·嵌入式：I2C总线", "explain": "I2C 只用 SCL 时钟线与 SDA 数据线，通过地址区分多个从设备，适合板内短距离低速通信。", "type": "single"}, {"id": "ncre4emb_9", "stem": "嵌入式开发中，交叉编译是指什么？", "options": {"A": "在目标板上直接编译程序", "B": "在宿主机上为不同架构的目标机编译程序", "C": "同时编译两个版本的程序", "D": "用两种语言混合编写程序"}, "answer": "B", "point": "NCRE四级·嵌入式：交叉编译", "explain": "嵌入式目标机资源有限，常在性能更强的宿主机上，用交叉编译器生成目标机架构的可执行程序。", "type": "single"}, {"id": "ncre4emb_10", "stem": "下列哪项是降低嵌入式系统功耗的合理做法？", "options": {"A": "让 CPU 始终满频运行", "B": "空闲时进入低功耗模式，按需调整主频", "C": "关闭所有中断", "D": "增大供电电压"}, "answer": "B", "point": "NCRE四级·嵌入式：低功耗设计", "explain": "低功耗设计常用空闲休眠、动态调频调压等方法；始终满频、增大电压都会增加功耗。", "type": "single"}]}], "rk_mid_supervisor": [{"name": "第1套 · 软考中级信息系统监理师上午客观题（10题）", "questions": [{"id": "rksup_1", "stem": "信息系统工程监理中，“三控”通常指什么？", "options": {"A": "质量控制、进度控制、投资控制", "B": "人员控制、设备控制、材料控制", "C": "需求控制、设计控制、测试控制", "D": "安全控制、保密控制、风险控制"}, "answer": "A", "point": "软考中级·监理：三控", "explain": "监理的“三控”即质量控制、进度控制、投资控制；“三管一协调”中的三管是合同管理、信息管理、安全管理，协调是组织协调。", "type": "single"}, {"id": "rksup_2", "stem": "监理规划一般由谁编制，并经谁批准后实施？", "options": {"A": "承建单位编制，建设单位批准", "B": "总监理工程师编制，监理单位技术负责人批准", "C": "建设单位编制，承建单位批准", "D": "监理员编制，总监理工程师批准"}, "answer": "B", "point": "软考中级·监理：监理规划", "explain": "监理规划由总监理工程师主持编制，经监理单位技术负责人批准后实施，是监理工作的指导性文件。", "type": "single"}, {"id": "rksup_3", "stem": "旁站监理主要适用于什么情形？", "options": {"A": "所有会议", "B": "关键部位、关键工序的施工或实施过程", "C": "文档编写", "D": "设备采购谈判"}, "answer": "B", "point": "软考中级·监理：旁站", "explain": "旁站是在关键部位、关键工序实施过程中，监理人员在现场跟班监督检查，出现问题及时处理。", "type": "single"}, {"id": "rksup_4", "stem": "关于监理单位与建设单位、承建单位关系的说法，正确的是哪一项？", "options": {"A": "监理单位是建设单位的下属部门", "B": "监理单位受建设单位委托，独立、公正地开展监理，与承建单位没有隶属关系", "C": "监理单位受承建单位领导", "D": "监理单位可以同时承接同一项目的建设任务"}, "answer": "B", "point": "软考中级·监理：独立公正", "explain": "监理单位受建设单位委托，依法独立、公正执业；它与承建单位没有隶属关系，也不得同时承担同一项目的建设任务以免利益冲突。", "type": "single"}, {"id": "rksup_5", "stem": "工程变更控制中，变更申请一般首先由谁提出并经监理审核？", "options": {"A": "只能由建设单位提出", "B": "建设、承建或监理任一方均可提出，按程序经监理审核、建设单位批准", "C": "只能由监理单位提出", "D": "变更不需要任何审批"}, "answer": "B", "point": "软考中级·监理：变更控制", "explain": "变更可由多方提出，但必须按程序经监理审核和建设单位批准后才能实施，未经批准不得擅自变更。", "type": "single"}, {"id": "rksup_6", "stem": "监理日志的主要作用是什么？", "options": {"A": "记录监理人员考勤", "B": "真实记录工程实施过程，为验收和争议处理提供依据", "C": "代替竣工报告", "D": "记录设备价格"}, "answer": "B", "point": "软考中级·监理：监理日志", "explain": "监理日志按日记录施工、检查、问题与处理情况，是工程过程的真实记录，也是验收和争议处理的重要依据。", "type": "single"}, {"id": "rksup_7", "stem": "在质量控制中，隐蔽工程在覆盖前必须经过什么程序？", "options": {"A": "承建单位自行覆盖即可", "B": "报监理检查验收合格后方可覆盖", "C": "只需拍照留存", "D": "等到竣工时再检查"}, "answer": "B", "point": "软考中级·监理：隐蔽工程验收", "explain": "隐蔽工程覆盖前必须报监理检查验收，合格后才能进入下一道工序，否则事后难以检查，质量责任不清。", "type": "single"}, {"id": "rksup_8", "stem": "下列哪项属于监理的合同管理工作？", "options": {"A": "编写用户手册", "B": "协助建设单位处理合同争议，监督合同履行", "C": "开发应用软件", "D": "采购办公设备"}, "answer": "B", "point": "软考中级·监理：合同管理", "explain": "合同管理包括监督合同履行、处理变更与索赔、协助解决合同争议等；开发软件、编写用户手册是承建单位的工作。", "type": "single"}, {"id": "rksup_9", "stem": "监理实施细则与监理规划的关系是？", "options": {"A": "实施细则是规划的细化，针对专业或分项工程编制", "B": "两者完全相同", "C": "实施细则可以替代规划", "D": "规划是实施细则的附件"}, "answer": "A", "point": "软考中级·监理：实施细则", "explain": "监理规划是总体指导文件，实施细则是针对某一专业或分项工程的操作性细化文件，两者是总体与具体的关系。", "type": "single"}, {"id": "rksup_10", "stem": "工程验收时，监理单位的主要职责是什么？", "options": {"A": "代替建设单位签字接收", "B": "对工程质量进行评估，提出监理评估意见", "C": "负责工程的后期运维", "D": "编制决算报告"}, "answer": "B", "point": "软考中级·监理：验收评估", "explain": "验收时监理单位应对工程质量作出评估并出具意见，供建设单位组织验收参考；接收与运维、决算不是监理单位的职责。", "type": "single"}]}], "rk_mid_integration": [{"name": "第1套 · 软考中级系统集成项目管理工程师上午客观题（10题）", "questions": [{"id": "rkint_1", "stem": "项目管理中，范围基准不包括哪一项？", "options": {"A": "范围说明书", "B": "工作分解结构（WBS）", "C": "WBS 词典", "D": "项目章程"}, "answer": "D", "point": "软考中级·集成管理：范围基准", "explain": "范围基准由范围说明书、WBS 和 WBS 词典组成；项目章程是项目启动的授权文件，不属于范围基准。", "type": "single"}, {"id": "rkint_2", "stem": "挣值管理中，成本绩效指数 CPI 的计算公式是？", "options": {"A": "CPI = EV / AC", "B": "CPI = EV / PV", "C": "CPI = AC / EV", "D": "CPI = PV / EV"}, "answer": "A", "point": "软考中级·集成管理：挣值", "explain": "CPI = 挣值 EV / 实际成本 AC，CPI 大于 1 表示成本节约，小于 1 表示成本超支；EV / PV 是进度绩效指数 SPI。", "type": "single"}, {"id": "rkint_3", "stem": "某项目 EV = 80 万元，AC = 100 万元，PV = 90 万元，则该项目处于什么状态？", "options": {"A": "进度超前、成本节约", "B": "进度落后、成本超支", "C": "进度超前、成本超支", "D": "进度落后、成本节约"}, "answer": "B", "point": "软考中级·集成管理：挣值判断", "explain": "SPI = EV / PV = 80 / 90 < 1，进度落后；CPI = EV / AC = 80 / 100 < 1，成本超支。", "type": "single"}, {"id": "rkint_4", "stem": "关键路径法中，活动的总时差是指？", "op   let html = `<div class="card"><h3 style="margin:4px 0">${esc(e.name)}</h3><p class="meta">${esc(e.subtitle)}</p><p class="meta">${esc(e.note||'')}</p>`;
  html += (e.group?`<p class="meta">所属：${esc(e.group)}${e.fit?' · 模型适配：'+esc(e.fit):''}</p>`:'');
  html += e.sections.map(s=>`<div style="padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px"><b>${esc(s.name)}</b>：${esc(s.note||'')}${s.score!=null?'（'+s.score+'分）':''}</div>`).join('');
  html += `</div>`;
  if(e.status==='skeleton'){
    html += `<div class="card"><p>题库待接入：配置骨架已建好（分值、题型、时长），按试点验证的顺序逐科出题，不会为凑数放未经核对的题目。</p></div>`;
    $('#app').innerHTML=html; return;
  }
  if(e.status==='live_elsewhere'){
    html += `<div class="card"><p>本题库已在原页面上线，通用版下一步再迁移，本页不重复建库。</p><div class="row"><button class="btn pri" onclick="window.open('${e.link}','_blank')">打开原税法一页面</button></div></div>`;
    $('#app').innerHTML=html; return;
  }
  let done=ALL.filter(q=>progress[q.id]).length;
  html += `<div class="card"><div class="meta">总进度 ${done} / ${ALL.length} 题 · 进度只保存在本机浏览器，换设备请用导出思路备份（后续接同步时再打通）</div>
    <div class="bar" style="margin-top:8px"><i style="width:${ALL.length?done/ALL.length*100:0}%"></i></div></div>`
    + curSets().map((s,i)=>{const d=s.questions.filter(q=>progress[q.id]).length;
      return `<button class="setbtn" onclick="openSet(${i})"><b>${esc(s.name)}</b><br><small>${s.questions.length} 题 · 已做 ${d} 题</small></button>`}).join('');
  $('#app').innerHTML=html;
}
function openSet(i){ curSet=i; renderQuestions(curSets()[i].questions, curSets()[i].name, ()=>renderSets()); }
function renderQuestions(list, title, back){
  CASESEEN=new Set();
  $('#app').innerHTML = `<div class="row"><button class="btn" onclick="backFn()">← 返回</button></div>
    <h3 style="margin:12px 2px">${esc(title)}</h3>` + list.map((q,idx)=>qHTML(q,idx)).join('');
  window.backFn=back;
  list.forEach(q=>restore(q));
}
let CASESEEN=new Set();
function typeLabel(t){ return t==='single'?'单选题':t==='multi'?'多选题':t==='calc'?'计算题':t==='self'?'自评题（写作／翻译）':'题目'; }
function qHTML(q,idx){
  let caseHtml=''; if(q.case && !CASESEEN.has(q.case)){ CASESEEN.add(q.case); caseHtml=`<div class="casebox">${esc(q.case)}</div>`; }
  const head=caseHtml+`<div class="qtag">${typeLabel(q.type)} · 第 ${idx+1} 题</div><div class="stem">${esc(q.stem)}</div>`;
  let body='';
  if(q.type==='calc'){
    body=`<input class="num" id="in-${q.id}" type="number" inputmode="decimal" placeholder="输入答案（单位：${q.unit||''}）">
          <div class="row"><button class="btn pri" onclick="gradeCalc('${q.id}')">提交答案</button></div>`;
  }else if(q.type==='self'){
    body=`<textarea class="ans" id="txt-${q.id}" placeholder="在这里作答（写作／翻译），写完对照下方范文自评"></textarea>
          <div class="row"><button class="btn pri" onclick="gradeSelf('${q.id}',true)">对照后：我写对了</button><button class="btn" onclick="gradeSelf('${q.id}',false)">对照后：我写错了</button></div>
          <p class="meta">自评说明：先自己写，再点开解析对照范文与自评清单打对错；系统不替你判主观题。</p>`;
  }else{
    body=Object.keys(q.options).sort().map(k=>
      `<button class="opt" id="opt-${q.id}-${k}" onclick="pick('${q.id}','${k}',${q.type==='multi'})">${k}. ${esc(q.options[k])}</button>`).join('')
      +`<div class="row"><button class="btn pri" onclick="gradeChoice('${q.id}')">提交答案</button></div>`;
  }
  return `<div class="card" id="card-${q.id}">${head}${body}<div class="exp" id="exp-${q.id}"></div></div>`;
}
const selState={};
function pick(id,k,multi){
  if(progress[id]) return;
  selState[id]=selState[id]||new Set();
  if(multi){ selState[id].has(k)?selState[id].delete(k):selState[id].add(k); }
  else selState[id]=new Set([k]);
  document.querySelectorAll(`[id^="opt-${id}-"]`).forEach(b=>b.classList.remove('sel'));
  selState[id].forEach(x=>{const b=document.getElementById(`opt-${id}-${x}`); if(b) b.classList.add('sel');});
}
function verdict(id,ok,ansText,q){
  const e=document.getElementById('exp-'+id);
  e.classList.add('show');
  e.innerHTML=`<span class="verdict ${ok?'ok':'bad'}">${ok?'✓ 答对了':'✗ 答错了'}</span>　正确答案：<b>${esc(ansText)}</b>`+(q.point?`\n<span class="ptline">考点：${esc(q.point)}</span>`:'')+(q.explain?`\n解析：${esc(q.explain)}`:'');
  progress[id]={correct:ok}; markWrong(id,!ok); save();
}
function gradeChoice(id){
  const q=curAll().find(x=>x.id===id); const sel=selState[id];
  if(!sel||sel.size===0){alert('先选一个答案');return;}
  const mine=[...sel].sort().join(''), ans=String(q.answer).split('').sort().join('');
  const ok = mine===ans;
  [...String(q.answer)].forEach(k=>{const b=document.getElementById(`opt-${id}-${k}`); if(b) b.classList.add('right');});
  if(!ok) sel.forEach(k=>{const b=document.getElementById(`opt-${id}-${k}`); if(b) b.classList.add('wrong');});
  verdict(id,ok,String(q.answer),q);
}
function gradeCalc(id){
  const q=curAll().find(x=>x.id===id); const v=parseFloat(document.getElementById('in-'+id).value);
  if(isNaN(v)){alert('先输入数字答案');return;}
  const ok=Math.abs(v-Number(q.answer))<=Math.max(0.02,Math.abs(Number(q.answer))*0.001);
  verdict(id,ok,`${q.answer} ${q.unit||''}`,q);
}
function gradeSelf(id,ok){
  const q=curAll().find(x=>x.id===id);
  verdict(id,ok,'范文对照（见解析）',q);
}
function restore(q){
  if(!progress[q.id]) return;
  const e=document.getElementById('exp-'+q.id); if(!e) return;
  const ok=progress[q.id].correct;
  e.classList.add('show');
  e.innerHTML=`<span class="verdict ${ok?'ok':'bad'}">${ok?'✓ 已答对':'✗ 已答错（在错题本里）'}</span>　正确答案：<b>${q.type==='calc'?q.answer+' '+(q.unit||''):esc(q.answer)}</b>`+(q.point?`\n<span class="ptline">考点：${esc(q.point)}</span>`:'')+(q.explain?`\n解析：${esc(q.explain)}`:'');
  if(q.type!=='calc' && q.type!=='self') [...String(q.answer)].forEach(k=>{const b=document.getElementById(`opt-${q.id}-${k}`); if(b) b.classList.add('right');});
}

/* 模拟考试：客观题随机抽，碎片版，非全真卷 */
function renderExamHome(){
  const e=curExam(), pool=curAll().filter(q=>q.type!=='self');
  if(!pool.length){ $('#app').innerHTML=`<div class="empty">该考试暂无客观题，题库接入后再开模拟考试。</div>`; return; }
  $('#app').innerHTML=`<div class="card"><h3 style="margin:4px 0">模拟考试（碎片版）</h3>
  <p class="meta">从${esc(e.name)}客观题库随机抽 ${Math.min(20,pool.length)} 题，限时 30 分钟，交卷后统一判分。全真卷按各考试官方时长与分值另行配置（税法 140分/150分钟、四级 710分/130分钟等），碎片版只练手感和查漏。</p>
  <div class="row"><button class="btn pri" onclick="startExam()">开始考试</button></div></div>`;
}
function startExam(){
  const pool=[...curAll().filter(q=>q.type!=='self')].sort(()=>Math.random()-0.5).slice(0,20);
  exam={list:pool,left:30*60,timer:null};
  renderQuestions(pool,'模拟考试（'+pool.length+' 题）',()=>{clearInterval(exam.timer);showTab('exam');});
  document.querySelectorAll('#app .card .btn.pri').forEach(b=>{ if(b.textContent.includes('提交')) b.style.display='none'; });
  const h=document.createElement('div'); h.className='card'; h.id='examhead';
  h.innerHTML=`<span class="timer" id="timer">30:00</span>　<span class="meta">答完点下方交卷</span>
    <div class="row"><button class="btn pri" onclick="submitExam()">交卷</button></div>`;
  $('#app').prepend(h);
  exam.timer=setInterval(()=>{ exam.left--;
    const t=document.getElementById('timer'); if(t) t.textContent=`${String(Math.floor(exam.left/60)).padStart(2,'0')}:${String(exam.left%60).padStart(2,'0')}`;
    if(exam.left<=0){clearInterval(exam.timer);submitExam();} },1000);
}
function submitExam(){
  if(!exam) return; clearInterval(exam.timer);
  let score=0; const total=exam.list.length;
  exam.list.forEach(q=>{
    let ok=false;
    if(q.type==='calc'){ const el=document.getElementById('in-'+q.id); const v=el?parseFloat(el.value):NaN;
      ok=!isNaN(v)&&Math.abs(v-Number(q.answer))<=Math.max(0.02,Math.abs(Number(q.answer))*0.001); }
    else { const sel=selState[q.id]; if(sel&&sel.size){ ok=[...sel].sort().join('')===String(q.answer).split('').sort().join(''); } }
    if(ok) score++; else markWrong(q.id,true);
    progress[q.id]={correct:ok};
  });
  save();
  const head=document.getElementById('examhead');
  if(head) head.innerHTML=`<div class="score">${score} / ${total}</div><p class="meta">已交卷。下面逐题看对错和解析，错题已自动进错题本。</p>`;
  exam.list.forEach(q=>restore(q));
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderWrong(){
  const list=curAll().filter(q=>wrong.includes(q.id));
  if(!list.length){ $('#app').innerHTML=`<div class="empty">错题本是空的，做错的题会自动收进来（按当前考试隔离）。</div>`; return; }
  renderQuestions(list,`错题本（${list.length} 题）`,()=>showTab('wrong'));
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<button class="btn" onclick="if(confirm('清空当前考试的错题本？')){wrong=[];save();showTab('wrong');}">清空错题本</button>`;
  $('#app').appendChild(d);
}
function renderMap(){
  const REG=curAll(), e=curExam();
  const groups={};
  REG.forEach(q=>{ if(!q.point) return; const ch=q.point.split('·')[0];
    groups[ch]=groups[ch]||{}; (groups[ch][q.point]=groups[ch][q.point]||[]).push(q); });
  const nPts=Object.values(groups).reduce((a,g)=>a+Object.keys(g).length,0);
  let fhtml='';
  if(e.cards && e.cards.length){
    fhtml=`<div class="card"><h3 style="margin:4px 0">知识卡片</h3>`+
      e.cards.map(f=>`<div style="padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6"><b>${esc(f.name)}</b>：${esc(f.text)}</div>`).join('')+`</div>`;
  }
  let html=fhtml+`<div class="card"><h3 style="margin:4px 0">考点地图 · ${esc(e.name)}</h3>
    <p class="meta">现有 ${REG.length} 道题，覆盖 ${nPts} 个考点。点任意考点的「专练」，只练这一考点的全部题目。</p></div>`;
  if(!Object.keys(groups).length){ html+=`<div class="card"><p>该考试暂无考点数据，题库接入后自动生成考点地图。</p></div>`; }
  Object.keys(groups).forEach(ch=>{
    html+=`<div class="sechead">${esc(ch)}</div>`;
    Object.keys(groups[ch]).forEach(p=>{
      const list=groups[ch][p];
      html+=`<div class="maprow"><span style="flex:1">${esc(p.split('·').slice(1).join('·')||p)}<br><small class="meta">${list.length} 题</small></span><button class="btn" onclick="practicePoint('${p.replace(/'/g,"\\'")}')">专练</button></div>`;
    });
  });
  $('#app').innerHTML=html;
}
function practicePoint(p){
  const list=curAll().filter(q=>q.point===p);
  renderQuestions(list,'考点专练 · '+p,()=>showTab('map'));
}
/* 初始化：分类下拉 -> 考试下拉，默认财务考试 · 税法一（展示税法归位） */
function switchCategory(cat){
  const sel=$('#examSel');
  const list=EXAMS.filter(e=>e.category===cat);
  sel.innerHTML = list.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  switchExam(list[0].id);
}
(function init(){
  const csel=$('#catSel');
  csel.innerHTML = CATS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  csel.value='finance';
  switchCategory('finance');
})();
</script>
