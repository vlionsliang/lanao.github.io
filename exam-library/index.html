栈是后进先出的线性表，插入和删除都只在栈顶进行；先进先出的是队列。", "type": "single"}, {"id": "rkprog_2", "stem": "在 C 语言中，int a[5]; 则 a[4] 是第几个元素？", "options": {"A": "第 4 个", "B": "第 5 个", "C": "第 6 个", "D": "不存在"}, "answer": "B", "point": "软考初级·程序员：数组下标", "explain": "C 数组下标从 0 开始，a[0] 是第 1 个，a[4] 是第 5 个，也是该数组的最后一个元素。", "type": "single"}, {"id": "rkprog_3", "stem": "关于循环的说法，正确的是哪一项？", "options": {"A": "for 循环不能用在已知次数的场合", "B": "while 循环先判断条件再执行循环体", "C": "do-while 循环先执行一次再判断", "D": "B 和 C 都正确"}, "answer": "D", "point": "软考初级·程序员：循环结构", "explain": "while 是先判断后执行，可能一次都不执行；do-while 是先执行后判断，至少执行一次；for 常用于已知次数。", "type": "single"}, {"id": "rkprog_4", "stem": "二进制数 1011 转换为十进制是多少？", "options": {"A": "9", "B": "10", "C": "11", "D": "13"}, "answer": "C", "point": "软考初级·程序员：数制转换", "explain": "1011 = 1×8 + 0×4 + 1×2 + 1×1 = 11。", "type": "single"}, {"id": "rkprog_5", "stem": "关于函数的说法，正确的是哪一项？", "options": {"A": "函数不能有返回值", "B": "函数可以把复杂任务分解成小任务，便于复用", "C": "函数只能调用一次", "D": "函数不能带参数"}, "answer": "B", "point": "软考初级·程序员：函数", "explain": "函数用于分解任务、复用代码，可以带参数、可以有返回值、可以多次调用。", "type": "single"}, {"id": "rkprog_6", "stem": "在关系数据库中，SELECT 语句的作用是？", "options": {"A": "创建表", "B": "查询数据", "C": "删除表", "D": "修改表结构"}, "answer": "B", "point": "软考初级·程序员：SQL查询", "explain": "SELECT 用于查询数据；CREATE TABLE 建表，DROP TABLE 删表，ALTER TABLE 改结构。", "type": "single"}, {"id": "rkprog_7", "stem": "操作系统中，进程与程序的区别最接近哪一项？", "options": {"A": "两者完全相同", "B": "程序是静态代码，进程是程序的一次动态执行过程", "C": "进程是静态的，程序是动态的", "D": "程序只能运行一次"}, "answer": "B", "point": "软考初级·程序员：进程与程序", "explain": "程序是静态的指令集合，进程是程序在运行时的动态实体，包含代码、数据和执行状态。", "type": "single"}, {"id": "rkprog_8", "stem": "关于算法时间复杂度 O(n) 的说法，正确的是哪一项？", "options": {"A": "执行时间与数据量无关", "B": "执行时间随数据量线性增长", "C": "执行时间是数据量的平方", "D": "执行时间恒定"}, "answer": "B", "point": "软考初级·程序员：时间复杂度", "explain": "O(n) 表示执行时间随数据规模 n 线性增长；O(1) 是恒定，O(n²) 是平方增长。", "type": "single"}, {"id": "rkprog_9", "stem": "在软件开发中，测试的主要目的是？", "options": {"A": "证明软件完全没有错误", "B": "发现软件中的错误，提高质量", "C": "拖延交付时间", "D": "替代需求分析"}, "answer": "B", "point": "软考初级·程序员：软件测试", "explain": "测试的目的是发现错误，不能证明软件完全无错；它也不能替代需求分析。", "type": "single"}, {"id": "rkprog_10", "stem": "关于变量命名，合理的做法是？", "options": {"A": "用单个字母 a、b 命名所有变量", "B": "用能表达含义的名字，如 studentCount", "C": "用中文拼音缩写随意命名", "D": "名字越长越好"}, "answer": "B", "point": "软考初级·程序员：编程规范", "explain": "好的变量名能表达含义，如 studentCount 表示学生数量，便于阅读和维护；无意义或过长的名字都不利于维护。", "type": "single"}]}], "rk_junior_netadmin": [{"name": "第1套 · 软考初级网络管理员上午客观题（10题）", "questions": [{"id": "rknetadm_1", "stem": "局域网中，交换机的主要作用是什么？", "options": {"A": "连接不同网络并做路由", "B": "按 MAC 地址转发数据帧，连接同一网络内的设备", "C": "提供互联网接入", "D": "加密数据"}, "answer": "B", "point": "软考初级·网络管理员：交换机", "explain": "交换机工作在数据链路层，按 MAC 地址表转发帧；路由器连接不同网络并做路由，加密不是交换机的主要作用。", "type": "single"}, {"id": "rknetadm_2", "stem": "IP地址 192.168.1.10 属于哪类地址？", "options": {"A": "公网地址", "B": "私网地址", "C": "组播地址", "D": "保留地址"}, "answer": "B", "point": "软考初级·网络管理员：私网地址", "explain": "192.168.0.0/16 是私网地址段，仅在局域网内使用，不能直接在公网路由。", "type": "single"}, {"id": "rknetadm_3", "stem": "ping 命令主要用于什么？", "options": {"A": "查看 IP 配置", "B": "测试两台主机之间是否连通及往返时延", "C": "下载文件", "D": "配置路由器"}, "answer": "B", "point": "软考初级·网络管理员：ping", "explain": "ping 发送 ICMP 回显请求，测试连通性与时延；查看 IP 配置常用 ipconfig / ifconfig。", "type": "single"}, {"id": "rknetadm_4", "stem": "关于双绞线，正确的是哪一项？", "options": {"A": "双绞线只能用于电话", "B": "超五类、六类双绞线常用于局域网布线，抗干扰靠绞合", "C": "双绞线传输距离无限", "D": "双绞线不需要水晶头"}, "answer": "B", "point": "软考初级·网络管理员：双绞线", "explain": "双绞线靠线对绞合抵消干扰，超五类、六类广泛用于局域网；传输距离有限，一般不超过 100 米。", "type": "single"}, {"id": "rknetadm_5", "stem": "DNS 服务器的主要作用是？", "options": {"A": "分配 IP 地址", "B": "把域名解析为 IP 地址", "C": "过滤病毒", "D": "管理用户密码"}, "answer": "B", "point": "软考初级·网络管理员：DNS", "explain": "DNS 把域名解析为 IP 地址；动态分配地址是 DHCP，过滤病毒是安全软件的工作。", "type": "single"}, {"id": "rknetadm_6", "stem": "网络管理员发现某台电脑无法上网，第一步最合理的是？", "options": {"A": "立即更换交换机", "B": "先检查网线、IP 配置和本机连通性，逐步定位故障点", "C": "重装操作系统", "D": "更换所有网线"}, "answer": "B", "point": "软考初级·网络管理员：故障排查", "explain": "故障排查应从简单到复杂，先查物理连接、IP 配置和连通性，定位后再处理，避免盲目更换设备。", "type": "single"}, {"id": "rknetadm_7", "stem": "关于无线网络 SSID，正确的是哪一项？", "options": {"A": "SSID 是无线网络的名称，用于标识一个无线网络", "B": "SSID 是密码", "C": "SSID 是 IP 地址", "D": "SSID 不能隐藏"}, "answer": "A", "point": "软考初级·网络管理员：SSID", "explain": "SSID 是无线网络的名称，设备靠它识别网络；密码是另外的认证信息，SSID 可以设置为不广播。", "type": "single"}, {"id": "rknetadm_8", "stem": "下列哪项是网络管理员日常工作的一部分？", "options": {"A": "只负责采购电脑", "B": "监控网络运行状态、备份配置、管理账号与权限", "C": "只负责开发软件", "D": "只负责打扫机房"}, "answer": "B", "point": "软考初级·网络管理员：日常工作", "explain": "网络管理员要监控运行状态、备份设备配置、管理用户账号与权限，及时处理故障；采购、开发、保洁不是其核心工作。", "type": "single"}, {"id": "rknetadm_9", "stem": "子网掩码 255.255.255.0 对应的网络前缀长度是？", "options": {"A": "16 位", "B": "24 位", "C": "8 位", "D": "32 位"}, "answer": "B", "point": "软考初级·网络管理员：子网掩码", "explain": "255.255.255.0 有 24 个连续的 1，即 /24 前缀，主机位为 8 位。", "type": "single"}, {"id": "rknetadm_10", "stem": "关于防火墙，网络管理员最常做的配置是？", "options": {"A": "关闭防火墙", "B": "按业务需要放行必要的端口和地址，默认拒绝其他访问", "C": "放行所有端口", "D": "防火墙不需要配置"}, "answer": "B", "point": "软考初级·网络管理员：防火墙配置", "explain": "防火墙应按最小必要原则配置：放行业务必需的端口和地址，默认拒绝其余访问；全放行等于没有防火墙。", "type": "single"}]}], "rk_junior_info": [{"name": "第1套 · 软考初级信息处理技术员上午客观题（10题）", "questions": [{"id": "rkinfo_1", "stem": "在电子表格中，公式 =SUM(A1:A5) 的作用是？", "options": {"A": "求 A1 到 A5 的平均值", "B": "求 A1 到 A5 的和", "C": "求 A1 到 A5 的最大值", "D": "统计 A1 到 A5 的个数"}, "answer": "B", "point": "软考初级·信息处理：电子表格", "explain": "SUM 是求和函数，A1:A5 表示从 A1 到 A5 的连续区域；平均值用 AVERAGE，最大值用 MAX，计数用 COUNT。", "type": "single"}, {"id": "rkinfo_2", "stem": "在 Word 中，要把一段文字居中对齐，通常使用哪个操作？", "options": {"A": "左对齐", "B": "居中对齐", "C": "右对齐", "D": "两端对齐"}, "answer": "B", "point": "软考初级·信息处理：文字处理", "explain": "居中对齐把段落放在页面中间；左对齐靠左，右对齐靠右，两端对齐让左右两边都对齐。", "type": "single"}, {"id": "rkinfo_3", "stem": "关于数据录入，正确的做法是？", "options": {"A": "录完不需要核对", "B": "录入后要核对关键数据，发现错误及时更正", "C": "可以凭印象填写", "D": "格式不重要"}, "answer": "B", "point": "软考初级·信息处理：数据录入", "explain": "信息处理强调准确性，录入后要核对关键数据并及时更正；凭印象填写、不核对都会导致错误数据进入系统。", "type": "single"}, {"id": "rkinfo_4", "stem": "文件扩展名 .docx 通常表示什么文件？", "options": {"A": "图像文件", "B": "音频文件", "C": "Word 文档", "D": "压缩文件"}, "answer": "C", "point": "软考初级·信息处理：文件格式", "explain": ".docx 是 Word 文档格式；图像常用 .jpg/.png，音频常用 .mp3/.wav，压缩常用 .zip。", "type": "single"}, {"id": "rkinfo_5", "stem": "在演示文稿中，母版的主要作用是？", "options": {"A": "增加动画效果", "B": "统一整套幻灯片的版式、字体与配色", "C": "播放音乐", "D": "统计幻灯片数量"}, "answer": "B", "point": "软考初级·信息处理：演示文稿", "explain": "母版定义整套幻灯片的统一版式、字体与配色，改母版即可统一全套风格；动画、音乐是另外的功能。", "type": "single"}, {"id": "rkinfo_6", "stem": "关于信息检索，正确的做法是？", "options": {"A": "只用一个关键词搜一次", "B": "用多个关键词组合，筛选结果并核对来源", "C": "搜索结果越多越好，不用筛选", "D": "只看第一条结果"}, "answer": "B", "point": "软考初级·信息处理：信息检索", "explain": "好的检索要组合关键词、筛选结果、核对来源可靠性；只搜一次、只看第一条都容易漏掉或误用信息。", "type": "single"}, {"id": "rkinfo_7", "stem": "在数据库表中，一行记录通常称为什么？", "options": {"A": "字段", "B": "元组（记录）", "C": "表名", "D": "主键"}, "answer": "B", "point": "软考初级·信息处理：数据库基础", "explain": "表中的一行是一条记录，也叫元组；一列是字段（属性），主键是能唯一标识记录的字段。", "type": "single"}, {"id": "rkinfo_8", "stem": "关于多媒体信息处理，图片分辨率越高意味着？", "options": {"A": "图片越模糊", "B": "单位面积像素越多，画面越清晰，文件通常越大", "C": "图片颜色越少", "D": "图片越小"}, "answer": "B", "point": "软考初级·信息处理：多媒体", "explain": "分辨率高即像素密度高，画面更清晰，但数据量和文件通常也更大。", "type": "single"}, {"id": "rkinfo_9", "stem": "在日常办公中，收到可疑邮件附件时正确的做法是？", "options": {"A": "立即打开查看", "B": "不打开，先核实发件人，必要时请管理员确认", "C": "转发给所有同事", "D": "直接删除重要邮件"}, "answer": "B", "point": "软考初级·信息处理：信息安全意识", "explain": "可疑附件可能带病毒或钓鱼链接，应先核实发件人，必要时请管理员确认，不要直接打开或转发。", "type": "single"}, {"id": "rkinfo_10", "stem": "关于数据备份，合理的做法是？", "options": {"A": "只备份一次就够了", "B": "定期备份重要数据，并把备份与原件分开存放", "C": "备份可以不验证", "D": "只备份在同一台电脑上"}, "answer": "B", "point": "软考初级·信息处理：数据备份", "explain": "备份要定期做，并与原件分开存放，最好异地保存；只备一次、不验证、只放同一台电脑都不能保证恢复。", "type": "single"}]}], "rk_junior_ops": [{"name": "第1套 · 软考初级信息系统运行管理员上午客观题（10题）", "questions": [{"id": "rkops_1", "stem": "信息系统运行管理员的核心职责最接近哪一项？", "options": {"A": "开发新系统", "B": "保障已上线系统日常稳定运行，及时处理运行问题", "C": "只负责采购设备", "D": "只负责编写需求文档"}, "answer": "B", "point": "软考初级·运行管理：职责", "explain": "运行管理员负责已上线系统的日常运维，保障稳定运行、处理故障；开发新系统、编写需求是开发阶段的工作。", "type": "single"}, {"id": "rkops_2", "stem": "系统运行中，定期巡检的主要目的是？", "options": {"A": "增加工作量", "B": "提前发现隐患，防止小问题演变成故障", "C": "关闭系统", "D": "统计用户数量"}, "answer": "B", "point": "软考初级·运行管理：巡检", "explain": "巡检是主动检查运行状态、日志与资源使用，提前发现隐患，避免故障发生后才被动处理。", "type": "single"}, {"id": "rkops_3", "stem": "关于系统日志，正确的做法是？", "options": {"A": "日志可以随意删除", "B": "定期检查日志，异常要记录并跟进处理", "C": "日志不需要保存", "D": "日志只给领导看"}, "answer": "B", "point": "软考初级·运行管理：日志", "explain": "日志是排查故障的重要依据，要定期检查、妥善保存，异常要记录并跟进，不能随意删除。", "type": "single"}, {"id": "rkops_4", "stem": "系统出现故障时，运行管理员首先应该做什么？", "options": {"A": "立即重启所有设备", "B": "先确认故障范围与影响，采取措施恢复服务并记录", "C": "等用户投诉后再处理", "D": "直接更换所有硬件"}, "answer": "B", "point": "软考初级·运行管理：故障处理", "explain": "故障处理先确认范围与影响，优先恢复服务，同时记录过程；盲目重启、等投诉、全部更换都不是规范做法。", "type": "single"}, {"id": "rkops_5", "stem": "关于账号管理，运行管理员应该做到？", "options": {"A": "离职人员账号可以继续使用", "B": "账号按需分配，人员变动及时调整或注销", "C": "所有人共用一个管理员账号", "D": "密码可以公开张贴"}, "answer": "B", "point": "软考初级·运行管理：账号管理", "explain": "账号要按需分配、专人专用，人员入离职、调岗时及时调整或注销；共用账号、公开密码都会失控。", "type": "single"}, {"id": "rkops_6", "stem": "系统升级前，运行管理员必须先做什么？", "options": {"A": "直接升级", "B": "先备份数据与配置，确认回退方案，再按计划升级", "C": "升级后再备份", "D": "不需要通知用户"}, "answer": "B", "point": "软考初级·运行管理：升级管理", "explain": "升级前必须备份数据与配置、准备回退方案，并按计划在合适时间实施，必要时提前通知用户。", "type": "single"}, {"id": "rkops_7", "stem": "关于机房环境管理，正确的是哪一项？", "options": {"A": "温度湿度不需要控制", "B": "保持适宜的温度湿度、清洁、防尘，并定期检查消防与供电", "C": "机房可以堆放杂物", "D": "机房不需要门禁"}, "answer": "B", "point": "软考初级·运行管理：机房环境", "explain": "机房要控制温湿度、保持清洁防尘、定期检查消防与供电，并做好门禁管理；堆放杂物会带来安全隐患。", "type": "single"}, {"id": "rkops_8", "stem": "运行值班交接时，最重要的是？", "options": {"A": "口头说一声即可", "B": "把未处理问题、运行异常与注意事项书面交接清楚", "C": "不需要交接", "D": "只交接钥匙"}, "answer": "B", "point": "软考初级·运行管理：值班交接", "explain": "值班交接要把未处理问题、异常情况与注意事项书面交接清楚，避免下一班遗漏；只口头说一声容易丢信息。", "type": "single"}, {"id": "rkops_9", "stem": "关于系统性能监控，运行管理员主要关注什么？", "options": {"A": "只关注 CPU", "B": "关注 CPU、内存、磁盘、网络等关键指标的变化趋势", "C": "只关注用户数量", "D": "不需要监控"}, "answer": "B", "point": "软考初级·运行管理：性能监控", "explain": "性能监控要综合看 CPU、内存、磁盘、网络等指标及其趋势，提前发现瓶颈；只看单一指标是不够的。", "type": "single"}, {"id": "rkops_10", "stem": "系统运行文档的作用是什么？", "options": {"A": "应付检查", "B": "记录运行操作、故障处理与变更情况，便于交接、追溯与审计", "C": "可以不写", "D": "只给外部人员看"}, "answer": "B", "point": "软考初级·运行管理：运行文档", "explain": "运行文档记录日常操作、故障与变更，是交接、追溯与审计的依据，不是应付检查的形式。", "type": "single"}]}], "rk_senior_pm": [{"name": "第1套 · 软考高级信息系统项目管理师上午客观题（10题）", "questions": [{"id": "rksenpm_1", "stem": "项目组合管理的核心目标是？", "options": {"A": "管好单个项目", "B": "按战略目标选择、优化项目组合，实现组织战略价值最大化", "C": "只管项目进度", "D": "只管项目成本"}, "answer": "B", "point": "软考高级·项目管理：项目组合", "explain": "项目组合管理从组织战略出发，选择和优化一组项目与运营的组合，使战略价值最大化，不只管单个项目。", "type": "single"}, {"id": "rksenpm_2", "stem": "关于项目治理，正确的是哪一项？", "options": {"A": "项目治理就是项目经理个人决策", "B": "项目治理是组织为项目提供方向、监督与控制的框架，明确决策权与责任", "C": "项目治理不需要干系人参与", "D": "项目治理只在项目结束时起作用"}, "answer": "B", "point": "软考高级·项目管理：项目治理", "explain": "项目治理是组织层面的框架，规定项目决策权、监督与控制机制，贯穿项目全过程，不是个人决策。", "type": "single"}, {"id": "rksenpm_3", "stem": "挣值管理中，完工尚需绩效指数 TCPI（基于 BAC）的公式是？", "options": {"A": "TCPI = (BAC - EV) / (BAC - AC)", "B": "TCPI = EV / AC", "C": "TCPI = EV / PV", "D": "TCPI = AC / EV"}, "answer": "A", "point": "软考高级·项目管理：TCPI", "explain": "TCPI = 剩余工作量 (BAC-EV) / 剩余预算 (BAC-AC)，表示为按预算完工，剩余工作必须达到的成本绩效。", "type": "single"}, {"id": "rksenpm_4", "stem": "某项目 BAC = 100 万，EV = 40 万，AC = 50 万，则按 BAC 计算的 TCPI 约为？", "options": {"A": "0.8", "B": "1.0", "C": "1.2", "D": "1.5"}, "answer": "C", "point": "软考高级·项目管理：TCPI计算", "explain": "TCPI = (100-40)/(100-50) = 60/50 = 1.2，意味着剩余工作要以 1.2 的成本绩效才能按原预算完工，难度较大。", "type": "single"}, {"id": "rksenpm_5", "stem": "大型复杂项目管理中，项目群（Program）与项目组合的区别是？", "options": {"A": "项目群是为实现共同收益而协调管理的一组相关项目，项目组合更侧重战略选择与优化", "B": "两者完全相同", "C": "项目群只管成本", "D": "项目组合只管单个项目"}, "answer": "A", "point": "软考高级·项目管理：项目群与组合", "explain": "项目群协调一组相关项目以获得单独管理得不到的收益；项目组合侧重按战略选择、优先排序与优化资源。", "type": "single"}, {"id": "rksenpm_6", "stem": "关于组织过程资产，正确的是哪一项？", "options": {"A": "组织过程资产只包括模板", "B": "组织过程资产包括流程、政策、历史信息与经验教训，供项目复用", "C": "组织过程资产不能更新", "D": "组织过程资产只属于单个项目"}, "answer": "B", "point": "软考高级·项目管理：组织过程资产", "explain": "组织过程资产是组织积累的流程、政策、模板、历史数据与经验教训，项目应复用并在结束后更新它们。", "type": "single"}, {"id": "rksenpm_7", "stem": "风险管理中，定量风险分析的主要工具不包括？", "options": {"A": "蒙特卡洛模拟", "B": "决策树分析", "C": "敏感性分析", "D": "头脑风暴"}, "answer": "D", "point": "软考高级·项目管理：定量风险分析", "explain": "蒙特卡洛、决策树、敏感性分析都是定量分析工具；头脑风暴属于定性识别风险的工具。", "type": "single"}, {"id": "rksenpm_8", "stem": "关于合同收尾，正确的是哪一项？", "options": {"A": "合同收尾就是付款", "B": "合同收尾包括确认工作完成、验收、结算、记录经验教训并关闭合同", "C": "合同收尾不需要文档", "D": "合同收尾只在项目结束时做一次"}, "answer": "B", "point": "软考高级·项目管理：合同收尾", "explain": "合同收尾要确认可交付成果、完成验收与结算、归档记录并关闭合同；它不只是付款。", "type": "single"}, {"id": "rksenpm_9", "stem": "在敏捷与传统结合的混合项目中，项目经理首先要做的是？", "options": {"A": "强制所有团队用同一种方法", "B": "根据项目特点与组织环境，选择并裁剪适合的方法组合", "C": "放弃计划", "D": "只用敏捷"}, "answer": "B", "point": "软考高级·项目管理：混合方法", "explain": "混合方法要按项目特点、干系人与组织环境裁剪方法组合，不是强制统一，也不是放弃计划。", "type": "single"}, {"id": "rksenpm_10", "stem": "关于项目绩效域，正确的是哪一项？", "options": {"A": "绩效域只包括进度和成本", "B": "绩效域包括干系人、团队、开发方法、计划、项目工作、交付、绩效、不确定性等多个相互关联的域", "C": "绩效域互不相关", "D": "绩效域只在收尾时评价"}, "answer": "B", "point": "软考高级·项目管理：绩效域", "explain": "现代项目管理把项目看作多个绩效域的集合，干系人、团队、计划、工作、交付、绩效、不确定性等相互影响，需整体管理。", "type": "single"}]}], "rk_senior_arch": [{"name": "第1套 · 软考高级系统架构设计师上午客观题（10题）", "questions": [{"id": "rksenarch_1", "stem": "软件架构中，质量属性“可用性”主要关注什么？", "options": {"A": "系统功能多少", "B": "系统在规定时间内正常提供服务的能力，以及故障后的恢复能力", "C": "界面美观", "D": "代码行数"}, "answer": "B", "point": "软考高级·架构：质量属性", "explain": "可用性关注系统正常运行时间与故障恢复，如故障检测、隔离与恢复机制；功能数量、界面、代码行数不是可用性的核心。", "type": "single"}, {"id": "rksenarch_2", "stem": "关于分层架构，正确的是哪一项？", "options": {"A": "各层可以随意互相调用", "B": "上层调用下层，下层不依赖上层，便于分工与复用", "C": "分层会降低所有性能问题", "D": "分层只能有两层"}, "answer": "B", "point": "软考高级·架构：分层架构", "explain": "分层架构规定上层依赖下层、下层不依赖上层，层与层之间通过接口交互，便于分工、测试与复用。", "type": "single"}, {"id": "rksenarch_3", "stem": "微服务架构相对于单体架构的主要优点是？", "options": {"A": "部署一定更简单", "B": "服务可独立开发、部署与扩展，故障隔离性更好", "C": "不需要任何治理", "D": "数据一定一致"}, "answer": "B", "point": "软考高级·架构：微服务", "explain": "微服务的优点是服务独立演进、独立扩展、故障隔离；但它也带来分布式治理、数据一致性等新复杂度，部署并不一定更简单。", "type": "single"}, {"id": "rksenarch_4", "stem": "设计模式中，单例模式的主要目的是？", "options": {"A": "创建很多对象", "B": "保证一个类只有一个实例，并提供全局访问点", "C": "隐藏所有方法", "D": "提高运行速度"}, "answer": "B", "point": "软考高级·架构：设计模式", "explain": "单例模式保证类只有一个实例并提供全局访问点，常用于配置、连接池等全局唯一资源。", "type": "single"}, {"id": "rksenarch_5", "stem": "关于中间件，正确的是哪一项？", "options": {"A": "中间件是操作系统", "B": "中间件位于应用与底层平台之间，提供通信、事务、消息等通用服务", "C": "中间件只能用于数据库", "D": "中间件不需要部署"}, "answer": "B", "point": "软考高级·架构：中间件", "explain": "中间件是应用与操作系统、网络等底层之间的软件层，提供远程调用、消息、事务、安全等通用服务。", "type": "single"}, {"id": "rksenarch_6", "stem": "在架构评估中，ATAM 方法的核心是？", "options": {"A": "只评估性能", "B": "通过质量属性场景，识别架构决策中的敏感点、权衡点与风险", "C": "只看代码", "D": "不需要干系人参与"}, "answer": "B", "point": "软考高级·架构：ATAM", "explain": "ATAM 是架构权衡分析方法，围绕质量属性场景，找出敏感点、权衡点与风险，需要干系人共同参与。", "type": "single"}, {"id": "rksenarch_7", "stem": "关于 CAP 定理，正确的是哪一项？", "options": {"A": "分布式系统可以同时完全满足一致性、可用性、分区容忍性", "B": "分布式系统在分区发生时，只能在一致性与可用性之间权衡", "C": "CAP 只适用于单机系统", "D": "分区容忍性可以放弃"}, "answer": "B", "point": "软考高级·架构：CAP定理", "explain": "CAP 定理指出分布式系统不能同时完全满足一致性、可用性、分区容忍性；分区不可避免时，只能在一致性与可用性之间权衡。", "type": "single"}, {"id": "rksenarch_8", "stem": "在分布式系统中，最终一致性的含义是？", "options": {"A": "所有节点永远不一致", "B": "更新后经过一段时间，所有副本最终会达到一致", "C": "更新立即对所有节点可见", "D": "不需要任何同步"}, "answer": "B", "point": "软考高级·架构：最终一致性", "explain": "最终一致性不保证更新立即全局可见，但保证在没有新更新的情况下，经过一段时间所有副本会收敛一致。", "type": "single"}, {"id": "rksenarch_9", "stem": "关于架构文档，正确的做法是？", "options": {"A": "架构文档越详细越好，不需要区分读者", "B": "架构文档应按视图组织，面向不同干系人说明关键决策与约束", "C": "架构文档可以不写", "D": "架构文档只需要画一张图"}, "answer": "B", "point": "软考高级·架构：架构文档", "explain": "好的架构文档按视图组织，面向开发、运维、管理等不同干系人，说明关键决策、约束与权衡，不是一张图或面面俱到的堆砌。", "type": "single"}, {"id": "rksenarch_10", "stem": "在系统重构时，架构师首先要评估的是？", "options": {"A": "代码行数", "B": "现有架构的问题、业务目标与重构风险收益", "C": "开发工具版本", "D": "团队人数"}, "answer": "B", "point": "软考高级·架构：重构评估", "explain": "重构前要评估现有架构的问题、业务目标、成本与风险收益，再决定重构范围与策略；只看代码行数或人数是不够的。", "type": "single"}]}], "rk_senior_netplan": [{"name": "第1套 · 软考高级网络规划设计师上午客观题（10题）", "questions": [{"id": "rksennet_1", "stem": "网络规划的第一步通常是？", "options": {"A": "采购设备", "B": "需求分析：明确业务目标、用户规模、流量与服务质量要求", "C": "直接布线", "D": "配置路由器"}, "answer": "B", "point": "软考高级·网络规划：需求分析", "explain": "网络规划先做需求分析，明确业务、规模、流量与服务质量要求，再做拓扑、选型与实施；先采购是常见错误。", "type": "single"}, {"id": "rksennet_2", "stem": "园区网三层结构中，汇聚层的主要作用是？", "options": {"A": "直接连接终端", "B": "汇聚接入层流量，做策略控制与路由转发", "C": "连接互联网", "D": "只做供电"}, "answer": "B", "point": "软考高级·网络规划：三层结构", "explain": "三层结构为接入层、汇聚层、核心层：接入层接终端，汇聚层汇聚流量并做策略与路由，核心层高速转发。", "type": "single"}, {"id": "rksennet_3", "stem": "在网络可靠性设计中，冗余链路的主要目的是？", "options": {"A": "提高带宽一倍", "B": "单点故障时仍有备用路径，保证业务不中断", "C": "降低成本", "D": "简化管理"}, "answer": "B", "point": "软考高级·网络规划：冗余设计", "explain": "冗余链路与设备是为了消除单点故障，故障时自动切换到备用路径；它通常增加成本与管理复杂度，不是为了省钱。", "type": "single"}, {"id": "rksennet_4", "stem": "关于网络地址规划，正确的做法是？", "options": {"A": "地址随意分配", "B": "按部门与业务划分子网，预留扩展空间，并做好地址记录", "C": "所有设备用同一地址", "D": "不需要规划"}, "answer": "B", "point": "软考高级·网络规划：地址规划", "explain": "地址规划要按业务划分子网、预留扩展、统一记录，便于管理与故障定位；随意分配会很快失控。", "type": "single"}, {"id": "rksennet_5", "stem": "在广域网规划中，专线与互联网 VPN 的主要权衡是？", "options": {"A": "专线一定便宜", "B": "专线质量与安全性较好但成本高，互联网 VPN 成本低但质量依赖公网", "C": "两者没有区别", "D": "VPN 一定更安全"}, "answer": "B", "point": "软考高级·网络规划：广域网", "explain": "专线独享带宽、质量与安全性较好但成本高；互联网 VPN 成本低，但时延与质量受公网影响，需加密保障安全。", "type": "single"}, {"id": "rksennet_6", "stem": "网络容量规划中，峰值流量的意义是？", "options": {"A": "平均流量", "B": "业务高峰期的流量，是决定带宽与设备能力的重要依据", "C": "最小流量", "D": "与规划无关"}, "answer": "B", "point": "软考高级·网络规划：容量规划", "explain": "容量规划不能只看平均流量，要以峰值流量为依据并留有余量，否则高峰期会出现拥塞与丢包。", "type": "single"}, {"id": "rksennet_7", "stem": "关于网络安全规划，分区隔离的主要思路是？", "options": {"A": "所有系统放在同一区域", "B": "按信任级别划分区域，区域间用防火墙等控制访问", "C": "不需要任何隔离", "D": "只隔离外网"}, "answer": "B", "point": "软考高级·网络规划：安全分区", "explain": "安全分区按信任级别划分内外网、DMZ、核心业务区等，区域间用防火墙与访问控制限制流量，降低横向扩散风险。", "type": "single"}, {"id": "rksennet_8", "stem": "在无线网络规划中，AP 部署首先要考虑的是？", "options": {"A": "AP 数量越多越好", "B": "覆盖、容量与干扰的平衡，做现场勘测与信道规划", "C": "AP 颜色", "D": "AP 品牌"}, "answer": "B", "point": "软考高级·网络规划：无线规划", "explain": "无线规划要平衡覆盖、容量与同频干扰，需现场勘测、合理布点与信道规划；盲目增加 AP 会加剧干扰。", "type": "single"}, {"id": "rksennet_9", "stem": "网络规划文档中，拓扑图的主要作用是？", "options": {"A": "装饰作用", "B": "清晰展示设备、链路与区域关系，是实施与运维的依据", "C": "只给领导看", "D": "不需要更新"}, "answer": "B", "point": "软考高级·网络规划：拓扑图", "explain": "拓扑图展示设备、链路、区域与地址关系，是实施、验收与运维的共同依据，变更后要同步更新。", "type": "single"}, {"id": "rksennet_10", "stem": "在网络项目验收中，最重要的依据是？", "options": {"A": "设备品牌", "B": "规划与合同中约定的性能、功能与安全指标的实测结果", "C": "施工方口头承诺", "D": "设备数量"}, "answer": "B", "point": "软考高级·网络规划：验收", "explain": "验收要以规划与合同约定的指标为准，用实测结果验证性能、功能与安全是否达标，不是看品牌或数量。", "type": "single"}]}], "rk_senior_analyst": [{"name": "第1套 · 软考高级系统分析师上午客观题（10题）", "questions": [{"id": "rksenana_1", "stem": "系统分析阶段的首要任务是？", "options": {"A": "编写代码", "B": "深入理解业务与用户需求，形成准确的需求规格", "C": "采购硬件", "D": "部署系统"}, "answer": "B", "point": "软考高级·系统分析：需求分析", "explain": "系统分析阶段的核心是理解业务与用户真实需求，形成需求规格；编码、采购、部署属于后续阶段。", "type": "single"}, {"id": "rksenana_2", "stem": "UML 中，用例图主要用于什么？", "options": {"A": "描述类之间的关系", "B": "描述系统功能与参与者之间的交互", "C": "描述对象随时间的状态变化", "D": "描述部署结构"}, "answer": "B", "point": "软考高级·系统分析：UML用例图", "explain": "用例图展示参与者与系统用例之间的关系，用于表达系统功能需求；类图描述结构，状态图描述状态变化，部署图描述部署。", "type": "single"}, {"id": "rksenana_3", "stem": "关于需求变更，系统分析师首先应该做的是？", "options": {"A": "直接修改代码", "B": "评估变更对范围、进度、成本与质量的影响，并按流程审批", "C": "拒绝一切变更", "D": "口头答应用户"}, "answer": "B", "point": "软考高级·系统分析：需求变更", "explain": "需求变更要先评估影响、按流程审批，再更新需求文档与计划；直接改代码或口头答应都会失控。", "type": "single"}, {"id": "rksenana_4", "stem": "业务流程建模中，BPMN 的主要作用是？", "options": {"A": "画数据库表", "B": "用标准符号描述业务流程的活动、分支与参与方", "C": "编写测试用例", "D": "管理项目进度"}, "answer": "B", "point": "软考高级·系统分析：BPMN", "explain": "BPMN 是业务流程建模标准符号，用于清晰描述流程活动、网关分支、事件与参与方，便于业务与技术沟通。", "type": "single"}, {"id": "rksenana_5", "stem": "关于非功能需求，正确的是哪一项？", P"}, "answer": "A", "point": "NCRE二级·MS Office：PowerPoint快捷键", "explain": "Ctrl + M 插入新幻灯片，Ctrl + N 新建演示文稿，Ctrl + S 保存，Ctrl + P 打印。", "type": "single"}, {"id": "ncre2off_9", "stem": "在 Excel 中，COUNT 函数的作用是？", "options": {"A": "求和", "B": "求平均", "C": "统计区域中数字单元格的个数", "D": "求最大值"}, "answer": "C", "point": "NCRE二级·MS Office：Excel函数", "explain": "COUNT 统计数字单元格个数；求和是 SUM，求平均是 AVERAGE，求最大值是 MAX。", "type": "single"}, {"id": "ncre2off_10", "stem": "在 Word 中，撤销上一步操作的快捷键是？", "options": {"A": "Ctrl + Z", "B": "Ctrl + Y", "C": "Ctrl + X", "D": "Ctrl + V"}, "answer": "A", "point": "NCRE二级·MS Office：Word快捷键", "explain": "Ctrl + Z 撤销，Ctrl + Y 恢复（重做），Ctrl + X 剪切，Ctrl + V 粘贴。", "type": "single"}]}, {"name": "第2套 · 二级MS Office填空题（5题）", "questions": [{"id": "ncre2offf_1", "stem": "填空：在 Excel 中，求 A1:A5 之和的公式是 ______。（写完整公式）", "options": {}, "answer": "=SUM(A1:A5)", "point": "NCRE二级·MS Office填空：求和公式", "explain": "公式以 = 开头，SUM(A1:A5) 对 A1 到 A5 求和。判分忽略大小写与空格。", "type": "fill", "alts": ["SUM(A1:A5)"]}, {"id": "ncre2offf_2", "stem": "填空：在 Word 中，保存文档的快捷键是 ______。", "options": {}, "answer": "Ctrl+S", "point": "NCRE二级·MS Office填空：保存快捷键", "explain": "Ctrl + S 保存。判分忽略大小写与空格，Ctrl+S 与 Ctrl + S 等价。", "type": "fill", "alts": ["Ctrl + S"]}, {"id": "ncre2offf_3", "stem": "填空：在 Excel 中，求平均值的函数名是 ______。", "options": {}, "answer": "AVERAGE", "point": "NCRE二级·MS Office填空：平均值函数", "explain": "AVERAGE 求平均值。判分忽略大小写。", "type": "fill"}, {"id": "ncre2offf_4", "stem": "填空：在 PowerPoint 中，从头开始放映的快捷键是 ______。", "options": {}, "answer": "F5", "point": "NCRE二级·MS Office填空：放映快捷键", "explain": "F5 从头放映；Shift + F5 是从当前页放映，本题问从头开始，故为 F5。", "type": "fill"}, {"id": "ncre2offf_5", "stem": "填空：Word 文档的默认扩展名是 ______。", "options": {}, "answer": ".docx", "point": "NCRE二级·MS Office填空：文件扩展名", "explain": "Word 2007 及以后版本的默认扩展名是 .docx（旧版 .doc 已不是默认）。", "type": "fill", "alts": ["docx"]}]}], "ncre3_net": [{"name": "第1套 · 三级网络技术客观题（10题）", "questions": [{"id": "ncre3net_1", "stem": "在 OSI 参考模型中，IP 协议工作在哪一层？", "options": {"A": "物理层", "B": "数据链路层", "C": "网络层", "D": "传输层"}, "answer": "C", "point": "NCRE三级·网络技术：OSI模型", "explain": "IP 负责寻址与路由，属于网络层。物理层传比特，数据链路层管帧与 MAC，传输层是 TCP/UDP。", "type": "single"}, {"id": "ncre3net_2", "stem": "IPv4 地址由多少位二进制数组成？", "options": {"A": "16 位", "B": "32 位", "C": "48 位", "D": "128 位"}, "answer": "B", "point": "NCRE三级·网络技术：IPv4地址", "explain": "IPv4 地址共 32 位，通常写成 4 段十进制。48 位是 MAC 地址，128 位是 IPv6。", "type": "single"}, {"id": "ncre3net_3", "stem": "子网掩码为 255.255.255.0 的网络中，可用的主机地址有几个？", "options": {"A": "254 个", "B": "255 个", "C": "256 个", "D": "512 个"}, "answer": "A", "point": "NCRE三级·网络技术：子网划分", "explain": "主机位 8 位共 256 个地址，减去网络地址与广播地址，剩下 254 个可用。", "type": "single"}, {"id": "ncre3net_4", "stem": "下列哪种传输层协议是面向连接、可靠传输的？", "options": {"A": "UDP", "B": "TCP", "C": "IP", "D": "ICMP"}, "answer": "B", "point": "NCRE三级·网络技术：TCP与UDP", "explain": "TCP 面向连接、有确认重传，可靠；UDP 无连接、不可靠但开销小；IP、ICMP 在网络层。", "type": "single"}, {"id": "ncre3net_5", "stem": "DNS 的主要作用是？", "options": {"A": "分配 IP 地址", "B": "把域名解析为 IP 地址", "C": "加密传输数据", "D": "过滤垃圾邮件"}, "answer": "B", "point": "NCRE三级·网络技术：DNS", "explain": "DNS 把域名翻译成 IP 地址。分配地址是 DHCP，加密靠 TLS，过滤邮件靠反垃圾机制。", "type": "single"}, {"id": "ncre3net_6", "stem": "HTTP 协议默认使用的端口号是？", "options": {"A": "21", "B": "25", "C": "53", "D": "80"}, "answer": "D", "point": "NCRE三级·网络技术：常用端口", "explain": "HTTP 默认 80，HTTPS 默认 443；21 是 FTP，25 是 SMTP，53 是 DNS。", "type": "single"}, {"id": "ncre3net_7", "stem": "以太网网卡的 MAC 地址长度是？", "options": {"A": "32 位", "B": "48 位", "C": "64 位", "D": "128 位"}, "answer": "B", "point": "NCRE三级·网络技术：MAC地址", "explain": "MAC 地址 48 位，前 24 位是厂商标识，后 24 位是厂商内编号。", "type": "single"}, {"id": "ncre3net_8", "stem": "路由器主要工作在 OSI 模型的哪一层？", "options": {"A": "数据链路层", "B": "网络层", "C": "传输层", "D": "应用层"}, "answer": "B", "point": "NCRE三级·网络技术：网络设备", "explain": "路由器按 IP 地址转发，属网络层设备；交换机在数据链路层，集线器在物理层。", "type": "single"}, {"id": "ncre3net_9", "stem": "下列哪个地址属于私有地址（常用于局域网）？", "options": {"A": "8.8.8.8", "B": "192.168.1.1", "C": "202.96.128.86", "D": "114.114.114.114"}, "answer": "B", "point": "NCRE三级·网络技术：私有地址", "explain": "192.168.0.0/16 是私有地址段；其余三项均为公网地址。", "type": "single"}, {"id": "ncre3net_10", "stem": "在以太网中，CSMA/CD 的作用是？", "options": {"A": "加密帧内容", "B": "检测冲突并在冲突后退避重发", "C": "把域名转为 IP", "D": "分配动态地址"}, "answer": "B", "point": "NCRE三级·网络技术：CSMA/CD", "explain": "CSMA/CD 是带冲突检测的载波侦听多路访问：先听后发、边发边听、冲突停发、随机退避后重发。", "type": "single"}]}], "ncre3_db": [{"name": "第1套 · 三级数据库技术客观题（10题）", "questions": [{"id": "ncre3db_1", "stem": "在 SQL 中，查询表中全部记录应使用的语句是？", "options": {"A": "SELECT * FROM 表名", "B": "INSERT INTO 表名", "C": "DELETE FROM 表名", "D": "UPDATE 表名"}, "answer": "A", "point": "NCRE三级·数据库技术：SQL查询", "explain": "SELECT 是查询，INSERT 是插入，DELETE 是删除，UPDATE 是修改。", "type": "single"}, {"id": "ncre3db_2", "stem": "关于主键，下列说法正确的是？", "options": {"A": "可以为空", "B": "可以重复", "C": "唯一且不能为空", "D": "一张表可以有多个主键"}, "answer": "C", "point": "NCRE三级·数据库技术：主键", "explain": "主键唯一标识一行，不能为空、不能重复；一张表只能有一个主键（可由多列组成复合主键）。", "type": "single"}, {"id": "ncre3db_3", "stem": "数据库事务的 ACID 特性中，A 代表？", "options": {"A": "一致性", "B": "原子性", "C": "隔离性", "D": "持久性"}, "answer": "B", "point": "NCRE三级·数据库技术：事务ACID", "explain": "ACID：原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）、持久性（Durability）。", "type": "single"}, {"id": "ncre3db_4", "stem": "外键的主要作用是？", "options": {"A": "加快查询速度", "B": "维护表之间的参照完整性", "C": "加密数据", "D": "备份数据"}, "answer": "B", "point": "NCRE三级·数据库技术：外键", "explain": "外键约束子表取值必须在父表主键中出现，保证参照完整性；加快查询靠索引。", "type": "single"}, {"id": "ncre3db_5", "stem": "第三范式（3NF）主要消除的是？", "options": {"A": "部分函数依赖", "B": "传递函数依赖", "C": "多值依赖", "D": "连接依赖"}, "answer": "B", "point": "NCRE三级·数据库技术：范式", "explain": "1NF 消除重复组，2NF 消除对主键的部分依赖，3NF 消除非主属性间的传递依赖。", "type": "single"}, {"id": "ncre3db_6", "stem": "下列哪条语句是删除整张表结构（连同数据）的？", "options": {"A": "DELETE FROM 表名", "B": "TRUNCATE TABLE 表名", "C": "DROP TABLE 表名", "D": "ALTER TABLE 表名"}, "answer": "C", "point": "NCRE三级·数据库技术：DDL与DML", "explain": "DROP TABLE 删除表结构与数据；DELETE 只删行、保留结构；TRUNCATE 清空行但保留结构；ALTER 改结构。", "type": "single"}   e.classList.add('show');
  e.innerHTML=`<span class="verdict ${ok?'ok':'bad'}">${ok?'✓ 已答对':'✗ 已答错（在错题本里）'}</span>　正确答案：<b>${q.type==='calc'?q.answer+' '+(q.unit||''):esc(q.answer)}</b>`+(q.point?`\n<span class="ptline">考点：${esc(q.point)}</span>`:'')+(q.explain?`\n解析：${esc(q.explain)}`:'');
  if(q.type!=='calc' && q.type!=='self') [...String(q.answer)].forEach(k=>{const b=document.getElementById(`opt-${q.id}-${k}`); if(b) b.classList.add('right');});
}

/* 模拟考试：客观题随机抽，碎片版，非全真卷 */
function renderExamHome(){
  const e=curExam(), pool=curAll().filter(q=>q.type!=='self');
  if(!pool.length){ $('#app').innerHTML=`<div class="empty">该考试暂无客观题，题库接入后再开模拟考试。</div>`; return; }
  $('#app').innerHTML=`<div class="card"><h3 style="margin:4px 0">模拟考试（碎片版）</h3>
  <p class="meta">从${esc(e.name)}客观题库随机抽 ${Math.min(20,pool.length)} 题，限时 30 分钟，交卷后统一判分。全真卷按各考试官方时长与分值另行配置（税法 140分/150分钟、四级 710分/130分钟等），碎片版只练手感和查漏。</p>
  <div class="row"><button class="btn pri" onclick="startExam()">开始考试</button></div></div>`;
}
function startExam(){
  const pool=[...curAll().filter(q=>q.type!=='self')].sort(()=>Math.random()-0.5).slice(0,20);
  exam={list:pool,left:30*60,timer:null};
  renderQuestions(pool,'模拟考试（'+pool.length+' 题）',()=>{clearInterval(exam.timer);showTab('exam');});
  document.querySelectorAll('#app .card .btn.pri').forEach(b=>{ if(b.textContent.includes('提交')) b.style.display='none'; });
  const h=document.createElement('div'); h.className='card'; h.id='examhead';
  h.innerHTML=`<span class="timer" id="timer">30:00</span>　<span class="meta">答完点下方交卷</span>
    <div class="row"><button class="btn pri" onclick="submitExam()">交卷</button></div>`;
  $('#app').prepend(h);
  exam.timer=setInterval(()=>{ exam.left--;
    const t=document.getElementById('timer'); if(t) t.textContent=`${String(Math.floor(exam.left/60)).padStart(2,'0')}:${String(exam.left%60).padStart(2,'0')}`;
    if(exam.left<=0){clearInterval(exam.timer);submitExam();} },1000);
}
function submitExam(){
  if(!exam) return; clearInterval(exam.timer);
  let score=0; const total=exam.list.length;
  exam.list.forEach(q=>{
    let ok=false;
    if(q.type==='calc'){ const el=document.getElementById('in-'+q.id); const v=el?parseFloat(el.value):NaN;
      ok=!isNaN(v)&&Math.abs(v-Number(q.answer))<=Math.max(0.02,Math.abs(Number(q.answer))*0.001); }
    else if(q.type==='fill'){ const el=document.getElementById('in-'+q.id); const v=el?el.value:'';
      ok=v.trim()!==''&&[q.answer].concat(q.alts||[]).some(a=>normFill(a)===normFill(v)); }
    else { const sel=selState[q.id]; if(sel&&sel.size){ ok=[...sel].sort().join('')===String(q.answer).split('').sort().join(''); } }
    if(ok) score++; else markWrong(q.id,true);
    progress[q.id]={correct:ok};
  });
  save();
  const head=document.getElementById('examhead');
  if(head) head.innerHTML=`<div class="score">${score} / ${total}</div><p class="meta">已交卷。下面逐题看对错和解析，错题已自动进错题本。</p>`;
  exam.list.forEach(q=>restore(q));
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderWrong(){
  const list=curAll().filter(q=>wrong.includes(q.id));
  if(!list.length){ $('#app').innerHTML=`<div class="empty">错题本是空的，做错的题会自动收进来（按当前考试隔离）。</div>`; return; }
  renderQuestions(list,`错题本（${list.length} 题）`,()=>showTab('wrong'));
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<button class="btn" onclick="if(confirm('清空当前考试的错题本？')){wrong=[];save();showTab('wrong');}">清空错题本</button>`;
  $('#app').appendChild(d);
}
function renderMap(){
  const REG=curAll(), e=curExam();
  const groups={};
  REG.forEach(q=>{ if(!q.point) return; const ch=q.point.split('·')[0];
    groups[ch]=groups[ch]||{}; (groups[ch][q.point]=groups[ch][q.point]||[]).push(q); });
  const nPts=Object.values(groups).reduce((a,g)=>a+Object.keys(g).length,0);
  let fhtml='';
  if(e.cards && e.cards.length){
    fhtml=`<div class="card"><h3 style="margin:4px 0">知识卡片</h3>`+
      e.cards.map(f=>`<div style="padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6"><b>${esc(f.name)}</b>：${esc(f.text)}</div>`).join('')+`</div>`;
  }
  let html=fhtml+`<div class="card"><h3 style="margin:4px 0">考点地图 · ${esc(e.name)}</h3>
    <p class="meta">现有 ${REG.length} 道题，覆盖 ${nPts} 个考点。点任意考点的「专练」，只练这一考点的全部题目。</p></div>`;
  if(!Object.keys(groups).length){ html+=`<div class="card"><p>该考试暂无考点数据，题库接入后自动生成考点地图。</p></div>`; }
  Object.keys(groups).forEach(ch=>{
    html+=`<div class="sechead">${esc(ch)}</div>`;
    Object.keys(groups[ch]).forEach(p=>{
      const list=groups[ch][p];
      html+=`<div class="maprow"><span style="flex:1">${esc(p.split('·').slice(1).join('·')||p)}<br><small class="meta">${list.length} 题</small></span><button class="btn" onclick="practicePoint('${p.replace(/'/g,"\\'")}')">专练</button></div>`;
    });
  });
  $('#app').innerHTML=html;
}
function practicePoint(p){
  const list=curAll().filter(q=>q.point===p);
  renderQuestions(list,'考点专练 · '+p,()=>showTab('map'));
}
/* 初始化：分类下拉 -> 考试下拉，默认财务考试 · 税法一（展示税法归位） */
function switchCategory(cat){
  const sel=$('#examSel');
  const list=EXAMS.filter(e=>e.category===cat);
  sel.innerHTML = list.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  switchExam(list[0].id);
}
(function init(){
  const csel=$('#catSel');
  csel.innerHTML = CATS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  csel.value='finance';
  switchCategory('finance');
})();
</script>
