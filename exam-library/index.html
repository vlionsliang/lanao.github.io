<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考试库 · 通用刷题引擎</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#15803d;--bad:#dc2626}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:9;background:#111827;color:#fff;padding:12px 16px}
  header h1{margin:0;font-size:17px}
  header p{margin:4px 0 0;font-size:12px;color:#9ca3af}
  header select{width:100%;margin-top:10px;padding:9px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
  nav{display:flex;gap:8px;padding:10px 12px;position:sticky;top:118px;z-index:9;background:var(--bg)}
  nav button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px}
  nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  main{padding:4px 12px 40px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .setbtn{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin:10px 0;font-size:15px}
  .setbtn small{color:var(--sub)}
  .qtag{font-size:12px;color:var(--acc);font-weight:600}
  .stem{font-size:15px;line-height:1.65;margin:8px 0 10px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;line-height:1.5}
  .opt.sel{border-color:var(--acc);background:#eff6ff}
  .opt.right{border-color:var(--ok);background:#f0fdf4}
  .opt.wrong{border-color:var(--bad);background:#fef2f2}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .exp{display:none;margin-top:10px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
  .exp.show{display:block}
  .verdict{font-weight:700}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  input.num,textarea.ans{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  textarea.ans{min-height:140px;line-height:1.6}
  .meta{color:var(--sub);font-size:12.5px}
  .score{font-size:26px;font-weight:800}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}
  .timer{font-variant-numeric:tabular-nums;font-weight:700}
  .empty{color:var(--sub);text-align:center;padding:28px 0}
  .casebox{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.65;margin:10px 0;white-space:pre-wrap}
  .sechead{font-size:16px;font-weight:800;margin:18px 2px 4px}
  .ptline{color:#92400e;font-weight:600}
  .maprow{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0;font-size:13.5px}
  .maprow .btn{flex:0 0 auto;padding:6px 12px}
</style>
</head>
<body>
<header>
  <h1>考试库 · 通用刷题引擎</h1>
  <p id="examSub">一个引擎，多个考试：切换考试后进度、错题本按考试隔离保存</p>
  <select id="catSel" onchange="switchCategory(this.value)"></select>
  <select id="examSel" onchange="switchExam(this.value)"></select>
</header>
<nav>
  <button id="tab-practice" class="on" onclick="showTab('practice')">按套练习</button>
  <button id="tab-exam" onclick="showTab('exam')">模拟考试</button>
  <button id="tab-map" onclick="showTab('map')">考点地图</button>
  <button id="tab-wrong" onclick="showTab('wrong')">错题本</button>
</nav>
<main id="app"></main>

const SETS_MAP = {"cet4": [{"name": "第1套 · 词汇与语法（10题）", "questions": [{"answer": "A", "explain": "take advantage of 是固定搭配，意为“利用”。for / to / with 都不能与 advantage 构成这一搭配。", "id": "cet4v1", "options": {"A": "of", "B": "for", "C": "to", "D": "with"}, "point": "词汇与语法·固定搭配：take advantage of", "stem": "Students should take full advantage ___ the library resources during the exam season.", "type": "single"}, {"answer": "A", "explain": "be responsible for 意为“对……负责”。to / of / with 都不构成这一搭配。", "id": "cet4v2", "options": {"A": "for", "B": "to", "C": "of", "D": "with"}, "point": "词汇与语法·固定搭配：be responsible for", "stem": "Parents are responsible ___ their children's safety at school.", "type": "single"}, {"answer": "A", "explain": "be familiar with 意为“熟悉”。to / for / on 都不构成这一搭配。", "id": "cet4v3", "options": {"A": "with", "B": "to", "C": "for", "D": "on"}, "point": "词汇与语法·固定搭配：be familiar with", "stem": "She is already familiar ___ the new software after a week of training.", "type": "single"}, {"answer": "A", "explain": "rely on 意为“依靠、依赖”。in / to / for 都不构成这一搭配。", "id": "cet4v4", "options": {"A": "on", "B": "in", "C": "to", "D": "for"}, "point": "词汇与语法·固定搭配：rely on", "stem": "Small businesses often rely ___ local customers to survive.", "type": "single"}, {"answer": "A", "explain": "contribute to 后接名词时意为“有助于、促进”。for / with / on 都不构成这一搭配。", "id": "cet4v5", "options": {"A": "to", "B": "for", "C": "with", "D": "on"}, "point": "词汇与语法·固定搭配：contribute to", "stem": "Regular exercise can contribute ___ better sleep and a stronger immune system.", "type": "single"}, {"answer": "A", "explain": "pay attention to 是固定搭配，意为“注意”。on / for / with 都不构成这一搭配。", "id": "cet4v6", "options": {"A": "to", "B": "on", "C": "for", "D": "with"}, "point": "词汇与语法·固定搭配：pay attention to", "stem": "Please pay close attention ___ the safety instructions before you start the experiment.", "type": "single"}, {"answer": "A", "explain": "be aware of 意为“意识到”。for / to / with 都不构成这一搭配。", "id": "cet4v7", "options": {"A": "of", "B": "for", "C": "to", "D": "with"}, "point": "词汇与语法·固定搭配：be aware of", "stem": "Are you aware ___ the changes to the exam schedule?", "type": "single"}, {"answer": "A", "explain": "focus on 意为“集中于”。in / to / for 都不构成这一搭配。", "id": "cet4v8", "options": {"A": "on", "B": "in", "C": "to", "D": "for"}, "point": "词汇与语法·固定搭配：focus on", "stem": "The course focuses ___ practical communication skills rather than grammar rules alone.", "type": "single"}, {"answer": "C", "explain": "空格后是名词 essay，需要表示所属的关系词 whose。who / whom 指人作主语或宾语，which 指物且不表示所属。", "id": "cet4v9", "options": {"A": "who", "B": "whom", "C": "whose", "D": "which"}, "point": "语法·定语从句：whose 表示所属", "stem": "The student ___ essay won first prize is in my class.", "type": "single"}, {"answer": "A", "explain": "insist 表示“要求”时，后接 (should +) 动词原形。submits 是陈述语气，不合“要求”的语境；submitted / submitting 也不合虚拟语气结构。", "id": "cet4v10", "options": {"A": "submit", "B": "submits", "C": "submitted", "D": "submitting"}, "point": "语法·虚拟语气：insist 后接动词原形", "stem": "The teacher insisted that every student ___ the essay before Friday.", "type": "single"}]}, {"name": "第2套 · 阅读理解（10题）", "questions": [{"answer": "A", "case": "For many students, online learning was once a backup plan, used only when the classroom was closed. Today it has become a normal part of education. A student in a small town can now listen to a lecture from a famous university, submit homework at midnight, and join a discussion group with classmates in other cities. The main advantage is flexibility: learners can study at their own speed and review difficult parts as many times as they need.\nFlexibility, however, is also a risk. Without a fixed timetable, some students put off their work until the last day. Others are easily distracted by phones and social media at home. Good online courses therefore use short videos, clear weekly deadlines, and quick feedback. These small structures help students stay on track without taking away freedom.\nOnline learning will not replace teachers, the author argues. It works best when technology and human guidance are combined: the screen delivers information, while the teacher answers questions, encourages discussion, and checks understanding.", "explain": "首段说在线学习已成为教育的正常部分，末段说它与教师指导结合时效果最好。B 与末段相反，C、D 都只是文中举例，不是主旨。", "id": "cet4r1", "options": {"A": "Online learning has become normal, and it works best together with teacher guidance.", "B": "Online learning will soon replace all teachers.", "C": "Online learning is only useful for students in small towns.", "D": "Students mainly like online learning because they can submit homework at midnight."}, "point": "阅读理解·主旨大意", "stem": "What is the main idea of the passage?", "type": "single"}, {"answer": "A", "explain": "文中明确说 flexibility 指 learners can study at their own speed and review difficult parts as many times as they need。", "id": "cet4r2", "options": {"A": "Learners can study at their own speed and review difficult parts repeatedly.", "B": "Learners can avoid all deadlines.", "C": "Learners can study without any teacher.", "D": "Learners only need to submit homework at midnight."}, "point": "阅读理解·细节理解", "stem": "According to the passage, what does flexibility in online learning mean?", "type": "single"}, {"answer": "A", "explain": "第二段明确提到：没有固定时间表时，有的学生拖到最后一天才做作业，有的在家容易被手机和社交媒体分心。", "id": "cet4r3", "options": {"A": "Some students delay their work and are easily distracted at home.", "B": "Online lectures are always too short.", "C": "Universities refuse to offer online courses.", "D": "Students in small towns have no internet access."}, "point": "阅读理解·细节理解", "stem": "What problem of online learning is mentioned in the passage?", "type": "single"}, {"answer": "A", "explain": "第二段末尾明确列出：short videos, clear weekly deadlines, and quick feedback。", "id": "cet4r4", "options": {"A": "Short videos, clear weekly deadlines, and quick feedback.", "B": "Longer lectures with no deadlines.", "C": "Social media alone, without any structure.", "D": "Homework that can only be submitted at midnight."}, "point": "阅读理解·细节理解", "stem": "What do good online courses use to help students stay on track?", "type": "single"}, {"answer": "A", "explain": "作者既肯定在线学习的便利，又指出灵活性的风险，结论是技术与教师指导结合最好，属于肯定但谨慎的态度。", "id": "cet4r5", "options": {"A": "Positive but cautious: online learning works best when combined with teacher guidance.", "B": "Completely negative about online learning.", "C": "Teachers are no longer needed in education.", "D": "Flexibility in online learning has no risk at all."}, "point": "阅读理解·作者态度", "stem": "What is the author's attitude toward online learning?", "type": "single"}, {"answer": "A", "case": "Every year, a large amount of food is thrown away before it is eaten. At home, people often buy too much, misunderstand date labels, or cook more than they need. In shops and restaurants, unsold food is sometimes thrown away even when it is still safe to eat. The waste is not only a waste of money; it also wastes the water, land, and work used to grow, transport, and cook the food.\nPart of the problem is confusion about labels. “Best before” usually means the food may lose some quality after that date, but it is not necessarily unsafe. “Use by”, by contrast, is about safety and should be followed more strictly. Many people treat the two labels as the same and throw away food too early.\nThe passage suggests simple steps. At home, plan meals before shopping, store food correctly, and use leftovers for the next meal. Shops and restaurants can sell food near its date at a lower price or donate unsold food. Reducing waste, the author argues, needs both careful consumers and responsible businesses.", "explain": "全文先讲浪费的规模与原因，再讲标签混淆，最后讲家庭与商家两方面的办法，主旨是浪费问题大但可以从两方面减少。", "id": "cet4r6", "options": {"A": "Food waste is a large problem, but it can be reduced by careful consumers and responsible businesses.", "B": "Food waste happens only in restaurants.", "C": "Date labels are always about safety.", "D": "Leftovers should always be thrown away."}, "point": "阅读理解·主旨大意", "stem": "What is the main idea of the passage?", "type": "single"}, {"answer": "A", "explain": "首段明确列出家庭浪费的三个原因：buy too much, misunderstand date labels, or cook more than they need。", "id": "cet4r7", "options": {"A": "Buying too much, misunderstanding date labels, and cooking more than needed.", "B": "Cooking too little food at home.", "C": "Refusing to shop in supermarkets.", "D": "Eating only in restaurants."}, "point": "阅读理解·细节理解", "stem": "According to the passage, why do households waste food?", "type": "single"}, {"answer": "A", "explain": "文中区分：best before 通常指品质可能下降，但不一定不安全；use by 则关于安全，应更严格遵守。", "id": "cet4r8", "options": {"A": "It usually means quality may drop, but the food is not necessarily unsafe.", "B": "It always means the food is unsafe after that date.", "C": "It means the same as “use by”.", "D": "It means the food must be sold at a lower price."}, "point": "阅读理解·细节理解", "stem": "What does “best before” usually mean in the passage?", "type": "single"}, {"answer": "A", "explain": "末段明确建议：at home, use leftovers for the next meal；商店和餐馆则可降价出售或捐赠未售出的食物。", "id": "cet4r9", "options": {"A": "Use leftovers for the next meal, and shops can sell or donate unsold food.", "B": "Throw away all leftovers immediately.", "C": "Buy more food than needed.", "D": "Ignore date labels completely."}, "point": "阅读理解·细节理解", "stem": "What solutions does the passage suggest?", "type": "single"}, {"answer": "A", "explain": "末段结论句明确说 reducing waste needs both careful consumers and responsible businesses，即需要两方共同努力。", "id": "cet4r10", "options": {"A": "Both consumers and businesses need to act.", "B": "Only consumers need to act.", "C": "Only restaurants need to act.", "D": "Food waste cannot be reduced at all."}, "point": "阅读理解·推理判断", "stem": "What can be inferred from the last paragraph?", "type": "single"}]}, {"name": "第3套 · 写作与翻译（自评，2题）", "questions": [{"answer": "范文对照（自评）", "explain": "范文要点：首段点题——短视频时代，读书仍不可替代；中段两点：①读书培养深度思考，短视频多为碎片信息；②读书积累词汇与表达，有助于写作；尾段总结——把读书作为日常习惯，每天固定时间读。自评清单：①结构是否首段点题＋中段展开＋尾段总结；②是否达到120-180词；③有无主谓一致、时态错误；④是否用到2个以上连接词（如 however, in addition, therefore）。全部做到算对，否则进错题本重练。", "id": "cet4w1", "options": {}, "point": "写作·短文写作：观点论证", "stem": "For this part, you are allowed 30 minutes to write a short essay on whether reading books still matters in the age of short videos. You should write at least 120 words but no more than 180 words.", "type": "self"}, {"answer": "范文对照（自评）", "explain": "参考译文：High-speed rail has become an important way for Chinese people to travel. It is not only fast, but also punctual and safe. In the past, it took more than ten hours to travel from Beijing to Shanghai; today it takes only a little more than four hours. The development of high-speed rail has not only made people's lives more convenient, but also promoted the economic development of cities along the line. 自评清单：① high-speed rail 拼写正确；② not only...but also 结构完整；③ “促进沿线城市经济发展”译出 promoted the economic development of cities along the line；④时态以一般现在时为主。缺两项以上算错，进错题本。", "id": "cet4t1", "options": {}, "point": "翻译·汉译英：说明文段落", "stem": "将下面这段话翻译成英文：高铁已经成为中国人出行的重要方式。它不仅速度快，而且准时、安全。过去，从北京到上海需要十多个小时，如今只需要四个多小时。高铁的发展不仅方便了人们的生活，也促进了沿线城市的经济发展。", "type": "self"}]}], "cet6": [{"name": "第1套 · 词汇与语法（10题）", "questions": [{"id": "cet6_1", "stem": "The committee decided to postpone the meeting ______ further notice.", "options": {"A": "until", "B": "unless", "C": "though", "D": "despite"}, "answer": "A", "point": "六级·词汇语法：until further notice", "explain": "until further notice 是固定搭配，意为“另行通知之前”，句意是会议推迟到另行通知为止。", "type": "single"}, {"id": "cet6_2", "stem": "She took the criticism ______ her stride and kept working on the project.", "options": {"A": "in", "B": "on", "C": "by", "D": "with"}, "answer": "A", "point": "六级·词汇语法：take in one's stride", "explain": "take something in one's stride 是固定搭配，意为“从容应对、泰然处之”。", "type": "single"}, {"id": "cet6_3", "stem": "The new policy is intended to ______ the gap between urban and rural education.", "options": {"A": "widen", "B": "bridge", "C": "ignore", "D": "measure"}, "answer": "B", "point": "六级·词汇语法：bridge the gap", "explain": "bridge the gap 是固定搭配，意为“弥合差距”；widen the gap 是扩大差距，与政策意图相反。", "type": "single"}, {"id": "cet6_4", "stem": "Had he followed the doctor's advice, he ______ in hospital now.", "options": {"A": "would not be", "B": "would not have been", "C": "will not be", "D": "is not"}, "answer": "A", "point": "六级·词汇语法：混合虚拟语气", "explain": "条件是过去的虚拟（Had he followed），结果是现在的情况，用 would + 动词原形，即 would not be。", "type": "single"}, {"id": "cet6_5", "stem": "Only by working together ______ overcome the difficulties ahead.", "options": {"A": "we can", "B": "can we", "C": "we will", "D": "will we"}, "answer": "B", "point": "六级·词汇语法：倒装", "explain": "Only + 状语放句首时，主句要部分倒装：Only by working together can we overcome...", "type": "single"}, {"id": "cet6_6", "stem": "The professor ______ the students to read at least three papers before the seminar.", "options": {"A": "required", "B": "demanded that", "C": "asked that", "D": "suggested to"}, "answer": "A", "point": "六级·词汇语法：require sb to do", "explain": "require sb. to do sth. 是正确结构；demanded / asked / suggested 后接 that 从句时从句用虚拟语气，不直接接 to do。", "type": "single"}, {"id": "cet6_7", "stem": "This phenomenon is often ______ to the rapid growth of short-video platforms.", "options": {"A": "attributed", "B": "contributed", "C": "distributed", "D": "devoted"}, "answer": "A", "point": "六级·词汇语法：be attributed to", "explain": "be attributed to 意为“归因于”；contribute to 是“促成”，主被动与搭配不同。", "type": "single"}, {"id": "cet6_8", "stem": "______ the rain, the outdoor concert went on as planned.", "options": {"A": "In spite", "B": "Despite of", "C": "In spite of", "D": "Although"}, "answer": "C", "point": "六级·词汇语法：in spite of", "explain": "in spite of 后接名词或动名词，意为“尽管”；despite 后不加 of，although 后接从句。", "type": "single"}, {"id": "cet6_9", "stem": "The company has committed itself ______ reducing carbon emissions by 2030.", "options": {"A": "to", "B": "for", "C": "with", "D": "on"}, "answer": "A", "point": "六级·词汇语法：be committed to", "explain": "be committed to doing sth. 是固定搭配，to 是介词，后接动名词 reducing。", "type": "single"}, {"id": "cet6_10", "stem": "It is high time that the government ______ effective measures to protect personal data.", "options": {"A": "takes", "B": "took", "C": "will take", "D": "has taken"}, "answer": "B", "point": "六级·词汇语法：It is high time that", "explain": "It is high time that 后接从句用过去式表示虚拟，意为“早就该……了”。", "type": "single"}]}, {"name": "第2套 · 阅读理解（10题）", "questions": [{"id": "cet6r1", "stem": "Passage 1: Artificial intelligence is changing how students learn, but it does not change what learning means. A tutor program can correct grammar, suggest sources, and even draft an outline in seconds. What it cannot do is decide what is worth learning, or judge whether an argument is honest. Those judgments still belong to the learner. Students who use AI only to produce answers may finish assignments faster, yet understand less. Students who use it to test their own ideas — asking why a suggestion is made, checking sources, and rewriting in their own words — often learn more, because the machine forces them to explain what they actually mean. The difference is not the tool, but the habit that surrounds it.\nWhat is the main idea of Passage 1?", "options": {"A": "AI should be banned from schools.", "B": "AI changes the tools of learning, but judgment still belongs to the learner.", "C": "AI can decide what is worth learning.", "D": "Students should never use AI."}, "answer": "B", "point": "阅读理解·主旨大意", "explain": "首段点题：AI 改变学习方式，但不改变学习的本质；判断什么值得学、论证是否诚实，仍属于学习者。", "type": "single"}, {"id": "cet6r2", "stem": "According to Passage 1, what can a tutor program do?", "options": {"A": "Decide what is worth learning.", "B": "Correct grammar, suggest sources, and draft an outline.", "C": "Judge whether an argument is honest.", "D": "Replace the learner completely."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "文中明确列出：correct grammar, suggest sources, and even draft an outline；判断类工作明确说它不能做。", "type": "single"}, {"id": "cet6r3", "stem": "What does Passage 1 say about students who use AI only to produce answers?", "options": {"A": "They understand more.", "B": "They finish faster but may understand less.", "C": "They never finish assignments.", "D": "They learn to judge arguments."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "原文：may finish assignments faster, yet understand less，即完成更快但理解更少。", "type": "single"}, {"id": "cet6r4", "stem": "What habit does Passage 1 recommend when using AI?", "options": {"A": "Copy the output directly.", "B": "Ask why a suggestion is made, check sources, and rewrite in one's own words.", "C": "Avoid checking sources.", "D": "Use AI only for grammar."}, "answer": "B", "point": "阅读理解·推理判断", "explain": "文中推荐的用法是：问为什么这样建议、核查来源、用自己的话重写，这样机器反而迫使学习者说清自己的意思。", "type": "single"}, {"id": "cet6r5", "stem": "What can be inferred from the last sentence of Passage 1?", "options": {"A": "The tool itself determines learning outcomes.", "B": "How one uses the tool matters more than the tool itself.", "C": "Habits do not matter.", "D": "AI always improves learning."}, "answer": "B", "point": "阅读理解·推理判断", "explain": "末句：The difference is not the tool, but the habit that surrounds it，即差别不在工具，而在使用习惯。", "type": "single"}, {"id": "cet6r6", "stem": "Passage 2: Many cities are trying to bring nature back into daily life, not only in parks but on rooftops, along riverbanks, and between buildings. Green roofs can lower indoor temperatures in summer and slow rainwater runoff. Street trees shade sidewalks and make walking more pleasant, which in turn encourages people to leave their cars at home. Critics argue that such projects cost too much and need constant care. Supporters reply that the cost of doing nothing — hotter streets, more flooding, and fewer places to meet — is higher, though it is harder to see on a budget sheet. The real question, therefore, is not whether a city can afford green space, but whether it can afford to live without it.\nWhat is the main idea of Passage 2?", "options": {"A": "Cities should build more parks only.", "B": "Bringing nature into daily urban life has real benefits, and its cost must be weighed against the cost of doing nothing.", "C": "Green projects are free.", "D": "Cities should remove all street trees."}, "answer": "B", "point": "阅读理解·主旨大意", "explain": "全文先讲屋顶绿化、行道树等好处，再讲反对者的成本质疑，最后落点是：问题不是能否负担绿地，而是能否负担没有绿地的生活。", "type": "single"}, {"id": "cet6r7", "stem": "According to Passage 2, what can green roofs do?", "options": {"A": "Raise indoor temperatures.", "B": "Lower indoor temperatures in summer and slow rainwater runoff.", "C": "Increase flooding.", "D": "Replace all parks."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "原文：Green roofs can lower indoor temperatures in summer and slow rainwater runoff。", "type": "single"}, {"id": "cet6r8", "stem": "How do street trees encourage people to leave cars at home, according to Passage 2?", "options": {"A": "By blocking roads.", "B": "By shading sidewalks and making walking more pleasant.", "C": "By raising parking fees.", "D": "By banning cars."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "原文：Street trees shade sidewalks and make walking more pleasant, which in turn encourages people to leave their cars at home。", "type": "single"}, {"id": "cet6r9", "stem": "What do critics of green projects argue?", "options": {"A": "Green projects cost too much and need constant care.", "B": "Green projects need no care.", "C": "Green projects make streets hotter.", "D": "Green projects reduce meeting places."}, "answer": "A", "point": "阅读理解·细节理解", "explain": "原文：Critics argue that such projects cost too much and need constant care。", "type": "single"}, {"id": "cet6r10", "stem": "What does the last sentence of Passage 2 imply?", "options": {"A": "Green space is a luxury cities can skip.", "B": "Living without green space may cost more in the long run.", "C": "Budget sheets show all costs clearly.", "D": "Cities should stop all green projects."}, "answer": "B", "point": "阅读理解·推理判断", "explain": "末句反问：城市能否负担没有绿地的生活，呼应前文“不做的代价更高，只是账面上难看见”，即长期代价可能更大。", "type": "single"}]}, {"name": "第3套 · 写作与翻译（自评，2题）", "questions": [{"id": "cet6w1", "stem": "For this part, you are allowed 30 minutes to write a short essay on whether artificial intelligence helps or harms students' independent thinking. You should write at least 150 words but no more than 200 words.", "options": {}, "answer": "范文对照（自评）", "point": "写作·短文写作：观点论证", "explain": "范文要点：首段点题——AI 本身不决定思考质量，关键在使用方式；中段两点：①只抄答案会削弱独立思考，因为判断过程被外包了；②用来检验观点、核查来源、重写表达时，反而能逼出更清晰的思考；尾段总结——把 AI 当作检验工具而非答案机器。自评清单：①结构是否首段点题＋中段展开＋尾段总结；②是否达到150-200词；③有无主谓一致、时态错误；④是否用到2个以上连接词（如 however, for example, therefore）。全部做到算对，否则进错题本重练。", "type": "self"}, {"id": "cet6w2", "stem": "请将下面一段话翻译成英文：茶在中国已有几千年的历史。人们不仅把茶当作一种饮料，也把它看作一种文化。品茶讲究环境、心境和礼仪。如今，茶文化已经走向世界，成为中国与世界交流的一座桥梁。", "options": {}, "answer": "范文对照（自评）", "point": "翻译·段落翻译", "explain": "参考译文：Tea has a history of thousands of years in China. People regard tea not only as a drink, but also as a culture. Tea tasting pays attention to the environment, the state of mind, and etiquette. Today, tea culture has gone global and become a bridge for communication between China and the world. 自评清单：① “已有几千年的历史”译出 has a history of thousands of years；② not only...but also 结构完整；③ “走向世界”译出 has gone global；④ “桥梁”译出 bridge。缺两项以上算错，进错题本重练。", "type": "self"}]}], "kaoyan1": [{"name": "第1套 · 完形填空（10题，缩减版）", "questions": [{"id": "k1c1", "stem": "第 (1) 空最恰当的是？", "options": {"A": "However", "B": "Therefore", "C": "For example", "D": "In conclusion"}, "answer": "A", "point": "考研一·完形：转折连词", "explain": "前句说成功主要靠天赋，后句说研究表明习惯至少同样重要，两句转折，用 However。Therefore 表因果、For example 表举例、In conclusion 表总结，均不合转折语境。", "type": "single", "case": "Many people believe that success depends mainly on talent. ____ (1) ____, research on learning shows that habits matter at least as much. A student who studies a little every day often ____ (2) ____ a classmate who studies only before exams, ____ (3) ____ the second student may be more talented. The reason is simple: regular practice builds memory ____ (4) ____, while cramming fades quickly. ____ (5) ____, habits are not formed by willpower alone. They need clear cues, a fixed time, and a small reward ____ (6) ____ each session. For example, a reader who always reads after breakfast soon finds the habit ____ (7) ____, because the morning routine itself becomes the reminder. Of course, habits can also work ____ (8) ____ us: checking a phone first thing in the morning can steal the best hour of the day. The solution is not to fight every bad habit ____ (9) ____, but to replace it with a better one in the same situation. In the long run, our lives are shaped not by what we do once in a while, ____ (10) ____ by what we do daily."}, {"id": "k1c2", "stem": "第 (2) 空最恰当的是？", "options": {"A": "outperforms", "B": "ignores", "C": "avoids", "D": "replaces"}, "answer": "A", "point": "考研一·完形：动词辨析", "explain": "每天学一点的学生常常胜过只在考前突击的同学，用 outperforms（胜过）。ignores 忽视、avoids 避免、replaces 替代，均不合“成绩更好”的语境。", "type": "single"}, {"id": "k1c3", "stem": "第 (3) 空最恰当的是？", "options": {"A": "even if", "B": "as if", "C": "only if", "D": "in case"}, "answer": "A", "point": "考研一·完形：让步连词", "explain": "后半句“第二个学生可能更有天赋”是让步条件：即使更有天赋，仍可能输给坚持者，用 even if。as if 表虚拟假设、only if 表唯一条件、in case 表以防，均不合。", "type": "single"}, {"id": "k1c4", "stem": "第 (4) 空最恰当的是？", "options": {"A": "gradually", "B": "suddenly", "C": "rarely", "D": "secretly"}, "answer": "A", "point": "考研一·完形：副词辨析", "explain": "定期练习是逐步建立记忆，与后文“突击很快消退”对照，用 gradually（逐渐地）。suddenly 突然、rarely 很少、secretly 秘密地，均与“定期积累”不合。", "type": "single"}, {"id": "k1c5", "stem": "第 (5) 空最恰当的是？", "options": {"A": "In fact", "B": "In short", "C": "At last", "D": "By chance"}, "answer": "A", "point": "考研一·完形：插入语辨析", "explain": "本句进一步说明习惯形成的真相（不只靠意志力），用 In fact（事实上）引出补充说明。In short 表总结、At last 表最终、By chance 表偶然，均不合。", "type": "single"}, {"id": "k1c6", "stem": "第 (6) 空最恰当的是？", "options": {"A": "after", "B": "before", "C": "without", "D": "against"}, "answer": "A", "point": "考研一·完形：介词辨析", "explain": "每次学习之后给一个小奖励，即 a small reward after each session。before 在……之前、without 没有、against 反对，均不合“完成后的奖励”语境。", "type": "single"}, {"id": "k1c7", "stem": "第 (7) 空最恰当的是？", "options": {"A": "automatic", "B": "difficult", "C": "expensive", "D": "illegal"}, "answer": "A", "point": "考研一·完形：形容词辨析", "explain": "因为早餐 routine 本身成了提醒，习惯变得不假思索，用 automatic（自动的）。difficult 困难、expensive 昂贵、illegal 非法，均与“ routine 提醒”不合。", "type": "single"}, {"id": "k1c8", "stem": "第 (8) 空最恰当的是？", "options": {"A": "against", "B": "for", "C": "with", "D": "about"}, "answer": "A", "point": "考研一·完形：固定搭配 work against", "explain": "work against us 意为“对我们不利、拖后腿”，与前文好习惯对照。work for 为……工作、work with 与……合作、work about 无此搭配，均不合。", "type": "single"}, {"id": "k1c9", "stem": "第 (9) 空最恰当的是？", "options": {"A": "directly", "B": "secretly", "C": "rarely", "D": "finally"}, "answer": "A", "point": "考研一·完形：副词辨析", "explain": "解决办法不是正面硬抗每个坏习惯，而是替换它，用 directly（直接地）与 replace 对照。secretly 秘密地、rarely 很少、finally 最终，均不合。", "type": "single"}, {"id": "k1c10", "stem": "第 (10) 空最恰当的是？", "options": {"A": "but", "B": "and", "C": "or", "D": "so"}, "answer": "A", "point": "考研一·完形：并列连词 not...but...", "explain": "not by what we do once in a while, but by what we do daily 是 not...but... 结构，表否定前者、肯定后者。and 表并列、or 表选择、so 表因果，均不合。", "type": "single"}]}, {"name": "第2套 · 阅读理解A（10题，2篇）", "questions": [{"id": "k1r1", "stem": "Passage 1: Remote work was once a rare benefit. Today, millions of people work from home at least part of the week. Supporters say it saves commuting time, lets workers choose their hours, and allows companies to hire talent anywhere. Critics worry that remote workers feel isolated, that young employees miss informal learning from senior colleagues, and that the line between work and home becomes hard to draw.\nWhat is the main idea of Passage 1?", "options": {"A": "Remote work brings clear benefits but also real problems that need attention.", "B": "Remote work has no benefit at all.", "C": "Only young employees like remote work.", "D": "Companies should ban remote work completely."}, "answer": "A", "point": "考研一·阅读A：主旨大意", "explain": "首段先讲远程办公普及，再并列支持者与批评者的观点，全文是利弊两面。用 no benefit、only young、ban completely 都是片面或极端表述，与两面结构不合。", "type": "single"}, {"id": "k1r2", "stem": "According to Passage 1, what do supporters of remote work say?", "options": {"A": "It saves commuting time and allows hiring talent anywhere.", "B": "It makes all employees feel isolated.", "C": "It removes the need for any meetings.", "D": "It only works for senior employees."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "支持者观点明确列出：saves commuting time、choose hours、hire talent anywhere。feel isolated 是批评者观点，remove meetings、only senior 文中未提。", "type": "single"}, {"id": "k1r3", "stem": "According to Passage 1, what problem do critics mention for young employees?", "options": {"A": "They miss informal learning from senior colleagues.", "B": "They spend too much time commuting.", "C": "They refuse to use new technology.", "D": "They prefer to work in offices abroad."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "批评者观点原文：young employees miss informal learning from senior colleagues。commuting 是支持者说的节省项，refuse technology、offices abroad 文中未提。", "type": "single"}, {"id": "k1r4", "stem": "What can be inferred from Passage 1 about the line between work and home?", "options": {"A": "Remote work can blur it, which is one of its problems.", "B": "Remote work makes the line completely clear.", "C": "The line does not matter to remote workers.", "D": "Only office workers face this problem."}, "answer": "A", "point": "考研一·阅读A：推理判断", "explain": "批评者说 the line between work and home becomes hard to draw，即界限变模糊是问题之一。completely clear 与原文相反，does not matter、only office 文中未提。", "type": "single"}, {"id": "k1r5", "stem": "What is the author's attitude in Passage 1?", "options": {"A": "Balanced: presenting both sides without taking an extreme position.", "B": "Strongly against remote work.", "C": "Strongly in favour of remote work only.", "D": "Indifferent and giving no information."}, "answer": "A", "point": "考研一·阅读A：作者态度", "explain": "作者并列 supporters 与 critics 的观点，未下极端结论，属于 balanced。strongly against / only in favour 与两面结构不合，indifferent 与文中信息量不合。", "type": "single"}, {"id": "k1r6", "stem": "Passage 2: Many museums now put their collections online. A visitor in another country can examine a painting in detail, read its history, and even take a virtual tour of the gallery. Museum directors say this reaches people who could never travel to the museum, especially students and researchers. Some worry, however, that a screen cannot replace standing in front of the real work, seeing its size, texture, and the way light falls on it. The best result, most directors agree, is when the online visit encourages, rather than replaces, a real visit.\nWhat is the main idea of Passage 2?", "options": {"A": "Online collections expand access, but a real visit still has unique value.", "B": "Museums should close their physical galleries.", "C": "Online collections are useless for students.", "D": "Only researchers benefit from online museums."}, "answer": "A", "point": "考研一·阅读A：主旨大意", "explain": "全文结构：线上扩大了可达性（students and researchers），但屏幕无法替代实物体验，结论是线上应鼓励而非替代实地参观。close galleries、useless、only researchers 均与原文相反或片面。", "type": "single"}, {"id": "k1r7", "stem": "According to Passage 2, who especially benefits from online collections?", "options": {"A": "People who could never travel to the museum, especially students and researchers.", "B": "Only museum directors.", "C": "Only people living next to the museum.", "D": "People who dislike all art."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "原文：reaches people who could never travel to the museum, especially students and researchers。only directors、next to museum、dislike art 均与原文不合。", "type": "single"}, {"id": "k1r8", "stem": "According to Passage 2, what can a screen NOT replace?", "options": {"A": "Seeing the real work's size, texture, and the way light falls on it.", "B": "Reading the history of a painting.", "C": "Examining a painting in detail online.", "D": "Taking a virtual tour of the gallery."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "担忧句原文：a screen cannot replace standing in front of the real work, seeing its size, texture, and the way light falls on it。B、C、D 都是线上能做的事，不是不能替代的。", "type": "single"}, {"id": "k1r9", "stem": "What do most directors agree on in Passage 2?", "options": {"A": "The online visit should encourage, rather than replace, a real visit.", "B": "Online visits should replace all real visits.", "C": "Museums should stop putting collections online.", "D": "Virtual tours are better than real visits in every way."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "结论句原文：when the online visit encourages, rather than replaces, a real visit。replace all、stop online、better in every way 均与结论相反。", "type": "single"}, {"id": "k1r10", "stem": "The word \"texture\" in Passage 2 most probably means:", "options": {"A": "The surface quality of the work that can be seen or felt.", "B": "The price of the painting.", "C": "The age of the museum building.", "D": "The number of visitors."}, "answer": "A", "point": "考研一·阅读A：词义猜测", "explain": "texture 与 size、light 并列，讲站在实物前才能感知的表面质感。price、building age、visitor number 均与语境不合。", "type": "single"}]}, {"name": "第3套 · 翻译与写作（自评，2题）", "questions": [{"id": "k1t1", "stem": "将下面 5 句话翻译成汉语：(1) Success rarely comes from a single effort; it grows out of small actions repeated over time. (2) When people face a difficult choice, they often prefer a safe option, even if it brings less reward. (3) Technology has changed how we communicate, but it has not changed our need to be understood. (4) A good teacher does not give students all the answers; she teaches them how to ask better questions. (5) Reading widely does not guarantee wisdom, but it makes narrow thinking harder to defend.", "options": {}, "answer": "范文对照（自评）", "point": "考研一·翻译：英译汉句子翻译", "explain": "参考译文：(1) 成功很少来自一次努力，它来自长期重复的小行动。(2) 面对艰难选择时，人们往往偏爱稳妥的选项，即使回报更少。(3) 技术改变了我们的沟通方式，但没有改变我们被理解的需求。(4) 好老师不是把所有答案都给学生，而是教他们如何提出更好的问题。(5) 广泛阅读并不能保证智慧，但它让狭隘的想法更难站得住脚。自评清单：① 5 句是否都译出，无漏译；② grows out of / prefer / guarantee 等关键词是否译准；③ 汉语是否通顺，无逐词硬译。缺两项以上算错，进错题本。", "type": "self"}, {"id": "k1w1", "stem": "写作：图表显示，越来越多大学生用电子设备进行学习，传统纸质阅读时间相应减少。请写一篇短文：描述这一现象，分析其原因，并谈谈你的看法。词数 160–200 词。", "options": {}, "answer": "范文对照（自评）", "point": "考研一·写作：图表作文", "explain": "范文要点：首段描述现象——电子设备学习普及、纸质阅读时间减少；中段分析原因：① 设备便于检索与携带；② 视频、互动内容更直观；③ 碎片化时间可利用；尾段看法——电子学习是工具，深度阅读仍需纸质与专注，建议两者结合。自评清单：① 是否首段描述＋中段原因＋尾段看法；② 词数是否在 160–200 词；③ 有无主谓一致、时态错误；④ 是否用到 2 个以上连接词（如 however, moreover, therefore）。全部做到算对，否则进错题本重练。", "type": "self"}]}], "kaoyan2": [{"name": "第1套 · 完形填空（10题，缩减版）", "questions": [{"id": "k2c1", "stem": "第 (1) 空最恰当的是？", "options": {"A": "short", "B": "long", "C": "high", "D": "low"}, "answer": "A", "point": "考研二·完形：固定搭配 cut short", "explain": "cut short 意为“削减、缩短”，即工作一多就先砍睡眠。cut long、cut high、cut low 均无此搭配。", "type": "single", "case": "Sleep is often treated as wasted time, something to be cut ____ (1) ____ when work piles up. ____ (2) ____, scientists now regard sleep as an active part of learning. During deep sleep, the brain ____ (3) ____ the day's experiences, keeping useful information and discarding noise. Students who sleep after studying therefore remember more than those who stay up, ____ (4) ____ they spent the same time on the books. Sleep also affects mood: a tired person is more likely to ____ (5) ____ small problems as threats and to argue over nothing. ____ (6) ____, good sleep does not mean simply sleeping longer. Regular bedtimes, a dark room, and no screens before bed help the brain ____ (7) ____ the signal that it is time to rest. Caffeine late in the day, ____ (8) ____, can delay that signal for hours. None of this means that sleep alone guarantees success; diet, exercise, and study methods still ____ (9) ____. But without enough sleep, even the best methods work ____ (10) ____ well."}, {"id": "k2c2", "stem": "第 (2) 空最恰当的是？", "options": {"A": "However", "B": "Therefore", "C": "Besides", "D": "Finally"}, "answer": "A", "point": "考研二·完形：转折连词", "explain": "前句说睡眠被当作浪费，后句说科学家视睡眠为学习的主动部分，两句转折，用 However。Therefore 表因果、Besides 表补充、Finally 表最后，均不合。", "type": "single"}, {"id": "k2c3", "stem": "第 (3) 空最恰当的是？", "options": {"A": "sorts through", "B": "looks for", "C": "gives up", "D": "runs into"}, "answer": "A", "point": "考研二·完形：动词短语辨析", "explain": "深睡时大脑梳理当天的经历，保留有用信息、丢弃噪音，用 sorts through（梳理）。looks for 寻找、gives up 放弃、runs into 偶遇，均不合“保留与丢弃”的语境。", "type": "single"}, {"id": "k2c4", "stem": "第 (4) 空最恰当的是？", "options": {"A": "even though", "B": "as if", "C": "in case", "D": "only if"}, "answer": "A", "point": "考研二·完形：让步连词", "explain": "睡后学习者记得更多，尽管他们花在书本上的时间相同，用 even though（尽管）。as if 表虚拟、in case 表以防、only if 表唯一条件，均不合。", "type": "single"}, {"id": "k2c5", "stem": "第 (5) 空最恰当的是？", "options": {"A": "interpret", "B": "describe", "C": "hide", "D": "solve"}, "answer": "A", "point": "考研二·完形：动词辨析", "explain": "疲倦的人更可能把小问题解读为威胁，即 interpret ... as threats。describe 描述、hide 隐藏、solve 解决，均不合“解读为威胁”的语境。", "type": "single"}, {"id": "k2c6", "stem": "第 (6) 空最恰当的是？", "options": {"A": "In fact", "B": "In short", "C": "At first", "D": "By accident"}, "answer": "A", "point": "考研二·完形：插入语辨析", "explain": "本句澄清“好睡眠不等于睡得更久”这一真相，用 In fact。In short 表总结、At first 表起初、By accident 表偶然，均不合。", "type": "single"}, {"id": "k2c7", "stem": "第 (7) 空最恰当的是？", "options": {"A": "recognise", "B": "forget", "C": "ignore", "D": "delay"}, "answer": "A", "point": "考研二·完形：动词辨析", "explain": "规律作息、黑暗房间、睡前不用屏幕帮助大脑识别“该休息了”的信号，用 recognise。forget 忘记、ignore 忽视、delay 推迟，均与“帮助识别信号”相反或不合。", "type": "single"}, {"id": "k2c8", "stem": "第 (8) 空最恰当的是？", "options": {"A": "however", "B": "therefore", "C": "moreover", "D": "finally"}, "answer": "A", "point": "考研二·完形：转折副词", "explain": "句中插入 however 表转折：但白天晚些时候摄入咖啡因会推迟该信号。therefore 表因果、moreover 表递进、finally 表最后，均不合。", "type": "single"}, {"id": "k2c9", "stem": "第 (9) 空最恰当的是？", "options": {"A": "matter", "B": "disappear", "C": "fail", "D": "increase"}, "answer": "A", "point": "考研二·完形：动词辨析", "explain": "饮食、运动、学习方法仍然重要，用 still matter。disappear 消失、fail 失败、increase 增加，均不合“仍然重要”的语境。", "type": "single"}, {"id": "k2c10", "stem": "第 (10) 空最恰当的是？", "options": {"A": "less", "B": "more", "C": "most", "D": "best"}, "answer": "A", "point": "考研二·完形：比较级辨析", "explain": "没有足够睡眠，即使最好的方法效果也打折扣，即 work less well。more 更、most 最、best 最好，均与“打折扣”相反。", "type": "single"}]}, {"name": "第2套 · 阅读理解A（10题，2篇）", "questions": [{"id": "k2r1", "stem": "Passage 1: Volunteering is often described as giving time for free. Yet studies find that volunteers themselves gain a great deal. They meet new people, learn practical skills, and feel more connected to their community. One study found that older volunteers reported better mood and a stronger sense of purpose than similar people who did not volunteer. The benefit does not come from the hours alone, researchers say, but from feeling useful and belonging to a group.\nWhat is the main idea of Passage 1?", "options": {"A": "Volunteers gain mood, skills, and a sense of belonging, not just the people they help.", "B": "Volunteering only helps the people being served.", "C": "Volunteering is a waste of time for older people.", "D": "Only young people should volunteer."}, "answer": "A", "point": "考研二·阅读A：主旨大意", "explain": "全文讲志愿者自身获益：结识人、学技能、归属感，老年志愿者情绪与目标感更好。only helps served、waste of time、only young 均与原文相反或片面。", "type": "single"}, {"id": "k2r2", "stem": "According to Passage 1, what do older volunteers report?", "options": {"A": "Better mood and a stronger sense of purpose.", "B": "Worse mood and less purpose.", "C": "No change at all.", "D": "More free time but no friends."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文：older volunteers reported better mood and a stronger sense of purpose。worse、no change、no friends 均与原文不合。", "type": "single"}, {"id": "k2r3", "stem": "According to researchers in Passage 1, where does the benefit come from?", "options": {"A": "Feeling useful and belonging to a group, not hours alone.", "B": "The number of hours alone.", "C": "Getting paid for volunteering.", "D": "Working without any other people."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文：benefit does not come from the hours alone, but from feeling useful and belonging to a group。hours alone、paid、without people 均与原文不合。", "type": "single"}, {"id": "k2r4", "stem": "What can be inferred from Passage 1 about volunteering?", "options": {"A": "It can be good for the volunteer's own wellbeing.", "B": "It always harms the volunteer's health.", "C": "It requires professional skills only.", "D": "It is only useful in large cities."}, "answer": "A", "point": "考研二·阅读A：推理判断", "explain": "志愿者情绪、目标感、归属感提升，可推断对自身 wellbeing 有益。harms health、professional only、large cities 文中未提或与原文不合。", "type": "single"}, {"id": "k2r5", "stem": "What is the author's attitude in Passage 1?", "options": {"A": "Positive toward volunteering, supported by study findings.", "B": "Negative toward volunteering.", "C": "Neutral with no evidence.", "D": "Doubtful that any study is reliable."}, "answer": "A", "point": "考研二·阅读A：作者态度", "explain": "作者引用研究说明志愿者获益，态度积极且有依据。negative、no evidence、doubtful 均与文中研究引用不合。", "type": "single"}, {"id": "k2r6", "stem": "Passage 2: Second-hand markets are growing fast. People buy used clothes, phones, and furniture instead of new ones, often at a much lower price. Supporters say this reduces waste and saves resources, because making new products uses energy and materials. Sellers, too, can earn money from things they no longer need. Critics point out problems: quality varies, some goods have hidden faults, and returns are harder than in ordinary shops. Buyers are advised to check goods carefully and buy from sellers with good records.\nWhat is the main idea of Passage 2?", "options": {"A": "Second-hand markets save money and resources, but buyers should check quality carefully.", "B": "Second-hand markets are always safe.", "C": "New products are always better than used ones.", "D": "Second-hand markets only sell clothes."}, "answer": "A", "point": "考研二·阅读A：主旨大意", "explain": "全文两面：省钱省资源、卖家获益；但质量不一、有隐藏问题、退货难，结论是仔细检查、选信誉好的卖家。always safe、always better、only clothes 均片面或与原文不合。", "type": "single"}, {"id": "k2r7", "stem": "According to Passage 2, why do supporters favour second-hand markets?", "options": {"A": "They reduce waste and save resources used to make new products.", "B": "They make all products brand new.", "C": "They remove the need to check goods.", "D": "They guarantee every product is perfect."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文：reduces waste and saves resources, because making new products uses energy and materials。brand new、no need to check、guarantee perfect 均与原文不合。", "type": "single"}, {"id": "k2r8", "stem": "According to Passage 2, what problems do critics mention?", "options": {"A": "Quality varies, some goods have hidden faults, and returns are harder.", "B": "Prices are always higher than new goods.", "C": "Sellers never earn any money.", "D": "No one buys second-hand goods."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "批评者观点原文三项：quality varies、hidden faults、returns are harder。prices higher、never earn、no one buys 均与原文不合。", "type": "single"}, {"id": "k2r9", "stem": "What advice is given to buyers in Passage 2?", "options": {"A": "Check goods carefully and buy from sellers with good records.", "B": "Never check goods before buying.", "C": "Always buy the cheapest item without checking.", "D": "Avoid all second-hand markets."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文建议：check goods carefully and buy from sellers with good records。never check、cheapest without checking、avoid all 均与建议相反。", "type": "single"}, {"id": "k2r10", "stem": "The word \"records\" in Passage 2 most probably means:", "options": {"A": "A seller's past history of honest and reliable trading.", "B": "Music records sold in the market.", "C": "The weight of the goods.", "D": "The colour of the goods."}, "answer": "A", "point": "考研二·阅读A：词义猜测", "explain": "good records 与“选信誉好的卖家”语境对应，指过往交易记录/信誉。music records、weight、colour 均与语境不合。", "type": "single"}]}, {"name": "第3套 · 翻译与写作（自评，2题）", "questions": [{"id": "k2t1", "stem": "将下面一段话翻译成汉语：Learning a second language as an adult is difficult, but it is not impossible. The key is regular practice, not long hours once a week. A learner who speaks a little every day, listens to real conversations, and is not afraid of making mistakes will progress faster than one who only studies grammar rules. Mistakes, in fact, are useful signals: they show exactly where understanding is still weak.", "options": {}, "answer": "范文对照（自评）", "point": "考研二·翻译：英译汉段落翻译", "explain": "参考译文：成年人学习第二语言很难，但并非不可能。关键在于定期练习，而不是每周一次的长时间学习。每天说一点、听真实对话、不怕犯错的学习者，比只学语法规则的学习者进步更快。事实上，错误是有用的信号：它们恰恰显示了理解仍然薄弱的地方。自评清单：① regular practice / real conversations / useful signals 等关键词是否译准；② 比较结构 faster than 是否译出；③ 汉语是否通顺，无逐词硬译。缺两项以上算错，进错题本。", "type": "self"}, {"id": "k2w1", "stem": "写作：请给你的朋友写一封信，邀请他参加本周六下午的读书分享会。信中说明时间、地点、活动内容，并表达你希望他参加的心意。词数约 100 词。", "options": {}, "answer": "范文对照（自评）", "point": "考研二·写作：应用文（邀请信）", "explain": "范文要点：开头问候并说明写信目的——邀请参加读书分享会；中段说明时间（本周六下午）、地点、活动内容（分享一本喜欢的书、交流读书心得）；结尾表达期待对方参加并请对方回复。自评清单：① 格式是否含称呼、正文、落款；② 时间、地点、活动三要素是否齐全；③ 词数是否约 100 词；④ 有无主谓一致、时态错误。全部做到算对，否则进错题本重练。", "type": "self"}]}], "ncre4_net": [{"name": "第1套 · NCRE四级网络工程师客观题（10题）", "questions": [{"answer": "C", "explain": "OSI 七层中，传输层负责端到端通信与可靠传输；网络层负责路由与寻址，数据链路层负责相邻节点间传输，会话层负责会话管理。", "id": "ncre4_1", "options": {"A": "网络层", "B": "数据链路层", "C": "传输层", "D": "会话层"}, "point": "NCRE四级·网络体系结构：OSI传输层", "stem": "在 OSI 参考模型中，负责端到端可靠传输的是哪一层？", "type": "single"}, {"answer": "B", "explain": "/24 的主机位为 8 位，共 256 个地址，减去网络地址与广播地址，可用主机地址为 254 个。", "id": "ncre4_2", "options": {"A": "256 个", "B": "254 个", "C": "248 个", "D": "128 个"}, "point": "NCRE四级·IP编址：子网可用主机数", "stem": "192.168.1.0/24 这个网络中，可用的主机地址有多少个？", "type": "single"}, {"answer": "A", "explain": "TCP 建立连接采用三次握手：SYN、SYN＋ACK、ACK。两次握手不能确认双方收发能力，四次握手不是 TCP 建连过程。", "id": "ncre4_3", "options": {"A": "三次握手", "B": "两次握手", "C": "四次握手", "D": "一次握手"}, "point": "NCRE四级·TCP：三次握手", "stem": "TCP 建立连接时采用的是哪种握手过程？", "type": "single"}, {"answer": "C", "explain": "OSPF 是链路状态路由协议，路由器交换链路状态信息并计算最短路径；RIP 是距离矢量协议，BGP 是路径矢量协议，静态路由不是动态协议。", "id": "ncre4_4", "options": {"A": "RIP", "B": "BGP", "C": "OSPF", "D": "静态路由"}, "point": "NCRE四级·路由协议：OSPF", "stem": "下列哪种路由协议属于链路状态路由协议？", "type": "single"}, {"answer": "B", "explain": "交换机工作在数据链路层，依据 MAC 地址转发；路由器工作在网络层，依据 IP 地址路由；集线器工作在物理层，网关是概念性设备，不对应这一层。", "id": "ncre4_5", "options": {"A": "路由器工作在数据链路层", "B": "交换机工作在数据链路层，路由器工作在网络层", "C": "交换机工作在网络层", "D": "集线器工作在网络层"}, "point": "NCRE四级·网络设备与层次", "stem": "关于交换机与路由器工作层次的说法，正确的是哪一项？", "type": "single"}, {"answer": "C", "explain": "DNS 默认端口是 53，主要用 UDP，区域传送等少数情况用 TCP；80 是 HTTP，443 是 HTTPS，21 是 FTP。", "id": "ncre4_6", "options": {"A": "80", "B": "443", "C": "53", "D": "21"}, "point": "NCRE四级·应用层协议：DNS端口", "stem": "DNS 服务默认使用的端口号是多少？", "type": "single"}, {"answer": "B", "explain": "HTTPS 默认端口是 443，HTTP 是 80，FTP 是 21，SMTP 是 25。", "id": "ncre4_7", "options": {"A": "80", "B": "443", "C": "21", "D": "25"}, "point": "NCRE四级·应用层协议：HTTPS端口", "stem": "HTTPS 服务默认使用的端口号是多少？", "type": "single"}, {"answer": "B", "explain": "/26 的主机位为 6 位，共 64 个地址，减去网络地址与广播地址，可用主机地址为 62 个；30 是 /27 的可用数，126 是 /25 的可用数。", "id": "ncre4_8", "options": {"A": "30 个", "B": "62 个", "C": "126 个", "D": "254 个"}, "point": "NCRE四级·IP编址：/26可用主机数", "stem": "192.168.1.0/26 这个子网中，可用的主机地址有多少个？", "type": "single"}, {"answer": "C", "explain": "RSA 是非对称加密算法，用公钥加密、私钥解密；DES、AES、3DES 都是对称加密算法，收发双方用同一密钥。", "id": "ncre4_9", "options": {"A": "DES", "B": "AES", "C": "RSA", "D": "3DES"}, "point": "NCRE四级·网络安全：非对称加密", "stem": "下列哪种算法属于非对称加密算法？", "type": "single"}, {"answer": "A", "e
