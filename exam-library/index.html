lain": "对已排序数组做二分查找，每次比较后搜索区间减半，时间复杂度为 O(log n)；O(n) 是顺序查找，O(n log n) 常见于排序，O(1) 是哈希平均情况。", "id": "rk_7", "options": {"A": "O(n)", "B": "O(n log n)", "C": "O(log n)", "D": "O(1)"}, "point": "软考中级·算法：二分查找复杂度", "stem": "对已排序数组进行二分查找，其时间复杂度是多少？", "type": "single"}, {"answer": "A", "explain": "关键路径是耗时最长的路径，决定了项目的最短工期；关键路径上的活动没有浮动时间，延误会直接导致项目延期。", "id": "rk_8", "options": {"A": "关键路径是耗时最长的路径，决定项目最短工期", "B": "关键路径是耗时最短的路径", "C": "关键路径上的活动都有充足浮动时间", "D": "关键路径与项目工期无关"}, "point": "软考中级·项目管理：关键路径", "stem": "关于关键路径的说法，正确的是哪一项？", "type": "single"}, {"answer": "C", "explain": "黑盒测试不考虑程序内部结构，只根据规格说明测试功能是否符合要求；白盒测试才依据内部逻辑结构设计用例。", "id": "rk_9", "options": {"A": "黑盒测试依据内部逻辑结构设计用例", "B": "黑盒测试必须查看源代码", "C": "黑盒测试不考虑内部结构，只按规格测试功能", "D": "黑盒测试只能测试性能，不能测试功能"}, "point": "软考中级·软件测试：黑盒测试", "stem": "关于黑盒测试的说法，正确的是哪一项？", "type": "single"}, {"answer": "B", "explain": "法人作品的著作权保护期一般为首次发表后 50 年；自然人作品的保护期一般为作者终生加死后 50 年，两者不要混淆。", "id": "rk_10", "options": {"A": "法人作品保护期为作者终生加 50 年", "B": "法人作品保护期一般为首次发表后 50 年", "C": "法人作品没有保护期限制", "D": "法人作品保护期一律为 10 年"}, "point": "软考中级·知识产权：法人作品保护期", "stem": "关于法人作品著作权保护期的说法，正确的是哪一项？", "type": "single"}]}, {"name": "第2套 · 软考中级软件设计师下午案例自评（2题）", "questions": [{"answer": "范文对照（自评）", "explain": "范文要点：主要用例——读者借书、读者还书、读者查询图书、管理员管理图书与读者；主要类——读者、图书、借阅记录、管理员；关系——读者借阅图书产生借阅记录，一本图书同一时间只能被一位读者借出，管理员维护图书与读者信息。自评清单：①用例是否覆盖借、还、查、管理四类；②类是否包含读者、图书、借阅记录；③是否说清借阅记录由借书行为产生；④是否提到同一图书同一时间只能借给一人。缺两项以上算错，进错题本。", "id": "rk_case1", "options": {}, "point": "软考中级·案例分析：用例与类设计", "stem": "案例：某图书馆系统需支持读者借书、还书、查询图书，管理员管理图书与读者信息。请写出该系统的主要用例、主要类及其关系，写完对照范文自评。", "type": "self"}, {"answer": "范文对照（自评）", "explain": "范文对照：任务依赖为 A→B、A→C、B→D、C→D。路径 A-B-D 工期为 3＋2＋3＝8 天；路径 A-C-D 工期为 3＋4＋2＝9 天。关键路径为 A-C-D，总工期为 9 天。自评清单：①是否列出两条完整路径；②两条路径工期是否分别算对 8 天与 9 天；③关键路径是否写对 A-C-D；④总工期是否写对 9 天。缺一项以上算错，进错题本。", "id": "rk_case2", "options": {}, "point": "软考中级·案例分析：关键路径计算", "stem": "案例：某项目任务依赖为 A→B、A→C、B→D、C→D，工期分别为 A 3 天、B 2 天、C 4 天、D 2 天。请写出全部路径、每条路径工期、关键路径与项目总工期，写完对照范文自评。", "type": "self"}]}], "rk_mid_neteng": [{"name": "第1套 · 软考中级网络工程师上午客观题（10题）", "questions": [{"id": "rknet_1", "stem": "将 192.168.10.0/25 划分为一个子网时，可用的主机地址有多少个？", "options": {"A": "254 个", "B": "126 个", "C": "62 个", "D": "30 个"}, "answer": "B", "point": "软考中级·网络基础：子网主机数", "explain": "/25 的主机位为 7 位，共 128 个地址，减去网络地址与广播地址，可用 126 个。", "type": "single"}, {"id": "rknet_2", "stem": "关于 RIP 与 OSPF 的说法，正确的是哪一项？", "options": {"A": "RIP 是链路状态协议，OSPF 是距离矢量协议", "B": "RIP 以跳数作为度量，最大跳数为 15 跳", "C": "OSPF 以跳数作为度量，收敛速度比 RIP 慢", "D": "RIP 适用于大型网络，OSPF 只适用于小型网络"}, "answer": "B", "point": "软考中级·路由协议：RIP与OSPF", "explain": "RIP 是距离矢量协议，以跳数为度量，15 跳为最大有效跳数，16 跳表示不可达；OSPF 是链路状态协议，收敛更快，适用于较大网络。", "type": "single"}, {"id": "rknet_3", "stem": "生成树协议 STP 的主要作用是什么？", "options": {"A": "提高链路带宽", "B": "消除交换网络中的环路，防止广播风暴", "C": "实现不同网段之间的路由", "D": "为无线网络分配地址"}, "answer": "B", "point": "软考中级·局域网：生成树协议", "explain": "STP 通过阻塞冗余链路消除环路，防止广播风暴；它不提高带宽，也不做路由或地址分配。", "type": "single"}, {"id": "rknet_4", "stem": "关于 VLAN 的说法，正确的是哪一项？", "options": {"A": "同一 VLAN 内的主机必须在同一物理交换机上", "B": "VLAN 可以隔离广播域，不同 VLAN 间通信需要三层设备", "C": "VLAN 只能按端口划分，不能按 MAC 地址划分", "D": "VLAN 的主要作用是提高物理链路速率"}, "answer": "B", "point": "软考中级·局域网：VLAN", "explain": "VLAN 是逻辑分组，不受物理位置限制；不同 VLAN 属于不同广播域，互访需要路由器或三层交换机；划分方式包括端口、MAC、协议等多种。", "type": "single"}, {"id": "rknet_5", "stem": "下列哪项属于对称加密算法？", "options": {"A": "RSA", "B": "DSA", "C": "AES", "D": "ECC"}, "answer": "C", "point": "软考中级·网络安全：对称加密", "explain": "AES 是对称加密算法，收发双方用同一密钥；RSA、DSA、ECC 属于非对称加密算法。", "type": "single"}, {"id": "rknet_6", "stem": "SNMP 协议主要用于什么？", "options": {"A": "域名解析", "B": "网络设备管理与监控", "C": "文件传输", "D": "邮件收发"}, "answer": "B", "point": "软考中级·网络管理：SNMP", "explain": "SNMP 是简单网络管理协议，用于管理与监控网络设备；域名解析是 DNS，文件传输是 FTP，邮件收发是 SMTP／POP3。", "type": "single"}, {"id": "rknet_7", "stem": "IEEE 802.11 标准主要对应哪种网络？", "options": {"A": "有线局域网", "B": "无线局域网", "C": "广域网", "D": "城域网"}, "answer": "B", "point": "软考中级·无线网络：802.11", "explain": "802.11 系列是无线局域网标准；有线局域网主要是 802.3 以太网标准。", "type": "single"}, {"id": "rknet_8", "stem": "关于防火墙的说法，正确的是哪一项？", "options": {"A": "防火墙可以防范所有内部攻击", "B": "防火墙主要用于控制网络边界的访问，隔离内外网络", "C": "防火墙可以替代杀毒软件", "D": "防火墙只能过滤 IP 地址，不能过滤端口"}, "answer": "B", "point": "软考中级·网络安全：防火墙", "explain": "防火墙部署在网络边界，按规则控制进出访问；它不能防范所有内部攻击，也不能替代杀毒软件，包过滤防火墙可以按 IP 与端口过滤。", "type": "single"}, {"id": "rknet_9", "stem": "VPN 技术的主要作用是什么？", "options": {"A": "提高局域网带宽", "B": "在公共网络上建立安全的专用通信通道", "C": "替代路由器实现路由", "D": "为每台主机分配固定公网地址"}, "answer": "B", "point": "软考中级·网络安全：VPN", "explain": "VPN 通过加密隧道在公共网络上建立安全的专用通道，实现远程安全接入；它不提高带宽，也不替代路由。", "type": "single"}, {"id": "rknet_10", "stem": "在 TCP／IP 模型中，负责将 IP 地址解析为 MAC 地址的协议是哪个？", "options": {"A": "DNS", "B": "DHCP", "C": "ARP", "D": "ICMP"}, "answer": "C", "point": "软考中级·TCP／IP：ARP", "explain": "ARP 用于 IP 地址到 MAC 地址的解析；DNS 是域名到 IP，DHCP 是动态分配地址，ICMP 是控制报文协议。", "type": "single"}]}], "ncre4_db": [{"name": "第1套 · NCRE四级数据库工程师客观题（10题）", "questions": [{"id": "ncredb_1", "stem": "数据库事务的 ACID 特性中，字母 A 代表的是什么？", "options": {"A": "一致性", "B": "原子性", "C": "隔离性", "D": "持久性"}, "answer": "B", "point": "NCRE四级·数据库事务：ACID", "explain": "ACID 分别为原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）、持久性（Durability）。", "type": "single"}, {"id": "ncredb_2", "stem": "在 SQL 中，删除整张表结构（包括数据与定义）应使用哪个语句？", "options": {"A": "DELETE FROM 表名", "B": "DROP TABLE 表名", "C": "TRUNCATE TABLE 表名", "D": "UPDATE 表名"}, "answer": "B", "point": "NCRE四级·SQL：DROP与DELETE", "explain": "DROP TABLE 删除表定义与数据；DELETE 只删除数据行，保留表结构；TRUNCATE 清空数据但保留结构；UPDATE 是修改数据。", "type": "single"}, {"id": "ncredb_3", "stem": "关于范式的说法，正确的是哪一项？", "options": {"A": "满足 BCNF 的关系模式一定满足第三范式", "B": "满足第三范式的关系模式一定满足 BCNF", "C": "满足第一范式的关系模式一定满足第二范式", "D": "BCNF 与第三范式没有包含关系"}, "answer": "A", "point": "NCRE四级·数据库设计：BCNF", "explain": "BCNF 比第三范式更严格，满足 BCNF 一定满足第三范式；满足第三范式不一定满足 BCNF，因为 BCNF 要求每个决定因素都是候选键。", "type": "single"}, {"id": "ncredb_4", "stem": "关系代数中，选择运算与投影运算的符号分别是哪一组？", "options": {"A": "选择 σ，投影 π", "B": "选择 π，投影 σ", "C": "选择 ⋈，投影 σ", "D": "选择 σ，投影 ⋈"}, "answer": "A", "point": "NCRE四级·关系代数：选择与投影", "explain": "σ 表示选择（按条件选行），π 表示投影（选列），⋈ 表示连接。", "type": "single"}, {"id": "ncredb_5", "stem": "在并发控制中，“丢失更新”是指什么现象？", "options": {"A": "两个事务读到同一数据后各自更新，后提交的覆盖了先提交的更新", "B": "一个事务读到了另一个事务未提交的数据", "C": "一个事务读到了另一个事务已提交的旧数据", "D": "两个事务互相等待对方释放锁"}, "answer": "A", "point": "NCRE四级·并发控制：丢失更新", "explain": "丢失更新是两个事务对同一数据更新时，后者覆盖前者；读未提交数据是脏读，互相等待是死锁。", "type": "single"}, {"id": "ncredb_6", "stem": "关于聚集索引的说法，正确的是哪一项？", "options": {"A": "聚集索引的叶节点存放的是数据行本身，数据按索引键顺序存放", "B": "聚集索引的叶节点只存放键值与指针", "C": "一张表可以有多个聚集索引", "D": "聚集索引与数据存放顺序无关"}, "answer": "A", "point": "NCRE四级·索引：聚集索引", "explain": "聚集索引决定数据行的物理存放顺序，叶节点就是数据行本身，一张表最多只能有一个聚集索引；只存键值与指针的是非聚集索引。", "type": "single"}, {"id": "ncredb_7", "stem": "E-R 图中，实体与实体之间的“一对多”联系通常记为什么？", "options": {"A": "1:1", "B": "1:N", "C": "M:N", "D": "N:1 且只能反向表示"}, "answer": "B", "point": "NCRE四级·E-R图：联系类型", "explain": "一对多记为 1:N；一对一为 1:1，多对多为 M:N。", "type": "single"}, {"id": "ncredb_8", "stem": "数据库恢复中，检查点（Checkpoint）的主要作用是什么？", "options": {"A": "删除所有日志", "B": "缩短恢复时需要扫描的日志量，加快恢复", "C": "阻止所有事务提交", "D": "将数据库改为只读"}, "answer": "B", "point": "NCRE四级·数据库恢复：检查点", "explain": "检查点定期将内存数据写入磁盘并记录位置，恢复时只需从最近检查点开始扫描日志，从而加快恢复；它不删除日志，也不阻止提交。", "type": "single"}, {"id": "ncredb_9", "stem": "关于数据仓库的说法，正确的是哪一项？", "options": {"A": "数据仓库是面向事务处理的，数据频繁更新", "B": "数据仓库是面向主题、集成、相对稳定、随时间变化的数据集合", "C": "数据仓库与操作型数据库完全相同", "D": "数据仓库中的数据不随时间变化"}, "answer": "B", "point": "NCRE四级·数据仓库：基本特征", "explain": "数据仓库面向主题、集成、相对稳定、随时间变化，用于分析决策；操作型数据库面向事务处理，数据频繁更新。", "type": "single"}, {"id": "ncredb_10", "stem": "在数据库系统中，触发器是一种什么机制？", "options": {"A": "由用户手动调用的存储过程", "B": "在特定数据操作发生时自动执行的特殊存储过程", "C": "用于备份数据库的工具", "D": "用于创建索引的语句"}, "answer": "B", "point": "NCRE四级·触发器", "explain": "触发器在 INSERT、UPDATE、DELETE 等事件发生时自动执行，不需要用户手动调用；它不是备份工具，也不是索引语句。", "type": "single"}]}], "ncre4_sec": [{"name": "第1套 · NCRE四级信息安全工程师客观题（10题）", "questions": [{"id": "ncre4sec_1", "stem": "下列哪项属于对称加密算法？", "options": {"A": "RSA", "B": "AES", "C": "DSA", "D": "ECC"}, "answer": "B", "point": "NCRE四级·信息安全：对称加密", "explain": "AES 是对称加密算法，收发双方用同一密钥；RSA、DSA、ECC 属于非对称加密。", "type": "single"}, {"id": "ncre4sec_2", "stem": "数字签名的主要作用是什么？", "options": {"A": "对数据加密防止窃听", "B": "验证发送者身份并保证数据未被篡改", "C": "提高网络传输速度", "D": "压缩数据体积"}, "answer": "B", "point": "NCRE四级·信息安全：数字签名", "explain": "数字签名用发送者私钥签名、接收者公钥验证，解决身份认证与完整性问题；它本身不负责保密传输。", "type": "single"}, {"id": "ncre4sec_3", "stem": "关于哈希函数（散列）的说法，正确的是哪一项？", "options": {"A": "哈希值长度随输入长度成比例增长", "B": "同一输入的哈希值每次计算都不同", "C": "哈希是单向的，难以从哈希值还原原始数据", "D": "哈希可以替代加密实现保密"}, "answer": "C", "point": "NCRE四级·信息安全：哈希函数", "explain": "哈希函数输出定长摘要，具有单向性与抗碰撞性；它用于完整性校验，不能替代加密实现保密。", "type": "single"}, {"id": "ncre4sec_4", "stem": "入侵检测系统（IDS）与入侵防御系统（IPS）的主要区别是什么？", "options": {"A": "IDS 只检测不阻断，IPS 可以主动阻断可疑流量", "B": "IDS 只能检测病毒，IPS 只能检测木马", "C": "IDS 部署在边界，IPS 只能部署在内网", "D": "两者功能完全相同，只是名称不同"}, "answer": "A", "point": "NCRE四级·信息安全：IDS与IPS", "explain": "IDS 以检测报警为主，一般不阻断流量；IPS 串联在流量路径上，可以丢弃或阻断可疑流量。", "type": "single"}, {"id": "ncre4sec_5", "stem": "下列哪种攻击属于社会工程学攻击？", "options": {"A": "SQL 注入", "B": "钓鱼邮件诱骗用户交出账号密码", "C": "DDoS 攻击", "D": "缓冲区溢出"}, "answer": "B", "point": "NCRE四级·信息安全：社会工程学", "explain": "社会工程学利用人的心理弱点骗取信息，钓鱼邮件是典型；SQL 注入、DDoS、缓冲区溢出属于技术型攻击。", "type": "single"}, {"id": "ncre4sec_6", "stem": "访问控制模型中，基于角色的访问控制简称为？", "options": {"A": "DAC", "B": "MAC", "C": "RBAC", "D": "ABAC"}, "answer": "C", "point": "NCRE四级·信息安全：访问控制", "explain": "RBAC 是基于角色的访问控制；DAC 是自主访问控制，MAC 是强制访问控制，ABAC 是基于属性的访问控制。", "type": "single"}, {"id": "ncre4sec_7", "stem": "下列哪项不是计算机病毒的常见特征？", "options": {"A": "传染性", "B": "潜伏性", "C": "可触发性", "D": "可公开审计性"}, "answer": "D", "point": "NCRE四级·信息安全：病毒特征", "explain": "病毒常见特征包括传染性、潜伏性、破坏性、可触发性等；可公开审计性不是病毒特征。", "type": "single"}, {"id": "ncre4sec_8", "stem": "SSL／TLS 协议主要工作在哪一层？", "options": {"A": "网络层", "B": "传输层与应用层之间（会话层附近）", "C": "数据链路层", "D": "物理层"}, "answer": "B", "point": "NCRE四级·信息安全：SSL／TLS", "explain": "SSL／TLS 位于传输层之上、应用层之下，为应用数据提供加密与认证，常见说法是工作在传输层与应用层之间。", "type": "single"}, {"id": "ncre4sec_9", "stem": "关于数字证书的说法，正确的是哪一项？", "options": {"A": "数字证书由用户自己签发即具有公信力", "B": "数字证书将公钥与持有者身份绑定，由 CA 签发", "C": "数字证书只能用于加密，不能用于身份认证", "D": "数字证书的有效期是永久的"}, "answer": "B", "point": "NCRE四级·信息安全：数字证书与CA", "explain": "数字证书由可信的证书颁发机构 CA 签发，把公钥与身份绑定，用于身份认证与密钥分发；证书有有效期。", "type": "single"}, {"id": "ncre4sec_10", "stem": "下列哪项是防范 DDoS 攻击的合理措施？", "options": {"A": "关闭所有网络服务", "B": "流量清洗与带宽扩容结合，配合访问限速", "C": "把服务器密码设得更长", "D": "只允许内网用户访问，不再对外提供服务"}, "answer": "B", "point": "NCRE四级·信息安全：DDoS防范", "explain": "DDoS 靠海量流量压垮服务，合理做法是流量清洗、扩容与限速结合；单纯改密码或关服务不能解决流量攻击。", "type": "single"}]}], "ncre4_embed": [{"name": "第1套 · NCRE四级嵌入式系统开发工程师客观题（10题）", "questions": [{"id": "ncre4emb_1", "stem": "嵌入式系统最典型的特征是什么？", "options": {"A": "通用性强，可运行任意大型软件", "B": "专用性强，软硬件结合，资源受限", "C": "必须有大容量硬盘", "D": "必须联网运行"}, "answer": "B", "point": "NCRE四级·嵌入式基础：系统特征", "explain": "嵌入式系统面向特定应用，软硬件紧密结合，处理器、内存、功耗都受限；它不是通用计算机。", "type": "single"}, {"id": "ncre4emb_2", "stem": "关于实时操作系统（RTOS）的说法，正确的是哪一项？", "options": {"A": "RTOS 的首要目标是任务在规定时间内完成", "B": "RTOS 的首要目标是运行速度最快", "C": "RTOS 不能用于中断处理", "D": "RTOS 与通用操作系统没有区别"}, "answer": "A", "point": "NCRE四级·嵌入式：RTOS", "explain": "RTOS 强调确定性与时限性，任务要在截止时间前完成；速度快不等于实时，通用系统不保证时限。", "type": "single"}, {"id": "ncre4emb_3", "stem": "ARM 处理器中，RISC 架构的主要特点是什么？", "options": {"A": "指令复杂，单条指令完成多步操作", "B": "指令简单规整，执行效率高，功耗较低", "C": "只能用于服务器", "D": "不适合嵌入式应用"}, "answer": "B", "point": "NCRE四级·嵌入式：ARM与RISC", "explain": "RISC 指令简单规整，利于流水线与低功耗，这正是 ARM 在嵌入式领域广泛应用的原因。", "type": "single"}, {"id": "ncre4emb_4", "stem": "在嵌入式系统中，Flash 存储器常用于什么？", "options": {"A": "存放运行时的临时变量", "B": "存放程序代码与掉电不丢失的数据", "C": "替代 CPU 进行计算", "D": "存放显示缓存"}, "answer": "B", "point": "NCRE四级·嵌入式：存储器", "explain": "Flash 是非易失存储器，掉电后数据不丢失，常存程序与配置；运行时临时变量放在 RAM 里。", "type": "single"}, {"id": "ncre4emb_5", "stem": "中断处理中，保存现场的主要目的是什么？", "options": {"A": "提高 CPU 主频", "B": "中断返回后能恢复被打断程序的执行状态", "C": "减少内存占用", "D": "关闭所有外设"}, "answer": "B", "point": "NCRE四级·嵌入式：中断", "explain": "中断会打断当前程序，保存寄存器等现场是为了中断处理完后能准确恢复原程序继续执行。", "type": "single"}, {"id": "ncre4emb_6", "stem": "GPIO 的全称含义最接近哪一项？", "options": {"A": "图形处理输出接口", "B": "通用输入输出接口", "C": "高速串行总线", "D": "电源管理模块"}, "answer": "B", "point": "NCRE四级·嵌入式：GPIO", "explain": "GPIO 是 General Purpose Input/Output，即通用输入输出接口，可由软件配置为输入或输出。", "type": "single"}, {"id": "ncre4emb_7", "stem": "关于看门狗（Watchdog）的作用，正确的是哪一项？", "options": {"A": "防止程序跑飞，超时未喂狗则复位系统", "B": "监控网络流量", "C": "加密通信数据", "D": "管理文件系统"}, "answer": "A", "point": "NCRE四级·嵌入式：看门狗", "explain": "看门狗定时器需要程序定期“喂狗”，超时未喂说明程序可能跑飞或死机，看门狗会复位系统恢复运行。", "type": "single"}, {"id": "ncre4emb_8", "stem": "I2C 总线最显著的特点是什么？", "options": {"A": "需要很多根信号线", "B": "只需两根线（时钟与数据），可挂多个设备", "C": "只能一对一通信", "D": "传输距离可达数公里"}, "answer": "B", "point": "NCRE四级·嵌入式：I2C总线", "explain": "I2C 只用 SCL 时钟线与 SDA 数据线，通过地址区分多个从设备，适合板内短距离低速通信。", "type": "single"}, {"id": "ncre4emb_9", "stem": "嵌入式开发中，交叉编译是指什么？", "options": {"A": "在目标板上直接编译程序", "B": "在宿主机上为不同架构的目标机编译程序", "C": "同时编译两个版本的程序", "D": "用两种语言混合编写程序"}, "answer": "B", "point": "NCRE四级·嵌入式：交叉编译", "explain": "嵌入式目标机资源有限，常在性能更强的宿主机上，用交叉编译器生成目标机架构的可执行程序。", "type": "single"}, {"id": "ncre4emb_10", "stem": "下列哪项是降低嵌入式系统功耗的合理做法？", "options": {"A": "让 CPU 始终满频运行", "B": "空闲时进入低功耗模式，按需调整主频", "C": "关闭所有中断", "D": "增大供电电压"}, "answer": "B", "point": "NCRE四级·嵌入式：低功耗设计", "explain": "低功耗设计常用空闲休眠、动态调频调压等方法；始终满频、增大电压都会增加功耗。", "type": "single"}]}], "rk_mid_supervisor": [{"name": "第1套 · 软考中级信息系统监理师上午客观题（10题）", "questions": [{"id": "rksup_1", "stem": "信息系统工程监理中，“三控”通常指什么？", "options": {"A": "质量控制、进度控制、投资控制", "B": "人员控制、设备控制、材料控制", "C": "需求控制、设计控制、测试控制", "D": "安全控制、保密控制、风险控制"}, "answer": "A", "point": "软考中级·监理：三控", "explain": "监理的“三控”即质量控制、进度控制、投资控制；“三管一协调”中的三管是合同管理、信息管理、安全管理，协调是组织协调。", "type": "single"}, {"id": "rksup_2", "stem": "监理规划一般由谁编制，并经谁批准后实施？", "options": {"A": "承建单位编制，建设单位批准", "B": "总监理工程师编制，监理单位技术负责人批准", "C": "建设单位编制，承建单位批准", "D": "监理员编制，总监理工程师批准"}, "answer": "B", "point": "软考中级·监理：监理规划", "explain": "监理规划由总监理工程师主持编制，经监理单位技术负责人批准后实施，是监理工作的指导性文件。", "type": "single"}, {"id": "rksup_3", "stem": "旁站监理主要适用于什么情形？", "options": {"A": "所有会议", "B": "关键部位、关键工序的施工或实施过程", "C": "文档编写", "D": "设备采购谈判"}, "answer": "B", "point": "软考中级·监理：旁站", "explain": "旁站是在关键部位、关键工序实施过程中，监理人员在现场跟班监督检查，出现问题及时处理。", "type": "single"}, {"id": "rksup_4", "stem": "关于监理单位与建设单位、承建单位关系的说法，正确的是哪一项？", "options": {"A": "监理单位是建设单位的下属部门", "B": "监理单位受建设单位委托，独立、公正地开展监理，与承建单位没有隶属关系", "C": "监理单位受承建单位领导", "D": "监理单位可以同时承接同一项目的建设任务"}, "answer": "B", "point": "软考中级·监理：独立公正", "explain": "监理单位受建设单位委托，依法独立、公正执业；它与承建单位没有隶属关系，也不得同时承担同一项目的建设任务以免利益冲突。", "type": "single"}, {"id": "rksup_5", "stem": "工程变更控制中，变更申请一般首先由谁提出并经监理审核？", "options": {"A": "只能由建设单位提出", "B": "建设、承建或监理任一方均可提出，按程序经监理审核、建设单位批准", "C": "只能由监理单位提出", "D": "变更不需要任何审批"}, "answer": "B", "point": "软考中级·监理：变更控制", "explain": "变更可由多方提出，但必须按程序经监理审核和建设单位批准后才能实施，未经批准不得擅自变更。", "type": "single"}, {"id": "rksup_6", "stem": "监理日志的主要作用是什么？", "options": {"A": "记录监理人员考勤", "B": "真实记录工程实施过程，为验收和争议处理提供依据", "C": "代替竣工报告", "D": "记录设备价格"}, "answer": "B", "point": "软考中级·监理：监理日志", "explain": "监理日志按日记录施工、检查、问题与处理情况，是工程过程的真实记录，也是验收和争议处理的重要依据。", "type": "single"}, {"id": "rksup_7", "stem": "在质量控制中，隐蔽工程在覆盖前必须经过什么程序？", "options": {"A": "承建单位自行覆盖即可", "B": "报监理检查验收合格后方可覆盖", "C": "只需拍照留存", "D": "等到竣工时再检查"}, "answer": "B", "point": "软考中级·监理：隐蔽工程验收", "explain": "隐蔽工程覆盖前必须报监理检查验收，合格后才能进入下一道工序，否则事后难以检查，质量责任不清。", "type": "single"}, {"id": "rksup_8", "stem": "下列哪项属于监理的合同管理工作？", "options": {"A": "编写用户手册", "B": "协助建设单位处理合同争议，监督合同履行", "C": "开发应用软件", "D": "采购办公设备"}, "answer": "B", "point": "软考中级·监理：合同管理", "explain": "合同管理包括监督合同履行、处理变更与索赔、协助解决合同争议等；开发软件、编写用户手册是承建单位的工作。", "type": "single"}, {"id": "rksup_9", "stem": "监理实施细则与监理规划的关系是？", "options": {"A": "实施细则是规划的细化，针对专业或分项工程编制", "B": "两者完全相同", "C": "实施细则可以替代规划", "D": "规划是实施细则的附件"}, "answer": "A", "point": "软考中级·监理：实施细则", "explain": "监理规划是总体指导文件，实施细则是针对某一专业或分项工程的操作性细化文件，两者是总体与具体的关系。", "type": "single"}, {"id": "rksup_10", "stem": "工程验收时，监理单位的主要职责是什么？", "options": {"A": "代替建设单位签字接收", "B": "对工程质量进行评估，提出监理评估意见", "C": "负责工程的后期运维", "D": "编制决算报告"}, "answer": "B", "point": "软考中级·监理：验收评估", "explain": "验收时监理单位应对工程质量作出评估并出具意见，供建设单位组织验收参考；接收与运维、决算不是监理单位的职责。", "type": "single"}]}], "rk_mid_integration": [{"name": "第1套 · 软考中级系统集成项目管理工程师上午客观题（10题）", "questions": [{"id": "rkint_1", "stem": "项目管理中，范围基准不包括哪一项？", "options": {"A": "范围说明书", "B": "工作分解结构（WBS）", "C": "WBS 词典", "D": "项目章程"}, "answer": "D", "point": "软考中级·集成管理：范围基准", "explain": "范围基准由范围说明书、WBS 和 WBS 词典组成；项目章程是项目启动的授权文件，不属于范围基准。", "type": "single"}, {"id": "rkint_2", "stem": "挣值管理中，成本绩效指数 CPI 的计算公式是？", "options": {"A": "CPI = EV / AC", "B": "CPI = EV / PV", "C": "CPI = AC / EV", "D": "CPI = PV / EV"}, "answer": "A", "point": "软考中级·集成管理：挣值", "explain": "CPI = 挣值 EV / 实际成本 AC，CPI 大于 1 表示成本节约，小于 1 表示成本超支；EV / PV 是进度绩效指数 SPI。", "type": "single"}, {"id": "rkint_3", "stem": "某项目 EV = 80 万元，AC = 100 万元，PV = 90 万元，则该项目处于什么状态？", "options": {"A": "进度超前、成本节约", "B": "进度落后、成本超支", "C": "进度超前、成本超支", "D": "进度落后、成本节约"}, "answer": "B", "point": "软考中级·集成管理：挣值判断", "explain": "SPI = EV / PV = 80 / 90 < 1，进度落后；CPI = EV / AC = 80 / 100 < 1，成本超支。", "type": "single"}, {"id": "rkint_4", "stem": "关键路径法中，活动的总时差是指？", "options": {"A": "活动的最早开始与最晚开始之差", "B": "活动的持续时间", "C": "活动的最早完成时间", "D": "项目总工期的一半"}, "answer": "A", "point": "软考中级·集成管理：关键路径", "explain": "总时差 = 最晚开始 - 最早开始（也等于最晚完成 - 最早完成），关键路径上活动的总时差为零。", "type": "single"}, {"id": "rkint_5", "stem": "风险管理中，针对高概率、高影响的风险，通常优先采取的策略是？", "options": {"A": "接受", "B": "回避或减轻", "C": "转移给保险公司即可", "D": "不采取任何措施"}, "answer": "B", "point": "软考中级·集成管理：风险应对", "explain": "高概率高影响的风险应优先回避或减轻，降低其发生概率或影响；接受只适用于低风险，转移并不能消除风险本身。", "type": "single"}, {"id": "rkint_6", "stem": "关于项目干系人的说法，正确的是哪一项？", "options": {"A": "干系人只包括项目团队成员", "B": "干系人包括所有受项目影响或能影响项目的人和组织", "C": "干系人只在项目启动时识别一次", "D": "干系人管理不需要沟通"}, "answer": "B", "point": "软考中级·集成管理：干系人", "explain": "干系人范围很广，包括客户、用户、团队、供应商、监管方等，且需在项目全过程持续识别和管理，沟通是核心手段。", "type": "single"}, {"id": "rkint_7", "stem": "质量管理中，帕累托图主要用于什么？", "options": {"A": "显示工序随时间的变化", "B": "找出造成大多数问题的主要原因", "C": "判断过程是否受控", "D": "表示两个变量的相关性"}, "answer": "B", "point": "软考中级·集成管理：质量工具", "explain": "帕累托图按原因频率排序，体现“少数原因造成多数问题”，用于抓住主要矛盾；控制图用于判断过程受控，散点图用于相关性。", "type": "single"}, {"id": "rkint_8", "stem": "采购管理中，固定总价合同对买方的主要风险是什么？", "options": {"A": "卖方成本超支全部由买方承担", "B": "范围不清时卖方可能以变更索赔，买方仍需承担范围变更成本", "C": "买方无法控制质量", "D": "合同价格会随市场自动调整"}, "answer": "B", "point": "软考中级·集成管理：采购合同", "explain": "固定总价合同下卖方承担成本风险，但如果范围定义不清，卖方会通过变更索赔，买方仍要为范围变更买单；价格本身不自动调整。", "type": "single"}, {"id": "rkint_9", "stem": "项目整体管理中，实施整体变更控制的主要作用是什么？", "options": {"A": "拒绝一切变更", "B": "审查、批准或否决变更请求，并管理变更对各方面的影响", "C": "只记录变更，不做审批", "D": "把变更全部交给客户决定"}, "answer": "B", "point": "软考中级·集成管理：整体变更控制", "explain": "整体变更控制是审查所有变更请求、批准或否决，并协调变更对范围、进度、成本、质量等各方面的影响，不是拒绝一切变更。", "type": "single"}, {"id": "rkint_10", "stem": "沟通管理中，沟通渠道数量的计算公式是？", "options": {"A": "n × (n - 1)", "B": "n × (n - 1) / 2", "C": "n + 1", "D": "2n"}, "answer": "B", "point": "软考中级·集成管理：沟通渠道", "explain": "n 个人之间的沟通渠道数为 n(n-1)/2；例如 10 人时为 45 条。", "type": "single"}]}], "rk_mid_sysmgmt": [{"name": "第1套 · 软考中级信息系统管理工程师上午客观题（10题）", "questions": [{"id": "rksys_1", "stem": "IT 服务管理中，ITIL 的核心思想最接近哪一项？", "options": {"A": "以技术为中心，越先进越好", "B": "以客户需求为中心，用流程化方法提供高质量 IT 服务", "C": "只管硬件维修", "D": "不需要任何流程"}, "answer": "B", "point": "软考中级·系统管理：ITIL", "explain": "ITIL 是 IT 服务管理最佳实践框架，强调以客户和服务为中心，通过规范流程持续提供符合业务需求的服务。", "type": "single"}, {"id": "rksys_2", "stem": "信息系统运行维护中，事件管理与问题管理的区别是？", "options": {"A": "事件管理解决根本原因，问题管理恢复服务", "B": "事件管理尽快恢复服务，问题管理找出并消除根本原因", "C": "两者完全相同", "D": "事件管理只处理硬件故障"}, "answer": "B", "point": "软考中级·系统管理：事件与问题", "explain": "事件管理目标是尽快恢复正常服务，减少影响；问题管理目标是找出事件的根本原因并消除，防止重复发生。", "type": "single"}, {"id": "rksys_3", "stem": "系统性能管理中，系统响应时间通常指什么？", "options": {"A": "CPU 主频", "B": "用户发出请求到收到结果的时间", "C": "硬盘容量", "D": "网络带宽"}, "answer": "B", "point": "软考中级·系统管理：性能指标", "explain": "响应时间是用户视角的指标，即从发出请求到得到结果的时间；主频、容量、带宽是影响因素，不是响应时间本身。", "type": "single"}, {"id": "rksys_4", "stem": "关于系统备份策略，增量备份与差异备份的区别是？", "options": {"A": "增量备份备份自上次任何备份以来的变化，差异备份备份自上次完全备份以来的变化", "B": "两者完全相同", "C": "增量备份每次都备份全部数据", "D": "差异备份备份速度最快、恢复最慢"}, "answer": "A", "point": "软考中级·系统管理：备份策略", "explain": "增量备份只备自上次备份（完全或增量）以来的变化，备份快但恢复需多份；差异备份备自上次完全备份以来的变化，恢复只需完全加一份差异。", "type": "single"}, {"id": "rksys_5", "stem": "信息系统安全管理中，访问控制的首要原则是什么？", "options": {"A": "默认允许，事后审计", "B": "最小权限原则：只给完成工作必需的权限", "C": "所有人都有管理员权限", "D": "权限越大越安全"}, "answer": "B", "point": "软考中级·系统管理：最小权限", "explain": "最小权限原则要求每个用户和程序只获得完成任务必需的最小权限，以减少误操作和越权带来的损失。", "type": "single"}, {"id": "rksys_6", "stem": "系统故障处理中，故障恢复后首先应该做什么？", "options": {"A": "立即删除故障记录", "B": "确认服务恢复正常，并记录故障原因与处理过程", "C": "更换所有设备", "D": "通知所有用户故障已不存在即可"}, "answer": "B", "point": "软考中级·系统管理：故障处理", "explain": "恢复后要先验证服务确实正常，再完整记录故障现象、原因与处理过程，为问题管理和预防复发提供依据。", "type": "single"}, {"id": "rksys_7", "stem": "关于信息系统资产管理，正确的做法是？", "options": {"A": "只登记硬件，不登记软件", "B": "对软硬件资产登记造册，明确责任人，定期盘点", "C": "资产可以随意调拨，不需记录", "D": "报废资产不需要审批"}, "answer": "B", "point": "软考中级·系统管理：资产管理", "explain": "资产管理要覆盖软硬件，登记造册、明确责任人、定期盘点，调拨与报废都要按流程审批和记录。", "type": "single"}, {"id": "rksys_8", "stem": "系统运行维护的服务级别协议（SLA）主要约定什么？", "options": {"A": "服务提供方与客户之间的服务内容、指标与责任", "B": "员工工资标准", "C": "设备采购价格", "D": "软件源代码归属"}, "answer": "A", "point": "软考中级·系统管理：SLA", "explain": "SLA 是服务提供方与客户之间的协议，约定服务内容、可用性、响应时间等指标及双方责任，是衡量服务质量的依据。", "type": "single"}, {"id": "rksys_9", "stem": "在系统变更管理中，变更实施前必须经过什么？", "options": {"A": "直接实施，事后补手续", "B": "变更申请、评估影响、审批通过后，按计划实施并验证", "C": "只需口头通知", "D": "变更不需要回退方案"}, "answer": "B", "point": "软考中级·系统管理：变更管理", "explain": "正规变更流程是申请、影响评估、审批、按计划实施、验证效果，并准备回退方案；先实施后补手续是违规操作。", "type": "single"}, {"id": "rksys_10", "stem": "关于系统文档管理，正确的做法是？", "options": {"A": "文档只在项目结束时补写", "B": "文档随系统同步更新，版本受控，便于交接和运维", "C": "文档越少越好", "D": "文档可以不与实际系统一致"}, "answer": "B", "point": "软考中级·系统管理：文档管理", "explain": "系统文档要随系统变化同步更新并做版本控制，否则交接和运维时无据可依；事后补写、与实际不符都会埋下隐患。", "type": "single"}]}], "rk_mid_infosec": [{"name": "第1套 · 软考中级信息安全工程师上午客观题（10题）", "questions": [{"id": "rksec_1", "stem": "包过滤防火墙主要依据什么来决定是否放行数据包？", "options": {"A": "数据包的内容语义", "B": "源/目的 IP、端口和协议类型等包头信息", "C": "用户的口令强度", "D": "网站的美观程度"}, "answer": "B", "point": "软考中级·信息安全：包过滤防火墙", "explain": "包过滤防火墙工作在网络层，按包头中的地址、端口、协议等规则过滤，不解析应用层语义。", "type": "single"}, {"id": "rksec_2", "stem": "数字信封技术结合了哪两种加密方式的优点？", "options": {"A": "只用对称加密", "B": "只用非对称加密", "C": "用非对称加密保护对称密钥，用对称加密加密数据", "D": "不用任何加密"}, "answer": "C", "point": "软考中级·信息安全：数字信封", "explain": "数字信封先用对称密钥加密数据，再用接收方公钥加密对称密钥，兼顾速度与密钥分发安全。", "type": "single"}, {"id": "rksec_3", "stem": "关于密钥管理，正确的做法是？", "options": {"A": "密钥长期不变最安全", "B": "密钥应定期更换，作废密钥及时销毁，密钥与密文分开保管", "C": "密钥可以写在代码里公开", "D": "所有用户共用一个密钥最方便"}, "answer": "B", "point": "软考中级·信息安全：密钥管理", "explain": "密钥管理要求定期更换、及时作废销毁、分开保管；长期不变、写进代码、共用密钥都会放大泄露风险。", "type": "single"}, {"id": "rksec_4", "stem": "信息安全风险评估的一般顺序是？", "options": {"A": "先定风险等级，再识别资产", "B": "资产识别、威胁识别、脆弱性识别、风险分析与评价", "C": "先买设备，再评估", "D": "只评估技术漏洞，不评估管理漏洞"}, "answer": "B", "point": "软考中级·信息安全：风险评估", "explain": "风险评估先识别资产与价值，再识别威胁与脆弱性，最后分析风险并评价等级；技术与管理漏洞都要评估。", "type": "single"}, {"id": "rksec_5", "stem": "安全审计的主要作用是什么？", "options": {"A": "提高网速", "B": "记录和审查系统活动，发现违规与异常，为追责提供证据", "C": "加密所有数据", "D": "替代备份"}, "answer": "B", "point": "软考中级·信息安全：安全审计", "explain": "审计通过记录用户操作、系统事件等，发现违规与异常并留存证据；它不直接提高网速或加密数据。", "type": "single"}, {"id": "rksec_6", "stem": "下列哪项属于物理安全范畴？", "options": {"A": "口令策略", "B": "机房门禁、防火防水、防电磁干扰", "C": "入侵检测规则", "D": "病毒库更新"}, "answer": "B", "point": "软考中级·信息安全：物理安全", "explain": "物理安全保护设备与环境，包括门禁、防火、防水、防雷、防电磁干扰等；口令、检测规则、病毒库属于逻辑与技术安全。", "type": "single"}, {"id": "rksec_7", "stem": "在访问控制中，强制访问控制（MAC）的特点是？", "options": {"A": "资源所有者自行决定授权", "B": "由系统按安全级别强制决定访问，个人不能随意更改", "C": "按角色分配权限", "D": "不需要任何标识"}, "answer": "B", "point": "软考中级·信息安全：MAC", "explain": "MAC 由系统根据主体与客体的安全级别强制执行，个人不能自行授权；自主访问控制（DAC）才由所有者决定。", "type": "single"}, {"id": "rksec_8", "stem": "关于网络安全等级保护，等级越高意味着？", "options": {"A": "保护要求越低", "B": "遭到破坏后对国家、社会、个人的危害越大，保护要求越高", "C": "只需要技术措施", "D": "与业务重要性无关"}, "answer": "B", "point": "软考中级·信息安全：等级保护", "explain": "等级保护按系统遭到破坏后的危害程度定级，等级越高，危害越大，技术与管理保护要求也越高。", "type": "single"}, {"id": "rksec_9", "stem": "下列哪种行为属于拒绝服务攻击的特征？", "options": {"A": "窃取用户密码", "B": "用大量请求耗尽目标资源，使正常用户无法获得服务", "C": "篡改网页文字", "D": "冒充他人身份登录"}, "answer": "B", "point": "软考中级·信息安全：拒绝服务", "explain": "拒绝服务攻击的核心是耗尽带宽、连接或计算资源，导致正常服务不可用；窃取、篡改、冒充属于其他类型攻击。", "type": "single"}, {"id": "rksec_10", "stem": "数据备份与容灾的区别最接近哪一项？", "options": {"A": "备份是事后恢复数据，容灾是在异地建立可接管业务的系统", "B": "两者完全相同", "C": "容灾不需要备份", "D": "备份只能在本地做"}, "answer": "A", "point": "软考中级·信息安全：备份与容灾", "explain": "备份侧重把数据复制保存以便恢复；容灾侧重在灾难时异地系统能快速接管业务，保证业务连续性。", "type": "single"}]}], "rk_mid_dbeng": [{"name": "第1套 · 软考中级数据库系统工程师上午客观题（10题）", "questions": [{"id": "rkdb_1", "stem": "关系数据库中，候选键的定义最接近哪一项？", "options": {"A": "唯一能标识元组的属性或属性组，且其真子集不能标识元组", "B": "任意一个属性", "C": "只能是单个属性", "D": "必须包含所有属性"}, "answer": "A", "point": "软考中级·数据库：候选键", "explain": "候选键是能唯一标识元组的最小属性组：能标识，且去掉任何一个属性就不能标识；一个关系可以有多个候选键。", "type": "single"}, {"id": "rkdb_2", "stem": "视图的主要优点不包括哪一项？", "options": {"A": "简化复杂查询", "B": "提供数据安全性与逻辑独立性", "C": "视图中数据是独立存储的副本", "D": "按用户需求定制数据呈现"}, "answer": "C", "point": "软考中级·数据库：视图", "explain": "视图是虚表，本身不独立存储数据，查询时从基表导出；它的优点是简化查询、保护数据、提供逻辑独立性。", "type": "single"}, {"id": "rkdb_3", "stem": "在 SQL 中，定义外键约束的关键字是？", "options": {"A": "PRIMARY KEY", "B": "FOREIGN KEY", "C": "UNIQUE", "D": "CHECK"}, "answer": "B", "point": "软考中级·数据库：SQL约束", "explain": "FOREIGN KEY 定义外键，保证参照完整性；PRIMARY KEY 是主键，UNIQUE 是唯一，CHECK 是检查约束。", "type": "single"}, {"id": "rkdb_4", "stem": "两段锁协议要求事务的加锁与解锁阶段满足什么？", "options": {"A": "可以随时加锁和解锁", "B": "加锁阶段不能解锁，解锁阶段不能再加锁", "C": "只能加读锁", "D": "只能加写锁"}, "answer": "B", "point": "软考中级·数据库：两段锁", "explain": "两段锁协议把事务分为增长阶段（只加锁）和收缩阶段（只解锁），满足该协议的并发调度是可串行化的。", "type": "single"}, {"id": "rkdb_5", "stem": "死锁预防中，一次封锁法的缺点是什么？", "options": {"A": "会产生死锁", "B": "事务开始时要一次加全部锁，降低了并发度", "C": "不能保证可串行化", "D": "只能用于读操作"}, "answer": "B", "point": "软考中级·数据库：死锁预防", "explain": "一次封锁法要求事务开始就申请全部锁，避免了死锁，但锁持有时间长、并发度低，资源利用率不高。", "type": "single"}, {"id": "rkdb_6", "stem": "数据库恢复中，日志先写原则（WAL）是指？", "options": {"A": "先写数据，再写日志", "B": "对数据的修改必须先写入日志，日志写入磁盘后才能写数据", "C": "日志可以不写入磁盘", "D": "只记录成功的事务"}, "answer": "B", "point": "软考中级·数据库：WAL", "explain": "WAL 要求修改数据前先把日志写入磁盘，这样崩溃后才能用日志重做或撤销，保证恢复的正确性。", "type": "single"}, {"id": "rkdb_7", "stem": "函数依赖中，若 X 决定 Y，且 Y 的真子集也能被 X 决定，则称为什么？", "options": {"A": "完全函数依赖", "B": "部分函数依赖", "C": "传递函数依赖", "D": "多值依赖"}, "answer": "B", "point": "软考中级·数据库：函数依赖", "explain": "部分函数依赖指 Y 部分依赖于 X，即 X 的真子集就能决定 Y 的一部分；完全依赖要求 X 的任何真子集都不能决定 Y。", "type": "single"}, {"id": "rkdb_8", "stem": "关于存储过程，正确的是哪一项？", "options": {"A": "存储过程在客户端每次都要重新编译", "B": "存储过程预编译后存在数据库中，可被多次调用，减少网络往返", "C": "存储过程不能带参数", "D": "存储过程只能用于查询"}, "answer": "B", "point": "软考中级·数据库：存储过程", "explain": "存储过程预编译并存储在数据库服务器上，可带参数、多次调用，减少客户端与服务器之间的往返。", "type": "single"}, {"id": "rkdb_9", "stem": "分布式数据库中，数据分片的主要目的不包括？", "options": {"A": "把数据按规则分布到不同场地", "B": "提高局部访问效率", "C": "让所有场地都保存全量数据", "D": "支持并行处理"}, "answer": "C", "point": "软考中级·数据库：数据分片", "explain": "分片是把数据按水平或垂直规则分布到不同场地，提高局部性与并行性；所有场地都存全量数据叫复制，不是分片。", "type": "single"}, {"id": "rkdb_10", "stem": "数据库完整性约束中，实体完整性要求什么？", "options": {"A": "外键不能为空", "B": "主键不能为空且不能重复", "C": "所有字段都不能为空", "D": "数据必须符合业务规则"}, "answer": "B", "point": "软考中级·数据库：实体完整性", "explain": "实体完整性要求主键值不能为空且唯一，标识每条记录；外键约束属于参照完整性，业务规则属于用户定义完整性。", "type": "single"}]}], "rk_mid_media": [{"name": "第1套 · 软考中级多媒体应用设计师上午客观题（10题）", "questions": [{"id": "rkmed_1", "stem": "RGB 颜色模型中，R、G、B 三个分量各为 8 位时，一共能表示多少种颜色？", "options": {"A": "256 种", "B": "65536 种", "C": "约 1677 万种", "D": "无限种"}, "answer": "C", "point": "软考中级·多媒体：RGB颜色", "explain": "每分量 8 位即 256 级，三分量组合为 256×256×256 = 16777216 种，约 1677 万种。", "type": "single"}, {"id": "rkmed_2", "stem": "印刷领域常用 CMYK 颜色模型，其中的 K 代表什么？", "options": {"A": "红色", "B": "蓝色", "C": "黑色", "D": "黄色"}, "answer": "C", "point": "软考中级·多媒体：CMYK", "explain": "CMYK 中的 C 青、M 品红、Y 黄、K 黑；K 用黑色墨水提高暗部表现并节省彩色墨水。", "type": "single"}, {"id": "rkmed_3", "stem": "关于 JPEG 图像压缩，正确的是哪一项？", "options": {"A": "JPEG 是无损压缩", "B": "JPEG 是有损压缩，适合连续色调图像如照片", "C": "JPEG 只能压缩黑白图像", "D": "JPEG 压缩后文件一定比 BMP 小 100 倍"}, "answer": "B", "point": "软考中级·多媒体：JPEG", "explain": "JPEG 采用离散余弦变换等有损压缩，适合照片等连续色调图像；压缩比取决于质量参数，不是固定倍数。", "type": "single"}, {"id": "rkmed_4", "stem": "音频采样中，采样频率 44.1kHz 的含义是？", "options": {"A": "每秒采样 44100 次", "B": "每分钟采样 44100 次", "C": "声音频率为 44100Hz", "D": "文件大小为 44.1KB"}, "answer": "A", "point": "软考中级·多媒体：音频采样", "explain": "采样频率是每秒对声音采样的次数，44.1kHz 即每秒 44100 次，是 CD 音质的常用采样率。", "type": "single"}, {"id": "rkmed_5", "stem": "MIDI 与波形音频（WAV）的主要区别是？", "options": {"A": "MIDI 记录的是声音波形", "B": "MIDI 记录的是演奏指令，文件小但依赖音源还原音色", "C": "MIDI 只能录人声", "D": "两者完全相同"}, "answer": "B", "point": "软考中级·多媒体：MIDI", "explain": "MIDI 记录音符、力度、乐器等演奏指令，不记录波形，文件很小，播放效果取决于音源。", "type": "single"}, {"id": "rkmed_6", "stem": "视频帧率 30fps 的含义是？", "options": {"A": "每秒播放 30 帧画面", "B": "视频总共 30 帧", "C": "每分钟播放 30 帧", "D": "视频时长 30 秒"}, "answer": "A", "point": "软考中级·多媒体：视频帧率", "explain": "fps 是每秒帧数，30fps 即每秒 30 帧，帧率越高运动越流畅，数据量也越大。", "type": "single"}, {"id": "rkmed_7", "stem": "下列哪种视频压缩标准常用于网络流媒体？", "options": {"A": "BMP", "B": "H.264", "C": "TIFF", "D": "WAV"}, "answer": "B", "point": "软考中级·多媒体：视频压缩", "explain": "H.264 是广泛用于流媒体与存储的视频压缩标准；BMP、TIFF 是图像格式，WAV 是音频格式。", "type": "single"}, {"id": "rkmed_8", "stem": "图像分辨率 1920×1080 表示什么？", "options": {"A": "图像文件大小为 1920KB", "B": "图像宽 1920 像素、高 1080 像素", "C": "图像有 1920 种颜色", "D": "显示器尺寸为 1920 英寸"}, "answer": "B", "point": "软考中级·多媒体：分辨率", "explain": "分辨率是图像的像素尺寸，1920×1080 即宽 1920 像素、高 1080 像素，总像素约 207 万。", "type": "single"}, {"id": "rkmed_9", "stem": "在多媒体创作中，交互设计首先要考虑的是？", "options": {"A": "特效越华丽越好", "B": "用户任务与操作路径是否清晰易用", "C": "文件越大越好", "D": "颜色越鲜艳越好"}, "answer": "B", "point": "软考中级·多媒体：交互设计", "explain": "交互设计以用户任务为中心，路径清晰、操作可预期、反馈及时比华丽特效更重要。", "type": "single"}, {"id": "rkmed_10", "stem": "关于矢量图与位图的说法，正确的是哪一项？", "options": {"A": "矢量图放大后会失真，位图放大后不失真", "B": "矢量图用数学描述图形，任意缩放不失真；位图由像素组成，放大后会模糊", "C": "两者没有区别", "D": "矢量图只能是黑白的"}, "answer": "B", "point": "软考中级·多媒体：矢量图与位图", "explain": "矢量图用点、线、曲线等数学描述，缩放不失真；位图由像素阵列组成，放大超过原分辨率会模糊。", "type": "single"}]}], "rk_mid_ecom": [{"name": "第1套 · 软考中级电子商务设计师上午客观题（10题）", "questions": [{"id": "rkecom_1", "stem": "B2B、B2C、C2C 三种模式中，C2C 是指？", "options": {"A": "企业对企业", "B": "企业对消费者", "C": "消费者对消费者", "D": "企业对政府"}, "answer": "C", "point": "软考中级·电子商务：模式", "explain": "B2B 是企业对企业，B2C 是企业对消费者，C2C 是消费者对消费者，典型如个人二手交易平台。", "type": "single"}, {"id": "rkecom_2", "stem": "第三方支付平台在交易中的主要作用是？", "options": {"A": "直接生产商品", "B": "作为买卖双方之间的资金中介与信用担保，买家确认收货后才放款给卖家", "C": "只负责物流配送", "D": "制定商品价格"}, "answer": "B", "point": "软考中级·电子商务：第三方支付", "explain": "第三方支付先代收买家货款，确认收货后再结算给卖家，起到资金中介与信用担保作用，降低交易风险。", "type": "single"}, {"id": "rkecom_3", "stem": "电子签名要具备法律效力，关键在于？", "options": {"A": "签名好看", "B": "能可靠识别签名人身份，并保证签名后内容未被篡改", "C": "签名必须手写", "D": "签名必须用红色"}, "answer": "B", "point": "软考中级·电子商务：电子签名", "explain": "可靠电子签名的核心是身份可识别、内容完整性可验证，与字迹美观、颜色无关，手写不是必要条件。", "type": "single"}, {"id": "rkecom_4", "stem": "SEO 与 SEM 的区别最接近哪一项？", "options": {"A": "SEO 是付费推广，SEM 是免费优化", "B": "SEO 是通过优化自然排名获得流量，SEM 包括付费搜索广告等更广的搜索引擎营销", "C": "两者完全相同", "D": "SEO 只用于社交媒体"}, "answer": "B", "point": "软考中级·电子商务：网络营销", "explain": "SEO 是搜索引擎优化，靠自然排名获流；SEM 是搜索引擎营销的总称，包括付费广告等，范围更广。", "type": "single"}, {"id": "rkecom_5", "stem": "O2O 模式的核心是？", "options": {"A": "只做线上", "B": "只做线下", "C": "线上引流、线下消费体验，两者结合", "D": "只做海外贸易"}, "answer": "C", "point": "软考中级·电子商务：O2O", "explain": "O2O 是 Online to Offline，线上获取用户与订单，线下提供服务或提货体验，线上线下结合。", "type": "single"}, {"id": "rkecom_6", "stem": "电子商务安全中，SSL 协议主要解决什么问题？", "options": {"A": "商品定价", "B": "浏览器与服务器之间传输数据的加密与身份认证", "C": "物流路线规划", "D": "用户界面美化"}, "answer": "B", "point": "软考中级·电子商务：SSL", "explain": "SSL／TLS 在浏览器与服务器之间建立加密通道并验证服务器身份，保护登录、支付等敏感数据传输。", "type": "single"}, {"id": "rkecom_7", "stem": "供应链管理中，牛鞭效应是指？", "options": {"A": "需求波动沿供应链向上游逐级放大", "B": "需求波动沿供应链逐级减小", "C": "库存总是为零", "D": "物流速度越来越快"}, "answer": "A", "point": "软考中级·电子商务：供应链", "explain": "牛鞭效应指终端需求的小波动，经过各级经销、生产后逐级放大，导致上游库存与生产大幅波动。", "type": "single"}, {"id": "rkecom_8", "stem": "关于电子商务网站的购物车，最基本的要求是？", "options": {"A": "购物车商品越多越好", "B": "能准确记录用户所选商品、数量与价格，结算时一致", "C": "购物车不能修改", "D": "购物车只能放一件商品"}, "answer": "B", "point": "软考中级·电子商务：购物车", "explain": "购物车的基本功能是准确记录选择、数量与价格，结算金额与所选一致，并支持修改与删除。", "type": "single"}, {"id": "rkecom_9", "stem": "数据分析中，转化率通常指？", "options": {"A": "网站访问量", "B": "完成目标行为（如购买）的访客占总访客的比例", "C": "页面加载速度", "D": "商品种类数"}, "answer": "B", "point": "软考中级·电子商务：转化率", "explain": "转化率 = 完成目标行为的访客数 / 总访客数，是衡量营销与页面效果的核心指标，不是访问量本身。", "type": "single"}, {"id": "rkecom_10", "stem": "电子商务系统设计中，用户隐私保护首先要做到的是？", "options": {"A": "收集越多个信息越好", "B": "明确告知收集目的，只收集必要信息，并妥善保管", "C": "把用户信息公开", "D": "不需要用户同意"}, "answer": "B", "point": "软考中级·电子商务：隐私保护", "explain": "隐私保护要求目的明确、最小必要、用户知情同意、妥善保管；过度收集与公开都违反这一原则。", "type": "single"}]}], "rk_mid_embed": [{"name": "第1套 · 软考中级嵌入式系统设计师上午客观题（10题）", "questions": [{"id": "rkemb_1", "stem": "嵌入式系统中，任务的三种基本状态是？", "options": {"A": "运行、就绪、阻塞", "B": "开始、中间、结束", "C": "读、写、执行", "D": "输入、处理、输出"}, "answer": "A", "point": "软考中级·嵌入式：任务状态", "explain": "实时操作系统中任务基本状态为运行态、就绪态、阻塞态，调度器在三者之间切换。", "type": "single"}, {"id": "rkemb_2", "stem": "优先级反转是指什么现象？", "options": {"A": "低优先级任务占用了高优先级任务需要的资源，导致高优先级任务被低优先级任务间接阻塞", "B": "高优先级任务主动让出 CPU", "C": "任务优先级随机变化", "D": "所有任务优先级相同"}, "answer": "A", "point": "软考中级·嵌入式：优先级反转", "explain": "优先级反转是低优先级任务持有互斥资源，高优先级任务等待该资源，而中优先级任务又抢占低优先级任务，导致高优先级任务长期阻塞。", "type": "single"}, {"id": "rkemb_3", "stem": "解决优先级反转的常用方法是？", "options": {"A": "关闭中断", "B": "优先级继承或优先级天花板协议", "C": "增大任务栈", "D": "降低所有任务优先级"}, "answer": "B", "point": "软考中级·嵌入式：优先级继承", "explain": "优先级继承让持有资源的低优先级任务临时提升到等待者的优先级，尽快释放资源；天花板协议也有类似作用。", "type": "single"}, {"id": "rkemb_4", "stem": "DMA 的主要作用是什么？", "options": {"A": "让 CPU 更快计算", "B": "外设与内存之间直接传输数据，不经过 CPU 逐字节搬运", "C": "管理文件系统", "D": "加密数据"}, "answer": "B", "point": "软考中级·嵌入式：DMA", "explain": "DMA 控制器接管总线，在外设与内存之间直接搬运数据，CPU 只需在传输开始与结束时介入，从而释放 CPU。", "type": "single"}, {"id": "rkemb_5", "stem": "Bootloader 的主要作用是？", "options": {"A": "编写应用程序", "B": "系统上电后初始化硬件、加载并启动操作系统或应用程序", "C": "管理用户界面", "D": "连接网络"}, "answer": "B", "point": "软考中级·嵌入式：Bootloader", "explain": "Bootloader 是系统启动的第一段程序，负责初始化时钟、内存等硬件，再把操作系统或应用加载到内存并跳转执行。", "type": "single"}, {"id": "rkemb_6", "stem": "Cache 的主要作用是？", "options": {"A": "增大内存容量", "B": "利用局部性原理，在 CPU 与慢速内存之间缓存常用数据，提高访问速度", "C": "替代硬盘", "D": "降低 CPU 主频"}, "answer": "B", "point": "软考中级·嵌入式：Cache", "explain": "Cache 是高速小容量存储，利用时间与空间局部性缓存常用数据，减少对慢速主存的访问，从而提速。", "type": "single"}, {"id": "rkemb_7", "stem": "MMU 的主要功能是？", "options": {"A": "管理电源", "B": "实现虚拟地址到物理地址的转换与内存保护", "C": "驱动显示器", "D": "处理音频"}, "answer": "B", "point": "软考中级·嵌入式：MMU", "explain": "内存管理单元 MMU 负责虚拟地址映射到物理地址，并提供访问权限保护，是实现虚拟内存的基础。", "type": "single"}, {"id": "rkemb_8", "stem": "抢占式调度与非抢占式调度的主要区别是？", "options": {"A": "抢占式允许高优先级任务打断正在运行的任务，非抢占式要等当前任务主动让出", "B": "两者没有区别", "C": "非抢占式更快", "D": "抢占式只能用于单任务"}, "answer": "A", "point": "软考中级·嵌入式：调度", "explain": "抢占式调度中高优先级就绪任务可以打断低优先级运行任务，保证实时性；非抢占式必须等当前任务主动释放 CPU。", "type": "single"}, {"id": "rkemb_9", "stem": "信号量与互斥量的区别最接近哪一项？", "options": {"A": "信号量用于资源计数与同步，互斥量专用于互斥访问且常带所有权与优先级继承", "B": "两者完全相同", "C": "信号量只能用于单任务", "D": "互斥量不能用于同步"}, "answer": "A", "point": "软考中级·嵌入式：信号量与互斥量", "explain": "信号量可计数，用于同步与资源管理；互斥量是二值信号量的特化，强调互斥与所有权，常支持优先级继承。", "type": "single"}, {"id": "rkemb_10", "stem": "嵌入式系统测试中，交叉测试是指？", "options": {"A": "在宿主机上模拟目标机环境进行测试", "B": "在目标机上直接测试，不用宿主机", "C": "只测试硬件", "D": "只测试软件界面"}, "answer": "A", "point": "软考中级·嵌入式：交叉测试", "explain": "交叉测试是在宿主机上用模拟器或仿真环境测试目标机程序，适合目标机资源有限或尚未到位的阶段。", "type": "single"}]}], "rk_junior_prog": [{"name": "第1套 · 软考初级程序员上午客观题（10题）", "questions": [{"id": "rkprog_1", "stem": "关于栈的说法，正确的是哪一项？", "options": {"A": "栈是先进先出", "B": "栈是后进先出，插入删除都在栈顶进行", "C": "栈只能存储数字", "D": "栈没有容量限制"}, "answer": "B", "point": "软考初级·程序员：栈", "explain": "栈是后进先出的线性表，插入和删除都只在栈顶进行；先进先出的是队列。", "type": "single"}, {"id": "rkprog_2", "stem": "在 C 语言中，int a[5]; 则 a[4] 是第几个元素？", "options": {"A": "第 4 个", "B": "第 5 个", "C": "第 6 个", "D": "不存在"}, "answer": "B", "point": "软考初级·程序员：数组下标", "explain": "C 数组下标从 0 开始，a[0] 是第 1 个，a[4] 是第 5 个，也是该数组的最后一个元素。", "type": "single"}, {"id": "rkprog_3", "stem": "关于循环的说法，正确的是哪一项？", "options": {"A": "for 循环不能用在已知次数的场合", "B": "while 循环先判断条件再执行循环体", "C": "do-while 循环先执行一次再判断", "D": "B 和 C 都正确"}, "answer": "D", "point": "软考初级·程序员：循环结构", "explain": "while 是先判断后执行，可能一次都不执行；do-while 是先执行后判断，至少执行一次；for 常用于已知次数。", "type": "single"}, {"id": "rkprog_4", "stem": "二进制数 1011 转换为十进制是多少？", "options": {"A": "9", "B": "10", "C": "11", "D": "13"}, "answer": "C", "point": "软考初级·程序员：数制转换", "explain": "1011 = 1×8 + 0×4 + 1×2 + 1×1 = 11。", "type": "single"}, {"id": "rkprog_5", "stem": "关于函数的说法，正确的是哪一项？", "options": {"A": "函数不能有返回值", "B": "函数可以把复杂任务分解成小任务，便于复用", "C": "函数只能调用一次", "D": "函数不能带参数"}, "answer": "B", "point": "软考初级·程序员：函数", "explain": "函数用于分解任务、复用代码，可以带参数、可以有返回值、可以多次调用。", "type": "single"}, {"id": "rkprog_6", "stem": "在关系数据库中，SELECT 语句的作用是？", "options": {"A": "创建表", "B": "查询数据", "C": "删除表", "D": "修改表结构"}, "answer": "B", "point": "软考初级·程序员：SQL查询", "explain": "SELECT 用于查询数据；CREATE TABLE 建表，DROP TABLE 删表，ALTER TABLE 改结构。", "type": "single"}, {"id": "rkprog_7", "stem": "操作系统中，进程与程序的区别最接近哪一项？", "options": {"A": "两者完全相同", "B": "程序是静态代码，进程是程序的一次动态执行过程", "C": "进程是静态的，程序是动态的", "D": "程序只能运行一次"}, "answer": "B", "point": "软考初级·程序员：进程与程序", "explain": "程序是静态的指令集合，进程是程序在运行时的动态实体，包含代码、数据和执行状态。", "type": "single"}, {"id": "rkprog_8", "stem": "关于算法时间复杂度 O(n) 的说法，正确的是哪一项？", "options": {"A": "执行时间与数据量无关", "B": "执行时间随数据量线性增长", "C": "执行时间是数据量的平方", "D": "执行时间恒定"}, "answer": "B", "point": "软考初级·程序员：时间复杂度", "explain": "O(n) 表示执行时间随数据规模 n 线性增长；O(1) 是恒定，O(n²) 是平方增长。", "type": "single"}, {"id": "rkprog_9", "stem": "在软件开发中，测试的主要目的是？", "options": {"A": "证明软件完全没有错误", "B": "发现软件中的错误，提高质量", "C": "拖延交付时间", "D": "替代需求分析"}, "answer": "B", "point": "软考初级·程序员：软件测试", "explain": "测试的目的是发现错误，不能证明软件完全无错；它也不能替代需求分析。", "type": "single"}, {"id": "rkprog_10", "stem": "关于变量命名，合理的做法是？", "options": {"A": "用单个字母 a、b 命名所有变量", "B": "用能表达含义的名字，如 studentCount", "C": "用中文拼音缩写随意命名", "D": "名字越长越好"}, "answer": "B", "point": "软考初级·程序员：编程规范", "explain": "好的变量名能表达含义，如 studentCount 表示学生数量，便于阅读和维护；无意义或过长的名字都不利于维护。", "type": "single"}]}], "rk_junior_netadmin": [{"name": "第1套 · 软考初级网络管理员上午客观题（10题）", "questions": [{"id": "rknetadm_1", "stem": "局域网中，交换机的主要作用是什么？", "options": {"A": "连接不同网络并做路由", "B": "按 MAC 地址转发数据帧，连接同一网络内的设备", "C": "提供互联网接入", "D": "加密数据"}, "answer": "B", "point": "软考初级·网络管理员：交换机", "explain": "交换机工作在数据链路层，按 MAC 地址表转发帧；路由器连接不同网络并做路由，加密不是交换机的主要作用。", "type": "single"}, {"id": "rknetadm_2", "stem": "IP地址 192.168.1.10 属于哪类地址？", "options": {"A": "公网地址", "B": "私网地址", "C": "组播地址", "D": "保留地址"}, "answer": "B", "point": "软考初级·网络管理员：私网地址", "explain": "192.168.0.0/16 是私网地址段，仅在局域网内使用，不能直接在公网路由。", "type": "single"}, {"id": "rknetadm_3", "stem": "ping 命令主要用于什么？", "options": {"A": "查看 IP 配置", "B": "测试两台主机之间是否连通及往返时延", "C": "下载文件", "D": "配置路由器"}, "answer": "B", "point": "软考初级·网络管理员：ping", "explain": "ping 发送 ICMP 回显请求，测试连通性与时延；查看 IP 配置常用 ipconfig / ifconfig。", "type": "single"}, {"id": "rknetadm_4", "stem": "关于双绞线，正确的是哪一项？", "options": {"A": "双绞线只能用于电话", "B": "超五类、六类双绞线常用于局域网布线，抗干扰靠绞合", "C": "双绞线传输距离无限", "D": "双绞线不需要水晶头"}, "answer": "B", "point": "软考初级·网络管理员：双绞线", "explain": "双绞线靠线对绞合抵消干扰，超五类、六类广泛用于局域网；传输距离有限，一般不超过 100 米。", "type": "single"}, {"id": "rknetadm_5", "stem": "DNS 服务器的主要作用是？", "options": {"A": "分配 IP 地址", "B": "把域名解析为 IP 地址", "C": "过滤病毒", "D": "管理用户密码"}, "answer": "B", "point": "软考初级·网络管理员：DNS", "explain": "DNS 把域名解析为 IP 地址；动态分配地址是 DHCP，过滤病毒是安全软件的工作。", "type": "single"}, {"id": "rknetadm_6", "stem": "网络管理员发现某台电脑无法上网，第一步最合理的是？", "options": {"A": "立即更换交换机", "B": "先检查网线、IP 配置和本机连通性，逐步定位故障点", "C": "重装操作系统", "D": "更换所有网线"}, "answer": "B", "point": "软考初级·网络管理员：故障排查", "explain": "故障排查应从简单到复杂，先查物理连接、IP 配置和连通性，定位后再处理，避免盲目更换设备。", "type": "single"}, {"id": "rknetadm_7", "stem": "关于无线网络 SSID，正确的是哪一项？", "options": {"A": "SSID 是无线网络的名称，用于标识一个无线网络", "B": "SSID 是密码", "C": "SSID 是 IP 地址", "D": "SSID 不能隐藏"}, "answer": "A", "point": "软考初级·网络管理员：SSID", "explain": "SSID 是无线网络的名称，设备靠它识别网络；密码是另外的认证信息，SSID 可以设置为不广播。", "type": "single"}, {"id": "rknetadm_8", "stem": "下列哪项是网络管理员日常工作的一部分？", "options": {"A": "只负责采购电脑", "B": "监控网络运行状态、备份配置、管理账号与权限", "C": "只负责开发软件", "D": "只负责打扫机房"}, "answer": "B", "point": "软考初级·网络管理员：日常工作", "explain": "网络管理员要监控运行状态、备份设备配置、管理用户账号与权限，及时处理故障；采购、开发、保洁不是其核心工作。", "type": "single"}, {"id": "rknetadm_9", "stem": "子网掩码 255.255.255.0 对应的网络前缀长度是？", "options": {"A": "16 位", "B": "24 位", "C": "8 位", "D": "32 位"}, "answer": "B", "point": "软考初级·网络管理员：子网掩码", "explain": "255.255.255.0 有 24 个连续的 1，即 /24 前缀，主机位为 8 位。", "type": "single"}, {"id": "rknetadm_10", "stem": "关于防火墙，网络管理员最常做的配置是？", "options": {"A": "关闭防火墙", "B": "按业务需要放行必要的端口和地址，默认拒绝其他访问", "C": "放行所有端口", "D": "防火墙不需要配置"}, "answer": "B", "point": "软考初级·网络管理员：防火墙配置", "explain": "防火墙应按最小必要原则配置：放行业务必需的端口和地址，默认拒绝其余访问；全放行等于没有防火墙。", "type": "single"}]}], "rk_junior_info": [{"name": "第1套 · 软考初级信息处理技术员上午客观题（10题）", "questions": [{"id": "rkinfo_1", "stem": "在电子表格中，公式 =SUM(A1:A5) 的作用是？", "options": {"A": "求 A1 到 A5 的平均值", "B": "求 A1 到 A5 的和", "C": "求 A1 到 A5 的最大值", "D": "统计 A1 到 A5 的个数"}, "answer": "B", "point": "软考初级·信息处理：电子表格", "explain": "SUM 是求和函数，A1:A5 表示从 A1 到 A5 的连续区域；平均值用 AVERAGE，最大值用 MAX，计数用 COUNT。", "type": "single"}, {"id": "rkinfo_2", "stem": "在 Word 中，要把一段文字居中对齐，通常使用哪个操作？", "options": {"A": "左对齐", "B": "居中对齐", "C": "右对齐", "D": "两端对齐"}, "answer": "B", "point": "软考初级·信息处理：文字处理", "explain": "居中对齐把段落放在页面中间；左对齐靠左，右对齐靠右，两端对齐让左右两边都对齐。", "type": "single"}, {"id": "rkinfo_3", "stem": "关于数据录入，正确的做法是？", "options": {"A": "录完不需要核对", "B": "录入后要核对关键数据，发现错误及时更正", "C": "可以凭印象填写", "D": "格式不重要"}, "answer": "B", "point": "软考初级·信息处理：数据录入", "explain": "信息处理强调准确性，录入后要核对关键数据并及时更正；凭印象填写、不核对都会导致错误数据进入系统。", "type": "single"}, {"id": "rkinfo_4", "stem": "文件扩展名 .docx 通常表示什么文件？", "options": {"A": "图像文件", "B": "音频文件", "C": "Word 文档", "D": "压缩文件"}, "answer": "C", "point": "软考初级·信息处理：文件格式", "explain": ".docx 是 Word 文档格式；图像常用 .jpg/.png，音频常用 .mp3/.wav，压缩常用 .zip。", "type": "single"}, {"id": "rkinfo_5", "stem": "在演示文稿中，母版的主要作用是？", "options": {"A": "增加动画效果", "B": "统一整套幻灯片的版式、字体与配色", "C": "播放音乐", "D": "统计幻灯片数量"}, "answer": "B", "point": "软考初级·信息处理：演示文稿", "explain": "母版定义整套幻灯片的统一版式、字体与配色，改母版即可统一全套风格；动画、音乐是另外的功能。", "type": "single"}, {"id": "rkinfo_6", "stem": "关于信息检索，正确的做法是？", "options": {"A": "只用一个关键词搜一次", "B": "用多个关键词组合，筛选结果并核对来源", "C": "搜索结果越多越好，不用筛选", "D": "只看第一条结果"}, "answer": "B", "point": "软考初级·信息处理：信息检索", "explain": "好的检索要组合关键词、筛选结果、核对来源可靠性；只搜一次、只看第一条都容易漏掉或误用信息。", "type": "single"}, {"id": "rkinfo_7", "stem": "在数据库表中，一行记录通常称为什么？", "options": {"A": "字段", "B": "元组（记录）", "C": "表名", "D": "主键"}, "answer": "B", "point": "软考初级·信息处理：数据库基础", "explain": "表中的一行是一条记录，也叫元组；一列是字段（属性），主键是能唯一标识记录的字段。", "type": "single"}, {"id": "rkinfo_8", "stem": "关于多媒体信息处理，图片分辨率越高意味着？", "options": {"A": "图片越模糊", "B": "单位面积像素越多，画面越清晰，文件通常越大", "C": "图片颜色越少", "D": "图片越小"}, "answer": "B", "point": "软考初级·信息处理：多媒体", "explain": "分辨率高即像素密度高，画面更清晰，但数据量和文件通常也更大。", "type": "single"}, {"id": "rkinfo_9", "stem": "在日常办公中，收到可疑邮件附件时正确的做法是？", "options": {"A": "立即打开查看", "B": "不打开，先核实发件人，必要时请管理员确认", "C": "转发给所有同事", "D": "直接删除重要邮件"}, "answer": "B", "point": "软考初级·信息处理：信息安全意识", "explain": "可疑附件可能带病毒或钓鱼链接，应先核实发件人，必要时请管理员确认，不要直接打开或转发。", "type": "single"}, {"id": "rkinfo_10", "stem": "关于数据备份，合理的做法是？", "options": {"A": "只备份一次就够了", "B": "定期备份重要数据，并把备份与原件分开存放", "C": "备份可以不验证", "D": "只备份在同一台电脑上"}, "answer": "B", "point": "软考初级·信息处理：数据备份", "explain": "备份要定期做，并与原件分开存放，最好异地保存；只备一次、不验证、只放同一台电脑都不能保证恢复。", "type": "single"}]}], "rk_junior_ops": [{"name": "第1套 · 软考初级信息系统运行管理员上午客观题（10题）", "questions": [{"id": "rkops_1", "stem": "信息系统运行管理员的核心职责最接近哪一项？", "options": {"A": "开发新系统", "B": "保障已上线系统日常稳定运行，及时处理运行问题", "C": "只负责采购设备", "D": "只负责编写需求文档"}, "answer": "B", "point": "软考初级·运行管理：职责", "explain": "运行管理员负责已上线系统的日常运维，保障稳定运行、处理故障；开发新系统、编写需求是开发阶段的工作。", "type": "single"}, {"id": "rkops_2", "stem": "系统运行中，定期巡检的主要目的是？", "options": {"A": "增加工作量", "B": "提前发现隐患，防止小问题演变成故障", "C": "关闭系统", "D": "统计用户数量"}, "answer": "B", "point": "软考初级·运行管理：巡检", "explain": "巡检是主动检查运行状态、日志与资源使用，提前发现隐患，避免故障发生后才被动处理。", "type": "single"}, {"id": "rkops_3", "stem": "关于系统日志，正确的做法是？", "options": {"A": "日志可以随意删除", "B": "定期检查日志，异常要记录并跟进处理", "C": "日志不需要保存", "D": "日志只给领导看"}, "answer": "B", "point": "软考初级·运行管理：日志", "explain": "日志是排查故障的重要依据，要定期检查、妥善保存，异常要记录并跟进，不能随意删除。", "type": "single"}, {"id": "rkops_4", "stem": "系统出现故障时，运行管理员首先应该做什么？", "options": {"A": "立即重启所有设备", "B": "先确认故障范围与影响，采取措施恢复服务并记录", "C": "等用户投诉后再处理", "D": "直接更换所有硬件"}, "answer": "B", "point": "软考初级·运行管理：故障处理", "explain": "故障处理先确认范围与影响，优先恢复服务，同时记录过程；盲目重启、等投诉、全部更换都不是规范做法。", "type": "single"}, {"id": "rkops_5", "stem": "关于账号管理，运行管理员应该做到？", "options": {"A": "离职人员账号可以继续使用", "B": "账号按需分配，人员变动及时调整或注销", "C": "所有人共用一个管理员账号", "D": "密码可以公开张贴"}, "answer": "B", "point": "软考初级·运行管理：账号管理", "explain": "账号要按需分配、专人专用，人员入离职、调岗时及时调整或注销；共用账号、公开密码都会失控。", "type": "single"}, {"id": "rkops_6", "stem": "系统升级前，运行管理员必须先做什么？", "options": {"A": "直接升级", "B": "先备份数据与配置，确认回退方案，再按计划升级", "C": "升级后再备份", "D": "不需要通知用户"}, "answer": "B", "point": "软考初级·运行管理：升级管理", "explain": "升级前必须备份数据与配置、准备回退方案，并按计划在合适时间实施，必要时提前通知用户。", "type": "single"}, {"id": "rkops_7", "stem": "关于机房环境管理，正确的是哪一项？", "options": {"A": "温度湿度不需要控制", "B": "保持适宜的温度湿度、清洁、防尘，并定期检查消防与供电", "C": "机房可以堆放杂物", "D": "机房不需要门禁"}, "answer": "B", "point": "软考初级·运行管理：机房环境", "explain": "机房要控制温湿度、保持清洁防尘、定期检查消防与供电，并做好门禁管理；堆放杂物会带来安全隐患。", "type": "single"}, {"id": "rkops_8", "stem": "运行值班交接时，最重要的是？", "options": {"A": "口头说一声即可", "B": "把未处理问题、运行异常与注意事项书面交接清楚", "C": "不需要交接", "D": "只交接钥匙"}, "answer": "B", "point": "软考初级·运行管理：值班交接", "explain": "值班交接要把未处理问题、异常情况与注意事项书面交接清楚，避免下一班遗漏；只口头说一声容易丢信息。", "type": "single"}, {"id": "rkops_9", "stem": "关于系统性能监控，运行管理员主要关注什么？", "options": {"A": "只关注 CPU", "B": "关注 CPU、内存、磁盘、网络等关键指标的变化趋势", "C": "只关注用户数量", "D": "不需要监控"}, "answer": "B", "point": "软考初级·运行管理：性能监控", "explain": "性能监控要综合看 CPU、内存、磁盘、网络等指标及其趋势，提前发现瓶颈；只看单一指标是不够的。", "type": "single"}, {"id": "rkops_10", "stem": "系统运行文档的作用是什么？", "options": {"A": "应付检查", "B": "记录运行操作、故障处理与变更情况，便于交接、追溯与审计", "C": "可以不写", "D": "只给外部人员看"}, "answer": "B", "point": "软考初级·运行管理：运行文档", "explain": "运行文档记录日常操作、故障与变更，是交接、追溯与审计的依据，不是应付检查的形式。", "type": "single"}]}], "rk_senior_pm": [{"name": "第1套 · 软考高级信息系统项目管理师上午客观题（10题）", "questions": [{"id": "rksenpm_1", "stem": "项目组合管理的核心目标是？", "options": {"A": "管好单个项目", "B": "按战略目标选择、优化项目组合，实现组织战略价值最大化", "C": "只管项目进度", "D": "只管项目成本"}, "answer": "B", "point": "软考高级·项目管理：项目组合", "explain": "项目组合管理从组织战略出发，选择和优化一组项目与运营的组合，使战略价值最大化，不只管单个项目。", "type": "single"}, {"id": "rksenpm_2", "stem": "关于项目治理，正确的是哪一项？", "options": {"A": "项目治理就是项目经理个人决策", "B": "项目治理是组织为项目提供方向、监督与控制的框架，明确决策权与责任", "C": "项目治理不需要干系人参与", "D": "项目治理只在项目结束时起作用"}, "answer": "B", "point": "软考高级·项目管理：项目治理", "explain": "项目治理是组织层面的框架，规定项目决策权、监督与控制机制，贯穿项目全过程，不是个人决策。", "type": "single"}, {"id": "rksenpm_3", "stem": "挣值管理中，完工尚需绩效指数 TCPI（基于 BAC）的公式是？", "options": {"A": "TCPI = (BAC - EV) / (BAC - AC)", "B": "TCPI = EV / AC", "C": "TCPI = EV / PV", "D": "TCPI = AC / EV"}, "answer": "A", "point": "软考高级·项目管理：TCPI", "explain": "TCPI = 剩余工作量 (BAC-EV) / 剩余预算 (BAC-AC)，表示为按预算完工，剩余工作必须达到的成本绩效。", "type": "single"}, {"id": "rksenpm_4", "stem": "某项目 BAC = 100 万，EV = 40 万，AC = 50 万，则按 BAC 计算的 TCPI 约为？", "options": {"A": "0.8", "B": "1.0", "C": "1.2", "D": "1.5"}, "answer": "C", "point": "软考高级·项目管理：TCPI计算", "explain": "TCPI = (100-40)/(100-50) = 60/50 = 1.2，意味着剩余工作要以 1.2 的成本绩效才能按原预算完工，难度较大。", "type": "single"}, {"id": "rksenpm_5", "stem": "大型复杂项目管理中，项目群（Program）与项目组合的区别是？", "options": {"A": "项目群是为实现共同收益而协调管理的一组相关项目，项目组合更侧重战略选择与优化", "B": "两者完全相同", "C": "项目群只管成本", "D": "项目组合只管单个项目"}, "answer": "A", "point": "软考高级·项目管理：项目群与组合", "explain": "项目群协调一组相关项目以获得单独管理得不到的收益；项目组合侧重按战略选择、优先排序与优化资源。", "type": "single"}, {"id": "rksenpm_6", "stem": "关于组织过程资产，正确的是哪一项？", "options": {"A": "组织过程资产只包括模板", "B": "组织过程资产包括流程、政策、历史信息与经验教训，供项目复用", "C": "组织过程资产不能更新", "D": "组织过程资产只属于单个项目"}, "answer": "B", "point": "软考高级·项目管理：组织过程资产", "explain": "组织过程资产是组织积累的流程、政策、模板、历史数据与经验教训，项目应复用并在结束后更新它们。", "type": "single"}, {"id": "rksenpm_7", "stem": "风险管理中，定量风险分析的主要工具不包括？", "options": {"A": "蒙特卡洛模拟", "B": "决策树分析", "C": "敏感性分析", "D": "头脑风暴"}, "answer": "D", "point": "软考高级·项目管理：定量风险分析", "explain": "蒙特卡洛、决策树、敏感性分析都是定量分析工具；头脑风暴属于定性识别风险的工具。", "type": "single"}, {"id": "rksenpm_8", "stem": "关于合同收尾，正确的是哪一项？", "options": {"A": "合同收尾就是付款", "B": "合同收尾包括确认工作完成、验收、结算、记录经验教训并关闭合同", "C": "合同收尾不需要文档", "D": "合同收尾只在项目结束时做一次"}, "answer": "B", "point": "软考高级·项目管理：合同收尾", "explain": "合同收尾要确认可交付成果、完成验收与结算、归档记录并关闭合同；它不只是付款。", "type": "single"}, {"id": "rksenpm_9", "stem": "在敏捷与传统结合的混合项目中，项目经理首先要做的是？", "options": {"A": "强制所有团队用同一种方法", "B": "根据项目特点与组织环境，选择并裁剪适合的方法组合", "C": "放弃计划", "D": "只用敏捷"}, "answer": "B", "point": "软考高级·项目管理：混合方法", "explain": "混合方法要按项目特点、干系人与组织环境裁剪方法组合，不是强制统一，也不是放弃计划。", "type": "single"}, {"id": "rksenpm_10", "stem": "关于项目绩效域，正确的是哪一项？", "options": {"A": "绩效域只包括进度和成本", "B": "绩效域包括干系人、团队、开发方法、计划、项目工作、交付、绩效、不确定性等多个相互关联的域", "C": "绩效域互不相关", "D": "绩效域只在收尾时评价"}, "answer": "B", "point": "软考高级·项目管理：绩效域", "explain": "现代项目管理把项目看作多个绩效域的集合，干系人、团队、计划、工作、交付、绩效、不确定性等相互影响，需整体管理。", "type": "single"}]}], "rk_senior_arch": [{"name": "第1套 · 软考高级系统架构设计师上午客观题（10题）", "questions": [{"id": "rksenarch_1", "stem": "软件架构中，质量属性“可用性”主要关注什么？", "options": {"A": "系统功能多少", "B": "系统在规定时间内正常提供服务的能力，以及故障后的恢复能力", "C": "界面美观", "D": "代码行数"}, "answer": "B", "point": "软考高级·架构：质量属性", "explain": "可用性关注系统正常运行时间与故障恢复，如故障检测、隔离与恢复机制；功能数量、界面、代码行数不是可用性的核心。", "type": "single"}, {"id": "rksenarch_2", "stem": "关于分层架构，正确的是哪一项？", "options": {"A": "各层可以随意互相调用", "B": "上层调用下层，下层不依赖上层，便于分工与复用", "C": "分层会降低所有性能问题", "D": "分层只能有两层"}, "answer": "B", "point": "软考高级·架构：分层架构", "explain": "分层架构规定上层依赖下层、下层不依赖上层，层与层之间通过接口交互，便于分工、测试与复用。", "type": "single"}, {"id": "rksenarch_3", "stem": "微服务架构相对于单体架构的主要优点是？", "options": {"A": "部署一定更简单", "B": "服务可独立开发、部署与扩展，故障隔离性更好", "C": "不需要任何治理", "D": "数据一定一致"}, "answer": "B", "point": "软考高级·架构：微服务", "explain": "微服务的优点是服务独立演进、独立扩展、故障隔离；但它也带来分布式治理、数据一致性等新复杂度，部署并不一定更简单。", "type": "single"}, {"id": "rksenarch_4", "stem": "设计模式中，单例模式的主要目的是？", "options": {"A": "创建很多对象", "B": "保证一个类只有一个实例，并提供全局访问点", "C": "隐藏所有方法", "D": "提高运行速度"}, "answer": "B", "point": "软考高级·架构：设计模式", "explain": "单例模式保证类只有一个实例并提供全局访问点，常用于配置、连接池等全局唯一资源。", "type": "single"}, {"id": "rksenarch_5", "stem": "关于中间件，正确的是哪一项？", "options": {"A": "中间件是操作系统", "B": "中间件位于应用与底层平台之间，提供通信、事务、消息等通用服务", "C": "中间件只能用于数据库", "D": "中间件不需要部署"}, "answer": "B", "point": "软考高级·架构：中间件", "explain": "中间件是应用与操作系统、网络等底层之间的软件层，提供远程调用、消息、事务、安全等通用服务。", "type": "single"}, {"id": "rksenarch_6", "stem": "在架构评估中，ATAM 方法的核心是？", "options": {"A": "只评估性能", "B": "通过质量属性场景，识别架构决策中的敏感点、权衡点与风险", "C": "只看代码", "D": "不需要干系人参与"}, "answer": "B", "point": "软考高级·架构：ATAM", "explain": "ATAM 是架构权衡分析方法，围绕质量属性场景，找出敏感点、权衡点与风险，需要干系人共同参与。", "type": "single"}, {"id": "rksenarch_7", "stem": "关于 CAP 定理，正确的是哪一项？", "options": {"A": "分布式系统可以同时完全满足一致性、可用性、分区容忍性", "B": "分布式系统在分区发生时，只能在一致性与可用性之间权衡", "C": "CAP 只适用于单机系统", "D": "分区容忍性可以放弃"}, "answer": "B", "point": "软考高级·架构：CAP定理", "explain": "CAP 定理指出分布式系统不能同时完全满足一致性、可用性、分区容忍性；分区不可避免时，只能在一致性与可用性之间权衡。", "type": "single"}, {"id": "rksenarch_8", "stem": "在分布式系统中，最终一致性的含义是？", "options": {"A": "所有节点永远不一致", "B": "更新后经过一段时间，所有副本最终会达到一致", "C": "更新立即对所有节点可见", "D": "不需要任何同步"}, "answer": "B", "point": "软考高级·架构：最终一致性", "explain": "最终一致性不保证更新立即全局可见，但保证在没有新更新的情况下，经过一段时间所有副本会收敛一致。", "type": "single"}, {"id": "rksenarch_9", "stem": "关于架构文档，正确的做法是？", "options": {"A": "架构文档越详细越好，不需要区分读者", "B": "架构文档应按视图组织，面向不同干系人说明关键决策与约束", "C": "架构文档可以不写", "D": "架构文档只需要画一张图"}, "answer": "B", "point": "软考高级·架构：架构文档", "explain": "好的架构文档按视图组织，面向开发、运维、管理等不同干系人，说明关键决策、约束与权衡，不是一张图或面面俱到的堆砌。", "type": "single"}, {"id": "rksenarch_10", "stem": "在系统重构时，架构师首先要评估的是？", "options": {"A": "代码行数", "B": "现有架构的问题、业务目标与重构风险收益", "C": "开发工具版本", "D": "团队人数"}, "answer": "B", "point": "软考高级·架构：重构评估", "explain": "重构前要评估现有架构的问题、业务目标、成本与风险收益，再决定重构范围与策略；只看代码行数或人数是不够的。", "type": "single"}]}], "rk_senior_netplan": [{"name": "第1套 · 软考高级网络规划设计师上午客观题（10题）", "questions": [{"id": "rksennet_1", "stem": "网络规划的第一步通常是？", "options": {"A": "采购设备", "B": "需求分析：明确业务目标、用户规模、流量与服务质量要求", "C": "直接布线", "D": "配置路由器"}, "answer": "B", "point": "软考高级·网络规划：需求分析", "explain": "网络规划先做需求分析，明确业务、规模、流量与服务质量要求，再做拓扑、选型与实施；先采购是常见错误。", "type": "single"}, {"id": "rksennet_2", "stem": "园区网三层结构中，汇聚层的主要作用是？", "options": {"A": "直接连接终端", "B": "汇聚接入层流量，做策略控制与路由转发", "C": "连接互联网", "D": "只做供电"}, "answer": "B", "point": "软考高级·网络规划：三层结构", "explain": "三层结构为接入层、汇聚层、核心层：接入层接终端，汇聚层汇聚流量并做策略与路由，核心层高速转发。", "type": "single"}, {"id": "rksennet_3", "stem": "在网络可靠性设计中，冗余链路的主要目的是？", "options": {"A": "提高带宽一倍", "B": "单点故障时仍有备用路径，保证业务不中断", "C": "降低成本", "D": "简化管理"}, "answer": "B", "point": "软考高级·网络规划：冗余设计", "explain": "冗余链路与设备是为了消除单点故障，故障时自动切换到备用路径；它通常增加成本与管理复杂度，不是为了省钱。", "type": "single"}, {"id": "rksennet_4", "stem": "关于网络地址规划，正确的做法是？", "options": {"A": "地址随意分配", "B": "按部门与业务划分子网，预留扩展空间，并做好地址记录", "C": "所有设备用同一地址", "D": "不需要规划"}, "answer": "B", "point": "软考高级·网络规划：地址规划", "explain": "地址规划要按业务划分子网、预留扩展、统一记录，便于管理与故障定位；随意分配会很快失控。", "type": "single"}, {"id": "rksennet_5", "stem": "在广域网规划中，专线与互联网 VPN 的主要权衡是？", "options": {"A": "专线一定便宜", "B": "专线质量与安全性较好但成本高，互联网 VPN 成本低但质量依赖公网", "C": "两者没有区别", "D": "VPN 一定更安全"}, "answer": "B", "point": "软考高级·网络规划：广域网", "explain": "专线独享带宽、质量与安全性较好但成本高；互联网 VPN 成本低，但时延与质量受公网影响，需加密保障安全。", "type": "single"}, {"id": "rksennet_6", "stem": "网络容量规划中，峰值流量的意义是？", "options": {"A": "平均流量", "B": "业务高峰期的流量，是决定带宽与设备能力的重要依据", "C": "最小流量", "D": "与规划无关"}, "answer": "B", "point": "软考高级·网络规划：容量规划", "explain": "容量规划不能只看平均流量，要以峰值流量为依据并留有余量，否则高峰期会出现拥塞与丢包。", "type": "single"}, {"id": "rksennet_7", "stem": "关于网络安全规划，分区隔离的主要思路是？", "options": {"A": "所有系统放在同一区域", "B": "按信任级别划分区域，区域间用防火墙等控制访问", "C": "不需要任何隔离", "D": "只隔离外网"}, "answer": "B", "point": "软考高级·网络规划：安全分区", "explain": "安全分区按信任级别划分内外网、DMZ、核心业务区等，区域间用防火墙与访问控制限制流量，降低横向扩散风险。", "type": "single"}, {"id": "rksennet_8", "stem": "在无线网络规划中，AP 部署首先要考虑的是？", "options": {"A": "AP 数量越多越好", "B": "覆盖、容量与干扰的平衡，做现场勘测与信道规划", "C": "AP 颜色", "D": "AP 品牌"}, "answer": "B", "point": "软考高级·网络规划：无线规划", "explain": "无线规划要平衡覆盖、容量与同频干扰，需现场勘测、合理布点与信道规划；盲目增加 AP 会加剧干扰。", "type": "single"}, {"id": "rksennet_9", "stem": "网络规划文档中，拓扑图的主要作用是？", "options": {"A": "装饰作用", "B": "清晰展示设备、链路与区域关系，是实施与运维的依据", "C": "只给领导看", "D": "不需要更新"}, "answer": "B", "point": "软考高级·网络规划：拓扑图", "explain": "拓扑图展示设备、链路、区域与地址关系，是实施、验收与运维的共同依据，变更后要同步更新。", "type": "single"}, {"id": "rksennet_10", "stem": "在网络项目验收中，最重要的依据是？", "options": {"A": "设备品牌", "B": "规划与合同中约定的性能、功能与安全指标的实测结果", "C": "施工方口头承诺", "D": "设备数量"}, "answer": "B", "point": "软考高级·网络规划：验收", "explain": "验收要以规划与合同约定的指标为准，用实测结果验证性能、功能与安全是否达标，不是看品牌或数量。", "type": "single"}]}], "rk_senior_analyst": [{"name": "第1套 · 软考高级系统分析师上午客观题（10题）", "questions": [{"id": "rksenana_1", "stem": "系统分析阶段的首要任务是？", "options": {"A": "编写代码", "B": "深入理解业务与用户需求，形成准确的需求规格", "C": "采购硬件", "D": "部署系统"}, "answer": "B", "point": "软考高级·系统分析：需求分析", "explain": "系统分析阶段的核心是理解业务与用户真实需求，形成需求规格；编码、采购、部署属于后续阶段。", "type": "single"}, {"id": "rksenana_2", "stem": "UML 中，用例图主要用于什么？", "options": {"A": "描述类之间的关系", "B": "描述系统功能与参与者之间的交互", "C": "描述对象随时间的状态变化", "D": "描述部署结构"}, "answer": "B", "point": "软考高级·系统分析：UML用例图", "explain": "用例图展示参与者与系统用例之间的关系，用于表达系统功能需求；类图描述结构，状态图描述状态变化，部署图描述部署。", "type": "single"}, {"id": "rksenana_3", "stem": "关于需求变更，系统分析师首先应该做的是？", "options": {"A": "直接修改代码", "B": "评估变更对范围、进度、成本与质量的影响，并按流程审批", "C": "拒绝一切变更", "D": "口头答应用户"}, "answer": "B", "point": "软考高级·系统分析：需求变更", "explain": "需求变更要先评估影响、按流程审批，再更新需求文档与计划；直接改代码或口头答应都会失控。", "type": "single"}, {"id": "rksenana_4", "stem": "业务流程建模中，BPMN 的主要作用是？", "options": {"A": "画数据库表", "B": "用标准符号描述业务流程的活动、分支与参与方", "C": "编写测试用例", "D": "管理项目进度"}, "answer": "B", "point": "软考高级·系统分析：BPMN", "explain": "BPMN 是业务流程建模标准符号，用于清晰描述流程活动、网关分支、事件与参与方，便于业务与技术沟通。", "type": "single"}, {"id": "rksenana_5", "stem": "关于非功能需求，正确的是哪一项？", "options": {"A": "非功能需求不重要", "B": "非功能需求包括性能、安全性、可用性、可维护性等，是系统质量的重要约束", "C": "非功能需求就是界面颜色", "D": "非功能需求不需要验证"}, "answer": "B", "point": "软考高级·系统分析：非功能需求", "explain": "非功能需求规定性能、安全、可用、可维护等质量约束，与功能需求同等重要，且需要可验证的指标。", "type": "single"}, {"id": "rksenana_6", "stem": "在系统分析中，原型法的主要优点是？", "options": {"A": "不需要用户参与", "B": "通过快速原型让用户直观看到系统，及早发现需求偏差", "C": "原型就是最终系统", "D": "原型不需要任何文档"}, "answer": "B", "point": "软考高级·系统分析：原型法", "explain": "原型法用可运行的原型与用户沟通，及早暴露需求偏差；原型不等于最终系统，仍需后续开发与文档。", "type": "single"}, {"id": "rksenana_7", "stem": "数据流图（DFD）中，外部实体表示什么？", "options": {"A": "系统内部的处理", "B": "与系统交互的外部人员、组织或系统", "C": "数据存储", "D": "数据流本身"}, "answer": "B", "point": "软考高级·系统分析：数据流图", "explain": "DFD 中外部实体是与系统交换数据的外部参与方，处理是加工，数据存储是文件或数据库，箭头是数据流。", "type": "single"}, {"id": "rksenana_8", "stem": "关于系统可行性分析，正确的是哪一项？", "options": {"A": "只需要技术可行性", "B": "要综合分析技术、经济、法律、社会与运行可行性", "C": "可行性分析可以事后补", "D": "可行性分析就是立项报告"}, "answer": "B", "point": "软考高级·系统分析：可行性分析", "explain": "可行性分析要从技术、经济、法律、社会、运行等多方面综合判断，决定项目是否值得做，不能只看技术。", "type": "single"}, {"id": "rksenana_9", "stem": "系统分析师在评审需求规格时，最应关注的是？", "options": {"A": "文档页数", "B": "需求是否完整、一致、无歧义、可验证", "C": "文档格式是否华丽", "D": "是否用了最新工具"}, "answer": "B", "point": "软考高级·系统分析：需求评审", "explain": "需求评审关注完整性、一致性、无歧义性与可验证性；页数、格式、工具都不是评审的核心。", "type": "single"}, {"id": "rksenana_10", "stem": "关于系统分析与系统设计的关系，正确的是哪一项？", "options": {"A": "分析就是设计", "B": "分析回答“做什么”，设计回答“怎么做”，分析是设计的基础", "C": "设计可以不依赖分析", "D": "分析只在项目结束时做"}, "answer": "B", "point": "软考高级·系统分析：分析与设计", "explain": "分析确定系统要做什么，设计确定如何实现；设计必须建立在准确的分析之上，否则实现会偏离需求。", "type": "single"}]}], "rk_senior_planmgmt": [{"name": "第1套 · 软考高级系统规划与管理师上午客观题（10题）", "questions": [{"id": "rksenplan_1", "stem": "IT 战略规划首先要对齐的是？", "options": {"A": "技术潮流", "B": "组织业务战略与目标", "C": "供应商推荐", "D": "竞争对手的工具"}, "answer": "B", "point": "软考高级·规划管理：IT战略", "explain": "IT 战略规划必须服务于组织业务战略，先明确业务目标，再决定技术路线；追潮流、跟供应商都会偏离业务。", "type": "single"}, {"id": "rksenplan_2", "stem": "关于 IT 治理，正确的是哪一项？", "options": {"A": "IT 治理就是 IT 部门内部管理", "B": "IT 治理是组织层面确保 IT 投资、风险与价值受控的决策与监督框架", "C": "IT 治理不需要高层参与", "D": "IT 治理只管采购"}, "answer": "B", "point": "软考高级·规划管理：IT治理", "explain": "IT 治理是组织高层参与的框架，确保 IT 决策、投资、风险与价值符合组织目标，不只是 IT 部门内部管理。", "type": "single"}, {"id": "rksenplan_3", "stem": "在 IT 服务管理中，服务目录的主要作用是？", "options": {"A": "列出所有硬件型号", "B": "清晰说明向业务提供的服务内容、级别与对象", "C": "记录员工考勤", "D": "统计故障数量"}, "answer": "B", "point": "软考高级·规划管理：服务目录", "explain": "服务目录是面向业务的服务清单，说明服务内容、服务级别与服务对象，是服务管理与沟通的基础。", "type": "single"}, {"id": "rksenplan_4", "stem": "关于 IT 投资评价，正确的是哪一项？", "options": {"A": "只看初期投入", "B": "要综合考虑总拥有成本与业务收益，包括运维与风险成本", "C": "收益无法评估就不用评估", "D": "投资越大越好"}, "answer": "B", "point": "软考高级·规划管理：IT投资", "explain": "IT 投资评价要看总拥有成本（建设加运维）与业务收益，并考虑风险；只看初期投入会低估长期成本。", "type": "single"}, {"id": "rksenplan_5", "stem": "在系统运维管理中，知识管理的主要作用是？", "options": {"A": "保存所有邮件", "B": "把故障处理经验与解决方案沉淀为可复用的知识，提高处理效率", "C": "替代培训", "D": "只给专家看"}, "answer": "B", "point": "软考高级·规划管理：知识管理", "explain": "知识管理把分散的经验沉淀为可查找、可复用的知识库，让更多人能快速处理同类问题；它不能替代培训，但能放大培训效果。", "type": "single"}, {"id": "rksenplan_6", "stem": "关于外包管理，组织首先要明确的是？", "options": {"A": "外包价格越低越好", "B": "外包范围、服务级别、责任边界与退出机制", "C": "外包后不需要管理", "D": "外包可以转移所有风险"}, "answer": "B", "point": "软考高级·规划管理：外包管理", "explain": "外包要先明确范围、服务级别、责任边界与退出机制，并持续管理供应商；低价、外包后不管、转移所有风险都是误区。", "type": "single"}, {"id": "rksenplan_7", "stem": "在 IT 规划中，现状调研的主要目的是？", "options": {"A": "收集所有文档", "B": "摸清现有系统、能力与问题，为目标架构提供依据", "C": "证明现状很好", "D": "拖延规划时间"}, "answer": "B", "point": "软考高级·规划管理：现状调研", "explain": "现状调研要摸清现有系统、组织能力与主要问题，作为制定目标架构与实施路径的依据，不是为了收集文档本身。", "type": "single"}, {"id": "rksenplan_8", "stem": "关于变更管理在运维中的作用，正确的是哪一项？", "options": {"A": "变更越快越好，不需要审批", "B": "变更要评估影响、审批、按计划实施并验证，防止变更引发新故障", "C": "变更只适用于新系统", "D": "变更不需要记录"}, "answer": "B", "point": "软考高级·规划管理：变更管理", "explain": "运维变更同样要评估、审批、按计划实施并验证，变更本身是故障的重要来源，必须受控并留记录。", "type": "single"}, {"id": "rksenplan_9", "stem": "在服务级别管理中，SLA 与 OLA 的区别是？", "options": {"A": "两者完全相同", "B": "SLA 是与客户的服务协议，OLA 是内部团队之间的运营级别协议", "C": "OLA 是与客户的协议", "D": "SLA 只用于外部供应商"}, "answer": "B", "point": "软考高级·规划管理：SLA与OLA", "explain": "SLA 面向客户，约定服务内容与级别；OLA 面向内部支撑团队，约定为达成 SLA 各团队要提供的支持。", "type": "single"}, {"id": "rksenplan_10", "stem": "关于 IT 规划的实施路径，合理的做法是？", "options": {"A": "一次全部上线", "B": "分阶段实施，优先高价值、低风险的项目，边实施边评估调整", "C": "先做最难的项目", "D": "不需要评估调整"}, "answer": "B", "point": "软考高级·规划管理：实施路径", "explain": "大型 IT 规划应分阶段实施，优先高价值低风险项目，边实施边评估调整；一次全部上线风险极高。", "type": "single"}]}], "ncre2_python": [{"name": "第1套 · 二级Python客观题（10题）", "questions": [{"id": "ncre2py_1", "stem": "在 Python 中，表达式 [10, 20, 30][1] 的值是？", "options": {"A": "10", "B": "20", "C": "30", "D": "报错"}, "answer": "B", "point": "NCRE二级·Python：列表索引", "explain": "列表索引从 0 开始，[1] 取第二个元素 20。A 是 [0]，C 是 [2]，索引合法不会报错。", "type": "single"}, {"id": "ncre2py_2", "stem": "表达式 len('hello') 的值是？", "options": {"A": "4", "B": "5", "C": "6", "D": "hello"}, "answer": "B", "point": "NCRE二级·Python：字符串长度", "explain": "hello 共 5 个字符，len 返回 5。", "type": "single"}, {"id": "ncre2py_3", "stem": "表达式 7 // 2 的值是？", "options": {"A": "3", "B": "3.5", "C": "4", "D": "2"}, "answer": "A", "point": "NCRE二级·Python：整除运算", "explain": "// 是整除（向下取整），7 // 2 = 3。3.5 是 / 的结果，4 是四舍五入，2 不合。", "type": "single"}, {"id": "ncre2py_4", "stem": "表达式 2 ** 4 的值是？", "options": {"A": "8", "B": "6", "C": "16", "D": "24"}, "answer": "C", "point": "NCRE二级·Python：幂运算", "explain": "** 是幂运算，2 ** 4 = 16。8 是 2*4，6 是 2+4，24 是 4!，均不合。", "type": "single"}, {"id": "ncre2py_5", "stem": "下列哪种 Python 数据类型是不可变的？", "options": {"A": "列表 list", "B": "字典 dict", "C": "集合 set", "D": "元组 tuple"}, "answer": "D", "point": "NCRE二级·Python：可变与不可变类型", "explain": "元组一旦创建不能修改元素；列表、字典、集合都是可变的。", "type": "single"}, {"id": "ncre2py_6", "stem": "字典 d = {'a': 1, 'b': 2}，表达式 d['b'] 的值是？", "options": {"A": "a", "B": "1", "C": "2", "D": "报错"}, "answer": "C", "point": "NCRE二级·Python：字典取值", "explain": "用键 'b' 取值得到 2。键存在不会报错，a 是另一个键，1 是 'a' 的值。", "type": "single"}, {"id": "ncre2py_7", "stem": "for i in range(3): 循环体共执行几次？", "options": {"A": "2 次", "B": "3 次", "C": "4 次", "D": "无限次"}, "answer": "B", "point": "NCRE二级·Python：range 循环", "explain": "range(3) 产生 0、1、2 共 3 个值，循环执行 3 次。", "type": "single"}, {"id": "ncre2py_8", "stem": "下列哪个关键字用于定义 Python 函数？", "options": {"A": "func", "B": "def", "C": "define", "D": "function"}, "answer": "B", "point": "NCRE二级·Python：函数定义", "explain": "Python 用 def 定义函数。func、define、function 都不是 Python 关键字。", "type": "single"}, {"id": "ncre2py_9", "stem": "表达式 'abc'.upper() 的值是？", "options": {"A": "abc", "B": "ABC", "C": "Abc", "D": "aBc"}, "answer": "B", "point": "NCRE二级·Python：字符串方法", "explain": "upper() 把全部字母转为大写，得到 ABC。原字符串不变，方法返回新字符串。", "type": "single"}, {"id": "ncre2py_10", "stem": "下列哪个表达式的结果是 True？", "options": {"A": "3 > 5", "B": "3 == 4", "C": "3 < 5 and 5 < 10", "D": "not True"}, "answer": "C", "point": "NCRE二级·Python：布尔运算", "explain": "3 < 5 为真且 5 < 10 为真，and 结果为 True。3 > 5 假，3 == 4 假，not True 为 False。", "type": "single"}]}, {"name": "第2套 · 二级Python填空题（5题）", "questions": [{"id": "ncre2pyf_1", "stem": "填空：print(2 + 3 * 4) 的输出是 ______。", "options": {}, "answer": "14", "point": "NCRE二级·Python填空：运算符优先级", "explain": "先算乘法 3*4=12，再算加法 2+12=14。先加后乘会错得 20。", "type": "fill"}, {"id": "ncre2pyf_2", "stem": "填空：s = 'Python'，s[1] 的值是 ______。（填一个字符）", "options": {}, "answer": "y", "point": "NCRE二级·Python填空：字符串索引", "explain": "字符串索引从 0 开始，s[0]='P'，s[1]='y'。", "type": "fill"}, {"id": "ncre2pyf_3", "stem": "填空：x = [1, 2, 3]; x.append(4) 之后，len(x) 的值是 ______。", "options": {}, "answer": "4", "point": "NCRE二级·Python填空：列表方法", "explain": "append 在末尾加一个元素，列表变为 4 个元素，len 为 4。", "type": "fill"}, {"id": "ncre2pyf_4", "stem": "填空：表达式 not True 的值是 ______。", "options": {}, "answer": "False", "point": "NCRE二级·Python填空：逻辑非", "explain": "not 对 True 取反得到 False。注意 Python 布尔值首字母大写。", "type": "fill"}, {"id": "ncre2pyf_5", "stem": "填空：定义函数的关键字是 ______。", "options": {}, "answer": "def", "point": "NCRE二级·Python填空：函数定义关键字", "explain": "def func_name(): 是定义函数的固定写法。", "type": "fill"}]}], "ncre2_msoffice": [{"name": "第1套 · 二级MS Office客观题（10题）", "questions": [{"id": "ncre2off_1", "stem": "在 Word 中，给选中文字加粗的快捷键是？", "options": {"A": "Ctrl + I", "B": "Ctrl + U", "C": "Ctrl + B", "D": "Ctrl + S"}, "answer": "C", "point": "NCRE二级·MS Office：Word快捷键", "explain": "Ctrl + B 加粗，Ctrl + I 斜体，Ctrl + U 下画线，Ctrl + S 保存。", "type": "single"}, {"id": "ncre2off_2", "stem": "在 Excel 中，求 A1:A5 区域数值之和应使 和是 SUM，求平均是 AVERAGE，求最大值是 MAX。", "type": "single"}, {"id": "ncre2off_10", "stem": "在 Word 中，撤销上一步操作的快捷键是？", "options": {"A": "Ctrl + Z", "B": "Ctrl + Y", "C": "Ctrl + X", "D": "Ctrl + V"}, "answer": "A", "point": "NCRE二级·MS Office：Word快捷键", "explain": "Ctrl + Z 撤销，Ctrl + Y 恢复（重做），Ctrl + X 剪切，Ctrl + V 粘贴。", "type": "single"}]}, {"name": "第2套 · 二级MS Office填空题（5题）", "questions": [{"id": "ncre2offf_1", "stem": "填空：在 Excel 中，求 A1:A5 之和的公式是 ______。（写完整公式）", "options": {}, "answer": "=SUM(A1:A5)", "point": "NCRE二级·MS Office填空：求和公式", "explain": "公式以 = 开头，SUM(A1:A5) 对 A1 到 A5 求和。判分忽略大小写与空格。", "type": "fill", "alts": ["SUM(A1:A5)"]}, {"id": "ncre2offf_2", "stem": "填空：在 Word 中，保存文档的快捷键是 ______。", "options": {}, "answer": "Ctrl+S", "point": "NCRE二级·MS Office填空：保存快捷键", "explain": "Ctrl + S 保存。判分忽略大小写与空格，Ctrl+S 与 Ctrl + S 等价。", "type": "fill", "alts": ["Ctrl + S"]}, {"id": "ncre2offf_3", "stem": "填空：在 Excel 中，求平均值的函数名是 ______。", "options": {}, "answer": "AVERAGE", "point": "NCRE二级·MS Office填空：平均值函数", "explain": "AVERAGE 求平均值。判分忽略大小写。", "type": "fill"}, {"id": "ncre2offf_4", "stem": "填空：在 PowerPoint 中，从头开始放映的快捷键是 ______。", "options": {}, "answer": "F5", "point": "NCRE二级·MS Office填空：放映快捷键", "explain": "F5 从头放映；Shift + F5 是从当前页放映，本题问从头开始，故为 F5。", "type": "fill"}, {"id": "ncre2offf_5", "stem": "填空：Word 文档的默认扩展名是 ______。", "options": {}, "answer": ".docx", "point": "NCRE二级·MS Office填空：文件扩展名", "explain": "Word 2007 及以后版本的默认扩展名是 .docx（旧版 .doc 已不是默认）。", "type": "fill", "alts": ["docx"]}]}], "ncre3_net": [{"name": "第1套 · 三级网络技术客观题（10题）", "questions": [{"id": "ncre3net_1", "stem": "在 OSI 参考模型中，IP 协议工作在哪一层？", "options": {"A": "物理层", "B": "数据链路层", "C": "网络层", "D": "传输层"}, "answer": "C", "point": "NCRE三级·网络技术：OSI模型", "explain": "IP 负责寻址与路由，属于网络层。物理层传比特，数据链路层管帧与 MAC，传输层是 TCP/UDP。", "type": "single"}, {"id": "ncre3net_2", "stem": "IPv4 地址由多少位二进制数组成？", "options": {"A": "16 位", "B": "32 位", "C": "48 位", "D": "128 位"}, "answer": "B", "point": "NCRE三级·网络技术：IPv4地址", "explain": "IPv4 地址共 32 位，通常写成 4 段十进制。48 位是 MAC 地址，128 位是 IPv6。", "type": "single"}, {"id": "ncre3net_3", "stem": "子网掩码为 255.255.255.0 的网络中，可用的主机地址有几个？", "options": {"A": "254 个", "B": "255 个", "C": "256 个", "D": "512 个"}, "answer": "A", "point": "NCRE三级·网络技术：子网划分", "explain": "主机位 8 位共 256 个地址，减去网络地址与广播地址，剩下 254 个可用。", "type": "single"}, {"id": "ncre3net_4", "stem": "下列哪种传输层协议是面向连接、可靠传输的？", "options": {"A": "UDP", "B": "TCP", "C": "IP", "D": "ICMP"}, "answer": "B", "point": "NCRE三级·网络技术：TCP与UDP", "explain": "TCP 面向连接、有确认重传，可靠；UDP 无连接、不可靠但开销小；IP、ICMP 在网络层。", "type": "single"}, {"id": "ncre3net_5", "stem": "DNS 的主要作用是？", "options": {"A": "分配 IP 地址", "B": "把域名解析为 IP 地址", "C": "加密传输数据", "D": "过滤垃圾邮件"}, "answer": "B", "point": "NCRE三级·网络技术：DNS", "explain": "DNS 把域名翻译成 IP 地址。分配地址是 DHCP，加密靠 TLS，过滤邮件靠反垃圾机制。", "type": "single"}, {"id": "ncre3net_6", "stem": "HTTP 协议默认使用的端口号是？", "options": {"A": "21", "B": "25", "C": "53", "D": "80"}, "answer": "D", "point": "NCRE三级·网络技术：常用端口", "explain": "HTTP 默认 80，HTTPS 默认 443；21 是 FTP，25 是 SMTP，53 是 DNS。", "type": "single"}, {"id": "ncre3net_7", "stem": "以太网网卡的 MAC 地址长度是？", "options": {"A": "32 位", "B": "48 位", "C": "64 位", "D": "128 位"}, "answer": "B", "point": "NCRE三级·网络技术：MAC地址", "explain": "MAC 地址 48 位，前 24 位是厂商标识，后 24 位是厂商内编号。", "type": "single"}, {"id": "ncre3net_8", "stem": "路由器主要工作在 OSI 模型的哪一层？", "options": {"A": "数据链路层", "B": "网络层", "C": "传输层", "D": "应用层"}, "answer": "B", "point": "NCRE三级·网络技术：网络设备", "explain": "路由器按 IP 地址转发，属网络层设备；交换机在数据链路层，集线器在物理层。", "type": "single"}, {"id": "ncre3net_9", "stem": "下列哪个地址属于私有地址（常用于局域网）？", "options": {"A": "8.8.8.8", "B": "192.168.1.1", "C": "202.96.128.86", "D": "114.114.114.114"}, "answer": "B", "point": "NCRE三级·网络技术：私有地址", "explain": "192.168.0.0/16 是私有地址段；其余三项均为公网地址。", "type": "single"}, {"id": "ncre3net_10", "stem": "在以太网中，CSMA/CD 的作用是？", "options": {"A": "加密帧内容", "B": "检测冲突并在冲突后退避重发", "C": "把域名转为 IP", "D": "分配动态地址"}, "answer": "B", "point": "NCRE三级·网络技术：CSMA/CD", "explain": "CSMA/CD 是带冲突检测的载波侦听多路访问：先听后发、边发边听、冲突停发、随机退避后重发。", "type": "single"}]}], "ncre3_db": [{"name": "第1套 · 三级数据库技术客观题（10题）", "questions": [{"id": "ncre3db_1", "stem": "在 SQL 中，查询表中全部记录应使用的语句是？", "options": {"A": "SELECT * FROM 表名", "B": "INSERT INTO 表名", "C": "DELETE FROM 表名", "D": "UPDATE 表名"}, "answer": "A", "point": "NCRE三级·数据库技术：SQL查询", "explain": "SELECT 是查询，INSERT 是插入，DELETE 是删除，UPDATE 是修改。", "type": "single"}, {"id": "ncre3db_2", "stem": "关于主键，下列说法正确的是？", "options": {"A": "可以为空", "B": "可以重复", "C": "唯一且不能为空", "D": "一张表可以有多个主键"}, "answer": "C", "point": "NCRE三级·数据库技术：主键", "explain": "主键唯一标识一行，不能为空、不能重复；一张表只能有一个主键（可由多列组成复合主键）。", "type": "single"}, {"id": "ncre3db_3", "stem": "数据库事务的 ACID 特性中，A 代表？", "options": {"A": "一致性", "B": "原子性", "C": "隔离性", "D": "持久性"}, "answer": "B", "point": "NCRE三级·数据库技术：事务ACID", "explain": "ACID：原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）、持久性（Durability）。", "type": "single"}, {"id": "ncre3db_4", "stem": "外键的主要作用是？", "options": {"A": "加快查询速度", "B": "维护表之间的参照完整性", "C": "加密数据", "D": "备份数据"}, "answer": "B", "point": "NCRE三级·数据库技术：外键", "explain": "外键约束子表取值必须在父表主键中出现，保证参照完整性；加快查询靠索引。", "type": "single"}, {"id": "ncre3db_5", "stem": "第三范式（3NF）主要消除的是？", "options": {"A": "部分函数依赖", "B": "传递函数依赖", "C": "多值依赖", "D": "连接依赖"}, "answer": "B", "point": "NCRE三级·数据库技术：范式", "explain": "1NF 消除重复组，2NF 消除对主键的部分依赖，3NF 消除非主属性间的传递依赖。", "type": "single"}, {"id": "ncre3db_6", "stem": "下列哪条语句是删除整张表结构（连同数据）的？", "options": {"A": "DELETE FROM 表名", "B": "TRUNCATE TABLE 表名", "C": "DROP TABLE 表名", "D": "ALTER TABLE 表名"}, "answer": "C", "point": "NCRE三级·数据库技术：DDL与DML", "explain": "DROP TABLE 删除表结构与数据；DELETE 只删行、保留结构；TRUNCATE 清空行但保留结构；ALTER 改结构。", "type": "single"}, {"id": "ncre3db_7", "stem": "在 SQL 中，与 GROUP BY 常配合使用的函数是？", "options": {"A": "COUNT", "B": "ORDER", "C": "JOIN", "D": "WHERE"}, "answer": "A", "point": "NCRE三级·数据库技术：分组聚合", "explain": "GROUP BY 分组后用 COUNT、SUM、AVG 等聚合函数统计每组；WHERE 在分组前过滤行，HAVING 在分组后过滤组。", "type": "single"}, {"id": "ncre3db_8", "stem": "关于数据库索引，下列说法正确的是？", "options": {"A": "索引只加快查询，不影响写入", " let curExamId = 'cet4';
let progress = {}, wrong = [], tab='practice', curSet=0, exam=null;
const $=s=>document.querySelector(s);
function curExam(){ return EXAMS.find(e=>e.id===curExamId); }
function curSets(){ return SETS_MAP[curExamId]||[]; }
function curAll(){ return curSets().flatMap((s,si)=>s.questions.map(q=>({...q,set:si}))); }
function lsP(){ return 'exam_'+curExamId+'_progress_v1'; }
function lsW(){ return 'exam_'+curExamId+'_wrong_v1'; }
function loadProgress(){ try{ progress=JSON.parse(localStorage.getItem(lsP())||'{}'); }catch(e){ progress={}; } try{ wrong=JSON.parse(localStorage.getItem(lsW())||'[]'); }catch(e){ wrong=[]; } }
function save(){ localStorage.setItem(lsP(),JSON.stringify(progress)); localStorage.setItem(lsW(),JSON.stringify(wrong)); }
function markWrong(id,bad){ wrong = wrong.filter(x=>x!==id); if(bad) wrong.push(id); }
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function switchExam(id){
  curExamId=id; loadProgress(); selState={}; exam=null;
  const csel=$('#catSel'); if(csel) csel.value=curExam().category; const esel=$('#examSel'); if(esel) esel.value=id;
  const e=curExam();
  $('#examSub').textContent = e.name+' · '+e.subtitle;
  showTab('practice');
}
function showTab(t){ tab=t; exam=null;
  ['practice','exam','map','wrong'].forEach(x=>{const b=$('#tab-'+x); if(b) b.classList.toggle('on',x===t);});
  if(t==='practice') renderSets(); if(t==='exam') renderExamHome(); if(t==='map') renderMap(); if(t==='wrong') renderWrong(); }
function renderSets(){
  const e=curExam(), ALL=curAll();
  let html = `<div class="card"><h3 style="margin:4px 0">${esc(e.name)}</h3><p class="meta">${esc(e.subtitle)}</p><p class="meta">${esc(e.note||'')}</p>`;
  html += (e.group?`<p class="meta">所属：${esc(e.group)}${e.fit?' · 模型适配：'+esc(e.fit):''}</p>`:'');
  html += e.sections.map(s=>`<div style="padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px"><b>${esc(s.name)}</b>：${esc(s.note||'')}${s.score!=null?'（'+s.score+'分）':''}</div>`).join('');
  html += `</div>`;
  if(e.status==='skeleton'){
    html += `<div class="card"><p>题库待接入：配置骨架已建好（分值、题型、时长），按试点验证的顺序逐科出题，不会为凑数放未经核对的题目。</p></div>`;
    $('#app').innerHTML=html; return;
  }
  if(e.status==='live_elsewhere'){
    html += `<div class="card"><p>本题库已在原页面上线，通用版下一步再迁移，本页不重复建库。</p><div class="row"><button class="btn pri" onclick="window.open('${e.link}','_blank')">打开原税法一页面</button></div></div>`;
    $('#app').innerHTML=html; return;
  }
  let done=ALL.filter(q=>progress[q.id]).length;
  html += `<div class="card"><div class="meta">总进度 ${done} / ${ALL.length} 题 · 进度只保存在本机浏览器，换设备请用导出思路备份（后续接同步时再打通）</div>
    <div class="bar" style="margin-top:8px"><i style="width:${ALL.length?done/ALL.length*100:0}%"></i></div></div>`
    + curSets().map((s,i)=>{const d=s.questions.filter(q=>progress[q.id]).length;
      return `<button class="setbtn" onclick="openSet(${i})"><b>${esc(s.name)}</b><br><small>${s.questions.length} 题 · 已做 ${d} 题</small></button>`}).join('');
  $('#app').innerHTML=html;
}
function openSet(i){ curSet=i; renderQuestions(curSets()[i].questions, curSets()[i].name, ()=>renderSets()); }
function renderQuestions(list, title, back){
  CASESEEN=new Set();
  $('#app').innerHTML = `<div class="row"><button class="btn" onclick="backFn()">← 返回</button></div>
    <h3 style="margin:12px 2px">${esc(title)}</h3>` + list.map((q,idx)=>qHTML(q,idx)).join('');
  window.backFn=back;
  list.forEach(q=>restore(q));
}
let CASESEEN=new Set();
function typeLabel(t){ return t==='single'?'单选题':t==='multi'?'多选题':t==='calc'?'计算题':t==='self'?'自评题（写作／翻译）':t==='fill'?'填空题':'题目'; }
function normFill(s){ return String(s).trim().replace(/\s+/g,'').toLowerCase(); }
function qHTML(q,idx){
  let caseHtml=''; if(q.case && !CASESEEN.has(q.case)){ CASESEEN.add(q.case); caseHtml=`<div class="casebox">${esc(q.case)}</div>`; }
  const head=caseHtml+`<div class="qtag">${typeLabel(q.type)} · 第 ${idx+1} 题</div><div class="stem">${esc(q.stem)}</div>`;
  let body='';
  if(q.type==='calc'){
    body=`<input class="num" id="in-${q.id}" type="number" inputmode="decimal" placeholder="输入答案（单位：${q.unit||''}）">
          <div class="row"><button class="btn pri" onclick="gradeCalc('${q.id}')">提交答案</button></div>`;
  }else if(q.type==='fill'){
    body=`<input class="num" id="in-${q.id}" type="text" placeholder="输入填空答案（大小写、空格不影响判分）">
          <div class="row"><button class="btn pri" onclick="gradeFill('${q.id}')">提交答案</button></div>
          <p class="meta">填空说明：只填一处答案，如公式、函数名、快捷键或运行结果；大小写和空格不影响判分。</p>`;
  }else if(q.type==='self'){
    body=`<textarea class="ans" id="txt-${q.id}" placeholder="在这里作答（写作／翻译），写完对照下方范文自评"></textarea>
          <div class="row"><button class="btn pri" onclick="gradeSelf('${q.id}',true)">对照后：我写对了</button><button class="btn" onclick="gradeSelf('${q.id}',false)">对照后：我写错了</button></div>
          <p class="meta">自评说明：先自己写，再点开解析对照范文与自评清单打对错；系统不替你判主观题。</p>`;
  }else{
    body=Object.keys(q.options).sort().map(k=>
      `<button class="opt" id="opt-${q.id}-${k}" onclick="pick('${q.id}','${k}',${q.type==='multi'})">${k}. ${esc(q.options[k])}</button>`).join('')
      +`<div class="row"><button class="btn pri" onclick="gradeChoice('${q.id}')">提交答案</button></div>`;
  }
  return `<div class="card" id="card-${q.id}">${head}${body}<div class="exp" id="exp-${q.id}"></div></div>`;
}
const selState={};
function pick(id,k,multi){
  if(progress[id]) return;
  selState[id]=selState[id]||new Set();
  if(multi){ selState[id].has(k)?selState[id].delete(k):selState[id].add(k); }
  else selState[id]=new Set([k]);
  document.querySelectorAll(`[id^="opt-${id}-"]`).forEach(b=>b.classList.remove('sel'));
  selState[id].forEach(x=>{const b=document.getElementById(`opt-${id}-${x}`); if(b) b.classList.add('sel');});
}
function verdict(id,ok,ansText,q){
  const e=document.getElementById('exp-'+id);
  e.classList.add('show');
  e.innerHTML=`<span class="verdict ${ok?'ok':'bad'}">${ok?'✓ 答对了':'✗ 答错了'}</span>　正确答案：<b>${esc(ansText)}</b>`+(q.point?`\n<span class="ptline">考点：${esc(q.point)}</span>`:'')+(q.explain?`\n解析：${esc(q.explain)}`:'');
  progress[id]={correct:ok}; markWrong(id,!ok); save();
}
function gradeChoice(id){
  const q=curAll().find(x=>x.id===id); const sel=selState[id];
  if(!sel||sel.size===0){alert('先选一个答案');return;}
  const mine=[...sel].sort().join(''), ans=String(q.answer).split('').sort().join('');
  const ok = mine===ans;
  [...String(q.answer)].forEach(k=>{const b=document.getElementById(`opt-${id}-${k}`); if(b) b.classList.add('right');});
  if(!ok) sel.forEach(k=>{const b=document.getElementById(`opt-${id}-${k}`); if(b) b.classList.add('wrong');});
  verdict(id,ok,String(q.answer),q);
}
function gradeCalc(id){
  const q=curAll().find(x=>x.id===id); const v=parseFloat(document.getElementById('in-'+id).value);
  if(isNaN(v)){alert('先输入数字答案');return;}
  const ok=Math.abs(v-Number(q.answer))<=Math.max(0.02,Math.abs(Number(q.answer))*0.001);
  verdict(id,ok,`${q.answer} ${q.unit||''}`,q);
}
function gradeFill(id){
  const q=curAll().find(x=>x.id===id); const el=document.getElementById('in-'+id); const v=el?el.value:'';
  if(!v.trim()){alert('先输入填空答案');return;}
  const ok=[q.answer].concat(q.alts||[]).some(a=>normFill(a)===normFill(v));
  verdict(id,ok,String(q.answer),q);
}
function gradeSelf(id,ok){
  const q=curAll().find(x=>x.id===id);
  verdict(id,ok,'范文对照（见解析）',q);
}
function restore(q){
  if(!progress[q.id]) return;
  const e=document.getElementById('exp-'+q.id); if(!e) return;
  const ok=progress[q.id].correct;
  e.classList.add('show');
  e.innerHTML=`<span class="verdict ${ok?'ok':'bad'}">${ok?'✓ 已答对':'✗ 已答错（在错题本里）'}</span>　正确答案：<b>${q.type==='calc'?q.answer+' '+(q.unit||''):esc(q.answer)}</b>`+(q.point?`\n<span class="ptline">考点：${esc(q.point)}</span>`:'')+(q.explain?`\n解析：${esc(q.explain)}`:'');
  if(q.type!=='calc' && q.type!=='self') [...String(q.answer)].forEach(k=>{const b=document.getElementById(`opt-${q.id}-${k}`); if(b) b.classList.add('right');});
}
