超过 800 万元"}, "answer": "C", "point": "第二章·小规模纳税人标准500万元（掌握）★新法明文", "explain": "C。第九条：小规模纳税人指年应征增值税销售额未超过 500 万元的纳税人。", "type": "single"}, {"id": "tax1_d1q4", "stem": "下列关于增值税纳税人分类管理的表述，正确的是（ ）。", "options": {"A": "年应征增值税销售额超过规定标准的纳税人，一律不得按简易计税", "B": "小规模纳税人会计核算健全、能提供准确税务资料的，可以向主管税务机关办理登记，按一般计税方法计算缴纳增值税", "C": "纳税人一经登记为一般纳税人，可以自由转回小规模纳税人", "D": "个体工商户不能登记为一般纳税人"}, "answer": "B", "point": "第二章·纳税人分类管理：登记与不得转回（掌握）", "explain": "B。第九条第二款：小规模纳税人会计核算健全、能提供准确税务资料的，可办理登记按一般计税方法计税。A、C、D 均错（登记后不得任意转回；个体工商户可以登记）。", "type": "single"}, {"id": "tax1_d1q5", "stem": "境外单位在境内发生应税交易，未在境内设经营机构的，增值税扣缴义务人是（ ）。", "options": {"A": "境外单位的境内代理人（无条件）", "B": "购买方", "C": "税务机关", "D": "提供劳务发生地的主管税务机关"}, "answer": "B", "point": "第二章·扣缴义务人（掌握）", "explain": "B。第十五条：境外单位和个人在境内发生应税交易，以购买方为扣缴义务人（按规定委托境内代理人申报的除外）。", "type": "single"}, {"id": "tax1_d1q6", "stem": "某商场销售家电的同时提供送货上门服务，家电销售额与送货服务费分别核算。下列处理正确的是（ ）。", "options": {"A": "全部按销售货物的税率计算", "B": "全部按服务 6% 税率计算", "C": "分别按各自适用的税率计算；若未分别核算，从高适用税率", "D": "送货服务费免税"}, "answer": "C", "point": "第二章·兼营分别核算、未分别核算从高（掌握）★新法明文", "explain": "C。第十二条：发生两项以上涉及不同税率、征收率的应税交易，应分别核算；未分别核算的，从高适用税率。", "type": "single"}, {"id": "tax1_d1q7", "stem": "下列各项中，属于增值税征税范围的有（ ）。", "options": {"A": "销售货物", "B": "进口货物", "C": "转让无形资产", "D": "取得存款利息收入", "E": "销售不动产"}, "answer": "ABCE", "point": "第二章·征税范围全景（掌握）", "explain": "ABCE。D 存款利息属于不属于应税交易的情形，不在征税范围内。", "type": "multi"}, {"id": "tax1_d1q8", "stem": "下列关于一般纳税人登记的表述，正确的有（ ）。", "options": {"A": "年应征增值税销售额超过规定标准的，应当办理一般纳税人登记", "B": "小规模纳税人会计核算健全的，可以登记按一般计税方法计税", "C": "年应征增值税销售额未超过标准的纳税人，一律按小规模纳税人管理，不得选择按一般计税方法计税", "D": "个体工商户年应征增值税销售额超过标准的，可以暂不办理一般纳税人登记"}, "answer": "AB", "point": "第二章·一般纳税人登记管理（熟悉）", "explain": "AB。C 错：未超标但会计核算健全的可选择登记按一般计税；D 错：个体工商户超标同样应当登记。注意本题与第 4 题互为印证，是新法第九条的两种考法。", "type": "multi"}, {"id": "tax1_d1q9", "stem": "某一般纳税人 2026 年 3 月销售货物取得含税销售额 226 万元（税率 13%），当月购进货物取得增值税专用发票注明税额 20 万元。计算当月应纳增值税。", "options": {}, "answer": 6.0, "point": "第二章·一般计税应纳税额计算（掌握）", "explain": "销项税额＝226÷(1＋13%)×13%＝26（万元）；应纳税额＝26－20＝**6 万元**。", "type": "calc", "unit": "万元"}, {"id": "tax1_d1q10", "stem": "某企业进口一批货物，关税计税价格 200 万元，关税税率 10%，货物适用增值税税率 13%（不涉及消费税）。计算进口环节应纳增值税。", "options": {}, "answer": 28.6, "point": "第二章·进口环节增值税组成计税价格（掌握）", "explain": "关税＝200×10%＝20（万元）；组成计税价格＝200＋20＝220（万元）；进口增值税＝220×13%＝**28.6 万元**。第十四条：进口货物按组成计税价格乘以适用税率，组成计税价格＝关税计税价格＋关税＋消费税。", "type": "calc", "unit": "万元"}]}, {"name": "第2天 · 视同应税交易与税率", "questions": [{"id": "tax1_d2q1", "stem": "根据《增值税法》，下列情形属于视同应税交易的是（ ）。", "options": {"A": "单位将自产货物用于集体福利", "B": "单位将外购货物用于集体福利", "C": "单位将自产货物移送外县分支机构统一销售", "D": "单位将外购货物用于个人消费"}, "answer": "A", "point": "第二章·视同应税交易仅三项（掌握）★★新法大改", "explain": "A。第五条视同应税交易仅三项：（一）自产或委托加工货物用于集体福利或个人消费；（二）无偿转让货物；（三）无偿转让无形资产、不动产、金融商品。B、D 的「外购货物用于福利/个人消费」不在其列（处理方式是进项不得抵扣）；C「移送分支机构」是旧条例的视同项目，新法已删除——这是 2026 年最典型的变化题。", "type": "single"}, {"id": "tax1_d2q2", "stem": "增值税一般纳税人将外购的空调作为福利发放给职工，正确的税务处理是（ ）。", "options": {"A": "视同应税交易，计算销项税额", "B": "不视同应税交易，其进项税额不得抵扣", "C": "视同应税交易，但可以抵扣进项税额", "D": "按简易计税方法计税"}, "answer": "B", "point": "第二章·外购用于福利：不视同、进项不得抵扣（掌握）★新法口径", "explain": "B。外购货物用于集体福利不视同应税交易，但其进项税额不得抵扣（已抵扣的作转出）。", "type": "single"}, {"id": "tax1_d2q3", "stem": "下列各项中，不属于应税交易、不征收增值税的是（ ）。", "options": {"A": "销售不动产取得的收入", "B": "金融商品转让取得的收入", "C": "单位因房屋被依法征收取得的补偿收入", "D": "提供收派服务取得的收入"}, "answer": "C", "point": "第二章·不属于应税交易：征收征用补偿（掌握）★新法明文", "explain": "C。第六条：依照法律规定被征收、征用而取得补偿，不属于应税交易。A、B、D 均在征税范围内。", "type": "single"}, {"id": "tax1_d2q4", "stem": "下列业务中，适用 9% 税率的是（ ）。", "options": {"A": "有形动产租赁服务", "B": "基础电信服务", "C": "增值电信服务", "D": "加工修理修配服务"}, "answer": "B", "point": "第二章·税率9%的适用范围（掌握）", "explain": "B。第十条：基础电信、交通运输、邮政、建筑、不动产租赁、销售不动产、转让土地使用权及列举货物适用 9%；有形动产租赁、加工修理修配为 13%；增值电信为 6%。", "type": "single"}, {"id": "tax1_d2q5", "stem": "《增值税法》规定的简易计税方法征收率为（ ）。", "options": {"A": "1%", "B": "2%", "C": "3%", "D": "5%"}, "answer": "C", "point": "第二章·简易计税征收率3%（掌握）★新法明文", "explain": "C。第十一条：简易计税征收率为 3%。", "type": "single"}, {"id": "tax1_d2q6", "stem": "下列关于增值税零税率的表述，正确的是（ ）。", "options": {"A": "出口货物适用零税率", "B": "销售农产品适用零税率", "C": "小规模纳税人适用零税率", "D": "免税项目与零税率项目的进项税处理相同"}, "answer": "A", "point": "第二章·零税率与免税的区别（掌握）", "explain": "A。出口货物税率为零（国务院另有规定除外）。D 错：免税项目进项不得抵扣，零税率可享受退（免）税，二者处理不同——客观题高频对比点。", "type": "single"}, {"id": "tax1_d2q7", "stem": "根据《增值税法》，下列情形属于视同应税交易的有（ ）。", "options": {"A": "单位将自产货物用于个人消费", "B": "个体工商户无偿转让外购货物", "C": "单位无偿转让不动产", "D": "单位将货物移送设在外市的分支机构销售", "E": "单位将委托加工货物用于集体福利"}, "answer": "ABCE", "point": "第二章·视同应税交易三项完整辨析（掌握）★★新法大改", "explain": "ABCE。逐项对照第五条：A 对应第一项自产用于个人消费；B 对应第二项无偿转让货物（新法不限于自产，外购无偿转让同样视同）；C 对应第三项；E 对应第一项委托加工用于集体福利。D 移送分支机构新法已删除，不选。", "type": "multi"}, {"id": "tax1_d2q8", "stem": "下列各项中，不属于增值税应税交易的有（ ）。", "options": {"A": "员工为受雇单位提供取得工资的服务", "B": "取得存款利息收入", "C": "收取政府性基金", "D": "单位转让金融商品", "E": "依照法律规定被征用而取得补偿"}, "answer": "ABCE", "point": "第二章·不属于应税交易的四种情形（掌握）★新法明文", "explain": "ABCE。逐项对照第六条四项不属于应税交易的情形；D 转让金融商品属于应税交易。", "type": "multi"}, {"id": "tax1_d2q9", "stem": "某小规模纳税人 2026 年第一季度取得含税销售额 515,000 元（适用征收率 3%，不考虑阶段性优惠）。计算应纳增值税。", "options": {}, "answer": 15000.0, "point": "第二章·小规模简易计税计算（掌握）", "explain": "应纳税额＝515,000÷(1＋3%)×3%＝500,000×3%＝**15,000 元**。", "type": "calc", "unit": "元"}, {"id": "tax1_d2q10", "stem": "某一般纳税人销售自己使用过的、购入时不得抵扣且未抵扣进项税额的固定资产，取得含税售价 103,000 元（按简易办法依照 3% 征收率减按 2% 征收）。计算应纳增值税。", "options": {}, "answer": 2000.0, "point": "第二章·简易计税特殊规定：使用过的固定资产（熟悉）", "explain": "应纳税额＝103,000÷(1＋3%)×2%＝100,000×2%＝**2,000 元**。注意分母用征收率 3% 换算不含税价，税率（征收负担）用 2%——这类「3% 换算、2% 计算」是固定套路。", "type": "calc", "unit": "元"}]}, {"name": "第3天 · 销项与销售额", "questions": [{"id": "tax1_d3q1", "stem": "纳税人销售货物向购买方收取的下列款项中，不属于价外费用的是（ ）。", "options": {"A": "手续费", "B": "违约金", "C": "包装费", "D": "受托加工应税消费品代收代缴的消费税"}, "answer": "D", "point": "第二章·价外费用（掌握）", "explain": "D。价外费用包括向购买方收取的手续费、违约金、包装费、赔偿金等；受托加工应税消费品代收代缴的消费税不属于销售方的价外费用。", "type": "single"}, {"id": "tax1_d3q2", "stem": "纳税人采取折扣方式销售货物，下列处理正确的是（ ）。", "options": {"A": "折扣额与销售额在同一张发票的金额栏分别注明的，可按折扣后的销售额计税", "B": "折扣额另开发票的，也可以从销售额中扣除", "C": "折扣额只要在合同中注明即可从销售额中扣除", "D": "折扣销售一律按原价计税"}, "answer": "A", "point": "第二章·折扣销售的发票注明规则（掌握）", "explain": "A。折扣销售：销售额和折扣额在同一张发票的金额栏分别注明的，可按折扣后的销售额计算；另开发票或只在备注栏注明的，不得扣除。", "type": "single"}, {"id": "tax1_d3q3", "stem": "纳税人采取预收款方式销售货物的，关于销售额与纳税义务，下列表述正确的是（ ）。", "options": {"A": "预收款一律在收款当天全额计税", "B": "销售折扣（现金折扣）可以从销售额中扣除", "C": "还本销售的销售额不得减除还本支出", "D": "以物易物不属于销售行为"}, "answer": "C", "point": "第二章·特殊销售方式：还本、现金折扣、预收款（掌握）", "explain": "C。还本销售以货物销售价格为销售额，不得减除还本支出。A 错：预收款方式的纳税义务发生时间有专门规则（如生产销售大型货物、建筑服务预收款仅预缴），不能一概而论；B 错：销售折扣（现金折扣）不得从销售额中扣除；D 错：以物易物双方均应作购销处理。", "type": "single"}, {"id": "tax1_d3q4", "stem": "关于以旧换新销售，正确的是（ ）。", "options": {"A": "一律按新货物的同期销售价格确定销售额", "B": "金银首饰以旧换新，应按销售方实际收取的不含增值税的全部价款确定销售额", "C": "一般货物以旧换新应按差价计税", "D": "以旧换新收取的旧货作价可以从销售额中扣除"}, "answer": "B", "point": "第二章·以旧换新（金银首饰例外）（掌握）", "explain": "B。金银首饰以旧换新按实际收取的不含增值税的全部价款计税；一般货物以旧换新按新货物同期销售价格确定销售额，不扣减旧货收购价（A、C、D 错）。", "type": "single"}, {"id": "tax1_d3q5", "stem": "某企业销售啤酒收取包装物押金，押金单独记账、约定一年内返还。下列处理正确的是（ ）。", "options": {"A": "收取当期即并入销售额计税", "B": "逾期未退没收的押金，应按所包装货物的适用税率计算销项税额", "C": "押金一律不征税", "D": "押金按征收率简易计税"}, "answer": "B", "point": "第二章·包装物押金（掌握）", "explain": "B。一般货物（啤酒等）包装物押金单独记账、未逾期的不并入销售额，逾期未退或没收时按所包装货物税率计税。注意对比：白酒等其他酒类的押金在收取当期即并入销售额——第 8 天消费税部分还会再遇到。", "type": "single"}, {"id": "tax1_d3q6", "stem": "纳税人销售价格明显偏低且无正当理由的，税务机关核定销售额的第一个顺序是（ ）。", "options": {"A": "按组成计税价格核定", "B": "按纳税人最近时期同类货物的平均销售价格核定", "C": "按其他纳税人最近时期同类货物的平均销售价格核定", "D": "按市场同类货物平均价格核定"}, "answer": "B", "point": "第二章·销售额明显偏低的核定顺序（熟悉）", "explain": "B。核定顺序：①纳税人最近时期同类货物平均销售价格 → ②其他纳税人最近时期同类货物平均销售价格 → ③组成计税价格（成本×(1＋成本利润率）)。", "type": "single"}, {"id": "tax1_d3q7", "stem": "下列款项中，属于增值税价外费用的有（ ）。", "options": {"A": "向购买方收取的延期付款利息", "B": "向购买方收取的包装物租金", "C": "受托加工应税消费品代收代缴的消费税", "D": "同时符合规定条件的代垫运输费用", "E": "向购买方收取的赔偿金"}, "answer": "ABE", "point": "第二章·价外费用的范围（掌握）", "explain": "ABE。C 代收代缴的消费税不属于；D 同时符合条件（承运部门开票给购买方、纳税人转交）的代垫运费不属于价外费用。", "type": "multi"}, {"id": "tax1_d3q8", "stem": "下列关于特殊销售方式的表述，正确的有（ ）。", "options": {"A": "采取商业折扣销售，折扣额与销售额在同一张发票上分别注明的，可按折扣后金额计税", "B": "采取以旧换新方式销售金银首饰，按实际收取的差价款计税", "C": "采取还本方式销售货物，其销售额就是货物的销售价格，不得扣除还本支出", "D": "直销企业先将货物销售给直销员，再由直销员销售给消费者的，直销员环节不征税"}, "answer": "ABC", "point": "第二章·特殊销售方式综合辨析（掌握）", "explain": "ABC。D 错：直销员将货物销售给消费者时，直销员为增值税纳税人，并非不征税。", "type": "multi"}, {"id": "tax1_d3q9", "stem": "某一般纳税人当月销售货物取得含税销售额 226 万元（税率 13%），另向购买方收取价外费用 11.3 万元（含税）。计算当月销项税额。", "options": {}, "answer": 27.3, "point": "第二章·销项税额计算：价外费用并入（掌握）", "explain": "销项税额＝(226＋11.3)÷(1＋13%)×13%＝237.3÷1.13×13%＝210×13%＝**27.3 万元**。价外费用为含税收入，必须并入后一并换算。", "type": "calc", "unit": "万元"}, {"id": "tax1_d3q10", "stem": "某啤酒生产企业没收逾期未退的包装物押金 45,200 元（含税），啤酒适用增值税税率 13%。计算该笔押金应计算的销项税额。", "options": {}, "answer": 5200.0, "point": "第二章·销项税额计算：包装物押金换算（掌握）", "explain": "销项税额＝45,200÷(1＋13%)×13%＝40,000×13%＝**5,200 元**。", "type": "calc", "unit": "元"}]}, {"name": "计算专套 · 增值税核心计算", "questions": [{"id": "tax1_c1", "stem": "（一般计税综合）某一般纳税人 2026 年 3 月：销售货物取得含税销售额 339 万元（税率 13%）；购进原材料取得专票注明税额 25 万元；购进农产品（取得农产品销售发票）买价 50 万元，用于生产应税货物；当月将部分外购货物用于职工集体福利，该批货物已抵扣进项税额 2 万元。计算当月应纳增值税。", "options": {}, "answer": 11.5, "point": "第二章·一般计税综合计算（掌握）", "explain": "销项＝339÷1.13×13%＝39（万元）；进项＝25＋50×9%－2（集体福利转出）＝25＋4.5－2＝27.5（万元）；应纳＝39－27.5＝**11.5 万元**。考点：外购货物用于集体福利不视同应税交易，但进项不得抵扣、已抵扣要转出。", "type": "calc", "unit": "万元"}, {"id": "tax1_c2", "stem": "（不得抵扣进项的划分）某生产企业兼营免税项目且无法划分不得抵扣的进项税额。当月全部可抵扣进项税额 100 万元，免税项目销售额 200 万元，全部销售额 1,000 万元。计算当月实际可抵扣的进项税额。", "options": {}, "answer": 80, "point": "第二章·不得抵扣进项的划分计算（掌握）", "explain": "不得抵扣＝100×200÷1,000＝20（万元）；可抵扣＝100－20＝**80 万元**。公式：不得抵扣的进项税额＝当月全部进项×当月免税项目销售额÷当月全部销售额。", "type": "calc", "unit": "万元"}, {"id": "tax1_c3", "stem": "（农产品加计扣除）某食品生产企业购进农产品买价 100 万元，全部用于生产税率 13% 的货物。按现行规定，农产品按 9% 计算抵扣，用于生产 13% 税率货物时可加计扣除 1%。计算可抵扣进项税额。", "options": {}, "answer": 10, "point": "第二章·农产品计算抵扣与加计扣除（掌握）", "explain": "可抵扣＝100×(9%＋1%)＝**10 万元**。加计 1% 在领用时点加计，属于「算抵扣＋加计」的组合套路。", "type": "calc", "unit": "万元"}, {"id": "tax1_c4", "stem": "（出口免抵退）某生产企业当月出口货物离岸价折合人民币 500 万元（征税率、退税率均为 13%，无免税料件），当月内销货物销项税额 30 万元，当月可抵扣进项税额合计 80 万元。计算当月应纳（退）税额及免抵税额。（本网页版只填应退税额；免抵税额见解析）", "options": {}, "answer": 50, "point": "第二章·出口免抵退（掌握）", "explain": "征退税率一致，不得免征和抵扣税额＝500×(13%－13%)＝0；应纳税额＝30－80＝－50（万元），期末留抵 50 万元；免抵退税额＝500×13%＝65（万元）；留抵 50＜65，应退税额＝**50 万元**，免抵税额＝65－50＝**15 万元**。口诀：退税取「留抵」与「免抵退税额」孰小。", "type": "calc", "unit": "万元"}, {"id": "tax1_c5", "stem": "（简易计税）某建筑企业（一般纳税人）以清包工方式提供建筑服务，取得含税工程款 1,030 万元，选择简易计税（征收率 3%）。计算应纳税额。", "options": {}, "answer": 30, "point": "第二章·简易计税：建筑服务清包工（掌握）", "explain": "应纳税额＝1,030÷1.03×3%＝**30 万元**。", "type": "calc", "unit": "万元"}, {"id": "tax1_c6", "stem": "（不动产简易）某一般纳税人销售 2016 年 4 月 30 日前取得的不动产，取得含税售价 1,050 万元，选择简易计税（征收率 5%）。计算应纳税额。", "options": {}, "answer": 50, "point": "第二章·简易计税：销售不动产5%（熟悉）", "explain": "应纳税额＝1,050÷1.05×5%＝**50 万元**。2016 年 4 月 30 日前取得的不动产，一般纳税人可选择简易计税，征收率 5%。", "type": "calc", "unit": "万元"}, {"id": "tax1_c7", "stem": "（差额征税）某劳务派遣公司选择差额纳税（简易计税，征收率 5%），当月取得含税收入 105 万元，其中代用工单位支付给派遣员工的工资、福利和社保住房公积金合计 84 万元。计算应纳税额。", "options": {}, "answer": 1, "point": "第二章·差额征税：劳务派遣（熟悉）", "explain": "应纳税额＝(105－84)÷1.05×5%＝21÷1.05×5%＝**1 万元**。差额征税先扣减、再换算、后乘征收率，顺序不能反。", "type": "calc", "unit": "万元"}, {"id": "tax1_c8", "stem": "（贷款服务）某企业当月取得贷款服务利息收入（含税）106 万元，适用税率 6%。计算销项税额。", "options": {}, "answer": 6, "point": "第二章·销项税额：贷款服务6%（掌握）", "explain": "销项税额＝106÷1.06×6%＝**6 万元**。利息收入是含税收入，先价税分离。", "type": "calc", "unit": "万元"}, {"id": "tax1_c9", "stem": "（视同应税交易的核定）某企业将自产货物无偿赠送客户，无同类货物销售价格，该批货物生产成本 80 万元，成本利润率 10%，税率 13%。计算销项税额。", "options": {}, "answer": 11.44, "point": "第二章·视同应税交易的组成计税价格核定（掌握）", "explain": "组成计税价格＝80×(1＋10%)＝88（万元）；销项税额＝88×13%＝**11.44 万元**。无同类价时用组成计税价格，这是核定顺序的第三顺位（前两顺位见第一批第 3 天单选 6）。", "type": "calc", "unit": "万元"}, {"id": "tax1_c10", "stem": "（月末综合）某一般纳税人当月：销售货物含税销售额 226 万元（税率 13%）；取得专票注明进项税额 15 万元；取得海关进口增值税专用缴款书注明税额 8 万元；购进农产品买价 30 万元（按 9% 计算抵扣）；因管理不善发生原材料损失，该批材料成本 10 万元（原已按 13% 抵扣进项）。计算当月应纳增值税。", "options": {}, "answer": 1.6, "point": "第二章·月末综合：缴款书、农产品、进项转出（掌握）", "explain": "销项＝226÷1.13×13%＝26（万元）；可抵扣进项＝15＋8＋30×9%－10×13%（非正常损失转出）＝15＋8＋2.7－1.3＝24.4（万元）；应纳＝26－24.4＝**1.6 万元**。考点串联：专票＋缴款书＋农产品算抵扣＋非正常损失转出，一道题四个点，这是综合分析题的典型结构。", "type": "calc", "unit": "万元"}]}, {"name": "第2天 · 增值税优惠与征收管理", "questions": [{"id": "tax1_e1", "stem": "下列项目中，免征增值税的是（ ）。", "options": {"A": "销售与进口避孕药品和用具", "B": "商场销售日用百货", "C": "一般纳税人销售化肥", "D": "企业销售农用机械"}, "answer": "A", "point": "第二章·法定免征增值税项目（掌握）", "explain": "A。《增值税法》规定的法定免征项目包括：农业生产者销售的自产农产品、避孕药品和用具、古旧图书、直接用于科学研究、科学实验和教学的进口仪器设备、外国政府和国际组织无偿援助的进口物资设备等。", "type": "single"}, {"id": "tax1_e2", "stem": "关于增值税起征点，下列说法正确的是（ ）。", "options": {"A": "起征点适用于所有小规模纳税人", "B": "起征点仅适用于个人", "C": "销售额未达到起征点的免税，达到起征点的仅就未达部分征税", "D": "起征点由纳税人自行确定"}, "answer": "B", "point": "第二章·起征点（掌握）", "explain": "B。增值税起征点仅适用于个人；达到起征点的全额征税，不存在「仅就未达部分征税」。", "type": "single"}, {"id": "tax1_e3", "stem": "下列关于增值税计税期间的表述，正确的是（ ）。", "options": {"A": "增值税的计税期间分别为十日、十五日、一个月或者一个季度", "B": "增值税的计税期间统一为一个季度", "C": "纳税人应自计税期间届满之日起三十日内申报纳税", "D": "小规模纳税人一律以一个月为一个计税期间"}, "answer": "A", "point": "第二章·计税期间与申报期限（掌握）", "explain": "A。《增值税法》：增值税的计税期间分别为十日、十五日、一个月或者一个季度；纳税人以一个月或者一个季度为计税期间的，自期满之日起十五日内申报纳税（B、C、D 均错）。", "type": "single"}, {"id": "tax1_e4", "stem": "下列关于增值税纳税地点的表述，正确的是（ ）。", "options": {"A": "固定业户应当向其机构所在地或者居住地的主管税务机关申报纳税", "B": "固定业户一律向销售地的主管税务机关申报纳税", "C": "进口货物应当向机构所在地海关申报纳税", "D": "非固定业户销售货物无需申报纳税"}, "answer": "A", "point": "第二章·纳税地点（熟悉）", "explain": "A。固定业户向机构所在地或居住地主管税务机关申报纳税；总机构和分支机构不在同一县（市）的，应分别向各自所在地申报，经批准可由总机构汇总向总机构所在地申报。进口货物向报关地海关申报。", "type": "single"}, {"id": "tax1_e5", "stem": "下列关于增值税发票管理的表述，正确的是（ ）。", "options": {"A": "增值税专用发票的最高开票限额由省级税务机关审批", "B": "任何单位和个人不得开具与实际经营业务情况不符的发票", "C": "一般纳税人不得使用增值税普通发票", "D": "小规模纳税人不得开具增值税专用发票"}, "answer": "B", "point": "第二章·发票管理（熟悉）", "explain": "B。不得虚开、不得开具与实际经营业务情况不符的发票，是发票管理的基本红线。最高开票限额由区县级税务机关审批；小规模纳税人可以自行开具或申请代开专票；一般纳税人同样使用普通发票。", "type": "single"}, {"id": "tax1_e6", "stem": "下列关于增值税留抵退税的表述，正确的是（ ）。", "options": {"A": "所有纳税人均可随时申请退还全部期末留抵税额", "B": "申请增量留抵退税需满足纳税信用等级为 A 级或者 B 级等法定条件", "C": "期末留抵税额一律不得结转下期继续抵扣", "D": "小规模纳税人适用留抵退税政策"}, "answer": "B", "point": "第二章·留抵退税（熟悉）", "explain": "B。增量留抵退税有明确门槛：纳税信用等级为 A 级或者 B 级、连续期间增量留抵条件、退税比例等，须逐项满足；留抵税额原则上结转下期抵扣，符合条件方可申请退还；小规模纳税人没有留抵概念。", "type": "single"}, {"id": "tax1_e7", "stem": "下列项目中，免征增值税的有（ ）。", "options": {"A": "古旧图书", "B": "避孕药品和用具", "C": "商业企业销售的农产品", "D": "直接用于科学研究、科学实验和教学的进口仪器、设备", "E": "外国政府、国际组织无偿援助的进口物资和设备"}, "answer": "ABDE", "point": "第二章·法定免征项目（掌握）", "explain": "ABDE。C 商业企业销售农产品属于应税销售（农产品批发、零售环节的免税仅限蔬菜、鲜活肉蛋等特定品目，不可一概而论），本题按法定免征项目判断，C 不选。", "type": "multi"}, {"id": "tax1_e8", "stem": "下列关于增值税征收管理的表述，正确的有（ ）。", "options": {"A": "纳税人以一个月或者一个季度为一个计税期间的，自期满之日起十五日内申报纳税", "B": "跨地区提供建筑服务的纳税人，应向建筑服务发生地预缴税款，向机构所在地申报纳税", "C": "进口货物应自海关填发海关进口增值税专用缴款书之日起十五日内缴纳税款", "D": "增值税的计税期间可以为十日或者十五日", "E": "小规模纳税人的计税期间一律为十五日"}, "answer": "ABCD", "point": "第二章·征收管理（掌握）", "explain": "ABCD。E 错：小规模纳税人可以选择以一个月或一个季度为计税期间，并非一律十五日。", "type": "multi"}, {"id": "tax1_e9", "stem": "某小规模纳税人按月申报缴纳增值税。2026 年 3 月销售货物取得含税销售额 20.6 万元，销售服务取得含税销售额 10.3 万元（均为应税收入，适用征收率 3%，不考虑阶段性优惠政策）。计算该纳税人当月应纳增值税。", "options": {}, "answer": 0.9, "point": "第二章·小规模应纳税额计算（掌握）", "explain": "销售额合计（含税）＝20.6＋10.3＝30.9（万元）；不含税销售额＝30.9÷(1＋3%)＝30（万元）；月销售额已超过小规模纳税人月度起征点标准（10 万元），全额计税：应纳税额＝30×3%＝**0.9 万元**。", "type": "calc", "unit": "万元"}, {"id": "tax1_e10", "stem": "某一般纳税人房地产开发企业销售自行开发的房地产项目，采用一般计税方法。2026 年 4 月取得预收款 109 万元（税率 9%）。计算该企业应预缴的增值税。", "options": {}, "answer": 3.0, "point": "第二章·房地产预收款预缴（掌握）", "explain": "预缴增值税＝109÷(1＋9%)×3%＝100×3%＝**3 万元**。房地产开发企业采取预收款方式销售自行开发的房地产项目，按 3% 预征率预缴。", "type": "calc", "unit": "万元"}]}, {"name": "第2天 · 消费税核心（上）", "questions": [{"id": "tax1_f1", "stem": "下列各项中，不属于消费税征税范围的是（ ）。", "options": {"A": "高档手表", "B": "游艇", "C": "普通化妆品", "D": "成品油"}, "answer": "C", "point": "消费税·征税范围（掌握）", "explain": "C。化妆品仅「高档化妆品」在消费税征税范围内，普通化妆品不征。", "type": "single"}, {"id": "tax1_f2", "stem": "高档化妆品的消费税税率为（ ）。", "options": {"A": "10%", "B": "15%", "C": "20%", "D": "30%"}, "answer": "B", "point": "消费税·税率：高档化妆品15%（掌握）", "explain": "B。高档化妆品税率 15%（生产、进口、委托加工环节）。", "type": "single"}, {"id": "tax1_f3", "stem": "小汽车消费税的纳税环节是（ ）。", "options": {"A": "零售环节", "B": "批发环节", "C": "生产、委托加工和进口环节", "D": "消费环节"}, "answer": "C", "point": "消费税·小汽车纳税环节（掌握）", "explain": "C。小汽车在生产、委托加工和进口环节征税；零售环节仅对超豪华小汽车加征 10%。", "type": "single"}, {"id": "tax1_f4", "stem": "某啤酒厂销售甲类啤酒 20 吨，甲类啤酒每吨定额税率为 250 元。应纳消费税为（ ）。", "options": {"A": "4,400 元", "B": "5,000 元", "C": "5,600 元", "D": "6,000 元"}, "answer": "B", "point": "消费税·啤酒从量定额（掌握）", "explain": "B。20×250＝**5,000 元**。啤酒从量定额，与售价无关；甲类（出厂价不含税 3,000 元/吨及以上）250 元/吨，乙类 220 元/吨。", "type": "single"}, {"id": "tax1_f5", "stem": "生产企业销售白酒收取的包装物押金，正确的税务处理是（ ）。", "options": {"A": "单独记账且未逾期的，不并入计税依据", "B": "在收取当期，无论是否返还及如何进行会计处理，均应并入销售额征税", "C": "在没收押金时并入销售额征税", "D": "在退还押金时并入销售额征税"}, "answer": "B", "point": "消费税·酒类包装物押金（掌握）", "explain": "B。对酒类产品（啤酒、黄酒除外）生产企业销售时收取的包装物押金，无论是否返还以及会计上如何处理，均应并入当期销售额征税——与增值税、与一般货物的处理都不同，是消费税的经典考点。", "type": "single"}, {"id": "tax1_f6", "stem": "进口应税消费品消费税组成计税价格的计算公式为（ ）。", "options": {"A": "（关税完税价格＋关税）×（1＋消费税税率）", "B": "（关税完税价格＋关税）÷（1－消费税税率）", "C": "关税完税价格÷（1－消费税税率）", "D": "（关税完税价格－关税）÷（1－消费税税率）"}, "answer": "B", "point": "消费税·进口组成计税价格（掌握）", "explain": "B。进口应税消费品实行从价定率办法的，组成计税价格＝（关税完税价格＋关税）÷（1－消费税税率），该价格同时是进口增值税的计税基础。", "type": "single"}, {"id": "tax1_f7", "stem": "下列关于消费税的表述，正确的有（ ）。", "options": {"A": "消费税实行价内税", "B": "消费税的征税项目具有选择性，只对列举的消费品征税", "C": "卷烟在生产环节和批发环节均征收消费税", "D": "高档化妆品的消费税税率为 15%", "E": "零售各类应税消费品的商场均为消费税纳税人"}, "answer": "ABCD", "point": "消费税·税制特征（熟悉）", "explain": "ABCD。E 错：消费税以生产、委托加工、进口环节为基本纳税环节，零售环节仅限金银首饰、超豪华小汽车等特定品目，一般零售商场不是纳税人。", "type": "multi"}, {"id": "tax1_f8", "stem": "下列应税消费品中，实行从量定额计征消费税的有（ ）。", "options": {"A": "啤酒", "B": "黄酒", "C": "成品油", "D": "高档手表", "E": "鞭炮、焰火"}, "answer": "ABC", "point": "消费税·从量定额品目（掌握）", "explain": "ABC。从量定额：啤酒、黄酒、成品油。高档手表、鞭炮焰火为从价定率（鞭炮焰火 15%）。", "type": "multi"}, {"id": "tax1_f9", "stem": "某化妆品生产企业 2026 年 4 月销售高档化妆品，取得不含税销售额 300 万元（税率 15%）。当月以外购已税高档化妆品为原料连续生产，外购环节已纳消费税 4 万元，符合扣除条件。计算该企业当月应纳消费税。", "options": {}, "answer": 41.0, "point": "消费税·已纳扣除计算（掌握）", "explain": "应纳税额＝300×15%－4＝45－4＝**41 万元**。外购已税高档化妆品连续生产，准予按生产领用数量扣除已纳消费税。", "type": "calc", "unit": "万元"}, {"id": "tax1_f10", "stem": "某卷烟厂销售 ": "消费税·委托加工（掌握）", "explain": "委托加工的应税消费品，由受托方在向委托方交货时代收代缴税款（受托方为个人除外）。", "type": "single"}, {"id": "tax1_a17", "stem": "下列外购已税应税消费品连续生产应税消费品的项目中，准予扣除已纳消费税的是（ ）。", "options": {"A": "外购已税白酒生产白酒", "B": "外购已税烟丝生产卷烟", "C": "外购已税小汽车生产小汽车", "D": "外购已税高档手表生产高档手表"}, "answer": "B", "point": "消费税·已纳消费税扣除（掌握）", "explain": "准予扣除的法定清单包括已税烟丝、珠宝玉石、高档化妆品、鞭炮焰火、摩托车等；酒（白酒等）、小汽车、高档手表不在扣除之列。", "type": "single"}, {"id": "tax1_a18", "stem": "卷烟在批发环节加征一道消费税，其税率为（ ）。", "options": {"A": "11% 加 0.005 元/支", "B": "5% 加 0.005 元/支", "C": "11% 加 0.003 元/支", "D": "20% 加 0.005 元/支"}, "answer": "A", "point": "消费税·卷烟批发环节（掌握）", "explain": "卷烟批发环节：比例税率 11% ＋ 定额 0.005 元/支，复合计征。", "type": "single"}, {"id": "tax1_a19", "stem": "下列单位中，属于消费税纳税人的是（ ）。", "options": {"A": "零售金银首饰的商场", "B": "普通的货物批发企业", "C": "零售小汽车的经销商", "D": "购买高档化妆品的消费者"}, "answer": "A", "point": "消费税·纳税人（掌握）", "explain": "金银首饰在零售环节征税，零售商场为纳税人；小汽车在生产/进口/委托加工环节征税，零售经销商不是纳税人。", "type": "single"}, {"id": "tax1_a20", "stem": "下列行为中，应征收土地增值税的是（ ）。", "options": {"A": "继承房地产", "B": "将房地产赠与直系亲属", "C": "企业转让国有土地使用权及地上厂房取得收入", "D": "将房地产出租取得租金"}, "answer": "C", "point": "土地增值税·征税范围（掌握）", "explain": "土增税征税范围：转让国有土地使用权、地上的建筑物及其附着物并取得收入。继承、赠与直系亲属不征；出租未发生权属转让，不征。", "type": "single"}, {"id": "tax1_a21", "stem": "房地产开发企业转让新建房，其加计扣除的比例为取得土地使用权所支付的金额与房地产开发成本之和的（ ）。", "options": {"A": "10%", "B": "20%", "C": "30%", "D": "5%"}, "answer": "B", "point": "土地增值税·扣除项目（掌握）", "explain": "开发企业按（取得土地使用权所支付的金额＋开发成本）×20% 加计扣除。", "type": "single"}, {"id": "tax1_a22", "stem": "土地增值税增值额超过扣除项目金额 100%、未超过 200% 的部分，适用税率为（ ）。", "options": {"A": "30%", "B": "40%", "C": "50%", "D": "60%"}, "answer": "C", "point": "土地增值税·税率（掌握）", "explain": "四级超率累进：50% 以下 30%；50%–100% 为 40%；100%–200% 为 50%；200% 以上 60%。", "type": "single"}, {"id": "tax1_a23", "stem": "下列情形中，纳税人应当向税务机关进行土地增值税清算的是（ ）。", "options": {"A": "房地产开发项目全部竣工、完成销售", "B": "项目竣工后销售面积达到 80%", "C": "取得预售许可证满 2 年", "D": "项目转让了部分车位"}, "answer": "A", "point": "土地增值税·清算（熟悉）", "explain": "应当清算：项目全部竣工完成销售、整体转让未竣工项目、直接转让土地使用权。销售达 85% 等属于税务机关可要求清算的情形。", "type": "single"}, {"id": "tax1_a24", "stem": "下列产品中，不征收资源税的是（ ）。", "options": {"A": "天然气", "B": "人造石油", "C": "海盐", "D": "煤层气"}, "answer": "B", "point": "资源税·征税范围（掌握）", "explain": "资源税征税范围为在境内开采的应税矿产品和生产的盐；人造石油不征收。", "type": "single"}, {"id": "tax1_a25", "stem": "资源税的计税方法以（ ）为主。", "options": {"A": "从量定额", "B": "从价定率", "C": "复合计税", "D": "定额税率"}, "answer": "B", "point": "资源税·计税方法（熟悉）", "explain": "资源税法确立从价计征为主、从量计征为辅；原油、天然气、煤炭等实行从价计征。", "type": "single"}, {"id": "tax1_a26", "stem": "下列项目免征资源税的是（ ）。", "options": {"A": "开采原油过程中用于加热的原油", "B": "出口销售的原油", "C": "深水油气田开采的原油", "D": "稠油"}, "answer": "A", "point": "资源税·税收优惠（熟悉）", "explain": "开采原油过程中用于加热的原油免税；深水油气田减征 30%，稠油减征 40%，均为减征而非免征。", "type": "single"}, {"id": "tax1_a27", "stem": "下列各项中，不属于关税纳税人的是（ ）。", "options": {"A": "进口货物的收货人", "B": "出口货物的发货人", "C": "进境物品的寄递收件人", "D": "进口货物的承运人"}, "answer": "D", "point": "关税·纳税人（掌握）", "explain": "关税纳税人：进口货物收货人、出口货物发货人、进境物品的携带人/收件人。承运人不是纳税人。", "type": "single"}, {"id": "tax1_a28", "stem": "进出口货物关税税率的适用日期，一般为（ ）。", "options": {"A": "货物实际到达口岸之日", "B": "海关接受货物申报进口或出口之日", "C": "货物装船之日", "D": "纳税人缴纳税款之日"}, "answer": "B", "point": "关税·税率适用（熟悉）", "explain": "进出口货物适用海关接受申报之日实施的税率；提前申报、补充申报等有特别规定。", "type": "single"}, {"id": "tax1_a29", "stem": "进口货物的关税完税价格包括（ ）。", "options": {"A": "货价及运抵境内输入地点起卸前的运费、保险费", "B": "货价及境内的运输费用", "C": "进口关税税额本身", "D": "进口环节增值税税额"}, "answer": "A", "point": "关税·完税价格（掌握）", "explain": "完税价格以成交价格为基础审定，包括货价、运抵境内输入地点起卸前的运输及相关费用、保险费。", "type": "single"}, {"id": "tax1_a30", "stem": "某企业购买自用小汽车一辆，向经销商支付不含增值税价款 20 万元。应纳车辆购置税为（ ）万元。", "options": {"A": "1.8", "B": "2", "C": "2.26", "D": "2.6"}, "answer": "B", "point": "车辆购置税·应纳税额（掌握）", "explain": "购买自用：计税价格为支付给销售者的全部价款和价外费用（不含增值税），20×10%＝2（万元）。", "type": "single"}, {"id": "tax1_a31", "stem": "下列车辆免征车辆购置税的是（ ）。", "options": {"A": "燃油乘用车", "B": "设有固定装置的非运输专用作业车辆", "C": "进口自用小汽车", "D": "普通货车"}, "answer": "B", "point": "车辆购置税·税收优惠（熟悉）", "explain": "免税车辆包括：使领馆车辆、军警车辆、应急救援专用号牌车辆、设有固定装置的非运输专用作业车辆、城市公交企业购置的公共汽电车辆等；政策期内新能源汽车 第十一章 社会保险费（10题）", "questions": [{"id": "tax1_sb_1", "stem": "我国社会保险费包括的险种有（ ）。", "options": {"A": "基本养老保险", "B": "基本医疗保险", "C": "工伤保险", "D": "失业保险", "E": "生育保险"}, "answer": "ABCDE", "point": "社会保险费·险种", "explain": "五险为基本养老、基本医疗、工伤、失业、生育保险，本题所列五项全部属于。", "type": "multi"}, {"id": "tax1_sb_2", "stem": "基本养老保险费中，职工个人缴费比例一般为（ ）。", "options": {"A": "16%", "B": "8%", "C": "2%", "D": "20%"}, "answer": "B", "point": "社会保险费·基本养老保险费", "explain": "职工个人缴费比例一般为8%，用人单位一般为16%；2%与20%均不是职工个人养老保险比例。", "type": "single"}, {"id": "tax1_sb_3", "stem": "下列关于社会保险费缴费主体的表述，正确的有（ ）。", "options": {"A": "用人单位与职工共同缴纳基本养老、基本医疗、失业保险费", "B": "工伤保险费与生育保险费由用人单位缴纳，职工个人不缴纳", "C": "所有险种均由职工个人全额缴纳", "D": "所有险种均由用人单位全额缴纳", "E": "灵活就业人员可按规定参加部分险种"}, "answer": "ABE", "point": "社会保险费·缴费主体", "explain": "养老、医疗、失业由单位与职工共同缴纳，工伤与生育由单位缴纳；不是一律个人或单位全额，灵活就业人员可按规定参加部分险种。", "type": "multi"}, {"id": "tax1_sb_4", "stem": "社会保险费的缴费基数一般是（ ）。", "options": {"A": "职工本人的全部收入一律", "B": "按规定确定的职工工资总额，有上下限", "C": "用人单位的利润", "D": "职工的银行存款"}, "answer": "B", "point": "社会保险费·缴费基数", "explain": "缴费基数按规定以职工工资总额确定，并设上下限；不是全部收入一律，也不是利润或存款。", "type": "single"}, {"id": "tax1_sb_5", "stem": "下列关于社会保险费征缴流程的表述，正确的有（ ）。", "options": {"A": "用人单位应当办理社会保险登记", "B": "用人单位应当按月申报并缴纳社会保险费", "C": "职工个人缴费部分由用人单位代扣代缴", "D": "用人单位可以不登记、不申报", "E": "社会保险费由税务机关等按规定征收"}, "answer": "ABCE", "point": "社会保险费·征缴流程", "explain": "登记、按月申报缴纳、代扣代缴、按规定征收是征缴流程；不登记、不申报是违法行为。", "type": "multi"}, {"id": "tax1_sb_6", "stem": "用人单位未按时足额缴纳社会保险费的，一般处理是（ ）。", "options": {"A": "无需任何处理", "B": "由征收机关责令限期缴纳或补足，并按规定加收滞纳金", "C": "直接免除缴费义务", "D": "由职工个人承担全部责任"}, "answer": "B", "point": "社会保险费·欠缴处理", "explain": "欠缴应责令限期缴纳或补足，并按规定加收滞纳金；不是无需处理、免除义务或转嫁职工。", "type": "single"}, {"id": "tax1_sb_7", "stem": "下列关于医疗保险与生育保险的表述，正确的有（ ）。", "options": {"A": "基本医疗保险由用人单位与职工共同缴纳", "B": "生育保险由用人单位缴纳", "C": "医疗保险与生育保险均由职工个人全额缴纳", "D": "生育保险待遇包括生育医疗费用与生育津贴等", "E": "医疗保险待遇包括医疗费用报销等"}, "answer": "ABDE", "point": "社会保险费·医疗保险与生育保险", "explain": "医疗保险单位与职工共同缴纳，生育保险单位缴纳；生育待遇包括医疗费用与津贴，医疗待遇包括费用报销；不是职工全额缴纳。", "type": "multi"}, {"id": "tax1_sb_8", "stem": "失业保险费的缴费主体一般是（ ）。", "options": {"A": "只有用人单位", "B": "只有职工个人", "C": "用人单位与职工共同缴纳", "D": "国家财政全额承担"}, "answer": "C", "point": "社会保险费·失业保险费", "explain": "失业保险费由用人单位与职工共同缴纳；不是单方缴纳，也不是财政全额承担。", "type": "single"}, {"id": "tax1_sb_9", "stem": "社会保险费缓缴与补缴的表述，正确的是（ ）。", "options": {"A": "符合条件的用人单位可按规定申请缓缴", "B": "缓缴期满后无需补缴", "C": "缓缴即免缴", "D": "补缴无需按规定计算滞纳金等"}, "answer": "A", "point": "社会保险费·缓缴与补缴", "explain": "符合条件的缓缴须按规定申请，缓缴期满应补缴；缓缴不是免缴，补缴的处理按规定执行。", "type": "single"}, {"id": "tax1_sb_10", "stem": "下列关于社会保险费与税收的区分，正确的有（ ）。", "options": {"A": "社会保险费是为社会保险而征收的专项费用", "B": "税收是国家为实现公共职能而征收的收入", "C": "社会保险费与税收完全相同", "D": "社会保险费的用途具有专项性", "E": "社会保险费的征收管理按社会保险法等规定执行"}, "answer": "ABDE", "point": "社会保险费·与税收区分", "explain": "社保费专项用于社会保险，税收用于公共职能，两者性质与用途不同；社保费征收管理按社保法等规定执行。", "type": "multi"}]}, {"name": "查漏补缺 · 第十二章 非税收入（10题）", "questions": [{"id": "tax1_fs_1", "stem": "下列各项中，属于非税收入的有（ ）。", "options": {"A": "行政事业性收费收入", "B": "政府性基金收入", "C": "罚没收入", "D": "彩票公益金", "E": "增值税收入"}, "answer": "ABCD", "point": "非税收入·范围", "explain": "行政事业性收费、政府性基金、罚没收入、彩票公益金均属非税收入；增值税收入属税收收入，不是非税收入。", "type": "multi"}, {"id": "tax1_fs_2", "stem": "政府性基金收入的主要特点是（ ）。", "options": {"A": "无特定用途，可任意使用", "B": "具有特定用途，专款专用", "C": "与税收完全相同", "D": "由企业自愿缴纳"}, "answer": "B", "point": "非税收入·政府性基金", "explain": "政府性基金具有特定用途，专款专用；不是任意使用，也不是自愿缴纳，更不是税收。", "type": "single"}, {"id": "tax1_fs_3", "stem": "行政事业性收费收入是指（ ）。", "options": {"A": "企业销售商品的收入", "B": "国家机关等为社会提供特定服务而收取的费用", "C": "个人工资收入", "D": "银行贷款利息收入"}, "answer": "B", "point": "非税收入·行政事业性收费", "explain": "行政事业性收费是国家机关等提供特定服务收取的费用；销售收入、工资、利息均不是。", "type": "single"}, {"id": "tax1_fs_4", "stem": "下列各项中，属于国有资源有偿使用收入的有（ ）。", "options": {"A": "国有土地使用权出让收入", "B": "矿产资源补偿费等", "C": "企业销售自产产品收入", "D": "个人转让自有住房收入", "E": "海域使用金等"}, "answer": "ABE", "point": "非税收入·国有资源有偿使用收入", "explain": "国有土地出让、矿产资源补偿、海域使用金等属国有资源有偿使用收入；企业销售与个人转让收入均不是。", "type": "multi"}, {"id": "tax1_fs_5", "stem": "罚没收入主要是指（ ）。", "options": {"A": "企业正常经营收入", "B": "国家机关依法对违法行为人处以罚款、没收违法所得等的收入", "C": "个人捐赠收入", "D": "政府投资收益"}, "answer": "B", "point": "非税收入·罚没收入", "explain": "罚没收入是依法对违法行为罚款、没收违法所得等的收入；经营、捐赠、投资收益均不是。", "type": "single"}, {"id": "tax1_fs_6", "stem": "彩票公益金是指（ ）。", "options": {"A": "彩票销售收入的全部", "B": "彩票发行机构的利润", "C": "按规定从彩票公益金中提取、用于社会公益事业的资金", "D": "购彩者的奖金"}, "answer": "C", "point": "非税收入·彩票公益金", "explain": "彩票公益金是按规定提取、用于社会公益事业的资金；不是全部销售收入、发行利润或奖金。", "type": "single"}, {"id": "tax1_fs_7", "stem": "下列关于非税收入征收管理的表述，正确的有（ ）。", "options": {"A": "非税收入应当按规定及时足额上缴国库或财政专户", "B": "非税收入的征收须有法律、法规或规章依据", "C": "执收单位可以擅自设立收费项目", "D": "非税收入应当接受财政与审计监督", "E": "非税收入可以截留、挪用"}, "answer": "ABD", "point": "非税收入·征收管理", "explain": "非税收入须有依据、及时足额上缴、接受监督；不得擅自设立项目，不得截留挪用。", "type": "multi"}, {"id": "tax1_fs_8", "stem": "非税收入与税收收入的主要区别在于（ ）。", "options": {"A": "征收主体不同", "B": "税收收入是国家凭借政治权力征收，非税收入多与特定服务、特定资源或特定行为相关", "C": "两者没有任何区别", "D": "非税收入不需要任何依据"}, "answer": "B", "point": "非税收入·与税收区分", "explain": "税收凭借政治权力普遍征收，非税收入多与特定服务、资源或行为相关；两者有区别，且非税收入也须有依据。", "type": "single"}, {"id": "tax1_fs_9", "stem": "下列各项中，属于非税收入管理要求的有（ ）。", "options": {"A": "收支两条线", "B": "票据管理", "C": "专户管理", "D": "坐收坐支", "E": "公开透明"}, "answer": "ABCE", "point": "非税收入·管理要求", "explain": "收支两条线、票据管理、专户管理、公开透明是非税收入管理要求；坐收坐支是被禁止的做法。", "type": "multi"}, {"id": "tax1_fs_10", "stem": "下列各项中，不属于非税收入的是（ ）。", "options": {"A": "行政事业性收费收入", "B": "政府性基金收入", "C": "企业所得税收入", "D": "罚没收入"}, "answer": "C", "point": "非税收入·范围", "explain": "企业所得税收入属税收收入，不是非税收入；其余三项均属非税收入。", "type": "single"}]}, {"name": "查漏补缺 · 第六章 资源税（10题）", "questions": [{"id": "tax1_zy_1", "stem": "下列各项中，属于资源税征税范围的是（ ）。", "options": {"A": "在境内开采的原油", "B": "人造石油", "C": "进口的原油", "D": "企业外购的成品油"}, "answer": "A", "point": "资源税·征税范围", "explain": "资源税针对在境内开采的应税矿产品和生产的盐；人造石油不征，进口与外购成品油不是资源税开采环节的征税对象。", "type": "single"}, {"id": "tax1_zy_2", "stem": "下列各项中，属于资源税从价计征的应税产品有（ ）。", "options": {"A": "原油", "B": "天然气", "C": "煤炭", "D": "水资源（从量计征）", "E": "盐（部分从量）"}, "answer": "ABC", "point": "资源税·计税方法", "explain": "原油、天然气、煤炭实行从价计征；水资源实行从量计征，盐的计征方式按税目规定，不一律从价。", "type": "multi"}, {"id": "tax1_zy_3", "stem": "某企业销售自产原油，销售额500万元，按题干给定资源税税率6%计算，应纳资源税为（ ）万元。", "answer": 30, "unit": "万元", "point": "资源税·从价计征计算", "explain": "应纳税额＝500×6%＝30（万元）。", "type": "calc"}, {"id": "tax1_zy_4", "stem": "某企业开采销售原矿1000吨，按题干给定从量定额税率每吨5元计算，应纳资源税为（ ）元。", "answer": 5000, "unit": "元", "point": "资源税·从量计征计算", "explain": "应纳税额＝1000×5＝5000（元）。", "type": "calc"}, {"id": "tax1_zy_5", "stem": "下列关于资源税减征的表述，正确的有（ ）。", "options": {"A": "衰竭期矿山开采的矿产品可按规定减征", "B": "深水油气田开采的油气可按规定减征", "C": "稠油可按规定减征", "D": "所有矿产品一律免征资源税", "E": "充填开采置换出来的矿产品可按规定减征"}, "answer": "ABCE", "point": "资源税·税收优惠", "explain": "衰竭期、深水油气田、稠油、充填开采置换均属按规定减征的情形；减征不是一律免征。", "type": "multi"}, {"id": "tax1_zy_6", "stem": "资源税的纳税地点一般是（ ）。", "options": {"A": "纳税人注册地一律", "B": "应税产品开采地或生产地", "C": "产品销售地一律", "D": "纳税人法定代表人户籍地"}, "answer": "B", "point": "资源税·纳税地点", "explain": "资源税在应税产品开采地或生产地缴纳；不是一律注册地、销售地或户籍地。", "type": "single"}, {"id": "tax1_zy_7", "stem": "下列各项中，不属于资源税纳税人的是（ ）。", "options": {"A": "在境内开采应税矿产品的单位", "B": "在境内生产盐的单位", "C": "购买应税矿产品用于生产的企业", "D": "在境内开采应税矿产品的个人"}, "answer": "C", "point": "资源税·纳税人", "explain": "开采矿产品与生产盐的单位和个人是纳税人；购买矿产品用于生产的企业不是资源税纳税人。", "type": "single"}, {"id": "tax1_zy_8", "stem": "下列关于资源税的表述，正确的有（ ）。", "options": {"A": "资源税以从价计征为主、从量计征为辅", "B": "开采原油过程中用于加热的原油免税", "C": "出口应税矿产品一律免征资源税", "D": "自产自用连续生产应税产品按规定处理", "E": "资源税的计税依据分从价销售额与从量销售数量"}, "answer": "ABDE", "point": "资源税·综合", "explain": "从价为主、从量为辅，加热用原油免税，自产自用连续生产按规定处理，计税依据分销售额与销售数量；出口应税矿产品照章征税，不是免征。", "type": "multi"}, {"id": "tax1_zy_9", "stem": "某企业将开采的原矿移送用于连续生产应税产品，该移送环节资源税的处理一般是（ ）。", "options": {"A": "一律不征资源税", "B": "按规定视同销售或按移送量计税，具体按税目与规定执行", "C": "由购买方代缴", "D": "按销售价格的两倍计税"}, "answer": "B", "point": "资源税·自用连续生产", "explain": "自产自用连续生产按规定处理，不是简单的一律不征、代缴或双倍计税，具体按税目与规定执行。", "type": "single"}, {"id": "tax1_zy_10", "stem": "资源税的申报纳税期限一般是（ ）。", "options": {"A": "按年申报一次即可", "B": "按月或按季申报，具体按规定执行", "C": "开采时即时缴纳，无需申报", "D": "由纳税人自行决定期限"}, "answer": "B", "point": "资源税·申报期限", "explain": "资源税按月或按季申报，具体按规定执行；不是按年一次、无需申报或自行决定。", "type": "single"}]}, {"name": "查漏补缺 · 第七章 车辆购置税（10题）", "questions": [{"id": "tax1_cg_1", "stem": "下列各项中，属于车辆购置税应税车辆的是（ ）。", "options": {"A": "汽车", "B": "自行车", "C": "火车", "D": "飞机"}, "answer": "A", "point": "车辆购置税·征税范围", "explain": "车辆购置税应税车辆包括汽车、摩托车、电车、挂车、农用运输车等；自行车、火车、飞机均不是。", "type": "single"}, {"id": "tax1_cg_2", "stem": "下列各项中，属于车辆购置税应税车辆的有（ ）。", "options": {"A": "汽车", "B": "摩托车", "C": "电车", "D": "挂车", "E": "农用运输车"}, "answer": "ABCDE", "point": "车辆购置税·征税范围", "explain": "汽车、摩托车、电车、挂车、农用运输车均属应税车辆，本题所列五项全部属于。", "type": "multi"}, {"id": "tax1_cg_3", "stem": "某个人购买自用小汽车，向经销商支付不含增值税价款30万元，按题干给定车辆购置税税率10%计算，应纳车辆购置税为（ ）万元。", "answer": 3, "unit": "万元", "point": "车辆购置税·应纳税额", "explain": "计税价格＝30（万元）；应纳税额＝30×10%＝3（万元）。", "type": "calc"}, {"id": "tax1_cg_4", "stem": "某企业进口自用小汽车，关税完税价格80万元，关税20万元，消费税10万元，按题干给定车辆购置税税率10%计算，应纳车辆购置税为（ ）万元。", "answer": 11, "unit": "万元", "point": "车辆购置税·进口自用计税价格", "explain": "计税价格＝80＋20＋10＝110（万元）；应纳税额＝110×10%＝11（万元）。", "type": "calc"}, {"id": "tax1_cg_5", "stem": "下列各项中，属于车辆购置税免税车辆的有（ ）。", "options": {"A": "军用车辆", "B": "警用车辆", "C": "设有固定装置的非运输专用作业车辆", "D": "普通燃油乘用车", "E": "城市公交企业购置的公共汽电车辆（按规定）"}, "answer": "ABCE", "point": "车辆购置税·税收优惠", "explain": "军警车辆、设有固定装置的非运输专用作业车辆、按规定的城市公交车辆属免税车辆；普通燃油乘用车不是。", "type": "multi"}, {"id": "tax1_cg_6", "stem": "车辆购置税的纳税地点一般是（ ）。", "options": {"A": "车辆销售地一律", "B": "纳税人所在地", "C": "车辆生产地一律", "D": "车辆登记地一律"}, "answer": "B", "point": "车辆购置税·纳税地点", "explain": "车辆购置税在纳税人所在地缴纳；不是一律销售地、生产地或登记地。", "type": "single"}, {"id": "tax1_cg_7", "stem": "车辆购置税的申报纳税期限一般是（ ）。", "options": {"A": "购置之日起60日内申报纳税", "B": "购置之日起1年内申报纳税", "C": "车辆报废时申报纳税", "D": "无需申报纳税"}, "answer": "A", "point": "车辆购置税·申报期限", "explain": "纳税人应自购置之日起60日内申报纳税；不是1年、报废时或无需申报。", "type": "single"}, {"id": "tax1_cg_8", "stem": "下列关于车辆购置税退税的表述，正确的有（ ）。", "options": {"A": "已缴税车辆退回生产企业或经销商的，可按规定申请退税", "B": "车辆因质量问题退车的，可按规定退税", "C": "车辆正常使用多年后一律退税", "D": "退税须按规定提供有关证明", "E": "已完税车辆再次转让的，再次征收车辆购置税"}, "answer": "ABD", "point": "车辆购置税·退税", "explain": "退回生产企业或经销商、因质量问题退车的可按规定退税，退税须提供证明；正常使用多年不退税，已完税车辆再次转让不再征收。", "type": "multi"}, {"id": "tax1_cg_9", "stem": "免税条件消失的车辆，车辆购置税的处理是（ ）。", "options": {"A": "无需补税", "B": "按规定补缴车辆购置税", "C": "由原销售方补缴", "D": "按车辆残值的一半补缴"}, "answer": "B", "point": "车辆购置税·免税条件消失", "explain": "免税条件消失的车辆，应按规定补缴车辆购置税；不是无需补税、由销售方补缴或按残值一半补缴。", "type": "single"}, {"id": "tax1_cg_10", "stem": "车辆购置税实行（ ）。", "options": {"A": "多次征收", "B": "一次性征收", "C": "按年征收", "D": "按行驶里程征收"}, "answer": "B", "point": "车辆购置税·征收方式", "explain": "车辆购置税实行一次性征收，购置时缴纳一次；不是多次、按年或按里程征收。", "type": "single"}]}, {"name": "查漏补缺 · 第八章 环境保护税（10题）", "questions": [{"id": "tax1_hb_1", "stem": "下列各项中，属于环境保护税纳税人的是（ ）。", "options": {"A": "直接向环境排放应税污染物的企业", "B": "向污水集中处理场所排放污水的工厂", "C": "排放生活垃圾的居民个人", "D": "拥有机动车辆的个人"}, "answer": "A", "point": "环境保护税·纳税人", "explain": "直接向环境排放的企业事业单位和其他生产经营者是纳税人；向集中处理场所排放不属直接排放，个人不是纳税人。", "type": "single"}, {"id": "tax1_hb_2", "stem": "下列各项中，属于环境保护税免征情形的有（ ）。", "options": {"A": "农业生产排放应税污染物", "B": "机动车、船舶等流动污染源排放应税污染物（暂予免征）", "C": "向依法设立的污水集中处理场所排放应税污染物", "D": "企业直接向河流排放生产废水", "E": "依法设立的生活垃圾集中处理场所排放应税污染物（符合规定）"}, "answer": "ABCE", "point": "环境保护税·免征情形", "explain": "农业生产、流动污染源暂免、向集中处理场所排放、符合规定的生活垃圾集中处理均属免征或不属直接排放；直接向河流排放生产废水应征税。", "type": "multi"}, {"id": "tax1_hb_3", "stem": "某企业排放大气污染物，污染当量数为100，按题干给定税额标准每污染当量3元计算，应纳环境保护税为（ ）元。", "answer": 300, "unit": "元", "point": "环境保护税·应纳税额计算", "explain": "应纳税额＝100×3＝300（元）。", "type": "calc"}, {"id": "tax1_hb_4", "stem": "某企业排放二氧化硫200千克，污染当量值为1千克，按题干给定税额标准每污染当量2元计算，应纳环境保护税为（ ）元。", "answer": 400, "unit": "元", "point": "环境保护税·污染当量计算", "explain": "污染当量数＝200÷1＝200；应纳税额＝200×2＝400（元）。", "type": "calc"}, {"id": "tax1_hb_5", "stem": "下列关于环境保护税减征的表述，正确的有（ ）。", "options": {"A": "纳税人排放应税大气污染物浓度值低于规定标准一定比例的，可按规定减征", "B": "纳税人排放应税水污染物浓度值低于规定标准一定比例的，可按规定减征", "C": "所有纳税人一律减半征收", "D": "减征须按规定提供有关资料", "E": "浓度超标的也可减征"}, "answer": "ABD", "point": "环境保护税·减征", "explain": "大气与水污染物浓度低于标准一定比例可按规定减征，减征须提供资料；不是一律减半，超标也不能减征。", "type": "multi"}, {"id": "tax1_hb_6", "stem": "应税固体废物的环境保护税 径 A-B-D 工期为 3＋2＋3＝8 天；路径 A-C-D 工期为 3＋4＋2＝9 天。关键路径为 A-C-D，总工期为 9 天。自评清单：①是否列出两条完整路径；②两条路径工期是否分别算对 8 天与 9 天；③关键路径是否写对 A-C-D；④总工期是否写对 9 天。缺一项以上算错，进错题本。", "id": "rk_case2", "options": {}, "point": "软考中级·案例分析：关键路径计算", "stem": "案例：某项目任务依赖为 A→B、A→C、B→D、C→D，工期分别为 A 3 天、B 2 天、C 4 天、D 2 天。请写出全部路径、每条路径工期、关键路径与项目总工期，写完对照范文自评。", "type": "self"}]}], "rk_mid_neteng": [{"name": "第1套 · 软考中级网络工程师上午客观题（10题）", "questions": [{"id": "rknet_1", "stem": "将 192.168.10.0/25 划分为一个子网时，可用的主机地址有多少个？", "options": {"A": "254 个", "B": "126 个", "C": "62 个", "D": "30 个"}, "answer": "B", "point": "软考中级·网络基础：子网主机数", "explain": "/25 的主机位为 7 位，共 128 个地址，减去网络地址与广播地址，可用 126 个。", "type": "single"}, {"id": "rknet_2", "stem": "关于 RIP 与 OSPF 的说法，正确的是哪一项？", "options": {"A": "RIP 是链路状态协议，OSPF 是距离矢量协议", "B": "RIP 以跳数作为度量，最大跳数为 15 跳", "C": "OSPF 以跳数作为度量，收敛速度比 RIP 慢", "D": "RIP 适用于大型网络，OSPF 只适用于小型网络"}, "answer": "B", "point": "软考中级·路由协议：RIP与OSPF", "explain": "RIP 是距离矢量协议，以跳数为度量，15 跳为最大有效跳数，16 跳表示不可达；OSPF 是链路状态协议，收敛更快，适用于较大网络。", "type": "single"}, {"id": "rknet_3", "stem": "生成树协议 STP 的主要作用是什么？", "options": {"A": "提高链路带宽", "B": "消除交换网络中的环路，防止广播风暴", "C": "实现不同网段之间的路由", "D": "为无线网络分配地址"}, "answer": "B", "point": "软考中级·局域网：生成树协议", "explain": "STP 通过阻塞冗余链路消除环路，防止广播风暴；它不提高带宽，也不做路由或地址分配。", "type": "single"}, {"id": "rknet_4", "stem": "关于 VLAN 的说法，正确的是哪一项？", "options": {"A": "同一 VLAN 内的主机必须在同一物理交换机上", "B": "VLAN 可以隔离广播域，不同 VLAN 间通信需要三层设备", "C": "VLAN 只能按端口划分，不能按 MAC 地址划分", "D": "VLAN 的主要作用是提高物理链路速率"}, "answer": "B", "point": "软考中级·局域网：VLAN", "explain": "VLAN 是逻辑分组，不受物理位置限制；不同 VLAN 属于不同广播域，互访需要路由器或三层交换机；划分方式包括端口、MAC、协议等多种。", "type": "single"}, {"id": "rknet_5", "stem": "下列哪项属于对称加密算法？", "options": {"A": "RSA", "B": "DSA", "C": "AES", "D": "ECC"}, "answer": "C", "point": "软考中级·网络安全：对称加密", "explain": "AES 是对称加密算法，收发双方用同一密钥；RSA、DSA、ECC 属于非对称加密算法。", "type": "single"}, {"id": "rknet_6", "stem": "SNMP 协议主要用于什么？", "options": {"A": "域名解析", "B": "网络设备管理与监控", "C": "文件传输", "D": "邮件收发"}, "answer": "B", "point": "软考中级·网络管理：SNMP", "explain": "SNMP 是简单网络管理协议，用于管理与监控网络设备；域名解析是 DNS，文件传输是 FTP，邮件收发是 SMTP／POP3。", "type": "single"}, {"id": "rknet_7", "stem": "IEEE 802.11 标准主要对应哪种网络？", "options": {"A": "有线局域网", "B": "无线局域网", "C": "广域网", "D": "城域网"}, "answer": "B", "point": "软考中级·无线网络：802.11", "explain": "802.11 系列是无线局域网标准；有线局域网主要是 802.3 以太网标准。", "type": "single"}, {"id": "rknet_8", "stem": "关于防火墙的说法，正确的是哪一项？", "options": {"A": "防火墙可以防范所有内部攻击", "B": "防火墙主要用于控制网络边界的访问，隔离内外网络", "C": "防火墙可以替代杀毒软件", "D": "防火墙只能过滤 IP 地址，不能过滤端口"}, "answer": "B", "point": "软考中级·网络安全：防火墙", "explain": "防火墙部署在网络边界，按规则控制进出访问；它不能防范所有内部攻击，也不能替代杀毒软件，包过滤防火墙可以按 IP 与端口过滤。", "type": "single"}, {"id": "rknet_9", "stem": "VPN 技术的主要作用是什么？", "options": {"A": "提高局域网带宽", "B": "在公共网络上建立安全的专用通信通道", "C": "替代路由器实现路由", "D": "为每台主机分配固定公网地址"}, "answer": "B", "point": "软考中级·网络安全：VPN", "explain": "VPN 通过加密隧道在公共网络上建立安全的专用通道，实现远程安全接入；它不提高带宽，也不替代路由。", "type": "single"}, {"id": "rknet_10", "stem": "在 TCP／IP 模型中，负责将 IP 地址解析为 MAC 地址的协议是哪个？", "options": {"A": "DNS", "B": "DHCP", "C": "ARP", "D": "ICMP"}, "answer": "C", "point": "软考中级·TCP／IP：ARP", "explain": "ARP 用于 IP 地址到 MAC 地址的解析；DNS 是域名到 IP，DHCP 是动态分配地址，ICMP 是控制报文协议。", "type": "single"}]}], "ncre4_db": [{"name": "第1套 · NCRE四级数据库工程师客观题（10题）", "questions": [{"id": "ncredb_1", "stem": "数据库事务的 ACID 特性中，字母 A 代表的是什么？", "options": {"A": "一致性", "B": "原子性", "C": "隔离性", "D": "持久性"}, "answer": "B", "point": "NCRE四级·数据库事务：ACID", "explain": "ACID 分别为原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）、持久性（Durability）。", "type": "single"}, {"id": "ncredb_2", "stem": "在 SQL 中，删除整张表结构（包括数据与定义）应使用哪个语句？", "options": {"A": "DELETE FROM 表名", "B": "DROP TABLE 表名", "C": "TRUNCATE TABLE 表名", "D": "UPDATE 表名"}, "answer": "B", "point": "NCRE四级·SQL：DROP与DELETE", "explain": "DROP TABLE 删除表定义与数据；DELETE 只删除数据行，保留表结构；TRUNCATE 清空数据但保留结构；UPDATE 是修改数据。", "type": "single"}, {"id": "ncredb_3", "stem": "关于范式的说法，正确的是哪一项？", "options": {"A": "满足 BCNF 的关系模式一定满足第三范式", "B": "满足第三范式的关系模式一定满足 BCNF", "C": "满足第一范式的关系模式一定满足第二范式", "D": "BCNF 与第三范式没有包含关系"}, "answer": "A", "point": "NCRE四级·数据库设计：BCNF", "explain": "BCNF 比第三范式更严格，满足 BCNF 一定满足第三范式；满足第三范式不一定满足 BCNF，因为 BCNF 要求每个决定因素都是候选键。", "type": "single"}, {"id": "ncredb_4", "stem": "关系代数中，选择运算与投影运算的符号分别是哪一组？", "options": {"A": "选择 σ，投影 π", "B": "选择 π，投影 σ", "C": "选择 ⋈，投影 σ", "D": "选择 σ，投影 ⋈"}, "answer": "A", "point": "NCRE四级·关系代数：选择与投影", "explain": "σ 表示选择（按条件选行），π 表示投影（选列），⋈ 表示连接。", "type": "single"}, {"id": "ncredb_5", "stem": "在并发控制中，“丢失更新”是指什么现象？", "options": {"A": "两个事务读到同一数据后各自更新，后提交的覆盖了先提交的更新", "B": "一个事务读到了另一个事务未提交的数据", "C": "一个事务读到了另一个事务已提交的旧数据", "D": "两个事务互相等待对方释放锁"}, "answer": "A", "point": "NCRE四级·并发控制：丢失更新", "explain": "丢失更新是两个事务对同一数据更新时，后者覆盖前者；读未提交数据是脏读，互相等待是死锁。", "type": "single"}, {"id": "ncredb_6", "stem": "关于聚集索引的说法，正确的是哪一项？", "options": {"A": "聚集索引的叶节点存放的是数据行本身，数据按索引键顺序存放", "B": "聚集索引的叶节点只存放键值与指针", "C": "一张表可以有多个聚集索引", "D": "聚集索引与数据存放顺序无关"}, "answer": "A", "point": "NCRE四级·索引：聚集索引", "explain": "聚集索引决定数据行的物理存放顺序，叶节点就是数据行本身，一张表最多只能有一个聚集索引；只存键值与指针的是非聚集索引。", "type": "single"}, {"id": "ncredb_7", "stem": "E-R 图中，实体与实体之间的“一对多”联系通常记为什么？", "options": {"A": "1:1", "B": "1:N", "C": "M:N", "D": "N:1 且只能反向表示"}, "answer": "B", "point": "NCRE四级·E-R图：联系类型", "explain": "一对多记为 1:N；一对一为 1:1，多对多为 M:N。", "type": "single"}, {"id": "ncredb_8", "stem": "数据库恢复中，检查点（Checkpoint）的主要作用是什么？", "options": {"A": "删除所有日志", "B": "缩短恢复时需要扫描的日志量，加快恢复", "C": "阻止所有事务提交", "D": "将数据库改为只读"}, "answer": "B", "point": "NCRE四级·数据库恢复：检查点", "explain": "检查点定期将内存数据写入磁盘并记录位置，恢复时只需从最近检查点开始扫描日志，从而加快恢复；它不删除日志，也不阻止提交。", "type": "single"}, {"id": "ncredb_9", "stem": "关于数据仓库的说法，正确的是哪一项？", "options": {"A": "数据仓库是面向事务处理的，数据频繁更新", "B": "数据仓库是面向主题、集成、相对稳定、随时间变化的数据集合", "C": "数据仓库与操作型数据库完全相同", "D": "数据仓库中的数据不随时间变化"}, "answer": "B", "point": "NCRE四级·数据仓库：基本特征", "explain": "数据仓库面向主题、集成、相对稳定、随时间变化，用于分析决策；操作型数据库面向事务处理，数据频繁更新。", "type": "single"}, {"id": "ncredb_10", "stem": "在数据库系统中，触发器是一种什么机制？", "options": {"A": "由用户手动调用的存储过程", "B": "在特定数据操作发生时自动执行的特殊存储过程", "C": "用于备份数据库的工具", "D": "用于创建索引的语句"}, "answer": "B", "point": "NCRE四级·触发器", "explain": "触发器在 INSERT、UPDATE、DELETE 等事件发生时自动执行，不需要用户手动调用；它不是备份工具，也不是索引语句。", "type": "single"}]}], "ncre4_sec": [{"name": "第1套 · NCRE四级信息安全工程师客观题（10题）", "questions": [{"id": "ncre4sec_1", "stem": "下列哪项属于对称加密算法？", "options": {"A": "RSA", "B": "AES", "C": "DSA", "D": "ECC"}, "answer": "B", "point": "NCRE四级·信息安全：对称加密", "explain": "AES 是对称加密算法，收发双方用同一密钥；RSA、DSA、ECC 属于非对称加密。", "type": "single"}, {"id": "ncre4sec_2", "stem": "数字签名的主要作用是什么？", "options": {"A": "对数据加密防止窃听", "B": "验证发送者身份并保证数据未被篡改", "C": "提高网络传输速度", "D": "压缩数据体积"}, "answer": "B", "point": "NCRE四级·信息安全：数字签名", "explain": "数字签名用发送者私钥签名、接收者公钥验证，解决身份认证与完整性问题；它本身不负责保密传输。", "type": "single"}, {"id": "ncre4sec_3", "stem": "关于哈希函数（散列）的说法，正确的是哪一项？", "options": {"A": "哈希值长度随输入长度成比例增长", "B": "同一输入的哈希值每次计算都不同", "C": "哈希是单向的，难以从哈希值还原原始数据", "D": "哈希可以替代加密实现保密"}, "answer": "C", "point": "NCRE四级·信息安全：哈希函数", "explain": "哈希函数输出定长摘要，具有单向性与抗碰撞性；它用于完整性校验，不能替代加密实现保密。", "type": "single"}, {"id": "ncre4sec_4", "stem": "入侵检测系统（IDS）与入侵防御系统（IPS）的主要区别是什么？", "options": {"A": "IDS 只检测不阻断，IPS 可以主动阻断可疑流量", "B": "IDS 只能检测病毒，IPS 只能检测木马", "C": "IDS 部署在边界，IPS 只能部署在内网", "D": "两者功能完全相同，只是名称不同"}, "answer": "A", "point": "NCRE四级·信息安全：IDS与IPS", "explain": "IDS 以检测报警为主，一般不阻断流量；IPS 串联在流量路径上，可以丢弃或阻断可疑流量。", "type": "single"}, {"id": "ncre4sec_5", "stem": "下列哪种攻击属于社会工程学攻击？", "options": {"A": "SQL 注入", "B": "钓鱼邮件诱骗用户交出账号密码", "C": "DDoS 攻击", "D": "缓冲区溢出"}, "answer": "B", "point": "NCRE四级·信息安全：社会工程学", "explain": "社会工程学利用人的心理弱点骗取信息，钓鱼邮件是典型；SQL 注入、DDoS、缓冲区溢出属于技术型攻击。", "type": "single"}, {"id": "ncre4sec_6", "stem": "访问控制模型中，基于角色的访问控制简称为？", "options": {"A": "DAC", "B": "MAC", "C": "RBAC", "D": "ABAC"}, "answer": "C", "point": "NCRE四级·信息安全：访问控制", "explain": "RBAC 是基于角色的访问控制；DAC 是自主访问控制，MAC 是强制访问控制，ABAC 是基于属性的访问控制。", "type": "single"}, {"id": "ncre4sec_7", "stem": "下列哪项不是计算机病毒的常见特征？", "options": {"A": "传染性", "B": "潜伏性", "C": "可触发性", "D": "可公开审计性"}, "answer": "D", "point": "NCRE四级·信息安全：病毒特征", "explain": "病毒常见特征包括传染性、潜伏性、破坏性、可触发性等；可公开审计性不是病毒特征。", "type": "single"}, {"id": "ncre4sec_8", "stem": "SSL／TLS 协议主要工作在哪一层？", "options": {"A": "网络层", "B": "传输层与应用层之间（会话层附近）", "C": "数据链路层", "D": "物理层"}, "answer": "B", "point": "NCRE四级·信息安全：SSL／TLS", "explain": "SSL／TLS 位于传输层之上、应用层之下，为应用数据提供加密与认证，常见说法是工作在传输层与应用层之间。", "type": "single"}, {"id": "ncre4sec_9", "stem": "关于数字证书的说法，正确的是哪一项？", "options": {"A": "数字证书由用户自己签发即具有公信力", "B": "数字证书将公钥与持有者身份绑定，由 CA 签发", "C": "数字证书只能用于加密，不能用于身份认证", "D": "数字证书的有效期是永久的"}, "answer": "B", "point": "NCRE四级·信息安全：数字证书与CA", "explain": "数字证书由可信的证书颁发机构 CA 签发，把公钥与身份绑定，用于身份认证与密钥分发；证书有有效期。", "type": "single"}, {"id": "ncre4sec_10", "stem": "下列哪项是防范 DDoS 攻击的合理措施？", "options": {"A": "关闭所有网络服务", "B": "流量清洗与带宽扩容结合，配合访问限速", "C": "把服务器密码设得更长", "D": "只允许内网用户访问，不再对外提供服务"}, "answer": "B", "point": "NCRE四级·信息安全：DDoS防范", "explain": "DDoS 靠海量流量压垮服务，合理做法是流量清洗、扩容与限速结合；单纯改密码或关服务不能解决流量攻击。", "type": "single"}]}], "ncre4_embed": [{"name": "第1套 · NCRE四级嵌入式系统开发工程师客观题（10题）", "questions": [{"id": "ncre4emb_1", "stem": "嵌入式系统最典型的特征是什么？", "options": {"A": "通用性强，可运行任意大型软件", "B": "专用性强，软硬件结合，资源受限", "C": "必须有大容量硬盘", "D": "必须联网运行"}, "answer": "B", "point": "NCRE四级·嵌入式基础：系统特征", "explain": "嵌入式系统面向特定应用，软硬件紧密结合，处理器、内存、功耗都受限；它不是通用计算机。", "type": "single"}, {"id": "ncre4emb_2", "stem": "关于实时操作系统（RTOS）的说法，正确的是哪一项？", "options": {"A": "RTOS 的首要目标是任务在规定时间内完成", "B": "RTOS 的首要目标是运行速度最快", "C": "RTOS 不能用于中断处理", "D": "RTOS 与通用操作系统没有区别"}, "answer": "A", "point": "NCRE四级·嵌入式：RTOS", "explain": "RTOS 强调确定性与时限性，任务要在截止时间前完成；速度快不等于实时，通用系统不保证时限。", "type": "single"}, {"id": "ncre4emb_3", "stem": "ARM 处理器中，RISC 架构的主要特点是什么？", "options": {"A": "指令复杂，单条指令完成多步操作", "B": "指令简单规整，执行效率高，功耗较低", "C": "只能用于服务器", "D": "不适合嵌入式应用"}, "answer": "B", "point": "NCRE四级·嵌入式：ARM与RISC", "explain": "RISC 指令简单规整，利于流水线与低功耗，这正是 ARM 在嵌入式领域广泛应用的原因。", "type": "single"}, {"id": "ncre4emb_4", "stem": "在嵌入式系统中，Flash 存储器常用于什么？", "options": {"A": "存放运行时的临时变量", "B": "存放程序代码与掉电不丢失的数据", "C": "替代 CPU 进行计算", "D": "存放显示缓存"}, "answer": "B", "point": "NCRE四级·嵌入式：存储器", "explain": "Flash 是非易失存储器，掉电后数据不丢失，常存程序与配置；运行时临时变量放在 RAM 里。", "type": "single"}, {"id": "ncre4emb_5", "stem": "中断处理中，保存现场的主要目的是什么？", "options": {"A": "提高 CPU 主频", "B": "中断返回后能恢复被打断程序的执行状态", "C": "减少内存占用", "D": "关闭所有外设"}, "answer": "B", "point": "NCRE四级·嵌入式：中断", "explain": "中断会打断当前程序，保存寄存器等现场是为了中断处理完后能准确恢复原程序继续执行。", "type": "single"}, {"id": "ncre4emb_6", "stem": "GPIO 的全称含义最接近哪一项？", "options": {"A": "图形处理输出接口", "B": "通用输入输出接口", "C": "高速串行总线", "D": "电源管理模块"}, "answer": "B", "point": "NCRE四级·嵌入式：GPIO", "explain": "GPIO 是 General Purpose Input/Output，即通用输入输出接口，可由软件配置为输入或输出。", "type": "single"}, {"id": "ncre4emb_7", "stem": "关于看门狗（Watchdog）的作用，正确的是哪一项？", "options": {"A": "防止程序跑飞，超时未喂狗则复位系统", "B": "监控网络流量", "C": "加密通信数据", "D": "管理文件系统"}, "answer": "A", "point": "NCRE四级·嵌入式：看门狗", "explain": "看门狗定时器需要程序定期“喂狗”，超时未喂说明程序可能跑飞或死机，看门狗会复位系统恢复运行。", "type": "single"}, {"id": "ncre4emb_8", "stem": "I2C 总线最显著的特点是什么？", "options": {"A": "需要很多根信号线", "B": "只需两根线（时钟与数据），可挂多个设备", "C": "只能一对一通信", "D": "传输距离可达数公里"}, "answer": "B", "point": "NCRE四级·嵌入式：I2C总线", "explain": "I2C 只用 SCL 时钟线与 SDA 数据线，通过地址区分多个从设备，适合板内短距离低速通信。", "type": "single"}, {"id": "ncre4emb_9", "stem": "嵌入式开发中，交叉编译是指什么？", "options": {"A": "在目标板上直接编译程序", "B": "在宿主机上为不同架构的目标机编译程序", "C": "同时编译两个版本的程序", "D": "用两种语言混合编写程序"}, "answer": "B", "point": "NCRE四级·嵌入式：交叉编译", "explain": "嵌入式目标机资源有限，常在性能更强的宿主机上，用交叉编译器生成目标机架构的可执行程序。", "type": "single"}, {"id": "ncre4emb_10", "stem": "下列哪项是降低嵌入式系统功耗的合理做法？", "options": {"A": "让 CPU 始终满频运行", "B": "空闲时进入低功耗模式，按需调整主频", "C": "关闭所有中断", "D": "增大供电电压"}, "answer": "B", "point": "NCRE四级·嵌入式：低功耗设计", "explain": "低功耗设计常用空闲休眠、动态调频调压等方法；始终满频、增大电压都会增加功耗。", "type": "single"}]}], "rk_mid_supervisor": [{"name": "第1套 · 软考中级信息系统监理师上午客观题（10题）", "questions": [{"id": "rksup_1", "stem": "信息系统工程监理中，“三控”通常指什么？", "options": {"A": "质量控制、进度控制、投资控制", "B": "人员控制、设备控制、材料控制", "C": "需求控制、设计控制、测试控制", "D": "安全控制、保密控制、风险控制"}, "answer": "A", "point": "软考中级·监理：三控", "explain": "监理的“三控”即质量控制、进度控制、投资控制；“三管一协调”中的三管是合同管理、信息管理、安全管理，协调是组织协调。", "type": "single"}, {"id": "rksup_2", "stem": "监理规划一般由谁编制，并经谁批准后实施？", "options": {"A": "承建单位编制，建设单位批准", "B": "总监理工程师编制，监理单位技术负责人批准", "C": "建设单位编制，承建单位批准", "D": "监理员编制，总监理工程师批准"}, "answer": "B", "point": "软考中级·监理：监理规划", "explain": "监理规划由总监理工程师主持编制，经监理单位技术负责人批准后实施，是监理工作的指导性文件。", "type": "single"}, {"id": "rksup_3", "stem": "旁站监理主要适用于什么情形？", "options": {"A": "所有会议", "B": "关键部位、关键工序的施工或实施过程", "C": "文档编写", "D": "设备采购谈判"}, "answer": "B", "point": "软考中级·监理：旁站", "explain": "旁站是在关键部位、关键工序实施过程中，监理人员在现场跟班监督检查，出现问题及时处理。", "type": "single"}, {"id": "rksup_4", "stem": "关于监理单位与建设单位、承建单位关系的说法，正确的是哪一项？", "options": {"A": "监理单位是建设单位的下属部门", "B": "监理单位受建设单位委托，独立、公正地开展监理，与承建单位没有隶属关系", "C": "监理单位受承建单位领导", "D": "监理单位可以同时承接同一项目的建设任务"}, "answer": "B", "point": "软考中级·监理：独立公正", "explain": "监理单位受建设单位委托，依法独立、公正执业；它与承建单位没有隶属关系，也不得同时承担同一项目的建设任务以免利益冲突。", "type": "single"}, {"id": "rksup_5", "stem": "工程变更控制中，变更申请一般首先由谁提出并经监理审核？", "options": {"A": "只能由建设单位提出", "B": "建设、承建或监理任一方均可提出，按程序经监理审核、建设单位批准", "C": "只能由监理单位提出", "D": "变更不需要任何审批"}, "answer": "B", "point": "软考中级·监理：变更控制", "explain": "变更可由多方提出，但必须按程序经监理审核和建设单位批准后才能实施，未经批准不得擅自变更。", "type": "single"}, {"id": "rksup_6", "stem": "监理日志的主要作用是什么？", "options": {"A": "记录监理人员考勤", "B": "真实记录工程实施过程，为验收和争议处理提供依据", "C": "代替竣工报告", "D": "记录设备价格"}, "answer": "B", "point": "软考中级·监理：监理日志", "explain": "监理日志按日记录施工、检查、问题与处理情况，是工程过程的真实记录，也是验收和争议处理的重要依据。", "type": "single"}, {"id": "rksup_7", "stem": "在质量控制中，隐蔽工程在覆盖前必须经过什么程序？", "options": {"A": "承建单位自行覆盖即可", "B": "报监理检查验收合格后方可覆盖", "C": "只需拍照留存", "D": "等到竣工时再检查"}, "answer": "B", "point": "软考中级·监理：隐蔽工程验收", "explain": "隐蔽工程覆盖前必须报监理检查验收，合格后才能进入下一道工序，否则事后难以检查，质量责任不清。", "type": "single"}, {"id": "rksup_8", "stem": "下列哪项属于监理的合同管理工作？", "options": {"A": "编写用户手册", "B": "协助建设单位处理合同争议，监督合同履行", "C": "开发应用软件", "D": "采购办公设备"}, "answer": "B", "point": "软考中级·监理：合同管理", "explain": "合同管理包括监督合同履行、处理变更与索赔、协助解决合同争议等；开发软件、编写用户手册是承建单位的工作。", "type": "single"}, {"id": "rksup_9", "stem": "监理实施细则与监理规划的关系是？", "options": {"A": "实施细则是规划的细化，针对专业或分项工程编制", "B": "两者完全相同", "C": "实施细则可以替代规划", "D": "规划是实施细则的附件"}, "answer": "A", "point": "软考中级·监理：实施细则", "explain": "监理规划是总体指导文件，实施细则是针对某一专业或分项工程的操作性细化文件，两者是总体与具体的关系。", "type": "single"}, {"id": "rksup_10", "stem": "工程验收时，监理单位的主要职责是什么？", "options": {"A": "代替建设单位签字接收", "B": "对工程质量进行评估，提出监理评估意见", "C": "负责工程的后期运维", "D": "编制决算报告"}, "answer": "B", "point": "软考中级·监理：验收评估", "explain": "验收时监理单位应对工程质量作出评估并出具意见，供建设单位组织验收参考；接收与运维、决算不是监理单位的职责。", "type": "single"}]}], "rk_mid_integration": [{"name": "第1套 · 软考中级系统集成项目管理工程师上午客观题（10题）", "questions": [{"id": "rkint_1", "stem": "项目管理中，范围基准不包括哪一项？", "options": {"A": "范围说明书", "B": "工作分解结构（WBS）", "C": "WBS 词典", "D": "项目章程"}, "answer": "D", "point": "软考中级·集成管理：范围基准", "explain": "范围基准由范围说明书、WBS 和 WBS 词典组成；项目章程是项目启动的授权文件，不属于范围基准。", "type": "single"}, {"id": "rkint_2", "stem": "挣值管理中，成本绩效指数 CPI 的计算公式是？", "options": {"A": "CPI = EV / AC", "B": "CPI = EV / PV", "C": "CPI = AC / EV", "D": "CPI = PV / EV"}, "answer": "A", "point": "软考中级·集成管理：挣值", "explain": "CPI = 挣值 EV / 实际成本 AC，CPI 大于 1 表示成本节约，小于 1 表示成本超支；EV / PV 是进度绩效指数 SPI。", "type": "single"}, {"id": "rkint_3", "stem": "某项目 EV = 80 万元，AC = 100 万元，PV = 90 万元，则该项目处于什么状态？", "options": {"A": "进度超前、成本节约", "B": "进度落后、成本超支", "C": "进度超前、成本超支", "D": "进度落后、成本节约"}, "answer": "B", "point": "软考中级·集成管理：挣值判断", "explain": "SPI = EV / PV = 80 / 90 < 1，进度落后；CPI = EV / AC = 80 / 100 < 1，成本超支。", "type": "single"}, {"id": "rkint_4", "stem": "关键路径法中，活动的总时差是指？", "options": {"A": "活动的最早开始与最晚开始之差", "B": "活动的持续时间", "C": "活动的最早完成时间", "D": "项目总工期的一半"}, "answer": "A", "point": "软考中级·集成管理：关键路径", "explain": "总时差 = 最晚开始 - 最早开始（也等于最晚完成 - 最早完成），关键路径上活动的总时差为零。", "type": "single"}, {"id": "rkint_5", "stem": "风险管理中，针对高概率、高影响的风险，通常优先采取的策略是？", "options": {"A": "接受", "B": "回避或减轻", "C": "转移给保险公司即可", "D": "不采取任何措施"}, "answer": "B", "point": "软考中级·集成管理：风险应对", "explain": "高概率高影响的风险应优先回避或减轻，降低其发生概率或影响；接受只适用于低风险，转移并不能消除风险本身。", "type": "single"}, {"id": "rkint_6", "stem": "关于项目干系人的说法，正确的是哪一项？", "options": {"A": "干系人只包括项目团队成员", "B": "干系人包括所有受项目影响或能影响项目的人和组织", "C": "干系人只在项目启动时识别一次", "D": "干系人管理不需要沟通"}, "answer": "B", "point": "软考中级·集成管理：干系人", "explain": "干系人范围很广，包括客户、用户、团队、供应商、监管方等，且需在项目全过程持续识别和管理，沟通是核心手段。", "type": "single"}, {"id": "rkint_7", "stem": "质量管理中，帕累托图主要用于什么？", "options": {"A": "显示工序随时间的变化", "B": "找出造成大多数问题的主要原因", "C": "判断过程是否受控", "D": "表示两个变量的相关性"}, "answer": "B", "point": "软考中级·集成管理：质量工具", "explain": "帕累托图按原因频率排序，体现“少数原因造成多数问题”，用于抓住主要矛盾；控制图用于判断过程受控，散点图用于相关性。", "type": "single"}, {"id": "rkint_8", "stem": "采购管理中，固定总价合同对买方的主要风险是什么？", "options": {"A": "卖方成本超支全部由买方承担", "B": "范围不清时卖方可能以变更索赔，买方仍需承担范围变更成本", "C": "买方无法控制质量", "D": "合同价格会随市场自动调整"}, "answer": "B", "point": "软考中级·集成管理：采购合同", "explain": "固定总价合同下卖方承担成本风险，但如果范围定义不清，卖方会通过变更索赔，买方仍要为范围变更买单；价格本身不自动调整。", "type": "single"}, {"id": "rkint_9", "stem": "项目整体管理中，实施整体变更控制的主要作用是什么？", "options": {"A": "拒绝一切变更", "B": "审查、批准或否决变更请求，并管理变更对各方面的影响", "C": "只记录变更，不做审批", "D": "把变更全部交给客户决定"}, "answer": "B", "point": "软考中级·集成管理：整体变更控制", "explain": "整体变更控制是审查所有变更请求、批准或否决，并协调变更对范围、进度、成本、质量等各方面的影响，不是拒绝一切变更。", "type": "single"}, {"id": "rkint_10", "stem": "沟通管理中，沟通渠道数量的计算公式是？", "options": {"A": "n × (n - 1)", "B": "n × (n - 1) / 2", "C": "n + 1", "D": "2n"}, "answer": "B", "point": "软考中级·集成管理：沟通渠道", "explain": "n 个人之间的沟通渠道数为 n(n-1)/2；例如 10 人时为 45 条。", "type": "single"}]}], "rk_mid_sysmgmt": [{"name": "第1套 · 软考中级信息系统管理工程师上午客观题（10题）", "questions": [{"id": "rksys_1", "stem": "IT 服务管理中，ITIL 的核心思想最接近哪一项？", "options": {"A": "以技术为中心，越先进越好", "B": "以客户需求为中心，用流程化方法提供高质量 IT 服务", "C": "只管硬件维修", "D": "不需要任何流程"}, "answer": "B", "point": "软考中级·系统管理：ITIL", "explain": "ITIL 是 IT 服务管理最佳实践框架，强调以客户和服务为中心，通过规范流程持续提供符合业务需求的服务。", "type": "single"}, {"id": "rksys_2", "stem": "信息系统运行维护中，事件管理与问题管理的区别是？", "options": {"A": "事件管理解决根本原因，问题管理恢复服务", "B": "事件管理尽快恢复服务，问题管理找出并消除根本原因", "C": "两者完全相同", "D": "事件管理只处理硬件故障"}, "answer": "B", "point": "软考中级·系统管理：事件与问题", "explain": "事件管理目标是尽快恢复正常服务，减少影响；问题管理目标是找出事件的根本原因并消除，防止重复发生。", "type": "single"}, {"id": "rksys_3", "stem": "系统性能管理中，系统响应时间通常指什么？", "options": {"A": "CPU 主频", "B": "用户发出请求到收到结果的时间", "C": "硬盘容量", "D": "网络带宽"}, "answer": "B", "point": "软考中级·系统管理：性能指标", "explain": "响应时间是用户视角的指标，即从发出请求到得到结果的时间；主频、容量、带宽是影响因素，不是响应时间本身。", "type": "single"}, {"id": "rksys_4", "stem": "关于系统备份策略，增量备份与差异备份的区别是？", "options": {"A": "增量备份备份自上次任何备份以来的变化，差异备份备份自上次完全备份以来的变化", "B": "两者完全相同", "C": "增量备份每次都备份全部数据", "D": "差异备份备份速度最快、恢复最慢"}, "answer": "A", "point": "软考中级·系统管理：备份策略", "explain": "增量备份只备自上次备份（完全或增量）以来的变化，备份快但恢复需多份；差异备份备自上次完全备份以来的变化，恢复只需完全加一份差异。", "type": "single"}, {"id": "rksys_5", "stem": "信息系统安全管理中，访问控制的首要原则是什么？", "options": {"A": "默认允许，事后审计", "B": "最小权限原则：只给完成工作必需的权限", "C": "所有人都有管理员权限", "D": "权限越大越安全"}, "answer": "B", "point": "软考中级·系统管理：最小权限", "explain": "最小权限原则要求每个用户和程序只获得完成任务必需的最小权限，以减少误操作和越权带来的损失。", "type": "single"}, {"id": "rksys_6", "stem": "系统故障处理中，故障恢复后首先应该做什么？", "options": {"A": "立即删除故障记录", "B": "确认服务恢复正常，并记录故障原因与处理过程", "C": "更换所有设备", "D": "通知所有用户故障已不存在即可"}, "answer": "B", "point": "软考中级·系统管理：故障处理", "explain": "恢复后要先验证服务确实正常，再完整记录故障现象、原因与处理过程，为问题管理和预防复发提供依据。", "type": "single"}, {"id": "rksys_7", "stem": "关于信息系统资产管理，正确的做法是？", "options": {"A": "只登记硬件，不登记软件", "B": "对软硬件资产登记造册，明确责任人，定期盘点", "C": "资产可以随意调拨，不需记录", "D": "报废资产不需要审批"}, "answer": "B", "point": "软考中级·系统管理：资产管理", "explain": "资产管理要覆盖软硬件，登记造册、明确责任人、定期盘点，调拨与报废都要按流程审批和记录。", "type": "single"}, {"id": "rksys_8", "stem": "系统运行维护的服务级别协议（SLA）主要约定什么？", "options": {"A": "服务提供方与客户之间的服务内容、指标与责任", "B": "员工工资标准", "C": "设备采购价格", "D": "软件源代码归属"}, "answer": "A", "point": "软考中级·系统管理：SLA", "explain": "SLA 是服务提供方与客户之间的协议，约定服务内容、可用性、响应时间等指标及双方责任，是衡量服务质量的依据。", "type": "single"}, {"id": "rksys_9", "stem": "在系统变更管理中，变更实施前必须经过什么？", "options": {"A": "直接实施，事后补手续", "B": "变更申请、评估影响、审批通过后，按计划实施并验证", "C": "只需口头通知", "D": "变更不需要回退方案"}, "answer": "B", "point": "软考中级·系统管理：变更管理", "explain": "正规变更流程是申请、影响评估、审批、按计划实施、验证效果，并准备回退方案；先实施后补手续是违规操作。", "type": "single"}, {"id": "rksys_10", "stem": "关于系统文档管理，正确的做法是？", "options": {"A": "文档只在项目结束时补写", "B": "文档随系统同步更新，版本受控，便于交接和运维", "C": "文档越少越好", "D": "文档可以不与实际系统一致"}, "answer": "B", "point": "软考中级·系统管理：文档管理", "explain": "系统文档要随系统变化同步更新并做版本控制，否则交接和运维时无据可依；事后补写、与实际不符都会埋下隐患。", "type": "single"}]}], "rk_mid_infosec": [{"name": "第1套 · 软考中级信息安全工程师上午客观题（10题）", "questions": [{"id": "rksec_1", "stem": "包过滤防火墙主要依据什么来决定是否放行数据包？", "options": {"A": "数据包的内容语义", "B": "源/目的 IP、端口和协议类型等包头信息", "C": "用户的口令强度", "D": "网站的美观程度"}, "answer": "B", "point": "软考中级·信息安全：包过滤防火墙", "explain": "包过滤防火墙工作在网络层，按包头中的地址、端口、协议等规则过滤，不解析应用层语义。", "type": "single"}, {"id": "rksec_2", "stem": "数字信封技术结合了哪两种加密方式的优点？", "options": {"A": "只用对称加密", "B": "只用非对称加密", "C": "用非对称加密保护对称密钥，用对称加密加密数据", "D": "不用任何加密"}, "answer": "C", "point": "软考中级·信息安全：数字信封", "explain": "数字信封先用对称密钥加密数据，再用接收方公钥加密对称密钥，兼顾速度与密钥分发安全。", "type": "single"}, {"id": "rksec_3", "stem": "关于密钥管理，正确的做法是？", "options": {"A": "密钥长期不变最安全", "B": "密钥应定期更换，作废密钥及时销毁，密钥与密文分开保管", "C": "密钥可以写在代码里公开", "D": "所有用户共用一个密钥最方便"}, "answer": "B", "point": "软考中级·信息安全：密钥管理", "explain": "密钥管理要求定期更换、及时作废销毁、分开保管；长期不变、写进代码、共用密钥都会放大泄露风险。", "type": "single"}, {"id": "rksec_4", "stem": "信息安全风险评估的一般顺序是？", "options": {"A": "先定风险等级，再识别资产", "B": "资产识别、威胁识别、脆弱性识别、风险分析与评价", "C": "先买设备，再评估", "D": "只评估技术漏洞，不评估管理漏洞"}, "answer": "B", "point": "软考中级·信息安全：风险评估", "explain": "风险评估先识别资产与价值，再识别威胁与脆弱性，最后分析风险并评价等级；技术与管理漏洞都要评估。", "type": "single"}, {"id": "rksec_5", "stem": "安全审计的主要作用是什么？", "options": {"A": "提高网速", "B": "记录和审查系统活动，发现违规与异常，为追责提供证据", "C": "加密所有数据", "D": "替代备份"}, "answer": "B", "point": "软考中级·信息安全：安全审计", "explain": "审计通过记录用户操作、系统事件等，发现违规与异常并留存证据；它不直接提高网速或加密数据。", "type": "single"}, {"id": "rksec_6", "stem": "下列哪项属于物理安全范畴？", "options": {"A": "口令策略", "B": "机房门禁、防火防水、防电磁干扰", "C": "入侵检测规则", "D": "病毒库更新"}, "answer": "B", "point": "软考中级·信息安全：物理安全", "explain": "物理安全保护设备与环境，包括门禁、防火、防水、防雷、防电磁干扰等；口令、检测规则、病毒库属于逻辑与技术安全。", "type": "single"}, {"id": "rksec_7", "stem": "在访问控制中，强制访问控制（MAC）的特点是？", "options": {"A": "资源所有者自行决定授权", "B": "由系统按安全级别强制决定访问，个人不能随意更改", "C": "按角色分配权限", "D": "不需要任何标识"}, "answer": "B", "point": "软考中级·信息安全：MAC", "explain": "MAC 由系统根据主体与客体的安全级别强制执行，个人不能自行授权；自主访问控制（DAC）才由所有者决定。", "type": "single"}, {"id": "rksec_8", "stem": "关于网络安全等级保护，等级越高意味着？", "options": {"A": "保护要求越低", "B": "遭到破坏后对国家、社会、个人的危害越大，保护要求越高", "C": "只需要技术措施", "D": "与业务重要性无关"}, "answer": "B", "point": "软考中级·信息安全：等级保护", "explain": "等级保护按系统遭到破坏后的危害程度定级，等级越高，危害越大，技术与管理保护要求也越高。", "type": "single"}, {"id": "rksec_9", "stem": "下列哪种行为属于拒绝服务攻击的特征？", "options": {"A": "窃取用户密码", "B": "用大量请求耗尽目标资源，使正常用户无法获得服务", "C": "篡改网页文字", "D": "冒充他人身份登录"}, "answer": "B", "point": "软考中级·信息安全：拒绝服务", "explain": "拒绝服务攻击的核心是耗尽带宽、连接或计算资源，导致正常服务不可用；窃取、篡改、冒充属于其他类型攻击。", "type": "single"}, {"id": "rksec_10", "stem": "数据备份与容灾的区别最接近哪一项？", "options": {"A": "备份是事后恢复数据，容灾是在异地建立可接管业务的系统", "B": "两者完全相同", "C": "容灾不需要备份", "D": "备份只能在本地做"}, "answer": "A", "point": "软考中级·信息安全：备份与容灾", "explain": "备份侧重把数据复制保存以便恢复；容灾侧重在灾难时异地系统能快速接管业务，保证业务连续性。", "type": "single"}]}], "rk_mid_dbeng": [{"name": "第1套 · 软考中级数据库系统工程师上午客观题（10题）", "questions": [{"id": "rkdb_1", "stem": "关系数据库中，候选键的定义最接近哪一项？", "options": {"A": "唯一能标识元组的属性或属性组，且其真子集不能标识元组", "B": "任意一个属性", "C": "只能是单个属性", "D": "必须包含所有属性"}, "answer": "A", "point": "软考中级·数据库：候选键", "explain": "候选键是能唯一标识元组的最小属性组：能标识，且去掉任何一个属性就不能标识；一个关系可以有多个候选键。", "type": "single"}, {"id": "rkdb_2", "stem": "视图的主要优点不包括哪一项？", "options": {"A": "简化复杂查询", "B": "提供数据安全性与逻辑独立性", "C": "视图中数据是独立存储的副本", "D": "按用户需求定制数据呈现"}, "answer": "C", "point": "软考中级·数据库：视图", "explain": "视图是虚表，本身不独立存储数据，查询时从基表导出；它的优点是简化查询、保护数据、提供逻辑独立性。", "type": "single"}, {"id": "rkdb_3", "stem": "在 SQL 中，定义外键约束的关键字是？", "options": {"A": "PRIMARY KEY", "B": "FOREIGN KEY", "C": "UNIQUE", "D": "CHECK"}, "answer": "B", "point": "软考中级·数据库：SQL约束", "explain": "FOREIGN KEY 定义外键，保证参照完整性；PRIMARY KEY 是主键，UNIQUE 是唯一，CHECK 是检查约束。", "type": "single"}, {"id": "rkdb_4", "stem": "两段锁协议要求事务的加锁与解锁阶段满足什么？", "options": {"A": "可以随时加锁和解锁", "B": "加锁阶段不能解锁，解锁阶段不能再加锁", "C": "只能加读锁", "D": "只能加写锁"}, "answer": "B", "point": "软考中级·数据库：两段锁", "explain": "两段锁协议把事务分为增长阶段（只加锁）和收缩阶段（只解锁），满足该协议的并发调度是可串行化的。", "type": "single"}, {"id": "rkdb_5", "stem": "死锁预防中，一次封锁法的缺点是什么？", "options": {"A": "会产生死锁", "B": "事务开始时要一次加全部锁，降低了并发度", "C": "不能保证可串行化", "D": "只能用于读操作"}, "answer": "B", "point": "软考中级·数据库：死锁预防", "explain": "一次封锁法要求事务开始就申请全部锁，避免了死锁，但锁持有时间长、并发度低，资源利用率不高。", "type": "single"}, {"id": "rkdb_6", "stem": "数据库恢复中，日志先写原则（WAL）是指？", "options": {"A": "先写数据，再写日志", "B": "对数据的修改必须先写入日志，日志写入磁盘后才能写数据", "C": "日志可以不写入磁盘", "D": "只记录成功的事务"}, "answer": "B", "point": "软考中级·数据库：WAL", "explain": "WAL 要求修改数据前先把日志写入磁盘，这样崩溃后才能用日志重做或撤销，保证恢复的正确性。", "type": "single"}, {"id": "rkdb_7", "stem": "函数依赖中，若 X 决定 Y，且 Y 的真子集也能被 X 决定，则称为什么？", "options": {"A": "完全函数依赖", "B": "部分函数依赖", "C": "传递函数依赖", "D": "多值依赖"}, "answer": "B", "point": "软考中级·数据库：函数依赖", "explain": "部分函数依赖指 Y 部分依赖于 X，即 X 的真子集就能决定 Y 的一部分；完全依赖要求 X 的任何真子集都不能决定 Y。", "type": "single"}, {"id": "rkdb_8", "stem": "关于存储过程，正确的是哪一项？", "options": {"A": "存储过程在客户端每次都要重新编译", "B": "存储过程预编译后存在数据库中，可被多次调用，减少网络往返", "C": "存储过程不能带参数", "D": "存储过程只能用于查询"}, "answer": "B", "point": "软考中级·数据库：存储过程", "explain": "存储过程预编译并存储在数据库服务器上，可带参数、多次调用，减少客户端与服务器之间的往返。", "type": "single"}, {"id": "rkdb_9", "stem": "分布式数据库中，数据分片的主要目的不包括？", "options": {"A": "把数据按规则分布到不同场地", "B": "提高局部访问效率", "C": "让所有场地都保存全量数据", "D": "支持并行处理"}, "answer": "C", "point": "软考中级·数据库：数据分片", "explain": "分片是把数据按水平或垂直规则分布到不同场地，提高局部性与并行性；所有场地都存全量数据叫复制，不是分片。", "type": "single"}, {"id": "rkdb_10", "stem": "数据库完整性约束中，实体完整性要求什么？", "options": {"A": "外键不能为空", "B": "主键不能为空且不能重复", "C": "所有字段都不能为空", "D": "数据必须符合业务规则"}, "answer": "B", "point": "软考中级·数据库：实体完整性", "explain": "实体完整性要求主键值不能为空且唯一，标识每条记录；外键约束属于参照完整性，业务规则属于用户定义完整性。", "type": "single"}]}], "rk_mid_media": [{"name": "第1套 · 软考中级多媒体应用设计师上午客观题（10题）", "questions": [{"id": "rkmed_1", "stem": "RGB 颜色模型中，R、G、B 三个分量各为 8 位时，一共能表示多少种颜色？", "options": {"A": "256 种", "B": "65536 种", "C": "约 1677 万种", "D": "无限种"}, "answer": "C", "point": "软考中级·多媒体：RGB颜色", "explain": "每分量 8 位即 256 级，三分量组合为 256×256×256 = 16777216 种，约 1677 万种。", "type": "single"}, {"id": "rkmed_2", "stem": "印刷领域常用 CMYK 颜色模型，其中的 K 代表什么？", "options": {"A": "红色", "B": "蓝色", "C": "黑色", "D": "黄色"}, "answer": "C", "point": "软考中级·多媒体：CMYK", "explain": "CMYK 中的 C 青、M 品红、Y 黄、K 黑；K 用黑色墨水提高暗部表现并节省彩色墨水。", "type": "single"}, {"id": "rkmed_3", "stem": "关于 JPEG 图像压缩，正确的是哪一项？", "options": {"A": "JPEG 是无损压缩", "B": "JPEG 是有损压缩，适合连续色调图像如照片", "C": "JPEG 只能压缩黑白图像", "D": "JPEG 压缩后文件一定比 BMP 小 100 倍"}, "answer": "B", "point": "软考中级·多媒体：JPEG", "explain": "JPEG 采用离散余弦变换等有损压缩，适合照片等连续色调图像；压缩比取决于质量参数，不是固定倍数。", "type": "single"}, {"id": "rkmed_4", "stem": "音频采样中，采样频率 44.1kHz 的含义是？", "options": {"A": "每秒采样 44100 次", "B": "每分钟采样 44100 次", "C": "声音频率为 44100Hz", "D": "文件大小为 44.1KB"}, "answer": "A", "point": "软考中级·多媒体：音频采样", "explain": "采样频率是每秒对声音采样的次数，44.1kHz 即每秒 44100 次，是 CD 音质的常用采样率。", "type": "single"}, {"id": "rkmed_5", "stem": "MIDI 与波形音频（WAV）的主要区别是？", "options": {"A": "MIDI 记录的是声音波形", "B": "MIDI 记录的是演奏指令，文件小但依赖音源还原音色", "C": "MIDI 只能录人声", "D": "两者完全相同"}, "answer": "B", "point": "软考中级·多媒体：MIDI", "explain": "MIDI 记录音符、力度、乐器等演奏指令，不记录波形，文件很小，播放效果取决于音源。", "type": "single"}, {"id": "rkmed_6", "stem": "视频帧率 30fps 的含义是？", "options": {"A": "每秒播放 30 帧画面", "B": "视频总共 30 帧", "C": "每分钟播放 30 帧", "D": "视频时长 30 秒"}, "answer": "A", "point": "软考中级·多媒体：视频帧率", "explain": "fps 是每秒帧数，30fps 即每秒 30 帧，帧率越高运动越流畅，数据量也越大。", "type": "single"}, {"id": "rkmed_7", "stem": "下列哪种视频压缩标准常用于网络流媒体？", "options": {"A": "BMP", "B": "H.264", "C": "TIFF", "D": "WAV"}, "answer": "B", "point": "软考中级·多媒体：视频压缩", "explain": "H.264 是广泛用于流媒体与存储的视频压缩标准；BMP、TIFF 是图像格式，WAV 是音频格式。", "type": "single"}, {"id": "rkmed_8", "stem": "图像分辨率 1920×1080 表示什么？", "options": {"A": "图像文件大小为 1920KB", "B": "图像宽 1920 像素、高 1080 像素", "C": "图像有 1920 种颜色", "D": "显示器尺寸为 1920 英寸"}, "answer": "B", "point": "软考中级·多媒体：分辨率", "explain": "分辨率是图像的像素尺寸，1920×1080 即宽 1920 像素、高 1080 像素，总像素约 207 万。", "type": "single"}, {"id": "rkmed_9", "stem": "在多媒体创作中，交互设计首先要考虑的是？", "options": {"A": "特效越华丽越好", "B": "用户任务与操作路径是否清晰易用", "C": "文件越大越好", "D": "颜色越鲜艳越好"}, "answer": "B", "point": "软考中级·多媒体：交互设计", "explain": "交互设计以用户任务为中心，路径清晰、操作可预期、反馈及时比华丽特效更重要。", "type"
