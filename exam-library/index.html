<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考试库 · 通用刷题引擎</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#15803d;--bad:#dc2626}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:9;background:#111827;color:#fff;padding:12px 16px}
  header h1{margin:0;font-size:17px}
  header p{margin:4px 0 0;font-size:12px;color:#9ca3af}
  header select{width:100%;margin-top:10px;padding:9px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
  nav{display:flex;gap:8px;padding:10px 12px;position:sticky;top:118px;z-index:9;background:var(--bg)}
  nav button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px}
  nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  main{padding:4px 12px 40px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .setbtn{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin:10px 0;font-size:15px}
  .setbtn small{color:var(--sub)}
  .qtag{font-size:12px;color:var(--acc);font-weight:600}
  .stem{font-size:15px;line-height:1.65;margin:8px 0 10px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;line-height:1.5}
  .opt.sel{border-color:var(--acc);background:#eff6ff}
  .opt.right{border-color:var(--ok);background:#f0fdf4}
  .opt.wrong{border-color:var(--bad);background:#fef2f2}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .exp{display:none;margin-top:10px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
  .exp.show{display:block}
  .verdict{font-weight:700}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  input.num,textarea.ans{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  textarea.ans{min-height:140px;line-height:1.6}
  .meta{color:var(--sub);font-size:12.5px}
  .score{font-size:26px;font-weight:800}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}
  .timer{font-variant-numeric:tabular-nums;font-weight:700}
  .empty{color:var(--sub);text-align:center;padding:28px 0}
  .casebox{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.65;margin:10px 0;white-space:pre-wrap}
  .sechead{font-size:16px;font-weight:800;margin:18px 2px 4px}
  .ptline{color:#92400e;font-weight:600}
  .maprow{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0;font-size:13.5px}
  .maprow .btn{flex:0 0 auto;padding:6px 12px}
</style>
</head>
<body>
<header>
  <h1>考试库 · 通用刷题引擎</h1>
  <p id="examSub">一个引擎，多个考试：切换考试后进度、错题本按考试隔离保存</p>
  <select id="catSel" onchange="switchCategory(this.value)"></select>
  <select id="examSel" onchange="switchExam(this.value)"></select>
</header>
<nav>
  <button id="tab-practice" class="on" onclick="showTab('practice')">按套练习</button>
  <button id="tab-exam" onclick="showTab('exam')">模拟考试</button>
  <button id="tab-map" onclick="showTab('map')">考点地图</button>
  <button id="tab-wrong" onclick="showTab('wrong')">错题本</button>
</nav>
<main id="app"></main>

const SETS_MAP = {"cet4": [{"name": "第1套 · 词汇与语法（10题）", "questions": [{"answer": "A", "explain": "take advantage of 是固定搭配，意为“利用”。for / to / with 都不能与 advantage 构成这一搭配。", "id": "cet4v1", "options": {"A": "of", "B": "for", "C": "to", "D": "with"}, "point": "词汇与语法·固定搭配：take advantage of", "stem": "Students should take full advantage ___ the library resources during the exam season.", "type": "single"}, {"answer": "A", "explain": "be responsible for 意为“对……负责”。to / of / with 都不构成这一搭配。", "id": "cet4v2", "options": {"A": "for", "B": "to", "C": "of", "D": "with"}, "point": "词汇与语法·固定搭配：be responsible for", "stem": "Parents are responsible ___ their children's safety at school.", "type": "single"}, {"answer": "A", "explain": "be familiar with 意为“熟悉”。to / for / on 都不构成这一搭配。", "id": "cet4v3", "options": {"A": "with", "B": "to", "C": "for", "D": "on"}, "point": "词汇与语法·固定搭配：be familiar with", "stem": "She is already familiar ___ the new software after a week of training.", "type": "single"}, {"answer": "A", "explain": "rely on 意为“依靠、依赖”。in / to / for 都不构成这一搭配。", "id": "cet4v4", "options": {"A": "on", "B": "in", "C": "to", "D": "for"}, "point": "词汇与语法·固定搭配：rely on", "stem": "Small businesses often rely ___ local customers to survive.", "type": "single"}, {"answer": "A", "explain": "contribute to 后接名词时意为“有助于、促进”。for / with / on 都不构成这一搭配。", "id": "cet4v5", "options": {"A": "to", "B": "for", "C": "with", "D": "on"}, "point": "词汇与语法·固定搭配：contribute to", "stem": "Regular exercise can contribute ___ better sleep and a stronger immune system.", "type": "single"}, {"answer": "A", "explain": "pay attention to 是固定搭配，意为“注意”。on / for / with 都不构成这一搭配。", "id": "cet4v6", "options": {"A": "to", "B": "on", "C": "for", "D": "with"}, "point": "词汇与语法·固定搭配：pay attention to", "stem": "Please pay close attention ___ the safety instructions before you start the experiment.", "type": "single"}, {"answer": "A", "explain": "be aware of 意为“意识到”。for / to / with 都不构成这一搭配。", "id": "cet4v7", "options": {"A": "of", "B": "for", "C": "to", "D": "with"}, "point": "词汇与语法·固定搭配：be aware of", "stem": "Are you aware ___ the changes to the exam schedule?", "type": "single"}, {"answer": "A", "explain": "focus on 意为“集中于”。in / to / for 都不构成这一搭配。", "id": "cet4v8", "options": {"A": "on", "B": "in", "C": "to", "D": "for"}, "point": "词汇与语法·固定搭配：focus on", "stem": "The course focuses ___ practical communication skills rather than grammar rules alone.", "type": "single"}, {"answer": "C", "explain": "空格后是名词 essay，需要表示所属的关系词 whose。who / whom 指人作主语或宾语，which 指物且不表示所属。", "id": "cet4v9", "options": {"A": "who", "B": "whom", "C": "whose", "D": "which"}, "point": "语法·定语从句：whose 表示所属", "stem": "The student ___ essay won first prize is in my class.", "type": "single"}, {"answer": "A", "explain": "insist 表示“要求”时，后接 (should +) 动词原形。submits 是陈述语气，不合“要求”的语境；submitted / submitting 也不合虚拟语气结构。", "id": "cet4v10", "options": {"A": "submit", "B": "submits", "C": "submitted", "D": "submitting"}, "point": "语法·虚拟语气：insist 后接动词原形", "stem": "The teacher insisted that every student ___ the essay before Friday.", "type": "single"}]}, {"name": "第2套 · 阅读理解（10题）", "questions": [{"answer": "A", "case": "For many students, online learning was once a backup plan, used only when the classroom was closed. Today it has become a normal part of education. A student in a small town can now listen to a lecture from a famous university, submit homework at midnight, and join a discussion group with classmates in other cities. The main advantage is flexibility: learners can study at their own speed and review difficult parts as many times as they need.\nFlexibility, however, is also a risk. Without a fixed timetable, some students put off their work until the last day. Others are easily distracted by phones and social media at home. Good online courses therefore use short videos, clear weekly deadlines, and quick feedback. These small structures help students stay on track without taking away freedom.\nOnline learning will not replace teachers, the author argues. It works best when technology and human guidance are combined: the screen delivers information, while the teacher answers questions, encourages discussion, and checks understanding.", "explain": "首段说在线学习已成为教育的正常部分，末段说它与教师指导结合时效果最好。B 与末段相反，C、D 都只是文中举例，不是主旨。", "id": "cet4r1", "options": {"A": "Online learning has become normal, and it works best together with teacher guidance.", "B": "Online learning will soon replace all teachers.", "C": "Online learning is only useful for students in small towns.", "D": "Students mainly like online learning because they can submit homework at midnight."}, "point": "阅读理解·主旨大意", "stem": "What is the main idea of the passage?", "type": "single"}, {"answer": "A", "explain": "文中明确说 flexibility 指 learners can study at their own speed and review difficult parts as many times as they need。", "id": "cet4r2", "options": {"A": "Learners can study at their own speed and review difficult parts repeatedly.", "B": "Learners can avoid all deadlines.", "C": "Learners can study without any teacher.", "D": "Learners only need to submit homework at midnight."}, "point": "阅读理解·细节理解", "stem": "According to the passage, what does flexibility in online learning mean?", "type": "single"}, {"answer": "A", "explain": "第二段明确提到：没有固定时间表时，有的学生拖到最后一天才做作业，有的在家容易被手机和社交媒体分心。", "id": "cet4r3", "options": {"A": "Some students delay their work and are easily distracted at home.", "B": "Online lectures are always too short.", "C": "Universities refuse to offer online courses.", "D": "Students in small towns have no internet access."}, "point": "阅读理解·细节理解", "stem": "What problem of online learning is mentioned in the passage?", "type": "single"}, {"answer": "A", "explain": "第二段末尾明确列出：short videos, clear weekly deadlines, and quick feedback。", "id": "cet4r4", "options": {"A": "Short videos, clear weekly deadlines, and quick feedback.", "B": "Longer lectures with no deadlines.", "C": "Social media alone, without any structure.", "D": "Homework that can only be submitted at midnight."}, "point": "阅读理解·细节理解", "stem": "What do good online courses use to help students stay on track?", "type": "single"}, {"answer": "A", "explain": "作者既肯定在线学习的便利，又指出灵活性的风险，结论是技术与教师指导结合最好，属于肯定但谨慎的态度。", "id": "cet4r5", "options": {"A": "Positive but cautious: online learning works best when combined with teacher guidance.", "B": "Completely negative about online learning.", "C": "Teachers are no longer needed in education.", "D": "Flexibility in online learning has no risk at all."}, "point": "阅读理解·作者态度", "stem": "What is the author's attitude toward online learning?", "type": "single"}, {"answer": "A", "case": "Every year, a large amount of food is thrown away before it is eaten. At home, people often buy too much, misunderstand date labels, or cook more than they need. In shops and restaurants, unsold food is sometimes thrown away even when it is still safe to eat. The waste is not only a waste of money; it also wastes the water, land, and work used to grow, transport, and cook the food.\nPart of the problem is confusion about labels. “Best before” usually means the food may lose some quality after that date, but it is not necessarily unsafe. “Use by”, by contrast, is about safety and should be followed more strictly. Many people treat the two labels as the same and throw away food too early.\nThe passage suggests simple steps. At home, plan meals before shopping, store food correctly, and use leftovers for the next meal. Shops and restaurants can sell food near its date at a lower price or donate unsold food. Reducing waste, the author argues, needs both careful consumers and responsible businesses.", "explain": "全文先讲浪费的规模与原因，再讲标签混淆，最后讲家庭与商家两方面的办法，主旨是浪费问题大但可以从两方面减少。", "id": "cet4r6", "options": {"A": "Food waste is a large problem, but it can be reduced by careful consumers and responsible businesses.", "B": "Food waste happens only in restaurants.", "C": "Date labels are always about safety.", "D": "Leftovers should always be thrown away."}, "point": "阅读理解·主旨大意", "stem": "What is the main idea of the passage?", "type": "single"}, {"answer": "A", "explain": "首段明确列出家庭浪费的三个原因：buy too much, misunderstand date labels, or cook more than they need。", "id": "cet4r7", "options": {"A": "Buying too much, misunderstanding date labels, and cooking more than needed.", "B": "Cooking too little food at home.", "C": "Refusing to shop in supermarkets.", "D": "Eating only in restaurants."}, "point": "阅读理解·细节理解", "stem": "According to the passage, why do households waste food?", "type": "single"}, {"answer": "A", "explain": "文中区分：best before 通常指品质可能下降，但不一定不安全；use by 则关于安全，应更严格遵守。", "id": "cet4r8", "options": {"A": "It usually means quality may drop, but the food is not necessarily unsafe.", "B": "It always means the food is unsafe after that date.", "C": "It means the same as “use by”.", "D": "It means the food must be sold at a lower price."}, "point": "阅读理解·细节理解", "stem": "What does “best before” usually mean in the passage?", "type": "single"}, {"answer": "A", "explain": "末段明确建议：at home, use leftovers for the next meal；商店和餐馆则可降价出售或捐赠未售出的食物。", "id": "cet4r9", "options": {"A": "Use leftovers for the next meal, and shops can sell or donate unsold food.", "B": "Throw away all leftovers immediately.", "C": "Buy more food than needed.", "D": "Ignore date labels completely."}, "point": "阅读理解·细节理解", "stem": "What solutions does the passage suggest?", "type": "single"}, {"answer": "A", "explain": "末段结论句明确说 reducing waste needs both careful consumers and responsible businesses，即需要两方共同努力。", "id": "cet4r10", "options": {"A": "Both consumers and businesses need to act.", "B": "Only consumers need to act.", "C": "Only restaurants need to act.", "D": "Food waste cannot be reduced at all."}, "point": "阅读理解·推理判断", "stem": "What can be inferred from the last paragraph?", "type": "single"}]}, {"name": "第3套 · 写作与翻译（自评，2题）", "questions": [{"answer": "范文对照（自评）", "explain": "范文要点：首段点题——短视频时代，读书仍不可替代；中段两点：①读书培养深度思考，短视频多为碎片信息；②读书积累词汇与表达，有助于写作；尾段总结——把读书作为日常习惯，每天固定时间读。自评清单：①结构是否首段点题＋中段展开＋尾段总结；②是否达到120-180词；③有无主谓一致、时态错误；④是否用到2个以上连接词（如 however, in addition, therefore）。全部做到算对，否则进错题本重练。", "id": "cet4w1", "options": {}, "point": "写作·短文写作：观点论证", "stem": "For this part, you are allowed 30 minutes to write a short essay on whether reading books still matters in the age of short videos. You should write at least 120 words but no more than 180 words.", "type": "self"}, {"answer": "范文对照（自评）", "explain": "参考译文：High-speed rail has become an important way for Chinese people to travel. It is not only fast, but also punctual and safe. In the past, it took more than ten hours to travel from Beijing to Shanghai; today it takes only a little more than four hours. The development of high-speed rail has not only made people's lives more convenient, but also promoted the economic development of cities along the line. 自评清单：① high-speed rail 拼写正确；② not only...but also 结构完整；③ “促进沿线城市经济发展”译出 promoted the economic development of cities along the line；④时态以一般现在时为主。缺两项以上算错，进错题本。", "id": "cet4t1", "options": {}, "point": "翻译·汉译英：说明文段落", "stem": "将下面这段话翻译成英文：高铁已经成为中国人出行的重要方式。它不仅速度快，而且准时、安全。过去，从北京到上海需要十多个小时，如今只需要四个多小时。高铁的发展不仅方便了人们的生活，也促进了沿线城市的经济发展。", "type": "self"}]}], "cet6": [{"name": "第1套 · 词汇与语法（10题）", "questions": [{"id": "cet6_1", "stem": "The committee decided to postpone the meeting ______ further notice.", "options": {"A": "until", "B": "unless", "C": "though", "D": "despite"}, "answer": "A", "point": "六级·词汇语法：until further notice", "explain": "until further notice 是固定搭配，意为“另行通知之前”，句意是会议推迟到另行通知为止。", "type": "single"}, {"id": "cet6_2", "stem": "She took the criticism ______ her stride and kept working on the project.", "options": {"A": "in", "B": "on", "C": "by", "D": "with"}, "answer": "A", "point": "六级·词汇语法：take in one's stride", "explain": "take something in one's stride 是固定搭配，意为“从容应对、泰然处之”。", "type": "single"}, {"id": "cet6_3", "stem": "The new policy is intended to ______ the gap between urban and rural education.", "options": {"A": "widen", "B": "bridge", "C": "ignore", "D": "measure"}, "answer": "B", "point": "六级·词汇语法：bridge the gap", "explain": "bridge the gap 是固定搭配，意为“弥合差距”；widen the gap 是扩大差距，与政策意图相反。", "type": "single"}, {"id": "cet6_4", "stem": "Had he followed the doctor's advice, he ______ in hospital now.", "options": {"A": "would not be", "B": "would not have been", "C": "will not be", "D": "is not"}, "answer": "A", "point": "六级·词汇语法：混合虚拟语气", "explain": "条件是过去的虚拟（Had he followed），结果是现在的情况，用 would + 动词原形，即 would not be。", "type": "single"}, {"id": "cet6_5", "stem": "Only by working together ______ overcome the difficulties ahead.", "options": {"A": "we can", "B": "can we", "C": "we will", "D": "will we"}, "answer": "B", "point": "六级·词汇语法：倒装", "explain": "Only + 状语放句首时，主句要部分倒装：Only by working together can we overcome...", "type": "single"}, {"id": "cet6_6", "stem": "The professor ______ the students to read at least three papers before the seminar.", "options": {"A": "required", "B": "demanded that", "C": "asked that", "D": "suggested to"}, "answer": "A", "point": "六级·词汇语法：require sb to do", "explain": "require sb. to do sth. 是正确结构；demanded / asked / suggested 后接 that 从句时从句用虚拟语气，不直接接 to do。", "type": "single"}, {"id": "cet6_7", "stem": "This phenomenon is often ______ to the rapid growth of short-video platforms.", "options": {"A": "attributed", "B": "contributed", "C": "distributed", "D": "devoted"}, "answer": "A", "point": "六级·词汇语法：be attributed to", "explain": "be attributed to 意为“归因于”；contribute to 是“促成”，主被动与搭配不同。", "type": "single"}, {"id": "cet6_8", "stem": "______ the rain, the outdoor concert went on as planned.", "options": {"A": "In spite", "B": "Despite of", "C": "In spite of", "D": "Although"}, "answer": "C", "point": "六级·词汇语法：in spite of", "explain": "in spite of 后接名词或动名词，意为“尽管”；despite 后不加 of，although 后接从句。", "type": "single"}, {"id": "cet6_9", "stem": "The company has committed itself ______ reducing carbon emissions by 2030.", "options": {"A": "to", "B": "for", "C": "with", "D": "on"}, "answer": "A", "point": "六级·词汇语法：be committed to", "explain": "be committed to doing sth. 是固定搭配，to 是介词，后接动名词 reducing。", "type": "single"}, {"id": "cet6_10", "stem": "It is high time that the government ______ effective measures to protect personal data.", "options": {"A": "takes", "B": "took", "C": "will take", "D": "has taken"}, "answer": "B", "point": "六级·词汇语法：It is high time that", "explain": "It is high time that 后接从句用过去式表示虚拟，意为“早就该……了”。", "type": "single"}]}, {"name": "第2套 · 阅读理解（10题）", "questions": [{"id": "cet6r1", "stem": "Passage 1: Artificial intelligence is changing how students learn, but it does not change what learning means. A tutor program can correct grammar, suggest sources, and even draft an outline in seconds. What it cannot do is decide what is worth learning, or judge whether an argument is honest. Those judgments still belong to the learner. Students who use AI only to produce answers may finish assignments faster, yet understand less. Students who use it to test their own ideas — asking why a suggestion is made, checking sources, and rewriting in their own words — often learn more, because the machine forces them to explain what they actually mean. The difference is not the tool, but the habit that surrounds it.\nWhat is the main idea of Passage 1?", "options": {"A": "AI should be banned from schools.", "B": "AI changes the tools of learning, but judgment still belongs to the learner.", "C": "AI can decide what is worth learning.", "D": "Students should never use AI."}, "answer": "B", "point": "阅读理解·主旨大意", "explain": "首段点题：AI 改变学习方式，但不改变学习的本质；判断什么值得学、论证是否诚实，仍属于学习者。", "type": "single"}, {"id": "cet6r2", "stem": "According to Passage 1, what can a tutor program do?", "options": {"A": "Decide what is worth learning.", "B": "Correct grammar, suggest sources, and draft an outline.", "C": "Judge whether an argument is honest.", "D": "Replace the learner completely."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "文中明确列出：correct grammar, suggest sources, and even draft an outline；判断类工作明确说它不能做。", "type": "single"}, {"id": "cet6r3", "stem": "What does Passage 1 say about students who use AI only to produce answers?", "options": {"A": "They understand more.", "B": "They finish faster but may understand less.", "C": "They never finish assignments.", "D": "They learn to judge arguments."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "原文：may finish assignments faster, yet understand less，即完成更快但理解更少。", "type": "single"}, {"id": "cet6r4", "stem": "What habit does Passage 1 recommend when using AI?", "options": {"A": "Copy the output directly.", "B": "Ask why a suggestion is made, check sources, and rewrite in one's own words.", "C": "Avoid checking sources.", "D": "Use AI only for grammar."}, "answer": "B", "point": "阅读理解·推理判断", "explain": "文中推荐的用法是：问为什么这样建议、核查来源、用自己的话重写，这样机器反而迫使学习者说清自己的意思。", "type": "single"}, {"id": "cet6r5", "stem": "What can be inferred from the last sentence of Passage 1?", "options": {"A": "The tool itself determines learning outcomes.", "B": "How one uses the tool matters more than the tool itself.", "C": "Habits do not matter.", "D": "AI always improves learning."}, "answer": "B", "point": "阅读理解·推理判断", "explain": "末句：The difference is not the tool, but the habit that surrounds it，即差别不在工具，而在使用习惯。", "type": "single"}, {"id": "cet6r6", "stem": "Passage 2: Many cities are trying to bring nature back into daily life, not only in parks but on rooftops, along riverbanks, and between buildings. Green roofs can lower indoor temperatures in summer and slow rainwater runoff. Street trees shade sidewalks and make walking more pleasant, which in turn encourages people to leave their cars at home. Critics argue that such projects cost too much and need constant care. Supporters reply that the cost of doing nothing — hotter streets, more flooding, and fewer places to meet — is higher, though it is harder to see on a budget sheet. The real question, therefore, is not whether a city can afford green space, but whether it can afford to live without it.\nWhat is the main idea of Passage 2?", "options": {"A": "Cities should build more parks only.", "B": "Bringing nature into daily urban life has real benefits, and its cost must be weighed against the cost of doing nothing.", "C": "Green projects are free.", "D": "Cities should remove all street trees."}, "answer": "B", "point": "阅读理解·主旨大意", "explain": "全文先讲屋顶绿化、行道树等好处，再讲反对者的成本质疑，最后落点是：问题不是能否负担绿地，而是能否负担没有绿地的生活。", "type": "single"}, {"id": "cet6r7", "stem": "According to Passage 2, what can green roofs do?", "options": {"A": "Raise indoor temperatures.", "B": "Lower indoor temperatures in summer and slow rainwater runoff.", "C": "Increase flooding.", "D": "Replace all parks."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "原文：Green roofs can lower indoor temperatures in summer and slow rainwater runoff。", "type": "single"}, {"id": "cet6r8", "stem": "How do street trees encourage people to leave cars at home, according to Passage 2?", "options": {"A": "By blocking roads.", "B": "By shading sidewalks and making walking more pleasant.", "C": "By raising parking fees.", "D": "By banning cars."}, "answer": "B", "point": "阅读理解·细节理解", "explain": "原文：Street trees shade sidewalks and make walking more pleasant, which in turn encourages people to leave their cars at home。", "type": "single"}, {"id": "cet6r9", "stem": "What do critics of green projects argue?", "options": {"A": "Green projects cost too much and need constant care.", "B": "Green projects need no care.", "C": "Green projects make streets hotter.", "D": "Green projects reduce meeting places."}, "answer": "A", "point": "阅读理解·细节理解", "explain": "原文：Critics argue that such projects cost too much and need constant care。", "type": "single"}, {"id": "cet6r10", "stem": "What does the last sentence of Passage 2 imply?", "options": {"A": "Green space is a luxury cities can skip.", "B": "Living without green space may cost more in the long run.", "C": "Budget sheets show all costs clearly.", "D": "Cities should stop all green projects."}, "answer": "B", "point": "阅读理解·推理判断", "explain": "末句反问：城市能否负担没有绿地的生活，呼应前文“不做的代价更高，只是账面上难看见”，即长期代价可能更大。", "type": "single"}]}, {"name": "第3套 · 写作与翻译（自评，2题）", "questions": [{"id": "cet6w1", "stem": "For this part, you are allowed 30 minutes to write a short essay on whether artificial intelligence helps or harms students' independent thinking. You should write at least 150 words but no more than 200 words.", "options": {}, "answer": "范文对照（自评）", "point": "写作·短文写作：观点论证", "explain": "范文要点：首段点题——AI 本身不决定思考质量，关键在使用方式；中段两点：①只抄答案会削弱独立思考，因为判断过程被外包了；②用来检验观点、核查来源、重写表达时，反而能逼出更清晰的思考；尾段总结——把 AI 当作检验工具而非答案机器。自评清单：①结构是否首段点题＋中段展开＋尾段总结；②是否达到150-200词；③有无主谓一致、时态错误；④是否用到2个以上连接词（如 however, for example, therefore）。全部做到算对，否则进错题本重练。", "type": "self"}, {"id": "cet6w2", "stem": "请将下面一段话翻译成英文：茶在中国已有几千年的历史。人们不仅把茶当作一种饮料，也把它看作一种文化。品茶讲究环境、心境和礼仪。如今，茶文化已经走向世界，成为中国与世界交流的一座桥梁。", "options": {}, "answer": "范文对照（自评）", "point": "翻译·段落翻译", "explain": "参考译文：Tea has a history of thousands of years in China. People regard tea not only as a drink, but also as a culture. Tea tasting pays attention to the environment, the state of mind, and etiquette. Today, tea culture has gone global and become a bridge for communication between China and the world. 自评清单：① “已有几千年的历史”译出 has a history of thousands of years；② not only...but also 结构完整；③ “走向世界”译出 has gone global；④ “桥梁”译出 bridge。缺两项以上算错，进错题本重练。", "type": "self"}]}], "kaoyan1": [{"name": "第1套 · 完形填空（10题，缩减版）", "questions": [{"id": "k1c1", "stem": "第 (1) 空最恰当的是？", "options": {"A": "However", "B": "Therefore", "C": "For example", "D": "In conclusion"}, "answer": "A", "point": "考研一·完形：转折连词", "explain": "前句说成功主要靠天赋，后句说研究表明习惯至少同样重要，两句转折，用 However。Therefore 表因果、For example 表举例、In conclusion 表总结，均不合转折语境。", "type": "single", "case": "Many people believe that success depends mainly on talent. ____ (1) ____, research on learning shows that habits matter at least as much. A student who studies a little every day often ____ (2) ____ a classmate who studies only before exams, ____ (3) ____ the second student may be more talented. The reason is simple: regular practice builds memory ____ (4) ____, while cramming fades quickly. ____ (5) ____, habits are not formed by willpower alone. They need clear cues, a fixed time, and a small reward ____ (6) ____ each session. For example, a reader who always reads after breakfast soon finds the habit ____ (7) ____, because the morning routine itself becomes the reminder. Of course, habits can also work ____ (8) ____ us: checking a phone first thing in the morning can steal the best hour of the day. The solution is not to fight every bad habit ____ (9) ____, but to replace it with a better one in the same situation. In the long run, our lives are shaped not by what we do once in a while, ____ (10) ____ by what we do daily."}, {"id": "k1c2", "stem": "第 (2) 空最恰当的是？", "options": {"A": "outperforms", "B": "ignores", "C": "avoids", "D": "replaces"}, "answer": "A", "point": "考研一·完形：动词辨析", "explain": "每天学一点的学生常常胜过只在考前突击的同学，用 outperforms（胜过）。ignores 忽视、avoids 避免、replaces 替代，均不合“成绩更好”的语境。", "type": "single"}, {"id": "k1c3", "stem": "第 (3) 空最恰当的是？", "options": {"A": "even if", "B": "as if", "C": "only if", "D": "in case"}, "answer": "A", "point": "考研一·完形：让步连词", "explain": "后半句“第二个学生可能更有天赋”是让步条件：即使更有天赋，仍可能输给坚持者，用 even if。as if 表虚拟假设、only if 表唯一条件、in case 表以防，均不合。", "type": "single"}, {"id": "k1c4", "stem": "第 (4) 空最恰当的是？", "options": {"A": "gradually", "B": "suddenly", "C": "rarely", "D": "secretly"}, "answer": "A", "point": "考研一·完形：副词辨析", "explain": "定期练习是逐步建立记忆，与后文“突击很快消退”对照，用 gradually（逐渐地）。suddenly 突然、rarely 很少、secretly 秘密地，均与“定期积累”不合。", "type": "single"}, {"id": "k1c5", "stem": "第 (5) 空最恰当的是？", "options": {"A": "In fact", "B": "In short", "C": "At last", "D": "By chance"}, "answer": "A", "point": "考研一·完形：插入语辨析", "explain": "本句进一步说明习惯形成的真相（不只靠意志力），用 In fact（事实上）引出补充说明。In short 表总结、At last 表最终、By chance 表偶然，均不合。", "type": "single"}, {"id": "k1c6", "stem": "第 (6) 空最恰当的是？", "options": {"A": "after", "B": "before", "C": "without", "D": "against"}, "answer": "A", "point": "考研一·完形：介词辨析", "explain": "每次学习之后给一个小奖励，即 a small reward after each session。before 在……之前、without 没有、against 反对，均不合“完成后的奖励”语境。", "type": "single"}, {"id": "k1c7", "stem": "第 (7) 空最恰当的是？", "options": {"A": "automatic", "B": "difficult", "C": "expensive", "D": "illegal"}, "answer": "A", "point": "考研一·完形：形容词辨析", "explain": "因为早餐 routine 本身成了提醒，习惯变得不假思索，用 automatic（自动的）。difficult 困难、expensive 昂贵、illegal 非法，均与“ routine 提醒”不合。", "type": "single"}, {"id": "k1c8", "stem": "第 (8) 空最恰当的是？", "options": {"A": "against", "B": "for", "C": "with", "D": "about"}, "answer": "A", "point": "考研一·完形：固定搭配 work against", "explain": "work against us 意为“对我们不利、拖后腿”，与前文好习惯对照。work for 为……工作、work with 与……合作、work about 无此搭配，均不合。", "type": "single"}, {"id": "k1c9", "stem": "第 (9) 空最恰当的是？", "options": {"A": "directly", "B": "secretly", "C": "rarely", "D": "finally"}, "answer": "A", "point": "考研一·完形：副词辨析", "explain": "解决办法不是正面硬抗每个坏习惯，而是替换它，用 directly（直接地）与 replace 对照。secretly 秘密地、rarely 很少、finally 最终，均不合。", "type": "single"}, {"id": "k1c10", "stem": "第 (10) 空最恰当的是？", "options": {"A": "but", "B": "and", "C": "or", "D": "so"}, "answer": "A", "point": "考研一·完形：并列连词 not...but...", "explain": "not by what we do once in a while, but by what we do daily 是 not...but... 结构，表否定前者、肯定后者。and 表并列、or 表选择、so 表因果，均不合。", "type": "single"}]}, {"name": "第2套 · 阅读理解A（10题，2篇）", "questions": [{"id": "k1r1", "stem": "Passage 1: Remote work was once a rare benefit. Today, millions of people work from home at least part of the week. Supporters say it saves commuting time, lets workers choose their hours, and allows companies to hire talent anywhere. Critics worry that remote workers feel isolated, that young employees miss informal learning from senior colleagues, and that the line between work and home becomes hard to draw.\nWhat is the main idea of Passage 1?", "options": {"A": "Remote work brings clear benefits but also real problems that need attention.", "B": "Remote work has no benefit at all.", "C": "Only young employees like remote work.", "D": "Companies should ban remote work completely."}, "answer": "A", "point": "考研一·阅读A：主旨大意", "explain": "首段先讲远程办公普及，再并列支持者与批评者的观点，全文是利弊两面。用 no benefit、only young、ban completely 都是片面或极端表述，与两面结构不合。", "type": "single"}, {"id": "k1r2", "stem": "According to Passage 1, what do supporters of remote work say?", "options": {"A": "It saves commuting time and allows hiring talent anywhere.", "B": "It makes all employees feel isolated.", "C": "It removes the need for any meetings.", "D": "It only works for senior employees."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "支持者观点明确列出：saves commuting time、choose hours、hire talent anywhere。feel isolated 是批评者观点，remove meetings、only senior 文中未提。", "type": "single"}, {"id": "k1r3", "stem": "According to Passage 1, what problem do critics mention for young employees?", "options": {"A": "They miss informal learning from senior colleagues.", "B": "They spend too much time commuting.", "C": "They refuse to use new technology.", "D": "They prefer to work in offices abroad."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "批评者观点原文：young employees miss informal learning from senior colleagues。commuting 是支持者说的节省项，refuse technology、offices abroad 文中未提。", "type": "single"}, {"id": "k1r4", "stem": "What can be inferred from Passage 1 about the line between work and home?", "options": {"A": "Remote work can blur it, which is one of its problems.", "B": "Remote work makes the line completely clear.", "C": "The line does not matter to remote workers.", "D": "Only office workers face this problem."}, "answer": "A", "point": "考研一·阅读A：推理判断", "explain": "批评者说 the line between work and home becomes hard to draw，即界限变模糊是问题之一。completely clear 与原文相反，does not matter、only office 文中未提。", "type": "single"}, {"id": "k1r5", "stem": "What is the author's attitude in Passage 1?", "options": {"A": "Balanced: presenting both sides without taking an extreme position.", "B": "Strongly against remote work.", "C": "Strongly in favour of remote work only.", "D": "Indifferent and giving no information."}, "answer": "A", "point": "考研一·阅读A：作者态度", "explain": "作者并列 supporters 与 critics 的观点，未下极端结论，属于 balanced。strongly against / only in favour 与两面结构不合，indifferent 与文中信息量不合。", "type": "single"}, {"id": "k1r6", "stem": "Passage 2: Many museums now put their collections online. A visitor in another country can examine a painting in detail, read its history, and even take a virtual tour of the gallery. Museum directors say this reaches people who could never travel to the museum, especially students and researchers. Some worry, however, that a screen cannot replace standing in front of the real work, seeing its size, texture, and the way light falls on it. The best result, most directors agree, is when the online visit encourages, rather than replaces, a real visit.\nWhat is the main idea of Passage 2?", "options": {"A": "Online collections expand access, but a real visit still has unique value.", "B": "Museums should close their physical galleries.", "C": "Online collections are useless for students.", "D": "Only researchers benefit from online museums."}, "answer": "A", "point": "考研一·阅读A：主旨大意", "explain": "全文结构：线上扩大了可达性（students and researchers），但屏幕无法替代实物体验，结论是线上应鼓励而非替代实地参观。close galleries、useless、only researchers 均与原文相反或片面。", "type": "single"}, {"id": "k1r7", "stem": "According to Passage 2, who especially benefits from online collections?", "options": {"A": "People who could never travel to the museum, especially students and researchers.", "B": "Only museum directors.", "C": "Only people living next to the museum.", "D": "People who dislike all art."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "原文：reaches people who could never travel to the museum, especially students and researchers。only directors、next to museum、dislike art 均与原文不合。", "type": "single"}, {"id": "k1r8", "stem": "According to Passage 2, what can a screen NOT replace?", "options": {"A": "Seeing the real work's size, texture, and the way light falls on it.", "B": "Reading the history of a painting.", "C": "Examining a painting in detail online.", "D": "Taking a virtual tour of the gallery."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "担忧句原文：a screen cannot replace standing in front of the real work, seeing its size, texture, and the way light falls on it。B、C、D 都是线上能做的事，不是不能替代的。", "type": "single"}, {"id": "k1r9", "stem": "What do most directors agree on in Passage 2?", "options": {"A": "The online visit should encourage, rather than replace, a real visit.", "B": "Online visits should replace all real visits.", "C": "Museums should stop putting collections online.", "D": "Virtual tours are better than real visits in every way."}, "answer": "A", "point": "考研一·阅读A：细节理解", "explain": "结论句原文：when the online visit encourages, rather than replaces, a real visit。replace all、stop online、better in every way 均与结论相反。", "type": "single"}, {"id": "k1r10", "stem": "The word \"texture\" in Passage 2 most probably means:", "options": {"A": "The surface quality of the work that can be seen or felt.", "B": "The price of the painting.", "C": "The age of the museum building.", "D": "The number of visitors."}, "answer": "A", "point": "考研一·阅读A：词义猜测", "explain": "texture 与 size、light 并列，讲站在实物前才能感知的表面质感。price、building age、visitor number 均与语境不合。", "type": "single"}]}, {"name": "第3套 · 翻译与写作（自评，2题）", "questions": [{"id": "k1t1", "stem": "将下面 5 句话翻译成汉语：(1) Success rarely comes from a single effort; it grows out of small actions repeated over time. (2) When people face a difficult choice, they often prefer a safe option, even if it brings less reward. (3) Technology has changed how we communicate, but it has not changed our need to be understood. (4) A good teacher does not give students all the answers; she teaches them how to ask better questions. (5) Reading widely does not guarantee wisdom, but it makes narrow thinking harder to defend.", "options": {}, "answer": "范文对照（自评）", "point": "考研一·翻译：英译汉句子翻译", "explain": "参考译文：(1) 成功很少来自一次努力，它来自长期重复的小行动。(2) 面对艰难选择时，人们往往偏爱稳妥的选项，即使回报更少。(3) 技术改变了我们的沟通方式，但没有改变我们被理解的需求。(4) 好老师不是把所有答案都给学生，而是教他们如何提出更好的问题。(5) 广泛阅读并不能保证智慧，但它让狭隘的想法更难站得住脚。自评清单：① 5 句是否都译出，无漏译；② grows out of / prefer / guarantee 等关键词是否译准；③ 汉语是否通顺，无逐词硬译。缺两项以上算错，进错题本。", "type": "self"}, {"id": "k1w1", "stem": "写作：图表显示，越来越多大学生用电子设备进行学习，传统纸质阅读时间相应减少。请写一篇短文：描述这一现象，分析其原因，并谈谈你的看法。词数 160–200 词。", "options": {}, "answer": "范文对照（自评）", "point": "考研一·写作：图表作文", "explain": "范文要点：首段描述现象——电子设备学习普及、纸质阅读时间减少；中段分析原因：① 设备便于检索与携带；② 视频、互动内容更直观；③ 碎片化时间可利用；尾段看法——电子学习是工具，深度阅读仍需纸质与专注，建议两者结合。自评清单：① 是否首段描述＋中段原因＋尾段看法；② 词数是否在 160–200 词；③ 有无主谓一致、时态错误；④ 是否用到 2 个以上连接词（如 however, moreover, therefore）。全部做到算对，否则进错题本重练。", "type": "self"}]}], "kaoyan2": [{"name": "第1套 · 完形填空（10题，缩减版）", "questions": [{"id": "k2c1", "stem": "第 (1) 空最恰当的是？", "options": {"A": "short", "B": "long", "C": "high", "D": "low"}, "answer": "A", "point": "考研二·完形：固定搭配 cut short", "explain": "cut short 意为“削减、缩短”，即工作一多就先砍睡眠。cut long、cut high、cut low 均无此搭配。", "type": "single", "case": "Sleep is often treated as wasted time, something to be cut ____ (1) ____ when work piles up. ____ (2) ____, scientists now regard sleep as an active part of learning. During deep sleep, the brain ____ (3) ____ the day's experiences, keeping useful information and discarding noise. Students who sleep after studying therefore remember more than those who stay up, ____ (4) ____ they spent the same time on the books. Sleep also affects mood: a tired person is more likely to ____ (5) ____ small problems as threats and to argue over nothing. ____ (6) ____, good sleep does not mean simply sleeping longer. Regular bedtimes, a dark room, and no screens before bed help the brain ____ (7) ____ the signal that it is time to rest. Caffeine late in the day, ____ (8) ____, can delay that signal for hours. None of this means that sleep alone guarantees success; diet, exercise, and study methods still ____ (9) ____. But without enough sleep, even the best methods work ____ (10) ____ well."}, {"id": "k2c2", "stem": "第 (2) 空最恰当的是？", "options": {"A": "However", "B": "Therefore", "C": "Besides", "D": "Finally"}, "answer": "A", "point": "考研二·完形：转折连词", "explain": "前句说睡眠被当作浪费，后句说科学家视睡眠为学习的主动部分，两句转折，用 However。Therefore 表因果、Besides 表补充、Finally 表最后，均不合。", "type": "single"}, {"id": "k2c3", "stem": "第 (3) 空最恰当的是？", "options": {"A": "sorts through", "B": "looks for", "C": "gives up", "D": "runs into"}, "answer": "A", "point": "考研二·完形：动词短语辨析", "explain": "深睡时大脑梳理当天的经历，保留有用信息、丢弃噪音，用 sorts through（梳理）。looks for 寻找、gives up 放弃、runs into 偶遇，均不合“保留与丢弃”的语境。", "type": "single"}, {"id": "k2c4", "stem": "第 (4) 空最恰当的是？", "options": {"A": "even though", "B": "as if", "C": "in case", "D": "only if"}, "answer": "A", "point": "考研二·完形：让步连词", "explain": "睡后学习者记得更多，尽管他们花在书本上的时间相同，用 even though（尽管）。as if 表虚拟、in case 表以防、only if 表唯一条件，均不合。", "type": "single"}, {"id": "k2c5", "stem": "第 (5) 空最恰当的是？", "options": {"A": "interpret", "B": "describe", "C": "hide", "D": "solve"}, "answer": "A", "point": "考研二·完形：动词辨析", "explain": "疲倦的人更可能把小问题解读为威胁，即 interpret ... as threats。describe 描述、hide 隐藏、solve 解决，均不合“解读为威胁”的语境。", "type": "single"}, {"id": "k2c6", "stem": "第 (6) 空最恰当的是？", "options": {"A": "In fact", "B": "In short", "C": "At first", "D": "By accident"}, "answer": "A", "point": "考研二·完形：插入语辨析", "explain": "本句澄清“好睡眠不等于睡得更久”这一真相，用 In fact。In short 表总结、At first 表起初、By accident 表偶然，均不合。", "type": "single"}, {"id": "k2c7", "stem": "第 (7) 空最恰当的是？", "options": {"A": "recognise", "B": "forget", "C": "ignore", "D": "delay"}, "answer": "A", "point": "考研二·完形：动词辨析", "explain": "规律作息、黑暗房间、睡前不用屏幕帮助大脑识别“该休息了”的信号，用 recognise。forget 忘记、ignore 忽视、delay 推迟，均与“帮助识别信号”相反或不合。", "type": "single"}, {"id": "k2c8", "stem": "第 (8) 空最恰当的是？", "options": {"A": "however", "B": "therefore", "C": "moreover", "D": "finally"}, "answer": "A", "point": "考研二·完形：转折副词", "explain": "句中插入 however 表转折：但白天晚些时候摄入咖啡因会推迟该信号。therefore 表因果、moreover 表递进、finally 表最后，均不合。", "type": "single"}, {"id": "k2c9", "stem": "第 (9) 空最恰当的是？", "options": {"A": "matter", "B": "disappear", "C": "fail", "D": "increase"}, "answer": "A", "point": "考研二·完形：动词辨析", "explain": "饮食、运动、学习方法仍然重要，用 still matter。disappear 消失、fail 失败、increase 增加，均不合“仍然重要”的语境。", "type": "single"}, {"id": "k2c10", "stem": "第 (10) 空最恰当的是？", "options": {"A": "less", "B": "more", "C": "most", "D": "best"}, "answer": "A", "point": "考研二·完形：比较级辨析", "explain": "没有足够睡眠，即使最好的方法效果也打折扣，即 work less well。more 更、most 最、best 最好，均与“打折扣”相反。", "type": "single"}]}, {"name": "第2套 · 阅读理解A（10题，2篇）", "questions": [{"id": "k2r1", "stem": "Passage 1: Volunteering is often described as giving time for free. Yet studies find that volunteers themselves gain a great deal. They meet new people, learn practical skills, and feel more connected to their community. One study found that older volunteers reported better mood and a stronger sense of purpose than similar people who did not volunteer. The benefit does not come from the hours alone, researchers say, but from feeling useful and belonging to a group.\nWhat is the main idea of Passage 1?", "options": {"A": "Volunteers gain mood, skills, and a sense of belonging, not just the people they help.", "B": "Volunteering only helps the people being served.", "C": "Volunteering is a waste of time for older people.", "D": "Only young people should volunteer."}, "answer": "A", "point": "考研二·阅读A：主旨大意", "explain": "全文讲志愿者自身获益：结识人、学技能、归属感，老年志愿者情绪与目标感更好。only helps served、waste of time、only young 均与原文相反或片面。", "type": "single"}, {"id": "k2r2", "stem": "According to Passage 1, what do older volunteers report?", "options": {"A": "Better mood and a stronger sense of purpose.", "B": "Worse mood and less purpose.", "C": "No change at all.", "D": "More free time but no friends."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文：older volunteers reported better mood and a stronger sense of purpose。worse、no change、no friends 均与原文不合。", "type": "single"}, {"id": "k2r3", "stem": "According to researchers in Passage 1, where does the benefit come from?", "options": {"A": "Feeling useful and belonging to a group, not hours alone.", "B": "The number of hours alone.", "C": "Getting paid for volunteering.", "D": "Working without any other people."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文：benefit does not come from the hours alone, but from feeling useful and belonging to a group。hours alone、paid、without people 均与原文不合。", "type": "single"}, {"id": "k2r4", "stem": "What can be inferred from Passage 1 about volunteering?", "options": {"A": "It can be good for the volunteer's own wellbeing.", "B": "It always harms the volunteer's health.", "C": "It requires professional skills only.", "D": "It is only useful in large cities."}, "answer": "A", "point": "考研二·阅读A：推理判断", "explain": "志愿者情绪、目标感、归属感提升，可推断对自身 wellbeing 有益。harms health、professional only、large cities 文中未提或与原文不合。", "type": "single"}, {"id": "k2r5", "stem": "What is the author's attitude in Passage 1?", "options": {"A": "Positive toward volunteering, supported by study findings.", "B": "Negative toward volunteering.", "C": "Neutral with no evidence.", "D": "Doubtful that any study is reliable."}, "answer": "A", "point": "考研二·阅读A：作者态度", "explain": "作者引用研究说明志愿者获益，态度积极且有依据。negative、no evidence、doubtful 均与文中研究引用不合。", "type": "single"}, {"id": "k2r6", "stem": "Passage 2: Second-hand markets are growing fast. People buy used clothes, phones, and furniture instead of new ones, often at a much lower price. Supporters say this reduces waste and saves resources, because making new products uses energy and materials. Sellers, too, can earn money from things they no longer need. Critics point out problems: quality varies, some goods have hidden faults, and returns are harder than in ordinary shops. Buyers are advised to check goods carefully and buy from sellers with good records.\nWhat is the main idea of Passage 2?", "options": {"A": "Second-hand markets save money and resources, but buyers should check quality carefully.", "B": "Second-hand markets are always safe.", "C": "New products are always better than used ones.", "D": "Second-hand markets only sell clothes."}, "answer": "A", "point": "考研二·阅读A：主旨大意", "explain": "全文两面：省钱省资源、卖家获益；但质量不一、有隐藏问题、退货难，结论是仔细检查、选信誉好的卖家。always safe、always better、only clothes 均片面或与原文不合。", "type": "single"}, {"id": "k2r7", "stem": "According to Passage 2, why do supporters favour second-hand markets?", "options": {"A": "They reduce waste and save resources used to make new products.", "B": "They make all products brand new.", "C": "They remove the need to check goods.", "D": "They guarantee every product is perfect."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文：reduces waste and saves resources, because making new products uses energy and materials。brand new、no need to check、guarantee perfect 均与原文不合。", "type": "single"}, {"id": "k2r8", "stem": "According to Passage 2, what problems do critics mention?", "options": {"A": "Quality varies, some goods have hidden faults, and returns are harder.", "B": "Prices are always higher than new goods.", "C": "Sellers never earn any money.", "D": "No one buys second-hand goods."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "批评者观点原文三项：quality varies、hidden faults、returns are harder。prices higher、never earn、no one buys 均与原文不合。", "type": "single"}, {"id": "k2r9", "stem": "What advice is given to buyers in Passage 2?", "options": {"A": "Check goods carefully and buy from sellers with good records.", "B": "Never check goods before buying.", "C": "Always buy the cheapest item without checking.", "D": "Avoid all second-hand markets."}, "answer": "A", "point": "考研二·阅读A：细节理解", "explain": "原文建议：check goods carefully and buy from sellers with good records。never check、cheapest without checking、avoid all 均与建议相反。", "type": "single"}, {"id": "k2r10", "stem": "The word \"records\" in Passage 2 most probably means:", "options": {"A": "A seller's past history of honest and reliable trading.", "B": "Music records sold in the market.", "C": "The weight of the goods.", "D": "The colour of the goods."}, "answer": "A", "point": "考研二·阅读A：词义猜测", "explain": "good records 与“选信誉好的卖家”语境对应，指过往交易记录/信誉。music records、weight、colour 均与语境不合。", "type": "single"}]}, {"name": "第3套 · 翻译与写作（自评，2题）", "questions": [{"id": "k2t1", "stem": "将下面一段话翻译成汉语：Learning a second language as an adult is difficult, but it is not impossible. The key is regular practice, not long hours once a week. A learner who speaks a little every day, listens to real conversations, and is not afraid of making mistakes will progress faster than one who only studies grammar rules. Mistakes, in fact, are useful signals: they show exactly where understanding is still weak.", "options": {}, "answer": "范文对照（自评）", "point": "考研二·翻译：英译汉段落翻译", "explain": "参考译文：成年人学习第二语言很难，但并非不可能。关键在于定期练习，而不是每周一次的长时间学习。每天说一点、听真实对话、不怕犯错的学习者，比只学语法规则的学习者进步更快。事实上，错误是有用的信号：它们恰恰显示了理解仍然薄弱的地方。自评清单：① regular practice / real conversations / useful signals 等关键词是否译准；② 比较结构 faster than 是否译出；③ 汉语是否通顺，无逐词硬译。缺两项以上算错，进错题本。", "type": "self"}, {"id": "k2w1", "stem": "写作：请给你的朋友写一封信，邀请他参加本周六下午的读书分享会。信中说明时间、地点、活动内容，并表达你希望他参加的心意。词数约 100 词。", "options": {}, "answer": "范文对照（自评）", "point": "考研二·写作：应用文（邀请信）", "explain": "范文要点：开头问候并说明写信目的——邀请参加读书分享会；中段说明时间（本周六下午）、地点、活动内容（分享一本喜欢的书、交流读书心得）；结尾表达期待对方参加并请对方回复。自评清单：① 格式是否含称呼、正文、落款；② 时间、地点、活动三要素是否齐全；③ 词数是否约 100 词；④ 有无主谓一致、时态错误。全部做到算对，否则进错题本重练。", "type": "self"}]}], "tax2": [{"name": "第1套 · 税法（二）客观题（10题）", "questions": [{"id": "tax2_1", "stem": "我国企业所得税的基本税率是？", "options": {"A": "10%", "B": "20%", "C": "25%", "D": "30%"}, "answer": "C", "point": "税法（二）·企业所得税：税率", "explain": "企业所得税法规定基本税率为 25%；20% 等是特定情形的优惠税率，不是基本税率。", "type": "single"}, {"id": "tax2_2", "stem": "企业所得税的应纳税所得额，计算起点是？", "options": {"A": "营业收入", "B": "收入总额减去不征税收入、免税收入、各项扣除及弥补亏损后的余额", "C": "利润总额", "D": "资产总额"}, "answer": "B", "point": "税法（二）·企业所得税：应纳税所得额", "explain": "应纳税所得额 = 收入总额 - 不征税收入 - 免税收入 - 各项扣除 - 允许弥补的以前年度亏损；营业收入与利润总额都不是直接起点。", "type": "single"}, {"id": "tax2_3", "stem": "居民个人取得综合所得，汇算清缴时按什么期间合并计算？", "options": {"A": "按月", "B": "按季", "C": "按纳税年度", "D": "按次"}, "answer": "C", "point": "税法（二）·个人所得税：综合所得", "explain": "居民个人综合所得（工资薪金、劳务报酬、稿酬、特许权使用费）按纳税年度合并计算个人所得税；经营所得等另有规定。", "type": "single"}, {"id": "tax2_4", "stem": "个人所得税综合所得适用的税率形式是？", "options": {"A": "比例税率", "B": "超额累进税率", "C": "超率累进税率", "D": "定额税率"}, "answer": "B", "point": "税法（二）·个人所得税：税率形式", "explain": "综合所得适用 3% 至 45% 的超额累进税率；比例税率适用于经营所得等部分情形，不是综合所得的形式。", "type": "single"}, {"id": "tax2_5", "stem": "下列哪项属于企业所得税的不征税收入？", "options": {"A": "销售货物收入", "B": "提供劳务收入", "C": "财政拨款", "D": "租金收入"}, "answer": "C", "point": "税法（二）·企业所得税：不征税收入", "explain": "财政拨款、依法收取并纳入财政管理的行政事业性收费等属于不征税收入；销售、劳务、租金收入均为应税收入。", "type": "single"}, {"id": "tax2_6", "stem": "国际税收中，为避免同一所得被两国重复征税，我国主要采用的方法是？", "options": {"A": "免税法与抵免法相结合的税收协定安排", "B": "一律在所得来源国征税", "C": "一律在居民国免税", "D": "由纳税人自选不缴税"}, "answer": "A", "point": "税法（二）·国际税收：消除重复征税", "explain": "我国通过税收协定与境外所得税收抵免等安排消除重复征税；不是一律单边征税或免税，更不是自选不缴。", "type": "single"}, {"id": "tax2_7", "stem": "印花税的计税依据一般是？", "options": {"A": "纳税人的全部资产", "B": "应税凭证所列金额", "C": "纳税人的全年利润", "D": "凭证的页数"}, "answer": "B", "point": "税法（二）·印花税：计税依据", "explain": "印花税以应税凭证所列金额为计税依据（如合同金额）；不是资产、利润或页数。", "type": "single"}, {"id": "tax2_8", "stem": "房产税的征税对象是？", "options": {"A": "所有土地", "B": "房屋", "C": "全部动产", "D": "股票"}, "answer": "B", "point": "税法（二）·房产税：征税对象", "explain": "房产税以房屋为征税对象；土地使用涉及城镇土地使用税等其他税种，动产与股票不是房产税对象。", "type": "single"}, {"id": "tax2_9", "stem": "契税的纳税义务人是？", "options": {"A": "转让方", "B": "承受方", "C": "中介方", "D": "登记机关"}, "answer": "B", "point": "税法（二）·契税：纳税人", "explain": "契税由承受土地、房屋权属的一方缴纳；转让方不是契税纳税人。", "type": "single"}, {"id": "tax2_10", "stem": "土地增值税的征税对象是？", "options": {"A": "转让国有土地使用权、地上的建筑物及其附着物并取得收入的行为", "B": "购买住房自住的行为", "C": "继承房屋的行为", "D": "出租房屋的行为"}, "answer": "A", "point": "税法（二）·土地增值税：征税对象", "explain": "土地增值税针对有偿转让房地产并取得增值收入的行为；自住购买、继承、出租本身不是其征税对象。", "type": "single"}]}, {"name": "第2套 · 税法（二）多选题（10题）", "questions": [{"id": "tax2_m1", "stem": "下列各项中，属于企业所得税税前扣除项目的有（ ）。", "options": {"A": "合理的工资薪金支出", "B": "企业发生的公益性捐赠支出（在限额内）", "C": "向投资者支付的股息", "D": "企业所得税税款", "E": "业务招待费（按规定限额扣除）"}, "answer": "ABE", "point": "税法（二）·企业所得税：税前扣除", "explain": "工资薪金、限额内公益捐赠、限额内业务招待费可按规定扣除；向投资者支付的股息、企业所得税税款不得扣除。", "type": "multi"}, {"id": "tax2_m2", "stem": "下列各项中，属于个人所得税综合所得的有（ ）。", "options": {"A": "工资、薪金所得", "B": "劳务报酬所得", "C": "稿酬所得", "D": "经营所得", "E": "特许权使用费所得"}, "answer": "ABCE", "point": "税法（二）·个人所得税：综合所得范围", "explain": "综合所得包括工资薪金、劳务报酬、稿酬、特许权使用费四项；经营所得、利息股息红利、财产租赁等不属于综合所得。", "type": "multi"}, {"id": "tax2_m3", "stem": "下列各项中，属于企业所得税免税收入的有（ ）。", "options": {"A": "国债利息收入", "B": "符合条件的居民企业之间的股息、红利等权益性投资收益", "C": "销售货物收入", "D": "符合条件的非营利组织的收入", "E": "提供劳务收入"}, "answer": "ABD", "point": "税法（二）·企业所得税：免税收入", "explain": "国债利息、符合条件的居民企业间股息红利、符合条件的非营利组织收入属免税收入；销售、劳务收入为应税收入。", "type": "multi"}, {"id": "tax2_m4", "stem": "下列各项中，属于印花税征税范围的有（ ）。", "options": {"A": "购销合同", "B": "借款合同", "C": "财产租赁合同", "D": "个人之间的口头借款约定（无书面凭证）", "E": "技术合同"}, "answer": "ABCE", "point": "税法（二）·印花税：征税范围", "explain": "印花税以书立的应税合同等凭证为对象，购销、借款、租赁、技术合同均在范围内；无书面凭证的口头约定不是印花税凭证。", "type": "multi"}, {"id": "tax2_m5", "stem": "下列各项中，土地增值税的扣除项目包括（ ）。", "options": {"A": "取得土地使用权所支付的金额", "B": "房地产开发成本", "C": "房地产开发费用", "D": "与转让房地产有关的税金", "E": "房地产开发企业的全部管理费用（不论是否按规定计算）"}, "answer": "ABCD", "point": "税法（二）·土地增值税：扣除项目", "explain": "土地增值税扣除包括取得土地使用权金额、开发成本、开发费用、与转让有关的税金；开发费用按规定比例计算扣除，不是全部管理费用照单扣除。", "type": "multi"}, {"id": "tax2_m6", "stem": "下列各项中，属于房产税征税对象的有（ ）。", "options": {"A": "企业自用的厂房", "B": "企业出租的写字楼", "C": "个人所有的汽车", "D": "无租使用的房产（由使用人纳税）", "E": "田野里的农田"}, "answer": "ABD", "point": "税法（二）·房产税：征税对象", "explain": "房产税以房屋为对象，自用、出租、无租使用房屋均在范畴内；汽车、农田不是房屋，不是房产税对象。", "type": "multi"}, {"id": "tax2_m7", "stem": "下列各项中，属于契税征税范围的有（ ）。", "options": {"A": "国有土地使用权出让", "B": "土地使用权转让", "C": "房屋买卖", "D": "房屋赠与", "E": "个人之间无偿赠送现金"}, "answer": "ABCD", "point": "税法（二）·契税：征税范围", "explain": "出让、转让、买卖、赠与土地房屋权属均属契税范围；赠送现金不涉及土地房屋权属，不属契税范围。法定继承人继承房屋按规定免征，是另一优惠情形。", "type": "multi"}, {"id": "tax2_m8", "stem": "国际税收中，下列做法有助于消除重复征税的有（ ）。", "options": {"A": "税收协定中约定的免税、抵免安排", "B": "境外已纳税款按规定抵免", "C": "对同一所得在两国全额重复征税而不作任何协调", "D": "居民国对境外所得一律不征税（视协定与国内法而定）", "E": "来源国与居民国通过协定划分征税权"}, "answer": "ABE", "point": "税法（二）·国际税收：消除重复征税", "explain": "协定划分征税权、抵免安排是消除重复征税的正途；全额重复征税不作协调恰恰是问题本身，D 的“一律”表述过宽，不能作为一般做法。", "type": "multi"}, {"id": "tax2_m9", "stem": "下列各项中，属于资源税征税范围的有（ ）。", "options": {"A": "原油", "B": "天然气", "C": "煤炭", "D": "人造石油", "E": "盐"}, "answer": "ABCE", "point": "税法（二）·资源税：征税范围", "explain": "原油、天然气、煤炭、盐等在境内开采的应税矿产品和生产的盐属资源税范围；人造石油不征收。", "type": "multi"}, {"id": "tax2_m10", "stem": "下列各项中，属于环境保护税应税污染物的有（ ）。", "options": {"A": "大气污染物", "B": "水污染物", "C": "固体废物", "D": "噪声", "E": "生活垃圾（居民个人排放）"}, "answer": "ABCD", "point": "税法（二）·环境保护税：应税污染物", "explain": "环保税应税污染物包括大气、水、固体废物、噪声四类；居民个人不属于环保税纳税人，其生活垃圾不在此列。", "type": "multi"}]}, {"name": "第3套 · 税法（二）计算题（10题）", "questions": [{"id": "tax2_c1", "stem": "某居民企业2025年度收入总额800万元，其中不征税收入100万元，各项扣除合计500万元，适用企业所得税税率25%。应纳企业所得税为（ ）万元。", "answer": 50, "unit": "万元", "point": "税法（二）·企业所得税：应纳税额", "explain": "应纳税所得额＝800－100－500＝200（万元）；应纳税额＝200×25%＝50（万元）。", "type": "calc"}, {"id": "tax2_c2", "stem": "某居民个人2025年综合所得收入200000元，减除费用60000元，专项扣除20000元，专项附加扣除30000元，无其他扣除。按综合所得超额累进税率表（36000元以下3%，超过36000至144000元的部分10%、速算扣除数2520元）计算，应纳个人所得税为（ ）元。", "answer": 3960, "unit": "元", "point": "税法（二）·个人所得税：综合所得应纳税额", "explain": "应纳税所得额＝200000－60000－20000－30000＝90000（元）；税额＝36000×3%＋（90000－36000）×10%－2520＝1080＋5400－2520＝3960（元）。", "type": "calc"}, {"id": "tax2_c3", "stem": "某企业签订购销合同，合同金额200万元，按题干给定印花税税率0.03%计算，应纳印花税为（ ）元。", "answer": 600, "unit": "元", "point": "税法（二）·印花税：应纳税额", "explain": "应纳税额＝2000000×0.03%＝600（元）。", "type": "calc"}, {"id": "tax2_c4", "stem": "某企业房产原值100万元，按规定减除30%后按1.2%税率计征房产税，应纳房产税为（ ）万元。", "answer": 0.84, "unit": "万元", "point": "税法（二）·房产税：从价计征", "explain": "计税余值＝100×（1－30%）＝70（万元）；应纳税额＝70×1.2%＝0.84（万元）。", "type": "calc"}, {"id": "tax2_c5", "stem": "某个人购买住房，成交价格200万元，按题干给定契税税率3%计算，应纳契税为（ ）万元。", "answer": 6, "unit": "万元", "point": "税法（二）·契税：应纳税额", "explain": "应纳税额＝200×3%＝6（万元）。", "type": "calc"}, {"id": "tax2_c6", "stem": "某企业转让房地产，取得收入1000万元，扣除项目金额800万元，增值额200万元，增值率25%，适用税率30%，应纳土地增值税为（ ）万元。", "answer": 60, "unit": "万元", "point": "税法（二）·土地增值税：应纳税额", "explain": "增值率＝200÷800＝25%，未超过50%，适用30%；应纳税额＝200×30%＝60（万元）。", "type": "calc"}, {"id": "tax2_c7", "stem": "某企业开采原油并销售，销售额1000万元，按题干给定资源税税率6%计算，应纳资源税为（ ）万元。", "answer": 60, "unit": "万元", "point": "税法（二）·资源税：从价计征", "explain": "应纳税额＝1000×6%＝60（万元）。", "type": "calc"}, {"id": "tax2_c8", "stem": "某居民企业应纳税所得额300万元，适用企业所得税税率25%，应纳企业所得税为（ ）万元。", "answer": 75, "unit": "万元", "point": "税法（二）·企业所得税：应纳税额", "explain": "应纳税额＝300×25%＝75（万元）。", "type": "calc"}, {"id": "tax2_c9", "stem": "某居民个人一次取得劳务报酬20000元，按预扣预缴计算：减除20%费用后余额16000元，适用预扣率20%（无速算扣除数），应预扣预缴个人所得税为（ ）元。", "answer": 3200, "unit": "元", "point": "税法（二）·个人所得税：劳务报酬预扣预缴", "explain": "预扣预缴应纳税所得额＝20000×（1－20%）＝16000（元）；预扣税额＝16000×20%＝3200（元）。", "type": "calc"}, {"id": "tax2_c10", "stem": "某企业进口货物，海关审定完税价格100万元，按题干给定关税税率10%计算，应纳关税为（ ）万元。", "answer": 10, "unit": "万元", "point": "税法（二）·关税：应纳税额", "explain": "应纳税额＝100×10%＝10（万元）。", "type": "calc"}]}], "tax_practice": [{"name": "第1套 · 涉税服务实务客观题（10题）", "questions": [{"id": "taxpr_1", "stem": "税务登记的核心作用是？", "options": {"A": "确认纳税人的税务管理身份，便于税务机关管理与纳税人履行义务", "B": "代替纳税申报", "C": "免除全部税款", "D": "代替发票开具"}, "answer": "A", "point": "涉税服务实务·税务登记", "explain": "税务登记是税务管理的基础，确认纳税人身份与管理关系；它不代替申报、开票，更不免税。", "type": "single"}, {"id": "taxpr_2", "stem": "纳税申报的基本要求是？", "options": {"A": "想起来再报", "B": "在法定期限内如实申报", "C": "只报赚钱的月份", "D": "由税务机关代填就不用核对"}, "answer": "B", "point": "涉税服务实务·纳税申报", "explain": "纳税人须在法定期限内如实申报；即使无税款也可能有申报义务，代填仍须纳税人核对确认。", "type": "single"}, {"id": "taxpr_3", "stem": "增值税专用发票与普通发票的主要区别之一是？", "options": {"A": "专用发票可用于抵扣进项税额，普通发票一般不能", "B": "普通发票金额更大", "C": "专用发票不需要开票方信息", "D": "两者完全相同"}, "answer": "A", "point": "涉税服务实务·发票管理", "explain": "增值税专用发票是抵扣凭证，购方凭此抵扣进项税；普通发票一般不能抵扣。", "type": "single"}, {"id": "taxpr_4", "stem": "涉税服务中，税务代理人应当遵循的首要原则是？", "options": {"A": "只听委托人怎么说就怎么做", "B": "依法代理、独立公正、维护委托人合法权益", "C": "帮委托人少缴税就是对的", "D": "不核对任何资料"}, "answer": "B", "point": "涉税服务实务·税务代理原则", "explain": "税务代理须依法、独立、公正，在法律框架内维护委托人合法权益；违法少缴、盲目执行都违反职业要求。", "type": "single"}, {"id": "taxpr_5", "stem": "企业办理注销税务登记前，一般应先完成什么？", "options": {"A": "直接关门", "B": "结清应纳税款、滞纳金、罚款，缴销发票与税务证件", "C": "先注销营业执照再说", "D": "把账本销毁"}, "answer": "B", "point": "涉税服务实务·注销登记", "explain": "注销前须结清税款、滞纳金、罚款，缴销发票与证件；销毁账本、直接关门都会留下税务风险。", "type": "single"}, {"id": "taxpr_6", "stem": "税收筹划与偷税的根本区别是？", "options": {"A": "筹划是在法律允许范围内安排，偷税是违法少缴", "B": "两者没有区别", "C": "筹划金额更大", "D": "偷税更合规"}, "answer": "A", "point": "涉税服务实务·税收筹划边界", "explain": "合法筹划在税法框架内优化税负；偷税是伪造、隐瞒等违法行为，两者性质完全不同。", "type": "single"}, {"id": "taxpr_7", "stem": "纳税人对税务机关的具体行政行为不服，首先可以依法采取的救济途径是？", "options": {"A": "直接拒绝执行", "B": "申请行政复议或提起行政诉讼（按法定程序与期限）", "C": "找媒体曝光就算救济", "D": "不再申报"}, "answer": "B", "point": "涉税服务实务·税务救济", "explain": "法定救济是行政复议与行政诉讼，须按程序与期限进行；拒绝执行、停报都会产生新的违法风险。", "type": "single"}, {"id": "taxpr_8", "stem": "涉税服务实务中，账簿、凭证的保存要求是？", "options": {"A": "用完即可销毁", "B": "按规定期限妥善保存，以备核查", "C": "只保存电子版截图", "D": "交给客户就不用管"}, "answer": "B", "point": "涉税服务实务·账簿凭证管理", "explain": "账簿、记账凭证、报表等须按法定期限保存备查；销毁、只留截图都不合规。", "type": "single"}, {"id": "taxpr_9", "stem": "增值税一般纳税人申报时，进项税额抵扣的前提之一是？", "options": {"A": "取得合法有效的扣税凭证并按规定申报抵扣", "B": "只要买了东西就能抵", "C": "不需要任何凭证", "D": "由销售方口头承诺即可"}, "answer": "A", "point": "涉税服务实务·进项抵扣", "explain": "抵扣须凭合法扣税凭证并按规定申报；无凭证、超范围、用于不得抵扣项目都不能抵扣。", "type": "single"}, {"id": "taxpr_10", "stem": "税务机关进行税务检查时，纳税人应当？", "options": {"A": "拒绝提供任何资料", "B": "如实提供资料、配合检查", "C": "临时修改账本", "D": "让检查人员自行猜测"}, "answer": "B", "point": "涉税服务实务·税务检查配合", "explain": "纳税人有配合检查、如实提供资料的义务；拒绝、篡改都会加重法律后果。", "type": "single"}]}, {"name": "第2套 · 涉税服务实务多选题（10题）", "questions": [{"id": "taxpr_m1", "stem": "纳税人办理税务登记后，下列事项发生变化时一般应办理变更登记的有（ ）。", "options": {"A": "法定代表人变更", "B": "经营地址变更", "C": "经营范围变更", "D": "企业名称变更", "E": "当日营业额波动"}, "answer": "ABCD", "point": "涉税服务实务·税务登记：变更登记", "explain": "登记内容（名称、地址、法定代表人、经营范围等）变化应办理变更登记；当日营业额波动不是登记事项。", "type": "multi"}, {"id": "taxpr_m2", "stem": "下列各项中，属于纳税申报资料的有（ ）。", "options": {"A": "纳税申报表", "B": "财务会计报表", "C": "与纳税有关的合同、协议", "D": "税务机关要求报送的其他资料", "E": "纳税人的个人日记"}, "answer": "ABCD", "point": "涉税服务实务·纳税申报：申报资料", "explain": "申报表、财务报表、有关合同协议及税务机关要求报送的资料均属申报资料；个人日记不是申报资料。", "type": "multi"}, {"id": "taxpr_m3", "stem": "下列各项中，增值税专用发票开具要求正确的有（ ）。", "options": {"A": "项目齐全，与实际交易相符", "B": "字迹清楚，不得压线、错格", "C": "发票联和抵扣联加盖发票专用章", "D": "可以按票面金额随意涂改后使用", "E": "不得虚开"}, "answer": "ABCE", "point": "涉税服务实务·发票管理：专票开具", "explain": "专票须项目齐全、与实际相符、字迹清楚、加盖专用章、不得虚开；涂改后使用是违规行为。", "type": "multi"}, {"id": "taxpr_m4", "stem": "税务代理业务中，代理人应当做到的有（ ）。", "options": {"A": "依法代理", "B": "保守委托人商业秘密", "C": "按委托协议履行职责", "D": "发现委托人违法行为时按规定处理", "E": "为迎合委托人伪造资料"}, "answer": "ABCD", "point": "涉税服务实务·税务代理：代理人义务", "explain": "依法代理、保密、履约、发现违法按规定处理是代理人义务；伪造资料是违法行为，绝不能做。", "type": "multi"}, {"id": "taxpr_m5", "stem": "下列各项中，属于税收筹划应当遵循的原则的有（ ）。", "options": {"A": "合法性", "B": "事先筹划", "C": "风险可控", "D": "事后补票造假", "E": "成本效益"}, "answer": "ABCE", "point": "涉税服务实务·税收筹划：原则", "explain": "合法、事先、风险可控、成本效益是筹划原则；事后补票造假是违法行为，不是筹划。", "type": "multi"}, {"id": "taxpr_m6", "stem": "企业所得税汇算清缴时，下列资料一般应报送的有（ ）。", "options": {"A": "企业所得税年度纳税申报表", "B": "年度财务报表", "C": "与纳税有关的合同、协议等资料", "D": "税务机关要求报送的其他资料", "E": "与纳税无关的私人信件"}, "answer": "ABCD", "point": "涉税服务实务·汇算清缴：报送资料", "explain": "申报表、财务报表、有关合同协议及税务机关要求资料均应报送；私人信件与纳税无关，不属报送资料。", "type": "multi"}, {"id": "taxpr_m7", "stem": "下列各项中，纳税人可以依法申请税务行政复议的情形包括（ ）。", "options": {"A": "对税务机关作出的征税决定不服", "B": "对税务机关作出的行政处罚决定不服", "C": "对税务机关作出的税收保全措施不服", "D": "对税务机关工作人员的个人生活方式不满", "E": "对税务机关作出的强制执行措施不服"}, "answer": "ABCE", "point": "涉税服务实务·税务救济：复议范围", "explain": "征税决定、处罚、保全、强制执行等具体行政行为不服可依法复议；工作人员个人生活方式不是复议对象。", "type": "multi"}, {"id": "taxpr_m8", "stem": "下列各项中，属于发票使用管理要求的有（ ）。", "options": {"A": "按规定开具发票", "B": "不得转借、转让发票", "C": "按规定保管发票", "D": "不得虚开发票", "E": "丢失发票无需报告"}, "answer": "ABCD", "point": "涉税服务实务·发票管理：使用要求", "explain": "按规定开具、保管，不得转借转让、不得虚开是基本要求；丢失发票应按规定报告处理，不是无需报告。", "type": "multi"}, {"id": "taxpr_m9", "stem": "增值税一般纳税人进项税额抵扣时，下列情形不得抵扣的有（ ）。", "options": {"A": "用于简易计税方法计税项目", "B": "用于免征增值税项目", "C": "用于集体福利", "D": "用于正常生产经营的应税项目并取得合规凭证", "E": "购进贷款服务"}, "answer": "ABCE", "point": "涉税服务实务·进项抵扣：不得抵扣情形", "explain": "简易计税、免税项目、集体福利、贷款服务等进项不得抵扣；正常应税项目凭合规凭证可抵扣。", "type": "multi"}, {"id": "taxpr_m10", "stem": "税务检查中，纳税人应当配合的事项包括（ ）。", "options": {"A": "如实提供账簿、记账凭证、报表", "B": "如实反映情况", "C": "提供与纳税有关的其他资料", "D": "阻挠检查人员进入经营场所", "E": "按要求说明有关问题"}, "answer": "ABCE", "point": "涉税服务实务·税务检查：配合义务", "explain": "如实提供资料、反映情况、说明问题是配合义务；阻挠检查是违法行为。", "type": "multi"}]}, {"name": "第3套 · 涉税服务实务简答与综合（自评，10题）", "questions": [{"id": "taxpr_s1", "stem": "简述纳税人办理税务登记的基本流程与需要准备的资料。", "answer": "自评", "point": "涉税服务实务·税务登记", "explain": "范文要点：领取营业执照后按规定期限向税务机关申报登记，提交营业执照、法定代表人身份证明、经营场所证明等资料，税务机关核发税务登记证件并确定管理关系。自评清单：①说清期限与受理机关；②列出核心资料；③说清登记后的管理关系。", "type": "self"}, {"id": "taxpr_s2", "stem": "简述增值税一般纳税人申报时，进项税额抵扣需要满足的基本条件。", "answer": "自评", "point": "涉税服务实务·进项抵扣", "explain": "范文要点：取得合法有效的扣税凭证、用于应税项目、按规定期限申报抵扣、不属于不得抵扣范围。自评清单：①凭证、用途、期限三要素齐全；②能举出不得抵扣的例子（如贷款服务、集体福利）。", "type": "self"}, {"id": "taxpr_s3", "stem": "企业丢失增值税专用发票，应当如何处理？", "answer": "自评", "point": "涉税服务实务·发票管理", "explain": "范文要点：及时向税务机关报告，按规定办理挂失与补办手续，凭相关证明与存根联复印件等资料处理抵扣与入账，不得自行伪造或涂改。自评清单：①报告与挂失；②补办资料；③不伪造、不涂改。", "type": "self"}, {"id": "taxpr_s4", "stem": "简述企业所得税汇算清缴的基本步骤。", "answer": "自评", "point": "涉税服务实务·汇算清缴", "explain": "范文要点：整理全年收入、成本、费用与纳税调整事项，计算应纳税所得额与应纳税额，填报年度申报表并报送财务报表等资料，结清多退少补。自评清单：①调整事项；②申报表与报表；③多退少补。", "type": "self"}, {"id": "taxpr_s5", "stem": "税务代理人在发现委托人有违法行为时，应当怎么做？", "answer": "自评", "point": "涉税服务实务·税务代理", "explain": "范文要点：向委托人指出违法风险并要求纠正，拒绝参与违法行为，按规定向有关机关报告或解除委托，不得隐瞒、包庇或伪造资料。自评清单：①指出风险；②拒绝参与；③按规定处理。", "type": "self"}, {"id": "taxpr_s6", "stem": "简述税收筹划与偷税的区别，并举一例说明合法筹划。", "answer": "自评", "point": "涉税服务实务·税收筹划边界", "explain": "范文要点：合法筹划在税法框架内事先安排，偷税是伪造、隐瞒等违法少缴；例：在法律允许的优惠政策范围内选择适用条件与申报方式。自评清单：①合法与违法界限；②事先安排；③例子不违法。", "type": "self"}, {"id": "taxpr_s7", "stem": "纳税人对税务机关的征税决定不服，可以依法采取哪些救济途径？", "answer": "自评", "point": "涉税服务实务·税务救济", "explain": "范文要点：按法定程序与期限申请行政复议或提起行政诉讼；复议前置的情形须先复议；救济期间不停止执行另有规定的除外。自评清单：①复议与诉讼；②程序与期限；③前置情形。", "type": "self"}, {"id": "taxpr_s8", "stem": "简述税务检查中纳税人的配合义务。", "answer": "自评", "point": "涉税服务实务·税务检查", "explain": "范文要点：如实提供账簿、凭证、报表与有关资料，如实反映情况，按要求说明问题，不得拒绝、阻挠或篡改资料。自评清单：①提供资料；②如实反映；③不拒绝、不篡改。", "type": "self"}, {"id": "taxpr_s9", "stem": "企业办理注销税务登记前，一般需要完成哪些事项？", "answer": "自评", "point": "涉税服务实务·注销登记", "explain": "范文要点：结清应纳税款、滞纳金与罚款，缴销发票与税务证件，办结有关涉税事项后办理注销手续。自评清单：①结清税款；②缴销发票证件；③办结涉税事项。", "type": "self"}, {"id": "taxpr_s10", "stem": "简述发票开具的基本要求。", "answer": "自评", "point": "涉税服务实务·发票管理", "explain": "范文要点：按实际交易开具，项目齐全、与实际相符、字迹清楚、加盖发票专用章，不得虚开、涂改、转借转让。自评清单：①实际交易；②项目齐全；③不虚开、不涂改。", "type": "self"}]}], "tax_law": [{"name": "第1套 · 涉税服务相关法律客观题（10题）", "questions": [{"id": "taxlaw_1", "stem": "行政行为合法的基本要求不包括？", "options": {"A": "主体合法", "B": "程序合法", "C": "内容合法", "D": "领导个人喜好"}, "answer": "D", "point": "涉税服务相关法律·行政法：合法性", "explain": "行政行为合法要求主体、权限、程序、内容均合法；领导个人喜好不是合法性要件。", "type": "single"}, {"id": "taxlaw_2", "stem": "行政复议与行政诉讼的关系是？", "options": {"A": "复议是诉讼的前置程序，一律先复议后诉讼", "B": "一般情况下当事人可选择复议或诉讼，法律另有规定的从其规定", "C": "复议与诉讼完全不能并用", "D": "诉讼后不能再复议"}, "answer": "B", "point": "涉税服务相关法律·行政复议与诉讼", "explain": "一般是复议与诉讼可选择，法律规定复议前置的须先复议；不是一律前置，也不是完全互斥。", "type": "single"}, {"id": "taxlaw_3", "stem": "民法中，民事主体主要包括？", "options": {"A": "只有自然人", "B": "自然人、法人、非法人组织", "C": "只有企业", "D": "只有国家机关"}, "answer": "B", "point": "涉税服务相关法律·民法：民事主体", "explain": "民事主体包括自然人、法人、非法人组织；企业只是法人的一种。", "type": "single"}, {"id": "taxlaw_4", "stem": "合同成立与生效的区别是？", "options": {"A": "成立即生效，没有任何区别", "B": "成立是当事人意思表示一致，生效是合同产生法律约束力，二者可能分离", "C": "生效不需要成立", "D": "成立只适用于口头合同"}, "answer": "B", "point": "涉税服务相关法律·民法：合同成立与生效", "explain": "成立解决“有没有合同”，生效解决“有没有约束力”；附条件、须审批等情形下成立后未必立即生效。", "type": "single"}, {"id": "taxlaw_5", "stem": "刑法中，犯罪构成的基本要素不包括？", "options": {"A": "犯罪主体", "B": "犯罪主观方面", "C": "犯罪客体与客观方面", "D": "被害人的财富多少"}, "answer": "D", "point": "涉税服务相关法律·刑法：犯罪构成", "explain": "犯罪构成包括主体、主观方面、客体、客观方面；被害人财富多少可能影响量刑，不是构成要素本身。", "type": "single"}, {"id": "taxlaw_6", "stem": "行政处罚的种类不包括？", "options": {"A": "警告", "B": "罚款", "C": "没收违法所得", "D": "判处有期徒刑"}, "answer": "D", "point": "涉税服务相关法律·行政处罚种类", "explain": "警告、罚款、没收违法所得等属于行政处罚；有期徒刑是刑罚，只能由法院依法判处。", "type": "single"}, {"id": "taxlaw_7", "stem": "民事诉讼中，举证责任的一般原则是？", "options": {"A": "谁主张、谁举证", "B": "一律由被告举证", "C": "一律由法院调查", "D": "谁有钱谁举证"}, "answer": "A", "point": "涉税服务相关法律·民事诉讼：举证责任", "explain": "一般原则是谁主张谁举证，法律另有规定的实行举证责任倒置；不是一律被告或法院承担。", "type": "single"}, {"id": "taxlaw_8", "stem": "行政诉讼的被告一般是？", "options": {"A": "作出行政行为的行政机关", "B": "原告本人", "C": "法院", "D": "与案件无关的第三人"}, "answer": "A", "point": "涉税服务相关法律·行政诉讼：被告", "explain": "行政诉讼被告是作出被诉行政行为的行政机关；原告是相对人，法院是审理机关。", "type": "single"}, {"id": "taxlaw_9", "stem": "诉讼时效制度的主要作用是？", "options": {"A": "让权利永久有效", "B": "督促权利人及时行使权利，超过时效可能丧失胜诉权", "C": "取消所有权利", "D": "延长所有合同期限"}, "answer": "B", "point": "涉税服务相关法律·民法：诉讼时效", "explain": "诉讼时效督促及时维权；超过时效，对方可以时效抗辩，权利人可能丧失胜诉权，但权利本身不一定消灭。", "type": "single"}, {"id": "taxlaw_10", "stem": "公司法中，有限责任公司的股东承担责任的限度是？", "options": {"A": "以全部个人财产承担无限责任", "B": "以其认缴的出资额为限承担责任", "C": "不承担任何责任", "D": "以公司全部资产承担责任"}, "answer": "B", "point": "涉税服务相关法律·公司法：有限责任", "explain": "有限责任公司股东以认缴出资额为限对公司承担责任；公司以全部财产对债务承担责任，二者不要混淆。", "type": "single"}]}, {"name": "第2套 · 涉税服务相关法律多选题（10题）", "questions": [{"id": "taxlaw_m1", "stem": "下列各项中，属于行政行为合法性要件的有（ ）。", "options": {"A": "主体合法", "B": "权限合法", "C": "程序合法", "D": "内容合法", "E": "领导个人满意"}, "answer": "ABCD", "point": "涉税服务相关法律·行政法：合法性要件", "explain": "主体、权限、程序、内容合法是行政行为合法性要件；领导个人满意不是法律要件。", "type": "multi"}, {"id": "taxlaw_m2", "stem": "下列各项中，属于行政处罚种类的有（ ）。", "options": {"A": "警告", "B": "罚款", "C": "没收违法所得", "D": "责令停产停业", "E": "判处拘役"}, "answer": "ABCD", "point": "涉税服务相关法律·行政处罚：种类", "explain": "警告、罚款、没收违法所得、责令停产停业等属行政处罚；拘役是刑罚，只能由法院判处。", "type": "multi"}, {"id": "taxlaw_m3", "stem": "下列各项中，属于民事法律关系客体的有（ ）。", "options": {"A": "物", "B": "行为", "C": "智力成果", "D": "人身利益", "E": "自然人本身"}, "answer": "ABCD", "point": "涉税服务相关法律·民法：民事法律关系客体", "explain": "物、行为、智力成果、人身利益均可为客体；自然人本身是主体，不是客体。", "type": "multi"}, {"id": "taxlaw_m4", "stem": "合同无效的情形包括（ ）。", "options": {"A": "无民事行为能力人实施的民事法律行为", "B": "行为人与相对人恶意串通，损害他人合法权益", "C": "违反法律、行政法规的强制性规定", "D": "违背公序良俗", "E": "双方自愿订立且内容合法的合同"}, "answer": "ABCD", "point": "涉税服务相关法律·民法：合同无效", "explain": "无民事行为能力、恶意串通、违反强制性规定、违背公序良俗的民事法律行为无效；自愿合法合同有效。", "type": "multi"}, {"id": "taxlaw_m5", "stem": "下列各项中，属于犯罪构成要件的有（ ）。", "options": {"A": "犯罪主体", "B": "犯罪主观方面", "C": "犯罪客体", "D": "犯罪客观方面", "E": "犯罪的社会危害程度（量刑情节）"}, "answer": "ABCD", "point": "涉税服务相关法律·刑法：犯罪构成", "explain": "主体、主观方面、客体、客观方面是犯罪构成四要件；社会危害程度影响量刑，不是构成要件本身。", "type": "multi"}, {"id": "taxlaw_m6", "stem": "下列各项中，属于行政复议参加人的有（ ）。", "options": {"A": "申请人", "B": "被申请人", "C": "第三人", "D": "复议机关", "E": "与案件无关的路人"}, "answer": "ABC", "point": "涉税服务相关法律·行政复议：参加人", "explain": "申请人、被申请人、第三人是复议参加人；复议机关是裁决机关，不是参加人；无关路人更不是。", "type": "multi"}, {"id": "taxlaw_m7", "stem": "下列各项中，属于公司设立条件的有（ ）。", "options": {"A": "股东符合法定人数", "B": "有符合公司章程规定的全体股东认缴的出资额", "C": "股东共同制定公司章程", "D": "有公司名称，建立符合要求的组织机构", "E": "必须有上市计划"}, "answer": "ABCD", "point": "涉税服务相关法律·公司法：公司设立", "explain": "股东人数、出资、章程、名称与组织机构是设立条件；上市不是设立条件。", "type": "multi"}, {"id": "taxlaw_m8", "stem": "下列各项中，属于民事诉讼证据种类的有（ ）。", "options": {"A": "书证", "B": "物证", "C": "证人证言", "D": "视听资料", "E": "法官个人推测"}, "answer": "ABCD", "point": "涉税服务相关法律·民事诉讼：证据种类", "explain": "书证、物证、证人证言、视听资料、电子数据等属证据种类；法官个人推测不是证据。", "type": "multi"}, {"id": "taxlaw_m9", "stem": "下列各项中，属于行政诉讼受案范围的有（ ）。", "options": {"A": "对行政处罚不服", "B": "对行政强制措施不服", "C": "认为行政机关侵犯经营自主权", "D": "对国防、外交等国家行为不服", "E": "对行政机关作出的征税决定不服"}, "answer": "ABCE", "point": "涉税服务相关法律·行政诉讼：受案范围", "explain": "处罚、强制措施、侵犯经营自主权、征税决定等可诉；国防、外交等国家行为不属受案范围。", "type": "multi"}, {"id": "taxlaw_m10", "stem": "下列各项中，属于诉讼时效中断事由的有（ ）。", "options": {"A": "权利人向义务人提出履行请求", "B": "义务人同意履行义务", "C": "权利人提起诉讼", "D": "权利人长期不行使权利且无任何主张", "E": "权利人向有关部门申请仲裁"}, "answer": "ABCE", "point": "涉税服务相关法律·民法：诉讼时效中断", "explain": "提出请求、同意履行、提起诉讼或仲裁均可中断时效；长期不行使且无主张不是中断事由。", "type": "multi"}]}, {"name": "第3套 · 涉税服务相关法律综合分析题（10题）", "questions": [{"id": "taxlaw_z1", "stem": "税务机关对该企业的处罚决定，应当由哪个机关作出才合法？", "options": {"A": "税务机关的工作人员个人", "B": "具有行政处罚权的税务机关", "C": "企业所在地居委会", "D": "与案件无关的企业"}, "answer": "B", "point": "涉税服务相关法律·行政处罚：主体", "explain": "行政处罚须由具有处罚权的行政机关作出，工作人员个人、居委会、无关企业均无处罚权。", "type": "single", "case": "案例一：某企业未按期办理纳税申报，税务机关拟对其作出罚款处罚。企业认为处罚过重，拟申请复议。"}, {"id": "taxlaw_z2", "stem": "企业对罚款处罚不服，申请行政复议的期限一般是？", "options": {"A": "知道处罚决定之日起60日内", "B": "处罚决定作出后1年内", "C": "任何时候都可以", "D": "处罚执行完毕后才可以"}, "answer": "A", "point": "涉税服务相关法律·行政复议：期限", "explain": "行政复议申请期限一般为知道具体行政行为之日起60日内，法律另有规定的除外；不是任何时候都可申请。", "type": "single", "case": "案例一：某企业未按期办理纳税申报，税务机关拟对其作出罚款处罚。企业认为处罚过重，拟申请复议。"}, {"id": "taxlaw_z3", "stem": "行政复议期间，该罚款处罚一般应当？", "options": {"A": "停止执行", "B": "不停止执行，法律另有规定的除外", "C": "由企业自行决定是否执行", "D": "自动撤销"}, "answer": "B", "point": "涉税服务相关法律·行政复议：执行", "explain": "复议期间具体行政行为不停止执行，但法律规定停止执行或复议机关认为需要停止的除外。", "type": "single", "case": "案例一：某企业未按期办理纳税申报，税务机关拟对其作出罚款处罚。企业认为处罚过重，拟申请复议。"}, {"id": "taxlaw_z4", "stem": "企业在复议中提出的证据，复议机关应当？", "options": {"A": "一律不予采纳", "B": "依法审查并结合其他证据认定", "C": "只采纳对企业有利的证据", "D": "只采纳税务机关的证据"}, "answer": "B", "point": "涉税服务相关法律·行政复议：证据审查", "explain": "复议机关应对证据依法审查、综合认定，不是一律采纳或只采纳一方证据。", "type": "single", "case": "案例一：某企业未按期办理纳税申报，税务机关拟对其作出罚款处罚。企业认为处罚过重，拟申请复议。"}, {"id": "taxlaw_z5", "stem": "企业对复议决定仍不服的，一般可以？", "options": {"A": "向上一级税务机关再复议一次", "B": "依法向人民法院提起行政诉讼", "C": "拒绝履行复议决定且不承担后果", "D": "向税务机关工作人员个人索赔"}, "answer": "B", "point": "涉税服务相关法律·行政诉讼：救济", "explain": "对复议决定不服的，可依法提起行政诉讼；不是无限次复议，也不是拒绝履行无后果。", "type": "single", "case": "案例一：某企业未按期办理纳税申报，税务机关拟对其作出罚款处罚。企业认为处罚过重，拟申请复议。"}, {"id": "taxlaw_z6", "stem": "甲乙双方签订买卖合同，甲未按期交货，乙要求甲承担违约责任，该法律关系的主体是？", "options": {"A": "合同标的物", "B": "甲与乙", "C": "合同文本", "D": "违约金数额"}, "answer": "B", "point": "涉税服务相关法律·民法：法律关系主体", "explain": "买卖合同法律关系的主体是甲与乙；标的物、合同文本、违约金数额是客体或内容，不是主体。", "type": "single", "case": "案例二：甲与乙签订买卖合同，约定甲向乙供应一批货物并按期交货。甲未按期交货，乙要求甲承担违约责任，甲以市场价格上涨为由拒绝。"}, {"id": "taxlaw_z7", "stem": "甲以市场价格上涨为由拒绝交货，该理由一般？", "options": {"A": "必然免除违约责任", "B": "不能当然免除违约责任，须看合同约定与法律规定", "C": "只要口头说明即可免责", "D": "由甲自行决定是否免责"}, "answer": "B", "point": "涉税服务相关法律·民法：违约责任", "explain": "市场价格上涨一般不能当然免责，是否免责须看合同约定、不可抗力等法定情形；口头说明、自行决定均不成立。", "type": "single", "case": "案例二：甲与乙签订买卖合同，约定甲向乙供应一批货物并按期交货。甲未按期交货，乙要求甲承担违约责任，甲以市场价格上涨为由拒绝。"}, {"id": "taxlaw_z8", "stem": "乙要求甲继续履行合同，该请求属于？", "options": {"A": "违约责任的一种承担方式", "B": "合同解除", "C": "合同无效的后果", "D": "与合同无关的请求"}, "answer": "A", "point": "涉税服务相关法律·民法：违约责任方式", "explain": "继续履行是违约责任的承担方式之一；不是解除、无效后果，也不是无关请求。", "type": "single", "case": "案例二：甲与乙签订买卖合同，约定甲向乙供应一批货物并按期交货。甲未按期交货，乙要求甲承担违约责任，甲以市场价格上涨为由拒绝。"}, {"id": "taxlaw_z9", "stem": "乙因甲迟延交货遭受的直接损失，甲一般应当？", "options": {"A": "不予赔偿", "B": "按约定或依法赔偿", "C": "只赔偿乙的预期利润", "D": "只在乙起诉后才赔偿"}, "answer": "B", "point": "涉税服务相关法律·民法：损害赔偿", "explain": "违约造成损失的，违约方应按约定或依法赔偿直接损失等；不是不赔、只赔预期利润，也不是起诉才产生赔偿义务。", "type": "single", "case": "案例二：甲与乙签订买卖合同，约定甲向乙供应一批货物并按期交货。甲未按期交货，乙要求甲承担违约责任，甲以市场价格上涨为由拒绝。"}, {"id": "taxlaw_z10", "stem": "甲乙双方协商变更交货日期，该变更应当？", "options": {"A": "口头说说即可，无需任何确认", "B": "经双方协商一致，并按约定形式确认", "C": "由甲单方决定", "D": "由乙单方决定"}, "answer": "B", "point": "涉税服务相关法律·民法：合同变更", "explain": "合同变更须经双方协商一致，并按约定或法律规定的形式确认；单方决定不产生变更效力。", "type": "single", "case": "案例二：甲与乙签订买卖合同，约定甲向乙供应一批货物并按期交货。甲未按期交货，乙要求甲承担违约责任，甲以市场价格上涨为由拒绝。"}]}], "tax_fa": [{"name": "第1套 · 财务与会计客观题（10题）", "questions": [{"id": "taxfa_1", "stem": "会计要素中，反映企业财务状况的是？", "options": {"A": "收入、费用、利润", "B": "资产、负债、所有者权益", "C": "现金、存货、应收账款", "D": "成本、费用、税金"}, "answer": "B", "point": "财务与会计·会计要素", "explain": "资产、负债、所有者权益反映某一时点的财务状况；收入、费用、利润反映一定时期的经营成果。", "type": "single"}, {"id": "taxfa_2", "stem": "会计恒等式是？", "options": {"A": "资产 = 负债 + 所有者权益", "B": "资产 = 负债 - 所有者权益", "C": "收入 = 费用 + 利润", "D": "资产 = 收入 + 费用"}, "answer": "A", "point": "财务与会计·会计恒等式", "explain": "资产 = 负债 + 所有者权益是最基本的会计等式；收入 - 费用 = 利润是经营成果等式。", "type": "single"}, {"id": "taxfa_3", "stem": "下列哪项属于流动资产？", "options": {"A": "厂房", "B": "存货", "C": "长期股权投资", "D": "无形资产"}, "answer": "B", "point": "财务与会计·资产分类", "explain": "存货预计一年内变现或耗用，属流动资产；厂房、长期投资、无形资产属非流动资产。", "type": "single"}, {"id": "taxfa_4", "stem": "权责发生制下，收入确认的时点一般是？", "options": {"A": "收到现金时", "B": "权利义务发生时，不论款项是否收付", "C": "开具发票时一律确认", "D": "年末统一确认"}, "answer": "B", "point": "财务与会计·权责发生制", "explain": "权责发生制按权利义务发生确认，不论现金收付；收到现金才确认是收付实现制。", "type": "single"}, {"id": "taxfa_5", "stem": "资产负债表中，资产按什么顺序排列？", "options": {"A": "按金额从大到小", "B": "按流动性由强到弱", "C": "按取得时间先后", "D": "随机排列"}, "answer": "B", "point": "财务与会计·资产负债表结构", "explain": "资产按流动性强弱排列，流动资产在前、非流动资产在后；负债按偿还期限由近到远。", "type": "single"}, {"id": "taxfa_6", "stem": "流动比率的计算公式是？", "options": {"A": "流动资产 / 流动负债", "B": "速动资产 / 流动负债", "C": "总资产 / 总负债", "D": "净利润 / 营业收入"}, "answer": "A", "point": "财务与会计·财务分析：流动比率", "explain": "流动比率 = 流动资产 / 流动负债，衡量短期偿债能力；速动比率用速动资产，资产负债率用总资产与总负债。", "type": "single"}, {"id": "taxfa_7", "stem": "货币时间价值中，现在 100 元、年利率 10%、一年后的终值是？", "options": {"A": "90 元", "B": "100 元", "C": "110 元", "D": "120 元"}, "answer": "C", "point": "财务与会计·货币时间价值", "explain": "终值 = 100 × (1 + 10%) = 110 元；这是单利与复利一年期结果相同的一年情形。", "type": "single"}, {"id": "taxfa_8", "stem": "存货计价中，先进先出法（FIFO）的特点是？", "options": {"A": "先购入的存货先发出，期末存货接近近期成本", "B": "后购入的存货先发出", "C": "按平均成本发出", "D": "不区分购入顺序"}, "answer": "A", "point": "财务与会计·存货计价", "explain": "FIFO 假设先入库的先发出，期末存货留存的是近期购入成本；后进先出、加权平均是另外的方法。", "type": "single"}, {"id": "taxfa_9", "stem": "下列哪项属于所有者权益？", "options": {"A": "应付账款", "B": "实收资本", "C": "短期借款", "D": "预收账款"}, "answer": "B", "point": "财务与会计·所有者权益", "explain": "实收资本、资本公积、留存收益属于所有者权益；应付账款、短期借款、预收账款属于负债。", "type": "single"}, {"id": "taxfa_10", "stem": "利润表中，营业利润的计算起点一般是？", "options": {"A": "营业收入减去营业成本、税金及附加、期间费用等", "B": "资产总额减去负债总额", "C": "现金流入减去现金流出", "D": "所有者权益减去负债"}, "answer": "A", "point": "财务与会计·利润表结构", "explain": 和法", "E": "一次摊销法"}, "answer": "ABCD", "point": "财务与会计·固定资产折旧", "explain": "年限平均、工作量、双倍余额递减、年数总和法属折旧方法；一次摊销法是低值易耗品等摊销方法，不是固定资产折旧方法。", "type": "multi"}, {"id": "taxfa_m9", "stem": "下列各项中，属于利润表项目的有（ ）。", "options": {"A": "营业收入", "B": "营业成本", "C": "营业利润", "D": "利润总额", "E": "资产总额"}, "answer": "ABCD", "point": "财务与会计·利润表", "explain": "营业收入、营业成本、营业利润、利润总额属利润表项目；资产总额属资产负债表项目。", "type": "multi"}, {"id": "taxfa_m10", "stem": "下列各项中，属于货币时间价值计算要素的有（ ）。", "options": {"A": "现值", "B": "终值", "C": "利率", "D": "期数", "E": "风险系数"}, "answer": "ABCD", "point": "财务与会计·货币时间价值", "explain": "现值、终值、利率、期数是货币时间价值的基本要素；风险系数不是基本计算要素。", "type": "multi"}]}, {"name": "第3套 · 财务与会计计算与综合（10题）", "questions": [{"id": "taxfa_c1", "stem": "某企业流动资产300万元，流动负债150万元，流动比率为（ ）倍。", "answer": 2, "unit": "倍", "point": "财务与会计·财务分析：流动比率", "explain": "流动比率＝300÷150＝2（倍）。", "type": "calc"}, {"id": "taxfa_c2", "stem": "某企业流动资产300万元，其中存货120万元，流动负债150万元，速动比率为（ ）倍。", "answer": 1.2, "unit": "倍", "point": "财务与会计·财务分析：速动比率", "explain": "速动资产＝300－120＝180（万元）；速动比率＝180÷150＝1.2（倍）。", "type": "calc"}, {"id": "taxfa_c3", "stem": "某企业资产总额1000万元，负债总额400万元，资产负债率为（ ）%。", "answer": 40, "unit": "%", "point": "财务与会计·财务分析：资产负债率", "explain": "资产负债率＝400÷1000×100%＝40%。", "type": "calc"}, {"id": "taxfa_c4", "stem": "某企业净利润80万元，平均净资产400万元，净资产收益率为（ ）%。", "answer": 20, "unit": "%", "point": "财务与会计·财务分析：净资产收益率", "explain": "净资产收益率＝80÷400×100%＝20%。", "type": "calc"}, {"id": "taxfa_c5", "stem": "某企业将10000元存入银行，年利率5%，按复利计算，2年后的终值为（ ）元。", "answer": 11025, "unit": "元", "point": "财务与会计·货币时间价值：复利终值", "explain": "终值＝10000×（1＋5%）²＝10000×1.1025＝11025（元）。", "type": "calc"}, {"id": "taxfa_z1", "stem": "该企业的所有者权益为（ ）万元。", "options": {"A": "400", "B": "600", "C": "1000", "D": "1400"}, "answer": "B", "point": "财务与会计·会计恒等式", "explain": "资产＝负债＋所有者权益，所有者权益＝1000－400＝600（万元）。", "type": "single", "case": "案例：某企业年末资产总额1000万元，负债总额400万元，营业收入800万元，净利润80万元。"}, {"id": "taxfa_z2", "stem": "该企业的资产负债率为（ ）。", "options": {"A": "40%", "B": "60%", "C": "80%", "D": "100%"}, "answer":
